                <span className="material-icons">{item.icon}</span>{!sidebarCollapsed && item.label}
              </div>
            </React.Fragment>
          );
        })}
        <div style={{padding:'14px 18px', marginTop:'auto', display:'flex', flexDirection:'column', gap:8}}>
          <a href="index.html" target="_blank" rel="noopener" style={{textDecoration:'none'}}>
            <button className="ghost sm" style={{background:'transparent', color:'#EEEEEE', borderColor:'#454B55', justifyContent:'center', width:'100%'}} title="前往打卡頁面">
              <span className="material-icons" style={{fontSize:16}}>open_in_new</span>{!sidebarCollapsed && '前往打卡頁面'}
            </button>
          </a>
          <button className="ghost sm" style={{background:'transparent', color:'#EEEEEE', borderColor:'#454B55', justifyContent:'center'}} onClick={()=>{ if(confirm('確定要登出嗎？')) logout(); }} title="登出">
            <span className="material-icons" style={{fontSize:16}}>logout</span>{!sidebarCollapsed && '登出'}
          </button>
          {/* 版本識別。瀏覽器偶爾會抓著舊的 admin.html 不放，肉眼分不出手上是不是最新版；
              回報問題時附上這串，就能確認版本對不對（點一下可強制重載並清掉編譯快取）。 */}
          {!sidebarCollapsed && (
            <div className="build-tag" title="點一下強制重新載入最新版"
              onClick={()=>{ try{ localStorage.removeItem('tap_admin_compiled'); }catch(e){} location.reload(true); }}>
              版本 {window.__APP_BUILD || '?'}
            </div>
          )}
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <h1><span className="material-icons">{NAV.find(x=>x.id===tab)?.icon}</span>{NAV.find(x=>x.id===tab)?.label}</h1>
          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            {dirty && <span className="badge warn"><span className="material-icons">warning</span>尚有未儲存的薪資異動</span>}
            {dirty && <button onClick={savePayroll} disabled={saving}>{saving?'儲存中...':'儲存薪資紀錄'}</button>}
          </div>
        </div>
        <div className="content">
          {/* 月份放在內容區的第一行、各頁篩選列的正上方 —— 它本來就是一種篩選條件，
              擺在標題列右上角時離操作區太遠，每切一次月都要把滑鼠拉過去一趟。 */}
          {needsMonth && (
            <div className="month-bar">
              <span className="material-icons">event</span>
              <YearMonthPicker value={month} onChange={setMonth} />
            </div>
          )}
          {tab==='dashboard' && <DashboardTab setTab={setTab}/>}
          {tab==='guide' && <GuideTab setTab={setTab}/>}
          {tab==='employees' && <EmployeesTab employees={employees} loading={employeesLoading} reload={reloadEmployees} onEdit={openEditEmployee} onNew={openNewEmployee} accountBox={accountBox} setAccountBox={setAccountBox} createAccountSubmit={createAccountSubmit} showInactive={showInactive} setShowInactive={v=>{ setShowInactive(v); reloadEmployees(v); }}/>}
          {tab==='records' && <RecordsTab employees={employees} month={month}/>}
          {tab==='requests' && <RequestsTab month={month} employees={employees} setTab={setTab}/>}
          {tab==='annual' && <AnnualLeaveTab employees={employees}/>}
          {tab==='comp' && <CompLedgerTab employees={employees}/>}
          {/* allLocked 一起傳進去：這顆「套用」跟薪資頁那顆是同一支函式，
              按鈕的可用狀態也該一致，否則在彙總頁按下去只會跳出「沒有任何欄位需要變動」，
              讓人誤以為資料有問題，其實是該月已鎖定、本來就不會被覆蓋 */}
          {tab==='attendance' && <AttendanceTab month={month} onApply={applyAttendanceToPayroll}
            allLocked={rows.length>0 && rows.every(({entry})=>entry.locked)}/>}
          {tab==='payroll' && <PayrollTab employees={employees} rows={rows} setEntry={setEntry} month={month} loading={payrollLoading} onApply={applyAttendanceToPayroll} onUndoApply={applyUndo?undoApply:null} onSave={savePayroll} dirty={dirty} saving={saving} onEditEmployee={openEditEmployee} onReload={()=>reloadPayroll(month)} menstrualBaseline={menstrualBaseline} settings={settings}/>}
          {tab==='payslip' && <PayslipTab employees={employees} payrollEntries={savedEntries} dirty={dirty} month={month} settings={settings} menstrualBaseline={menstrualBaseline}/>}
          {tab==='transfer' && <TransferTab rows={rows} month={month}/>}
          {tab==='register' && <PayrollRegisterTab/>}
          {tab==='insurance' && <InsuranceTab/>}
          {tab==='companies' && <CompanyTab/>}
          {tab==='departments' && <DepartmentTab employees={employees}/>}
          {tab==='shifts' && <ShiftTab employees={employees}/>}
          {tab==='holidays' && <HolidaysTab/>}
          {tab==='announcements' && <AnnouncementsTab/>}
          {tab==='accounts' && <AccountsTab employees={employees}/>}
          {tab==='settings' && <SettingsTab onSaved={reloadSettings} key={settingsCategory} initialCategory={settingsCategory}/>}
        </div>
      </div>
      {applyBox && (
        <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) setApplyBox(null); }}>
          <div className="modal" style={{width:900}}>
            <h3 style={{marginTop:0}}><span className="material-icons">sync_alt</span>
              套用出缺勤時數{applyBox.onlyName && <span style={{fontWeight:400, color:'var(--muted)', fontSize:14}}>／僅 {applyBox.onlyName}</span>}
            </h3>
            {applyBox.changes.length===0 ? (
              <div className="hint" style={{padding:'10px 0'}}>
                {applyBox.onlyName ? <>{applyBox.onlyName} 的</> : null}
                打卡計算結果與目前薪資表的時數<b>完全相同</b>，沒有任何欄位需要變動。
              </div>
            ) : (
              <>
                <div className="hint" style={{marginBottom:8}}>
                  將以 {month} 的打卡紀錄重新計算
                  {applyBox.onlyName
                    ? <>，<b>只影響 {applyBox.onlyName} 一人</b>，以下 <b>{applyBox.changes.length}</b> 個欄位會變動：</>
                    : <>，以下<b> {new Set(applyBox.changes.map(c=>c.empId)).size} </b>人的<b> {applyBox.changes.length} </b>個欄位會變動：</>}
                </div>
                {/* ⚠️ 一列一個欄位的話，同一個人的姓名會重複七八次，五個人就要捲三頁，
                    看完也拼不出「這個人到底被改了什麼」。改成**一個人一個區塊**：
                    左邊姓名，右邊是他所有變動的欄位膠囊，一眼就是一個人的全貌。 */}
                <div className="apply-list">
                  {Array.from(new Set(applyBox.changes.map(c=>c.empId))).map(eid=>{
                    const rows = applyBox.changes.filter(c=>c.empId===eid);
                    return (
                      <div className="apply-emp" key={eid}>
                        <div className="apply-name">{rows[0].name}<span className="apply-cnt">{rows.length} 項</span></div>
                        <div className="apply-fields">
                          {rows.map((c,i)=>(
                            <div className="apply-chip" key={i}>
                              <span className="fld">{c.field}</span>
                              <span className="mono from">{c.from}</span>
                              <span className="material-icons arw">arrow_right_alt</span>
                              <span className="mono to">{c.to}</span>
                              {c.wasManual && c.to===0 && <span className="badge warn" style={{marginLeft:6}}>手動值將被清掉</span>}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="hint" style={{marginTop:8}}>
                  {!applyBox.onlyName && <>其餘 {applyBox.untouched} 人無變化。</>}
                  {applyBox.onlyName && <>其他人的數字完全不動。</>}
                  {applyBox.lockedNames.length>0 && <> 已鎖定而略過：{applyBox.lockedNames.join('、')}。</>}
                  套用後可用工具列的「復原套用」一鍵還原，儲存前都有效。
                </div>
              </>
            )}
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setApplyBox(null)}>取消</button>
              {applyBox.changes.length>0 && <button onClick={confirmApply}>確認套用</button>}
            </div>
          </div>
        </div>
      )}
      <EmployeeEditModal editing={editingEmployee} setEditing={setEditingEmployee} isNew={isNewEmployee} saving={savingEmployee} onSave={saveEmployee} companies={companies} departments={departments} shifts={shifts} settings={settings} onGoSettings={cat=>{ setEditingEmployee(null); setSettingsCategory(cat); setTab('settings'); }}/>
    </div>
  );
}

/* ========================= 員工資料 ========================= */
function EmployeeEditModal({editing, setEditing, isNew, saving, onSave, companies, departments, shifts, settings, onGoSettings}){
  const [resignPreview, setResignPreview] = useState(null);
  const [resignPreviewLoading, setResignPreviewLoading] = useState(false);
  useEffect(()=>{ setResignPreview(null); }, [editing && editing.id]);
  async function loadResignPreview(){
    setResignPreviewLoading(true);
    try{
      const data = await apiGet('calcResignationLeaveSettlement', {employeeId: editing.id, resignDate: editing.resignDate, baseOverride: editing.baseSalary});
      setResignPreview(data);
    }catch(e){ alert(e.message); } finally{ setResignPreviewLoading(false); }
  }
  if(!editing) return null;
  return (
    <div className="modal-bg">
      <div className="modal modal-form">
        <h3><span className="material-icons">badge</span>{isNew ? '新增員工' : '編輯員工：' + editing.name}</h3>
        <div className="modal-body">
        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">person</span>基本資料</div>
        <div className="grid-2">
          <div className="field"><label>所屬公司</label>
            <select value={editing.companyId} onChange={e=>{ const c=companies.find(x=>x.id===e.target.value); setEditing({...editing, companyId:e.target.value, company: c?c.name:''}); }}>
              <option value="">請選擇</option>
              {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field"><label>部門</label>
            <select value={editing.departmentId} onChange={e=>{ const d=departments.find(x=>x.id===e.target.value); setEditing({...editing, departmentId:e.target.value, department: d?d.name:''}); }}>
              <option value="">請選擇</option>
              {departments.filter(d=>!editing.companyId || d.companyId===editing.companyId).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div className="field"><label>姓名 *</label><input value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} /></div>
          <div className="field"><label>手機</label><input value={editing.phone} onChange={e=>setEditing({...editing, phone:e.target.value})} placeholder="09xxxxxxxx" /></div>
          <div className="field"><label>身分證字號</label><input value={editing.nationalId} onChange={e=>setEditing({...editing, nationalId:e.target.value})} placeholder="A123456789" /></div>
          {/* 性別下拉本身很窄，右半邊是空的，生日就放在同一格右側 */}
          <div className="field"><label>性別 / 生日</label>
            <div style={{display:'flex', gap:6}}>
              <select style={{flex:'0 0 34%', minWidth:0}} value={editing.gender||''} onChange={e=>setEditing({...editing, gender:e.target.value})}>
                <option value="">不提供</option>
                <option value="女">女</option>
                <option value="男">男</option>
              </select>
              <input type="date" style={{flex:'1 1 auto', minWidth:0}} value={editing.birthday||''} onChange={e=>setEditing({...editing, birthday:e.target.value})} />
            </div>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}><label>戶籍地</label><input value={editing.householdAddress} onChange={e=>setEditing({...editing, householdAddress:e.target.value})} style={{width:'100%'}} /></div>
        </div>
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">event_available</span>任職與出勤</div>
        <div className="grid-2">
          <div className="field"><label>到職日</label><input type="date" value={editing.hireDate} onChange={e=>setEditing({...editing, hireDate:e.target.value})} /></div>
          <div className="field">
            {/* 標籤依員工類型換字，底層仍是同一個欄位與同一套邏輯。
                外包／兼職談不上「離職」，但停止合作要處理的事情完全一樣（從清單消失、
                當月保費按日計算、特休結算），所以改說法而不是另外做一個「停用」開關 ——
                多一個狀態就多一種互相矛盾的可能（曾發生「狀態=離職但離職日空白」）。 */}
            <label>{isCasual(editing) ? '合作終止日' : '離職日'}</label>
            <input type="date" value={editing.resignDate||''} onChange={e=>{ setEditing({...editing, resignDate:e.target.value, status: e.target.value ? '離職' : '在職'}); setResignPreview(null); }} />
            <div className="hint" style={{marginTop:4}}>
              {isCasual(editing)
                ? '填了這個日期之後，這位就不會再出現在員工清單、出缺勤彙總與薪資計算裡。已產生的歷史薪資紀錄不受影響。清空日期即可恢復。'
                : '有填離職日時，勞保費當月按在職日數比例計算，健保費則看月底當天是否仍在職（在職才收整月保費）'}
            </div>
            {editing.resignDate && editing.hireDate && !isNew && (
              <div style={{marginTop:6}}>
                <button type="button" className="ghost sm" disabled={resignPreviewLoading} onClick={loadResignPreview}>
                  <span className="material-icons" style={{fontSize:14}}>calculate</span>{resignPreviewLoading?'試算中...':'試算特休結算'}
                </button>
                {resignPreview && (
                  <div className="hint" style={{marginTop:6, background:'var(--bg-soft, #f5f5f5)', padding:8, borderRadius:6, lineHeight:1.7}}>
                    週年制重新計算期間：{resignPreview.periodStart} ～ {resignPreview.periodEnd}<br/>
                    應有 {trimNum(resignPreview.entitledDays,1)} 日，已休 {trimNum(resignPreview.usedDays,1)} 日，可結算 {trimNum(resignPreview.settleDays,1)} 日（{trimNum(resignPreview.settleHours,1)} 小時）<br/>
                    {resignPreview.overUsed && <span style={{color:'var(--danger)'}}>⚠ 已超休 {resignPreview.overDays} 日，公司不能扣薪，結算金額以0計<br/></span>}
                    以本薪 {money(editing.baseSalary)} 估算，結算金額約 <b>{money(resignPreview.settlePay)}</b> 元
                    <div style={{marginTop:4, color:'var(--muted, #888)'}}>正式金額請至「薪資結算」頁該員工當月薪資列，按同樣的試算按鈕帶入。</div>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="field">
            <label>年資中斷起（選填）</label>
            <input type="month" value={editing.tenureBreakStart||''} onChange={e=>setEditing({...editing, tenureBreakStart:e.target.value})} />
          </div>
          <div className="field">
            <label>年資中斷迄（選填）</label>
            <input type="month" value={editing.tenureBreakEnd||''} onChange={e=>setEditing({...editing, tenureBreakEnd:e.target.value})} />
            <div className="hint" style={{marginTop:4}}>員工曾離職又復職時填寫，這段期間會從特休年資中扣除，不影響上面的到職日顯示</div>
          </div>

          <div className="field"><label>班別</label>
            <select value={editing.shiftId} onChange={e=>setEditing({...editing, shiftId:e.target.value})}>
              <option value="">依系統預設班別</option>
              {shifts.map(s=><option key={s.id} value={s.id}>{s.name}（{s.workStart}-{s.workEnd}）</option>)}
            </select>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}>
            <label>員工類型</label>
            <select value={editing.employeeType || '正式員工'} onChange={e=>setEditing({...editing, employeeType:e.target.value})} style={{width:'100%'}}>
              <option value="正式員工">正式員工（受僱勞工，需打卡，適用特休與加班費）</option>
              <option value="負責人">負責人（委任關係非勞工，不需出勤紀錄，不適用特休與加班費）</option>
              <option value="非正式員工">非正式員工（外包／兼職，不需打卡）</option>
            </select>
            <div className="hint" style={{marginTop:4}}>
              {(editing.employeeType && editing.employeeType !== '正式員工')
                ? '此類型已自動視為免打卡，不列入出缺勤彙總、今日打卡統計與特休試算。'
                : '正式員工需打卡；若個別情況不需打卡（例如外派、彈性工時），可另外勾選下方的免打卡。'}
            </div>
          </div>
        </div>
        <label className="check-row">
          <input type="checkbox" checked={editing.exemptFromAttendance === true} onChange={e=>setEditing({...editing, exemptFromAttendance:e.target.checked})} />
          <span>免打卡（個別例外用；不列入出缺勤彙總與薪資自動試算，薪資項目需手動填寫）</span>
        </label>
        <label className="check-row">
          <input type="checkbox" checked={editing.canBeDelegate !== false} onChange={e=>setEditing({...editing, canBeDelegate:e.target.checked})} />
          <span>可被員工指定為請假代理人</span>
        </label>
        {editing.hireDate && <div className="fs-note">{tenureText(editing.hireDate, editing.tenureBreakStart, editing.tenureBreakEnd)}</div>}
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">health_and_safety</span>投保與健保</div>
        <div className="grid-2">
          <div className="field">
            <label>投保級距</label>
            <div style={{display:'flex', gap:6}}>
              <select value={editing.insuranceGrade} onChange={e=>setEditing({...editing, insuranceGrade:Number(e.target.value)})} style={{flex:1}}>
                <option value={0}>未設定</option>
                {INSURANCE_TABLE.map(r=><option key={r.grade} value={r.grade}>{r.grade.toLocaleString()}</option>)}
              </select>
              <button type="button" className="ghost sm" onClick={()=>setEditing({...editing, insuranceGrade: suggestGrade(insuranceBase(editing, settings))})} title="依投保基準建議級距">依基準建議</button>
            </div>
            {(()=>{
              const d = insuranceBaseDetail(editing, settings);
              const sug = suggestGrade(d.base);
              return (
                <div className="hint" style={{marginTop:6}}>
                  <div style={{display:'grid', gridTemplateColumns:'auto 1fr', columnGap:10, rowGap:3, maxWidth:240}}>
                    <span>本薪合計</span>
                    <span className="mono" style={{textAlign:'right'}}>{money(editing.baseSalary)}</span>
                    {d.deducted.map(x=>(
                      <React.Fragment key={x.label}>
                        <span>− {x.label}</span>
                        <span className="mono" style={{textAlign:'right'}}>{money(x.amount)}</span>
                      </React.Fragment>
                    ))}
                    <span style={{borderTop:'1px solid var(--line)', paddingTop:3, fontWeight:600}}>投保基準</span>
                    <span className="mono" style={{borderTop:'1px solid var(--line)', paddingTop:3, textAlign:'right', fontWeight:600}}>{money(d.base)}</span>
                    <span style={{fontWeight:600, color: sug===Number(editing.insuranceGrade) ? 'inherit' : 'var(--danger)'}}>建議級距</span>
                    <span className="mono" style={{textAlign:'right', fontWeight:600, color: sug===Number(editing.insuranceGrade) ? 'inherit' : 'var(--danger)'}}>{sug.toLocaleString()}</span>
                  </div>
                  <div style={{marginTop:5}}>
                    扣除項目可在
                    <a href="#" onClick={e=>{e.preventDefault(); onGoSettings && onGoSettings('leave');}} style={{color:'var(--brand)', textDecoration:'underline', margin:'0 2px'}}>系統設定 → 請假與獎金規則</a>
                    調整（會離開此畫面，未儲存的變更會遺失）。實際級距以向勞保局申報的值為準，建議值僅供對照。
                  </div>
                </div>
              );
            })()}
          </div>
          {/* 兩個健保欄位包成同一格：投保級距那格較高，若各佔一格會被 grid 擠到下一列的左欄，
              與健保眷屬人數分開很不直覺。包起來就會一起留在右欄、上下排列。 */}
          <div>
            <div className="field">
              <label>健保眷屬人數（不含本人）</label>
              <input type="number" min="0" max="3" value={editing.dependentCount} onChange={e=>setEditing({...editing, dependentCount:Number(e.target.value)})} />
              <div className="hint" style={{marginTop:4}}>健保費＝一口金額 ×（本人 1 口 ＋ 應繳眷屬口數），眷屬超過 3 口以 3 口計。健保繳費表上的「人數」是含本人的，這裡要填不含本人的眷屬數。</div>
            </div>
            <div className="field">
              <label>其中免繳保費的眷屬人數</label>
              <input type="number" min="0" max="3" value={editing.exemptDependentCount || 0} onChange={e=>setEditing({...editing, exemptDependentCount:Number(e.target.value)})} />
              <div className="hint" style={{marginTop:4}}>
                眷屬中保費由政府補助、不需繳費的人數，例如<b>65 歲以上且設籍的縣市有補助</b>、或具低收入戶等身分。
                這些眷屬仍在保，只是不必為他們繳費，所以從應繳口數扣除，<b>不要用少填眷屬人數的方式處理</b>（會讓投保人數失真）。
                目前應繳 <b>{Math.max(0, Math.min(n(editing.dependentCount),3) - n(editing.exemptDependentCount)) + 1}</b> 口（本人 1 ＋ 眷屬 {Math.max(0, Math.min(n(editing.dependentCount),3) - n(editing.exemptDependentCount))}）。
              </div>
              <div className="hint" style={{marginTop:4}}>眷屬保費同本人金額，超過3人一律以3人計算</div>
            </div>
          </div>
        </div>
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">payments</span>薪資項目</div>
        <div className="grid-2">
          <div className="field"><label>本薪</label><input type="number" value={editing.baseSalary} onChange={e=>setEditing({...editing, baseSalary:Number(e.target.value)})} /></div>

          <div className="field"><label>伙食津貼</label><input type="number" value={editing.mealAllowance} onChange={e=>setEditing({...editing, mealAllowance:Number(e.target.value)})} /></div>
          {/* 交通津貼與計算方式併成同一格，金額在左、方式在右，不各佔一格 */}
          <div className="field">
            <label>{editing.transportAllowanceMode==='daily' ? '交通津貼（每日補貼金額）' : '交通津貼'}</label>
            <div style={{display:'flex', gap:6}}>
              <input type="number" style={{flex:'1 1 90px', minWidth:0}} value={editing.transportAllowance} onChange={e=>setEditing({...editing, transportAllowance:Number(e.target.value)})} />
              <select style={{flex:'0 0 auto', width:'auto'}} value={editing.transportAllowanceMode||'fixed'} onChange={e=>setEditing({...editing, transportAllowanceMode:e.target.value})}>
                <option value="fixed">固定／月</option>
                <option value="daily">依出勤日數</option>
              </select>
            </div>
            {editing.transportAllowanceMode==='daily' && <div className="hint" style={{marginTop:4}}>系統會用「套用出缺勤時數」抓當月實際出勤日數 × 這個金額，自動算出當月交通津貼</div>}
          </div>
          <div className="field"><label>職務加給</label><input type="number" value={editing.positionAllowance} onChange={e=>setEditing({...editing, positionAllowance:Number(e.target.value)})} /></div>
          <div className="field"><label>全勤獎金（固定）</label><input type="number" value={editing.fullAttendanceBonus} onChange={e=>setEditing({...editing, fullAttendanceBonus:Number(e.target.value)})} /></div>
        </div>
        {editing.baseSalary>0 && (n(editing.baseSalary)+n(editing.mealAllowance)+n(editing.transportAllowance)+n(editing.positionAllowance)) < MIN_WAGE_MONTHLY && (
          <div className="hint" style={{color:'var(--danger)'}}>⚠ 本薪＋伙食＋交通＋職務加給合計 {money(n(editing.baseSalary)+n(editing.mealAllowance)+n(editing.transportAllowance)+n(editing.positionAllowance))} 元，低於2026年最低工資 {money(MIN_WAGE_MONTHLY)} 元，可能違反《最低工資法》（全勤獎金為條件式給予，不列入計算基準）</div>
        )}
        <div className="fs-note">依2026年新制《勞工請假規則》第9條，婚假、喪假、公傷病假、公假、生理假、家庭照顧事假等法定假別不得作為扣發全勤獎金的理由。病假、事假、遲到、早退依「設定」頁的比例規則自動扣除（不是全有全無）；曠職則是全扣（不是請假，不受第9條限制）。這裡填的是正常整月應發的金額。</div>
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">account_balance</span>匯款與備註</div>
        <div className="grid-2">
          {/* 銀行與帳號併成同一格：銀行名稱較短放左，帳號放右 */}
          <div className="field" style={{gridColumn:'span 2'}}><label>銀行 / 帳號</label>
            <div style={{display:'flex', gap:6}}>
              <input style={{flex:'0 0 30%', minWidth:0}} placeholder="銀行" value={editing.bankName} onChange={e=>setEditing({...editing, bankName:e.target.value})} />
              <input style={{flex:'1 1 auto', minWidth:0}} placeholder="帳號" value={editing.bankAccount} onChange={e=>setEditing({...editing, bankAccount:e.target.value})} />
            </div>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}><label>備註</label><input value={editing.note} onChange={e=>setEditing({...editing, note:e.target.value})} style={{width:'100%'}} /></div>
        </div>
        </div>
        </div>
        <div className="modal-actions">
          <button className="ghost" onClick={()=>setEditing(null)}>取消</button>
          <button onClick={onSave} disabled={saving}>{saving?'儲存中...':'儲存'}</button>
        </div>
      </div>
    </div>
  );
}

function EmployeesTab({employees, loading, reload, onEdit, onNew, accountBox, setAccountBox, createAccountSubmit, showInactive, setShowInactive}){
  const companiesByCo = [...new Set(employees.map(e=>e.company).filter(Boolean))];

  return (
    <div>
      <div className="toolbar">
        <button onClick={onNew}><span className="material-icons">person_add</span>新增員工</button>
        <span className="grow"></span>
        <label style={{display:'flex', alignItems:'center', gap:5, fontSize:13, marginBottom:0}}
          title="已離職或已終止合作的人預設不顯示。要把人叫回來，勾選後開啟他的編輯視窗、清空日期再儲存即可">
          <input type="checkbox" checked={!!showInactive} onChange={e=>setShowInactive(e.target.checked)} style={{width:'auto'}} />
          顯示已離職／已終止合作
        </label>
        <button className="ghost sm" onClick={()=>reload()}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
        <span className="hint">共 {employees.filter(e=>e.status!=='離職').length} 位在職{showInactive && employees.some(e=>e.status==='離職') ? `，另有 ${employees.filter(e=>e.status==='離職').length} 位已離職／終止` : ''}</span>
      </div>

      {loading ? <div className="hint">載入中...</div> : (
        <>
          {employees.length===0 && <div className="empty card">尚無員工資料，請點擊「＋ 新增員工」開始建立。</div>}
          {companiesByCo.concat(employees.some(e=>!e.company)?['(未分類)']:[]).map(co => (
            <div className="card" key={co} style={{overflowX:'auto'}}>
              <h3><span className="material-icons" style={{fontSize:17, color:'var(--brand)'}}>business</span> {co} <span className="badge">{employees.filter(e=>(e.company||'(未分類)')===co).length} 人</span></h3>
              <table style={{tableLayout:'fixed', minWidth:1100}}>
                <colgroup>
                  <col style={{width:'9%'}} /><col style={{width:'11%'}} /><col style={{width:'11%'}} />
                  <col style={{width:'8%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} />
                  <col style={{width:'8%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} />
                  <col style={{width:'12%'}} /><col style={{width:'15%'}} />
                </colgroup>
                <thead>
                  <tr>
                    <th className="left">部門</th><th className="left">姓名</th><th className="left">手機</th><th>班別</th><th>到職日</th>
                    <th>年資</th><th>投保級距</th><th>投保眷屬人數</th><th>本薪</th><th className="left">銀行帳號</th><th style={{whiteSpace:'normal'}}>操作</th>
                  </tr>
                </thead>
                <tbody>
                  {employees.filter(e=>(e.company||'(未分類)')===co).map(emp=>(
                    <tr key={emp.id} className={emp.status==='離職' ? 'emp-inactive' : ''}>
                      <td className="left">{emp.department}</td>
                      <td className="left" style={{cursor:'pointer'}} onClick={()=>onEdit(emp)}><b>{emp.name}</b>{emp.status === '離職' && <span className="badge off" style={{marginLeft:6}}>{isCasual(emp) ? '已終止合作' : '已離職'}{emp.resignDate ? ' ' + emp.resignDate : ''}</span>}{emp.employeeType && emp.employeeType !== '正式員工' && <span className="badge warn" style={{marginLeft:6}}>{emp.employeeType}</span>}{emp.exemptFromAttendance && (!emp.employeeType || emp.employeeType === '正式員工') && <span className="badge warn" style={{marginLeft:6}}>免打卡</span>}</td>
                      <td className="left mono">{emp.phone}</td>
                      <td>{emp.shift ? emp.shift.name : <span className="hint">預設</span>}</td>
                      <td>{emp.hireDate || '-'}</td>
                      <td>{tenureShortText(emp.hireDate, emp.tenureBreakStart, emp.tenureBreakEnd)}</td>
                      <td>{emp.insuranceGrade || 0}</td>
                      <td>{emp.dependentCount || 0}</td>
                      <td>{money(emp.baseSalary)}</td>
                      <td className="left mono">{emp.bankAccount}</td>
                      <td style={{whiteSpace:'normal'}}>
                        <button className="ghost sm" onClick={()=>onEdit(emp)}><span className="material-icons" style={{fontSize:14}}>edit</span>編輯</button>{' '}
                        <button className="ghost sm" onClick={()=>setAccountBox({employeeId:emp.id, name:emp.name, account:emp.phone||'', password: Math.random().toString(36).slice(2,8)})}><span className="material-icons" style={{fontSize:14}}>vpn_key</span>帳號</button>{' '}
                        {emp.status === '離職' ? (
                          /* 已離職／終止合作者的一鍵恢復。後端會同時把狀態改回在職並清空日期 ——
                             兩者必須一起改，只改一個會留下矛盾狀態，下次存檔又會消失。 */
                          <button className="ghost sm" onClick={async()=>{
                            const lb = isCasual(emp) ? '終止合作' : '離職';
                            if(!confirm(`要把「${emp.name}」恢復嗎？\n\n會清除${lb}日期並改回在職，之後就會重新出現在各項清單裡。`)) return;
                            try{ await apiPost('setEmployeeStatus', {id:emp.id, status:'在職', dryRun:false}); reload(); }
                            catch(err){ alert(err.message); }
                          }}><span className="material-icons" style={{fontSize:14}}>undo</span>恢復</button>
                        ) : (
                          <button className="danger sm" onClick={()=>{ const lb = isCasual(emp) ? '合作終止日' : '離職日'; alert(`請在編輯視窗中填寫「${emp.name}」的${lb}，儲存後就會從清單移除（歷史薪資紀錄不受影響）。\n\n之後可勾選上方「顯示已離職／已終止合作」把人找回來。`); onEdit(emp); }}><span className="material-icons" style={{fontSize:14}}>person_remove</span>{isCasual(emp) ? '終止合作' : '離職'}</button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
        </>
      )}

      {accountBox && (
        <div className="modal-bg">
          <div className="modal" style={{width:400}}>
            <h3><span className="material-icons">vpn_key</span>建立登入帳號：{accountBox.name}</h3>
            <div className="field"><label>帳號（建議用手機號碼或員工編號）</label><input value={accountBox.account} onChange={e=>setAccountBox({...accountBox, account:e.target.value})} /></div>
            <div className="field"><label>初始密碼</label><input value={accountBox.password} onChange={e=>setAccountBox({...accountBox, password:e.target.value})} /></div>
            <div className="hint">建立後請把帳號密碼告訴員工，員工登入後可自行修改密碼。</div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setAccountBox(null)}>取消</button>
              <button onClick={createAccountSubmit}>建立帳號</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 單一員工的逐日出勤（列表／月曆） =========================
   打卡紀錄頁選定一個人之後改用這一套：整個月每一天都有位置，沒打卡的那天也在。
   六日與國定假日照樣列出（假日出勤要看得見，加班費算法不同），只是淡化並且不算應出勤。
   系統啟用日之前的日子標成「待補登」，可以直接勾起來批次補回去。 */
const ADMIN_LEAVE_TYPES = ['特休','補休','事假','病假','生理假','婚假','喪假','公假','公傷病假','產假','產檢假','陪產假','家庭照顧假','災防假'];
const CAL_DOW = ['日','一','二','三','四','五','六'];
// 月曆一週從**星期一**開始（工作週的排法），六日落在最右邊兩欄，看起來就是「一週的結尾」。
// 這個陣列同時決定表頭順序與月初要空幾格，兩邊都吃它，改一個地方就好。
const CAL_WEEK = [1, 2, 3, 4, 5, 6, 0];
const CAL_DAYTYPE = {rest:'休息日', mandatory:'例假日', holiday:'國定假日'};

function EmployeeAttendanceView({employeeId, month, reloadKey, onEdit, onVoid, onRestore, onReload}){
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState(()=>{ try{ return localStorage.getItem('att_cal_view') || 'list'; }catch(e){ return 'list'; } });
  const [sel, setSel] = useState({});          // {date:true}
  const [bulk, setBulk] = useState({checkIn:'', checkOut:'', note:'', overwrite:false, busy:false});
  /* 代員工請假。後端 submitRequest 一直支援管理者代送（不受補請期限限制），
     但後台沒有入口 —— 員工「其實請了假只是沒送單」的日子，你只能請他自己補，
     而補請期限又會把太久以前的擋掉，等於卡死。這顆按鈕就是那個出口。 */
  const [leaveBox, setLeaveBox] = useState(null);   // {date, leaveType, startTime, endTime, hours, reason, busy}

  function load(){
    setLoading(true);
    apiGet('getAttendanceCalendar', {month, employeeId})
      .then(d=>{
        setData(d);
        // 批次補登的時間預設帶該員工班別的上下班，最常見的情況是照正常班補
        setBulk(b=>({...b, checkIn: b.checkIn || (d.workStart||'09:00').slice(0,5), checkOut: b.checkOut || (d.workEnd||'18:00').slice(0,5)}));
      })
      .catch(e=>alert(e.message))
      .finally(()=>setLoading(false));
  }
  /* reloadKey 也要放進依賴：工具列的「重新整理」按的是 RecordsTab 的 load()，
     那支只重抓舊的打卡清單，不會通知這個元件 —— 少了它，按鈕在逐日檢視下等於失效，
     而使用者會以為資料是最新的。 */
  useEffect(()=>{ setSel({}); load(); }, [month, employeeId, reloadKey]);
  function switchView(v){ setView(v); try{ localStorage.setItem('att_cal_view', v); }catch(e){} }

  const days = (data && data.days) || [];
  // 全月遲到早退合計（系統即時計算，與薪資同口徑）。補登的紀錄狀態欄看不出來，
  // 所以摘要列要有一個總數，否則要逐日看才知道。
  const calLateTotal = days.reduce((a,x)=>a + n(x.lateMinutes) + n(x.earlyMinutes), 0);
  const selDates = Object.keys(sel).filter(d=>sel[d]).sort();
  const dayByDate = useMemo(()=>{ const m={}; days.forEach(d=>{ m[d.date]=d; }); return m; }, [days]);
  // 已有紀錄的日子分兩種，處理方式完全不同：
  //   只缺一半（漏打下班卡）→ 補空白就好，不必勾覆蓋，已打好的那一半不會被動到
  //   兩邊都有值        → 要動到它就是覆蓋，必須明確勾選
  const selHasRecord = selDates.filter(d=>dayByDate[d] && dayByDate[d].records.filter(r=>!r.voided).length>0);
  const selHalfMissing = selHasRecord.filter(d=>{
    const r = dayByDate[d].records.filter(x=>!x.voided)[0];
    return r && (!r.checkIn || !r.checkOut);
  });
  const selFullRecord = selHasRecord.filter(d=>selHalfMissing.indexOf(d)===-1);
  const todayStr = new Date().toISOString().slice(0,10);

  function toggle(date){ setSel(s=>({...s, [date]: !s[date]})); }
  function selectAll(pred, label){
    const next = {};
    days.filter(pred).forEach(d=>{ next[d.date]=true; });
    if(Object.keys(next).length===0){ alert('沒有符合「'+label+'」的日期'); return; }
    setSel(next);
  }

  async function doBulk(){
    if(!selDates.length) return;
    if(!bulk.checkIn && !bulk.checkOut){ alert('上班與下班時間至少要填一個'); return; }
    const lines = [
      `批次補登 ${data.name} 的打卡紀錄`, '',
      `日期：${selDates.length} 天（${selDates[0]} ~ ${selDates[selDates.length-1]}）`,
      `上班：${bulk.checkIn||'不填'}　下班：${bulk.checkOut||'不填'}`,
      `備註：${bulk.note || '管理員批次補登'}`, ''
    ];
    if(selHalfMissing.length>0){
      lines.push(`· ${selHalfMissing.length} 天只缺一半（例如有上班卡沒下班卡）：${selHalfMissing.join('、')}`);
      lines.push(`　 只補空白的那一欄，已經打好的時間不會被動到。`);
    }
    if(selFullRecord.length>0){
      lines.push(bulk.overwrite
        ? `⚠ ${selFullRecord.length} 天上下班都已有紀錄，會被「覆蓋」：${selFullRecord.join('、')}\n　 原本的打卡時間會被改掉，這是原始出勤憑證，請確認無誤。`
        : `· ${selFullRecord.length} 天上下班都已有紀錄，會略過不動：${selFullRecord.join('、')}`);
    }
    if(selHalfMissing.length>0 || selFullRecord.length>0) lines.push('');
    lines.push('補登的紀錄會標記「管理員補登」，稽核時看得出來源。確定執行嗎？');
    if(!confirm(lines.join('\n'))) return;

    setBulk(b=>({...b, busy:true}));
    try{
      const r = await apiPost('batchPunchRecords', {
        employeeId, dates: selDates,
        checkInTime: bulk.checkIn, checkOutTime: bulk.checkOut,
        note: bulk.note || '管理員批次補登',
        overwrite: !!bulk.overwrite
      });
      const msg = [`新增 ${r.新增} 天`,
        r.補上空白 ? `補上缺的那一欄 ${r.補上空白} 天` : '',
        r.覆蓋 ? `覆蓋 ${r.覆蓋} 天` : '',
        r.略過 ? `略過 ${r.略過} 天（上下班都已有紀錄，未勾覆蓋）` : '',
        (r.無效日期||[]).length ? `無效 ${r.無效日期.length} 天：${r.無效日期.join('、')}` : ''
      ].filter(Boolean).join('　');
      alert('批次補登完成\n\n' + msg);
      setSel({}); load(); if(onReload) onReload();
    }catch(e){ alert(e.message); }
    finally{ setBulk(b=>({...b, busy:false})); }
  }

  function openLeaveFor(d){
    // 預設整天：用該員工的班表時間，時數帶當日標準工時
    const ws = (data.workStart||'09:00').slice(0,5), we = (data.workEnd||'18:00').slice(0,5);
    setLeaveBox({date: d.date, leaveType:'特休', startTime: ws, endTime: we,
      hours: data.standardHours, reason:'', busy:false});
  }
  async function submitLeave(){
    const b = leaveBox;
    if(!b.leaveType){ alert('請選擇假別'); return; }
    if(!(Number(b.hours) > 0)){ alert('時數必須大於 0'); return; }
    if(!confirm(`代 ${data.name} 送出假單\n\n${b.date} ${b.startTime}~${b.endTime}\n${b.leaveType} ${b.hours} 小時\n\n這張單會直接以管理者身分建立，不受補請期限限制。確定嗎？`)) return;
    setLeaveBox({...b, busy:true});
    try{
      await apiPost('submitRequest', {
        type:'請假', employeeId, leaveType: b.leaveType,
        startTime: b.date + ' ' + b.startTime, endTime: b.date + ' ' + b.endTime,
        hours: Number(b.hours), reason: b.reason || '管理者代為補登'
      });
      setLeaveBox(null); load(); if(onReload) onReload();
      alert('假單已送出。狀態為待審核，請到「假單審核」完成核准後才會計入。');
    }catch(e){ alert(e.message); setLeaveBox({...b, busy:false}); }
  }

  if(loading) return <div className="card"><div className="hint">載入中...</div></div>;
  if(!data) return null;
  const s = data.summary;

  // 一天的「主要狀態」：畫面上這一格要說什麼。順序即優先度。
  function dayState(d){
    if(d.records.some(r=>!r.voided && r.checkIn)){
      if(d.incomplete && d.workedHours<=0) return {k:'punch', t:'漏打下班卡'};
      /* ⚠️ 有打卡紀錄但時數仍然不足時，一定要把「缺幾小時」講出來。
         紅底的判準是「缺滿 1 小時」，而畫面上顯示的是遲到分鐘（已扣寬限），
         兩者差一個寬限值 —— 只看遲到分鐘的話，會覺得「53 分紅、31 分不紅」
         的界線莫名其妙。把判準本身寫出來就清楚了。 */
      if(d.gapHours > 0) return {k:'miss', t:'缺 ' + trimNum(d.gapHours,1) + ' 小時'};
      return null;                                   // 有正常紀錄、也沒缺口，不需要標籤
    }
    if(d.skipReason==='beforeStart') return {k:'todo', t:'待補登'};
    if(d.skipReason==='beforeHire') return {k:'off', t:'到職前'};
    if(d.skipReason==='afterResign') return {k:'off', t:'離職後'};
    if(d.skipReason==='future') return null;
    if(d.dayType!=='work') return null;
    if(d.leaveHours>0) return null;                  // 整天請假，下面會顯示假別
    if(d.pendingLeaveHours>0) return {k:'miss', t:'沒有紀錄'};
    return {k:'miss', t:'沒有紀錄'};
  }
  /* 打卡狀態欄的標籤。這一格同時要表達兩件不同的事，混在一起講就會誤導：
       ① 打卡當下寫進試算表的**原始記錄**（「遲到255分鐘」「未取得定位資訊」）—— 是憑證，不會改
       ② 薪資實際採用的分鐘數（扣掉已核准假單涵蓋的時段之後）

     ⚠️ 「已請假涵蓋」只能加在**遲到／早退**的狀態上。之前是只要 isAbnormalStatus 就加，
        結果「未取得定位資訊」也被標成「已請假涵蓋」—— 那跟請假一點關係都沒有。
     ⚠️ 部分被涵蓋時要把兩個數字都講出來。8/27 的例子：特休 08:30~12:05、打卡 12:55，
        原始記錄是「遲到255分鐘」（相對 08:30 算的），但實際只計 40 分鐘。
        只顯示 255 會讓人以為要扣 255 分鐘的全勤。 */
  function punchStatusTag(statusText, adjustedMin, kind){
    const txt = String(statusText || '');
    if(!isAbnormalStatus(txt)) return null;
    const m = txt.match(kind === '遲到' ? /遲到(\d+)分鐘/ : /早退(\d+)分鐘/);
    if(!m) return <span className="cal-tag punch">{txt}</span>;   // 不是遲到早退（例如定位異常），原樣顯示
    const raw = Number(m[1]), adj = n(adjustedMin);
    if(adj >= raw) return <span className="cal-tag punch">{txt}</span>;
    if(adj <= 0) return (
      <span className="cal-tag covered" title={`打卡當下記為${txt}，但這段時間已被當日的已核准假單涵蓋，薪資計算不算${kind}`}>
        {txt} · 已請假涵蓋
      </span>
    );
    return (
      <span className="cal-tag punch" title={`打卡當下記為${txt}，其中一部分已被已核准假單涵蓋，薪資實際計 ${adj} 分鐘`}>
        {txt} · 實計 {adj} 分鐘
      </span>
    );
  }
  function leaveTags(d, mini){
    /* mini＝月曆格子。空間小，但「假別＋時數」與「是否已核准」兩件事都不能省：
       看到「特休 8h」以為沒事了，實際上還在等審核，缺口並沒有補上。 */
    return d.leaves.map((lv,i)=>(
      <span key={i} className={'cal-tag lv' + (lv.status==='已核准'?'':' wait') + (mini?' cal-mini':'')}
            title={`${lv.leaveType} ${lv.hours} 小時（${lv.status}）　${lv.startTime} ~ ${lv.endTime}${lv.reason?'　'+lv.reason:''}`}>
        {lv.leaveType} {trimNum(lv.hours,1)}h{lv.status==='已核准'?'':'（審核中）'}
      </span>
    ));
  }

  return (
    <div>
      <div className="cal-head">
        <div className="cal-sum">
          <div className="cell"><div className="k">應出勤</div><div className="v">{s.requiredDays} 天</div></div>
          <div className="cell"><div className="k">應出勤時數</div><div className="v">{trimNum(s.requiredHours,1)}</div></div>
          <div className="cell"><div className="k">已打卡</div><div className="v ok">{s.punchedDays} 天</div></div>
          <div className="cell"><div className="k">實際工時</div><div className="v">{trimNum(s.workedHours,1)}</div></div>
          <div className="cell"><div className="k">已認列</div>
            <div className="v" title="逐日以標準工時封頂後的出勤＋已核准假。加班不能拿來補別天的缺勤，所以可能小於實際工時">
              {trimNum(s.creditedHours,1)}
            </div>
          </div>
          <div className="cell"><div className="k">已核准假</div><div className="v">{trimNum(s.leaveHours,1)}</div></div>
          <div className="cell"><div className="k">缺口</div><div className={'v ' + (s.gapHours>0?'bad':'ok')}>{trimNum(s.gapHours,1)}</div></div>
          {/* ⚠️ 這一格不能省。缺口只算「差滿 1 小時」的日子，零碎的不列進待辦，
              結果就是「實際工時 ＋ 缺口 ≠ 應出勤」—— 使用者自己一加就發現少了一截，
              會開始懷疑整張表。這些分鐘沒有被忽略，它們都計入遲到早退了。 */}
          {n(s.minorGapHours)>0 && (
            <div className="cell"><div className="k">零碎差額</div>
              <div className="v" title="每天不足、但未達 1 小時門檻的時數合計。不列入缺口待辦，但已計入遲到早退">
                {trimNum(s.minorGapHours,1)}
              </div>
            </div>
          )}
          <div className="cell"><div className="k">遲到／早退</div>
            <div className={'v ' + (calLateTotal>0 ? 'bad' : 'ok')}>{calLateTotal} 分</div></div>
          {s.pendingBackfillDates.length>0 &&
            <div className="cell"><div className="k">待補登</div><div className="v todo">{s.pendingBackfillDates.length} 天</div></div>}
        </div>
        <div className="cal-seg">
          <button className={view==='list'?'on':''} onClick={()=>switchView('list')}>
            <span className="material-icons" style={{fontSize:15}}>view_list</span>列表
          </button>
          <button className={view==='cal'?'on':''} onClick={()=>switchView('cal')}>
            <span className="material-icons" style={{fontSize:15}}>calendar_month</span>月曆
          </button>
        </div>
        <span className="grow"></span>
        <button className="ghost sm" onClick={()=>selectAll(d=>d.skipReason==='beforeStart' && d.records.length===0, '待補登')}>
          全選待補登（{s.pendingBackfillDates.length}）
        </button>
        <button className="ghost sm" onClick={()=>selectAll(d=>d.required && d.records.length===0 && d.leaveHours<=0, '應出勤但無紀錄')}>
          全選無紀錄
        </button>
        <button className="ghost sm" onClick={()=>selectAll(d=>d.incomplete, '漏打下班卡')}>
          全選漏打下班卡
        </button>
        {/* 勾選後就在這排直接給批次入口。原本只有畫面最底部那條工具列有，
            上面又還放著一顆「＋ 補登紀錄」（那是單筆的），兩個長得像、離得遠，很容易按錯。 */}
        {selDates.length>0 && <>
          <span className="tb-sep"></span>
          <span className="sel-count">已選 {selDates.length} 天</span>
          <button className="sm" onClick={()=>{
            const bar = document.querySelector('.cal-bar');
            if(bar) bar.scrollIntoView({behavior:'smooth', block:'end'});
          }}>
            <span className="material-icons" style={{fontSize:15}}>playlist_add</span>批次補登這 {selDates.length} 天
          </button>
          <button className="ghost sm" onClick={()=>setSel({})}>清除選取</button>
        </>}
      </div>
      {/* 把等式寫出來，省得每次都要自己算「少的那些去哪了」。
          ⚠️ 左邊要用「已認列」不是「實際工時」：每天的出勤以標準工時封頂
             （加班歸加班，不能拿來補別天的缺勤），所以實際工時可能比已認列多。
             用實際工時去加，帳就會差那一截超時的部分，反而更讓人困惑。 */}
      <div className="hint" style={{marginBottom:6}}>
        <b>應出勤 {trimNum(s.requiredHours,1)}</b>　＝　已認列 {trimNum(s.creditedHours,1)}
        {n(s.gapHours)>0 && <>　＋　缺口 {trimNum(s.gapHours,1)}</>}
        {n(s.minorGapHours)>0 && <>　＋　零碎差額 {trimNum(s.minorGapHours,1)}</>}
        {n(s.workedHours) > n(s.creditedHours) - n(s.leaveHours) && (
          <span style={{marginLeft:8, opacity:.75}}>
            （實際工時 {trimNum(s.workedHours,1)}，其中 {trimNum(n(s.workedHours) - (n(s.creditedHours) - n(s.leaveHours)), 2)} 小時是超過標準工時的部分，屬加班不計入對帳）
          </span>
        )}
      </div>
      <div className="hint" style={{marginBottom:10}}>
        {data.name}　{data.shiftName} {data.workStart}~{data.workEnd}（午休 {data.lunchBreak} 分，每日 {trimNum(data.standardHours,1)} 小時）
        {data.attendanceStartDate && <>　·　出勤紀錄起算日 <b>{data.attendanceStartDate}</b>，之前的日子不列入缺勤計算</>}
      </div>

      <div className="hint" style={{marginBottom:8, display:'flex', flexWrap:'wrap', gap:'2px 16px'}}>
        <span><span className="cal-tag off">灰底</span> 不用上班（六日／例假日／國定假日）</span>
        <span><span className="cal-tag miss">紅底</span> 當天少滿 <b>1 小時</b>以上，要處理</span>
        <span>少不到 1 小時的不標紅，歸入「零碎差額」，由全勤獎金按比例扣</span>
      </div>
      {view==='list' ? (
        <div className="card cal-wrap" style={{overflowX:'auto'}}>
          <table className="cal-tbl">
            {/* ⚠️ 只有「備註」不指定寬度。表格是 width:100%，沒指定寬度的欄會吃掉所有剩餘空間 ——
                寬螢幕上原本是狀態欄在吃，結果中間空一大片。備註本來就該有（補登備註、作廢原因
                都在這裡），讓它來吸收剩餘寬度，空間才有用途。 */}
            <colgroup>
              <col style={{width:'36px'}} />
              <col style={{width:'228px'}} />
              <col style={{width:'96px'}} /><col style={{width:'96px'}} />
              <col style={{width:'68px'}} /><col style={{width:'68px'}} />
              <col style={{width:'62px'}} />
              <col style={{width:'250px'}} />
              <col style={{width:'210px'}} />
              <col style={{width:'70px'}} />
              <col style={{width:'122px'}} />
            </colgroup>
            <thead>
              <tr>
                <th className="cal-sel-col"></th>
                <th style={{textAlign:'left'}}>日期</th>
                <th>上班</th><th>下班</th><th>外出</th><th>返回</th>
                <th>工時</th>
                <th style={{textAlign:'left'}}>狀態 / 請假</th>
                <th style={{textAlign:'left'}}>備註</th>
                <th>來源</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              {days.map(d=>{
                const st = dayState(d);
                const live = d.records.filter(r=>!r.voided);
                const rec = live[0] || d.records[0] || null;
                const cls = [d.dayType!=='work' ? 'offday' : '', d.gapHours>0 ? 'gap' : '',
                             sel[d.date] ? 'sel' : ''].filter(Boolean).join(' ');
                return (
                  <tr key={d.date} className={cls}>
                    <td className="cal-sel-col">
                      <input type="checkbox" checked={!!sel[d.date]} onChange={()=>toggle(d.date)} />
                    </td>
                    <td className="d">
                      {Number(d.date.slice(5,7))}/{Number(d.date.slice(8,10))}
                      <span className="dw">({CAL_DOW[d.dow]})</span>
                      {d.date===todayStr && <span className="cal-tag today" style={{marginLeft:6}}>今天</span>}
                      {d.dayType!=='work' && !d.holidayName &&
                        <span className="cal-tag off" style={{marginLeft:6}}>{CAL_DAYTYPE[d.dayType]}</span>}
                      {d.holidayName &&
                        <span className="cal-tag hol" style={{marginLeft:6}} title={CAL_DAYTYPE[d.dayType]||''}>{d.holidayName}</span>}
                    </td>
                    <td className={'t ' + (rec && rec.checkIn ? '' : 'none')}>{rec && rec.checkIn ? rec.checkIn.slice(11) : '—'}</td>
                    <td className={'t ' + (rec && rec.checkOut ? '' : 'none')}>{rec && rec.checkOut ? rec.checkOut.slice(11) : '—'}</td>
                    <td className={'t ' + (rec && rec.outgo ? '' : 'none')}>{rec && rec.outgo ? rec.outgo.slice(11,16) : '—'}</td>
                    <td className={'t ' + (rec && rec.returnTime ? '' : 'none')}>{rec && rec.returnTime ? rec.returnTime.slice(11,16) : '—'}</td>
                    <td className={'t ' + (d.workedHours>0 ? '' : 'none')}>{d.workedHours>0 ? trimNum(d.workedHours,2) : '—'}</td>
                    <td className="st">
                      <div className="st-wrap">
                      {st && <span className={'cal-tag ' + st.k}>{st.t}</span>}
                      {leaveTags(d)}
                      {rec && rec.voided && <span className="cal-tag void" title={'作廢原因：'+(rec.voidReason||'')}>已作廢</span>}
                      {/* 打卡狀態上的「遲到 N 分鐘」是打卡當下寫進試算表的原始記錄，
                          事後補請假不會去改它（那是原始憑證）。但薪資用的是經假單調整後的
                          分鐘數，所以這裡要標出「已請假涵蓋」，否則每次看到都會以為又被扣了。 */}
                      {rec && !rec.voided && punchStatusTag(rec.checkInStatus, d.lateMinutes, '遲到')}
                      {rec && !rec.voided && punchStatusTag(rec.checkOutStatus, d.earlyMinutes, '早退')}
                      {/* ⚠️ 補登／修改過的紀錄，狀態欄寫的是「管理員補登／修改」，**不含遲到資訊** ——
                          那個欄位是打卡當下寫進去的，事後補的不會回頭補寫。
                          但薪資用的是系統即時算出來的分鐘數，兩者不一致會讓人以為那天沒遲到。
                          原始文字沒提到遲到早退時，這裡把算出來的補上去。 */}
                      {rec && !rec.voided && n(d.lateMinutes)>0 && !/遲到\d+分鐘/.test(String(rec.checkInStatus||'')) && (
                        <span className="cal-tag punch" title="這筆是補登或修改過的紀錄，打卡狀態欄沒有遲到資訊。這個數字是系統依打卡時間與班表即時算出來的，薪資以此為準。">
                          遲到 {d.lateMinutes} 分鐘（系統計算）
                        </span>
                      )}
                      {rec && !rec.voided && n(d.earlyMinutes)>0 && !/早退\d+分鐘/.test(String(rec.checkOutStatus||'')) && (
                        <span className="cal-tag punch" title="這筆是補登或修改過的紀錄，打卡狀態欄沒有早退資訊。這個數字是系統依打卡時間與班表即時算出來的，薪資以此為準。">
                          早退 {d.earlyMinutes} 分鐘（系統計算）
                        </span>
                      )}
                      </div>
                    </td>
                    <td className="note">
                      {rec && rec.note}
                      {rec && rec.voided && (
                        <div className="void-meta">{rec.voidedBy} 於 {rec.voidedAt} 作廢{rec.voidReason ? '：' + rec.voidReason : ''}</div>
                      )}
                    </td>
                    <td className="src">{rec ? (rec.source||'') : ''}</td>
                    <td className="act">
                      {rec ? (rec.voided
                        ? <button className="ghost sm" onClick={()=>onRestore(rec.id, rec)}>還原</button>
                        : <>
                            <button className="ghost sm" onClick={()=>onEdit(rec)}>修改</button>
                            <button className="ghost sm" style={{marginLeft:4}} onClick={()=>onVoid(rec.id, rec)}>作廢</button>
                          </>)
                        : (d.date<=todayStr && <>
                            <button className="ghost sm" onClick={()=>setSel({[d.date]:true})}>補登</button>
                            {d.required && d.leaveHours<=0 && (
                              <button className="ghost sm" style={{marginLeft:4}} title="代這位員工送出假單（不受補請期限限制）"
                                      onClick={()=>openLeaveFor(d)}>代請假</button>
                            )}
                          </>)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="card">
          <div className="cal-grid" style={{marginBottom:6}}>
            {CAL_WEEK.map(d=><div key={d} className={'cal-dow' + (d===0||d===6?' we':'')}>{CAL_DOW[d]}</div>)}
          </div>
          <div className="cal-grid">
            {/* 月初前面的空格。⚠️ 一週從星期一起算，所以不能直接用 dow（那是以星期日為 0），
                要換算成「這一天排在該週的第幾格」，否則整個月會整體位移一格。 */}
            {days.length>0 && Array.from({length: CAL_WEEK.indexOf(days[0].dow)}).map((_,i)=>
              <div key={'b'+i} className="cal-cell blank"></div>)}
            {days.map(d=>{
              const st = dayState(d);
              const live = d.records.filter(r=>!r.voided);
              const rec = live[0] || null;
              const cls = ['cal-cell', d.dayType!=='work' ? 'off' : '', d.gapHours>0 ? 'gap' : '',
                           d.skipReason==='beforeStart' && d.records.length===0 ? 'todo' : '',
                           sel[d.date] ? 'sel' : '', d.date===todayStr ? 'today' : ''].filter(Boolean).join(' ');
              return (
                <div key={d.date} className={cls} onClick={()=>toggle(d.date)}
                     title={d.holidayName || (CAL_DAYTYPE[d.dayType]||'')}>
                  {/* 第一行：日期＋當天工時。工時擺右上角當「這天的結果」，
                      掃一眼就知道哪天不足 8 小時，不用逐格細看時間。 */}
                  <div className="cal-top">
                    <span className={'cal-n' + (d.dow===0||d.dow===6?' we':'')}>{Number(d.date.slice(8,10))}</span>
                    {d.holidayName && <span className="cal-hn">{d.holidayName}</span>}
                    <span className="grow"></span>
                    {d.workedHours>0 && (
                      <span className={'cal-wh' + (d.required && d.workedHours < d.standardHours ? ' short' : '')}>
                        {trimNum(d.workedHours,1)}h
                      </span>
                    )}
                  </div>
                  {/* 上下班併成一行：兩行只是把同一件事拆開，佔掉標籤的空間 */}
                  {rec && rec.checkIn && (
                    <div className="cal-t">
                      {rec.checkIn.slice(11,16)}
                      <span className="dash">–</span>
                      {rec.checkOut
                        ? rec.checkOut.slice(11,16)
                        : <span className="miss">未打下班</span>}
                    </div>
                  )}
                  {st && !(st.k==='punch' && rec) && <span className={'cal-tag cal-mini ' + st.k}>{st.t}</span>}
                  {/* ⚠️ 月曆也要標遲到早退。原本只有時間跟假別，遲到完全看不見 ——
                      而月曆正是用來「一眼掃過整個月」的檢視，看不到異常就失去意義。 */}
                  {n(d.lateMinutes)>0 && (
                    <span className="cal-tag cal-mini punch" title={'遲到 ' + d.lateMinutes + ' 分鐘（系統計算，薪資以此為準）'}>
                      遲到 {d.lateMinutes} 分
                    </span>
                  )}
                  {n(d.earlyMinutes)>0 && (
                    <span className="cal-tag cal-mini punch" title={'早退 ' + d.earlyMinutes + ' 分鐘（系統計算，薪資以此為準）'}>
                      早退 {d.earlyMinutes} 分
                    </span>
                  )}
                  {leaveTags(d, true)}
                </div>
              );
            })}
          </div>
          <div className="cal-legend">
            <span><b>點格子</b>＝選取（可多選，再用下方工具列批次補登）</span>
            <span><span className="cal-tag miss">沒有紀錄</span> 應出勤卻沒打卡也沒假單</span>
            <span><span className="cal-tag punch">漏打下班卡</span> 補登下班時間即可</span>
            <span><span className="cal-tag punch">遲25分</span> 遲到早退（系統計算，薪資以此為準）</span>
            <span><span className="cal-tag lv">特休 8h</span> 已核准假　<span className="cal-tag lv wait">事假 1h</span> 審核中</span>
            <span><span className="cal-tag todo">待補登</span> 系統啟用前</span>
            <span>灰底＝六日／國定假日，不用出勤；<b>紅色只代表要處理的缺漏</b></span>
          </div>
        </div>
      )}

      {leaveBox && (
        <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget && !leaveBox.busy) setLeaveBox(null); }}>
          <div className="modal" style={{maxWidth:460}}>
            <h3><span className="material-icons">event_note</span>代 {data.name} 請假
              <span style={{fontWeight:400, fontSize:13, color:'var(--muted)', marginLeft:8}}>{leaveBox.date}</span>
            </h3>
            <div className="hint" style={{marginBottom:12}}>
              用於「員工其實有請假、只是忘了送單」的情況。以管理者身分建立，<b>不受補請期限限制</b>；
              送出後仍是「待審核」，要到假單審核完成核准才會計入出勤與薪資。
            </div>
            <div className="grid-2">
              <div className="field"><label>假別</label>
                <select value={leaveBox.leaveType} onChange={e=>setLeaveBox({...leaveBox, leaveType:e.target.value})}>
                  {ADMIN_LEAVE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="field"><label>時數</label>
                <input type="number" step="any" min="0" value={leaveBox.hours}
                       onChange={e=>setLeaveBox({...leaveBox, hours:e.target.value})} />
              </div>
              <div className="field"><label>開始時間</label>
                <input type="time" value={leaveBox.startTime} onChange={e=>setLeaveBox({...leaveBox, startTime:e.target.value})} />
              </div>
              <div className="field"><label>結束時間</label>
                <input type="time" value={leaveBox.endTime} onChange={e=>setLeaveBox({...leaveBox, endTime:e.target.value})} />
              </div>
            </div>
            <div className="field"><label>事由</label>
              <input type="text" value={leaveBox.reason} placeholder="例如：員工當日口頭告知，事後未送單"
                     onChange={e=>setLeaveBox({...leaveBox, reason:e.target.value})} />
            </div>
            <div className="hint" style={{marginTop:-4}}>
              時數與起訖時間要對得上（{data.workStart}~{data.workEnd}，午休 {data.lunchBreak} 分不計）。
              整天 = {trimNum(data.standardHours,1)} 小時。
            </div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setLeaveBox(null)} disabled={leaveBox.busy}>取消</button>
              <button onClick={submitLeave} disabled={leaveBox.busy}>{leaveBox.busy?'送出中...':'送出假單'}</button>
            </div>
          </div>
        </div>
      )}

      {selDates.length>0 && (
        <div className="cal-bar">
          <span className="n">已選 {selDates.length} 天</span>
          <span style={{fontSize:12, color:'#C9CDD2'}}>
            {selDates.length<=6 ? selDates.map(d=>d.slice(5)).join('、') : selDates[0].slice(5)+' … '+selDates[selDates.length-1].slice(5)}
          </span>
          <span style={{width:1, height:22, background:'#4a525c'}}></span>
          <label>上班</label>
          <input type="time" value={bulk.checkIn} onChange={e=>setBulk({...bulk, checkIn:e.target.value})} />
          <label>下班</label>
          <input type="time" value={bulk.checkOut} onChange={e=>setBulk({...bulk, checkOut:e.target.value})} />
          {selHalfMissing.length>0 && (
            <span className="ow ok" title={'這些日子只缺一半（例如有上班卡沒下班卡），會只補空白的那一欄：\n'+selHalfMissing.join('、')}>
              <span className="material-icons" style={{fontSize:16}}>check_circle</span>
              {selHalfMissing.length} 天只補缺的那一欄
            </span>
          )}
          {selFullRecord.length>0 && (
            <label className="ow" title={'這些日子上下班都已經有紀錄，預設略過。勾了才會把原本的打卡時間覆蓋掉——那是原始出勤憑證，請確認後再勾。\n'+selFullRecord.join('、')}>
              <input type="checkbox" checked={bulk.overwrite} onChange={e=>setBulk({...bulk, overwrite:e.target.checked})} />
              覆蓋已有完整紀錄的 {selFullRecord.length} 天
            </label>
          )}
          <span className="grow"></span>
          <button className="ghost sm" onClick={()=>setSel({})}>取消</button>
          <button onClick={doBulk} disabled={bulk.busy}>
            {bulk.busy ? '寫入中...' : `批次補登 ${selDates.length} 天`}
          </button>
          {/* 備註另起一行：它是稽核軌跡的一部分，要有夠寬的輸入空間。
              快捷按鈕點了直接填入，最常用的「系統啟用前」排第一個。 */}
          <div className="cal-bar-note">
            <label>備註</label>
            <input type="text" value={bulk.note} placeholder="會寫進每一筆補登的紀錄裡，供日後稽核辨識來源"
                   onChange={e=>setBulk({...bulk, note:e.target.value})} />
            {BULK_NOTE_PRESETS.map(pz=>(
              <button key={pz.label} type="button" className="ghost sm np" title={pz.text}
                      onClick={()=>setBulk({...bulk, note:pz.text})}>{pz.label}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function RecordsTab({employees, month}){
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [manual, setManual] = useState(null);
  const [editing, setEditing] = useState(null);
  const [filterCompany, setFilterCompany] = useState('全部');
  const [filterName, setFilterName] = useState('全部');
  const [onlyAbnormal, setOnlyAbnormal] = useState(false);
  // 已作廢的紀錄預設隱藏（它們不算數），勾選才撈出來查看與還原
  const [showVoided, setShowVoided] = useState(false);

  // 逐日檢視是另一個元件、另一支 API，靠這個 key 通知它一起重載
  const [reloadKey, setReloadKey] = useState(0);
  function load(){
    setLoading(true);
    setReloadKey(k=>k+1);
    apiGet('getRecords', {month, includeVoided: showVoided ? 'true' : 'false'})
      .then(setRecords).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [month, showVoided]);

  async function saveManual(){
    try{ await apiPost('addManualRecord', manual); setManual(null); load(); }catch(e){ alert(e.message); }
  }
  async function saveEdit(){
    try{ await apiPost('adjustRecord', editing); setEditing(null); load(); }catch(e){ alert(e.message); }
  }
  // 作廢而非刪除：原始資料完整保留，只是不再列入任何統計與薪資計算。
  // 依勞基法第 30 條第 5 項出勤紀錄應保存 5 年，硬刪除等於銷毀憑證、勞檢時無法舉證。
  async function voidRecordAsk(id, info){
    const who = info ? `${info.date}　${info.name}　${info.checkIn||'—'} / ${info.checkOut||'—'}\n\n` : '';
    const reason = prompt(
      '作廢打卡紀錄\n\n' + who +
      '作廢後這筆不再列入出缺勤統計與薪資計算，但原始資料會完整保留，\n' +
      '並記錄操作者與時間，日後可還原（勞基法第 30 條要求出勤紀錄保存 5 年）。\n\n' +
      '請填寫作廢原因：', '');
    if(reason === null) return;               // 按取消
    if(!reason.trim()){ alert('請填寫作廢原因，這是稽核軌跡的一部分'); return; }
    try{ await apiPost('voidRecord', {id, reason: reason.trim()}); load(); }catch(e){ alert(e.message); }
  }
  async function restoreRecordAsk(id, info){
    const who = info ? `${info.date}　${info.name}` : '這筆紀錄';
    if(!confirm(`還原「${who}」？\n\n還原後會重新列入出缺勤統計與薪資計算。`)) return;
    try{ await apiPost('restoreRecord', {id}); load(); }catch(e){ alert(e.message); }
  }

  const empMap = {}; employees.forEach(e=>{ empMap[e.id] = e; });
  const companies = ['全部', ...Array.from(new Set(employees.map(e=>e.company||'(未分類)')))];
  const namesInCompany = filterCompany==='全部' ? employees : employees.filter(e=>(e.company||'(未分類)')===filterCompany);
  const idsWithRecords = new Set(records.map(r=>r.employeeId)); // 免打卡員工若本月確實有紀錄（例如手動補登），還是要能被篩選到
  const eligibleForFilter = namesInCompany.filter(e=>!(e.exemptFromAttendance || (e.employeeType && e.employeeType!=='正式員工')) || idsWithRecords.has(e.id));
  // ⚠️ 篩選值用員工 ID 不用姓名：逐日檢視要拿 employeeId 去查日曆，同名的話會查到別人
  const nameOptions = eligibleForFilter.map(e=>({id:e.id, name:e.name}));
  const selectedEmp = filterName !== '全部' ? empMap[filterName] : null;

  const filtered = records.filter(r=>{
    const emp = empMap[r.employeeId];
    const empCompany = emp ? (emp.company||'(未分類)') : '(未分類)';
    if(filterCompany!=='全部' && empCompany!==filterCompany) return false;
    if(filterName!=='全部' && r.employeeId!==filterName) return false;
    if(onlyAbnormal && !isAbnormalStatus(r.checkInStatus) && !isAbnormalStatus(r.checkOutStatus) && !isAbnormalStatus(r.outgoStatus) && !isAbnormalStatus(r.returnStatus)) return false;
    return true;
  });

  function punchCell(time, status){
    const t = (time||'').split(' ')[1] || '-';
    return (
      <td className="center">
        <div className="mono">{t}</div>
        {isAbnormalStatus(status) && <div className="flag" style={{fontSize:11, marginTop:2}}>{status}</div>}
      </td>
    );
  }

  return (
    <div>
      <div className="toolbar" style={{flexWrap:'wrap', gap:8}}>
        <select value={filterCompany} onChange={e=>{ setFilterCompany(e.target.value); setFilterName('全部'); }} style={{width:'auto'}}>
          {companies.map(c=><option key={c} value={c}>{c==='全部'?'全部公司':c}</option>)}
        </select>
        <select value={filterName} onChange={e=>setFilterName(e.target.value)} style={{width:'auto'}}>
          <option value="全部">全部姓名</option>
          {nameOptions.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
        {/* 選定單一員工時改用逐日檢視，整月每一天都有位置 ——
            那兩個篩選在逐日檢視下沒有意義（作廢與異常都直接標在該日那一列上） */}
        {!selectedEmp && <>
          <label style={{display:'flex', alignItems:'center', gap:5, fontSize:13, color:'var(--ink)'}}>
            <input type="checkbox" checked={onlyAbnormal} onChange={e=>setOnlyAbnormal(e.target.checked)} style={{width:'auto'}} />只顯示異常記錄
          </label>
          <label style={{display:'flex', alignItems:'center', gap:5, fontSize:13, color:'var(--ink)'}}>
            <input type="checkbox" checked={showVoided} onChange={e=>setShowVoided(e.target.checked)} style={{width:'auto'}} />顯示已作廢
          </label>
        </>}
        {/* 這兩顆接在篩選後面，不要用 grow 推到最右邊 ——
            寬螢幕上要把滑鼠橫拉過整個畫面才按得到。
            選定員工時預填該員工，省掉在視窗裡再選一次。 */}
        <span className="tb-sep"></span>
        <button className="ghost sm" onClick={()=>setManual({
          employeeId: selectedEmp ? selectedEmp.id : '',
          name: selectedEmp ? selectedEmp.name : '',
          companyFilter: filterCompany,
          date: month+'-01', checkIn:'', checkOut:'', note:''})}>＋ 補登紀錄</button>
        <button className="ghost sm" onClick={load}>
          <span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理
        </button>
        <span className="grow"></span>
      </div>
      {selectedEmp ? (
        <EmployeeAttendanceView
          employeeId={selectedEmp.id} month={month} reloadKey={reloadKey}
          onEdit={r=>setEditing({id:r.id, date:r.date, name:r.name, checkIn:r.checkIn, checkOut:r.checkOut,
            note:r.note||'', lat:r.checkInLat||r.checkOutLat||'', lng:r.checkInLng||r.checkOutLng||''})}
          onVoid={voidRecordAsk} onRestore={restoreRecordAsk} onReload={load} />
      ) : (
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{tableLayout:'fixed', minWidth:1080}}>
            <colgroup>
              <col style={{width:'9%'}} /><col style={{width:'11%'}} /><col style={{width:'9%'}} />
              <col style={{width:'9%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} />
              <col style={{width:'8%'}} /><col style={{width:'13%'}} /><col style={{width:'14%'}} />
            </colgroup>
            <thead><tr><th className="center">姓名</th><th className="center">公司</th><th className="center">日期</th><th>上班</th><th>下班</th><th>外出</th><th>返回</th><th className="center">來源</th><th className="left">備註</th><th className="center">操作</th></tr></thead>
            <tbody>
              {filtered.map(r=>{
                const emp = empMap[r.employeeId];
                return (
                <tr key={r.id} className={r.voided ? 'voided-row' : ''}>
                  <td className="center"><b>{r.name}</b>{r.voided && <span className="void-tag">已作廢</span>}</td>
                  <td className="center">{emp ? (emp.company||'(未分類)') : '-'}</td>
                  <td className="center">{r.date}</td>
                  {punchCell(r.checkIn, r.checkInStatus)}
                  {punchCell(r.checkOut, r.checkOutStatus)}
                  {punchCell(r.outgo, r.outgoStatus)}
                  {punchCell(r.returnTime, r.returnStatus)}
                  <td className="center">{r.source}</td>
                  <td className="left">
                    {r.note}
                    {r.voided && <div className="void-meta">{r.voidedBy} 於 {r.voidedAt} 作廢{r.voidReason ? '：' + r.voidReason : ''}</div>}
                  </td>
                  <td>
                    {r.voided ? (
                      <button className="ghost sm" onClick={()=>restoreRecordAsk(r.id, r)}>還原</button>
                    ) : (<>
                      <button className="ghost sm" onClick={()=>setEditing({id:r.id, date:r.date, name:r.name, checkIn:r.checkIn, checkOut:r.checkOut, note:r.note, lat:r.checkInLat||r.checkOutLat||'', lng:r.checkInLng||r.checkOutLng||''})}>修改</button>{' '}
                      <button className="danger sm" onClick={()=>voidRecordAsk(r.id, r)}>作廢</button>
                    </>)}
                  </td>
                </tr>
                );
              })}
              {filtered.length===0 && <tr><td colSpan="10" className="hint" style={{textAlign:'center'}}>{records.length===0?'本月尚無打卡紀錄':'沒有符合篩選條件的紀錄'}</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      )}

      {manual && (
        <div className="modal-bg">
          <div className="modal">
            <h3>補登打卡紀錄</h3>
            <div className="field"><label>公司</label>
              <select value={manual.companyFilter||'全部'} onChange={e=>setManual({...manual, companyFilter:e.target.value, employeeId:'', name:''})}>
                {companies.map(c=><option key={c} value={c}>{c==='全部'?'全部公司':c}</option>)}
              </select>
            </div>
            <div className="field"><label>員工</label>
              <select value={manual.employeeId} onChange={e=>{ const emp=employees.find(x=>x.id===e.target.value); setManual({...manual, employeeId:e.target.value, name: emp?emp.name:''}); }}>
                <option value="">請選擇</option>
                {employees.filter(e=>(manual.companyFilter||'全部')==='全部' || (e.company||'(未分類)')===manual.companyFilter).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
            <div className="grid-2">
              <div className="field"><label>日期</label><input type="date" value={manual.date} onChange={e=>setManual({...manual,date:e.target.value})} /></div>
              <div className="field"></div>
              <div className="field"><label>上班時間</label><input type="datetime-local" onChange={e=>setManual({...manual, checkIn:e.target.value.replace('T',' ')+':00'})} /></div>
              <div className="field"><label>下班時間</label><input type="datetime-local" onChange={e=>setManual({...manual, checkOut:e.target.value.replace('T',' ')+':00'})} /></div>
            </div>
            <div className="field">
              <label>備註</label>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:6}}>
                {NOTE_PRESETS.map(p=>(
                  <button key={p} type="button" className="ghost sm" onClick={()=>setManual({...manual, note: manual.note ? manual.note+'；'+p : p})}>{p}</button>
                ))}
              </div>
              <textarea value={manual.note} onChange={e=>setManual({...manual,note:e.target.value})} rows="3" placeholder="例如：員工反映忘記打卡，經口頭確認補登" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>
            </div>
            <AddressGeocodeField lat={manual.lat} lng={manual.lng} onFound={(lat,lng)=>setManual({...manual, lat, lng})} />
            <div className="hint" style={{marginTop:-6, marginBottom:10}}>選填，如果知道員工當時實際所在地點，可以輸入地址核對是否在打卡範圍內。</div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setManual(null)}>取消</button><button onClick={saveManual}>儲存</button></div>
          </div>
        </div>
      )}
      {editing && (
        <div className="modal-bg">
          <div className="modal">
            <h3>修改打卡紀錄{editing.date ? <span style={{fontWeight:400, fontSize:13, color:'var(--muted)', marginLeft:8}}>{editing.name} · {editing.date}</span> : null}</h3>
            <div className="grid-2">
              <div className="field"><label>上班時間</label><input type="datetime-local" defaultValue={(editing.checkIn||'').replace(' ','T').slice(0,16)} onChange={e=>setEditing({...editing, checkIn:e.target.value.replace('T',' ')+':00'})} /></div>
              <div className="field"><label>下班時間</label><input type="datetime-local" defaultValue={(editing.checkOut||'').replace(' ','T').slice(0,16)} onChange={e=>setEditing({...editing, checkOut:e.target.value.replace('T',' ')+':00'})} /></div>
            </div>
            <div className="field">
              <label>備註</label>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:6}}>
                {NOTE_PRESETS.map(p=>(
                  <button key={p} type="button" className="ghost sm" onClick={()=>setEditing({...editing, note: editing.note ? editing.note+'；'+p : p})}>{p}</button>
                ))}
              </div>
              <textarea value={editing.note} onChange={e=>setEditing({...editing,note:e.target.value})} rows="3" placeholder="例如：定位偏移是因為店內訊號問題，已跟員工確認實際有在店內" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>
            </div>
            <AddressGeocodeField lat={editing.lat} lng={editing.lng} onFound={(lat,lng)=>setEditing({...editing, lat, lng})} />
            <div className="hint" style={{marginTop:-6, marginBottom:10}}>選填，如果要修正這筆紀錄的定位，可以輸入正確地址後儲存，狀態欄會依新座標重新比對是否超出範圍。</div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setEditing(null)}>取消</button><button onClick={saveEdit}>儲存</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 出缺勤彙總 ========================= */
// 偶發假別共用「其他有薪假」一欄：這些假一年可能只請一次，各給固定欄位會有 7 欄整年是 0
const OCCASIONAL_LEAVES = ['婚假','喪假','公假','公傷病假','產假','產檢假','陪產假'];
// 展開明細的一列。狀態放最前，最左邊形成一條顏色帶，待審核的幾筆往下掃就找得到
function LeaveDetailRow({d}){
  const pending = (d.status === '待審核' || d.status === '初核通過');
  const sameDay = String(d.startTime).slice(0,10) === String(d.endTime).slice(0,10);
  const when = sameDay
    ? `${String(d.startTime).slice(5,10)}　${String(d.startTime).slice(11,16)}–${String(d.endTime).slice(11,16)}`
    : `${String(d.startTime).slice(5,10)} ～ ${String(d.endTime).slice(5,10)}`;
  return (
    <div className="lv-row">
      <span className={'lv-st' + (pending ? ' wait' : '')}>{d.status}</span>
      <span className="lv-ty">{d.leaveType}</span>
      <span className="lv-hr">{trimNum(d.hours,1)} 小時</span>
      <span className="lv-when">{when}{d.reason ? <span className="lv-why">· {d.reason}</span> : null}</span>
    </div>
  );
}

function AttendanceTab({month, onApply, allLocked}){
  const [summary, setSummary] = useState([]);
  const [loading, setLoading] = useState(true);
  const [applying, setApplying] = useState(false);
  const [makeupBox, setMakeupBox] = useState(null); // {employeeId, name, dates}
  // 欄位分組摺疊：預設展開出勤與兩組請假、收起加班，一屏看得完不必橫向捲
  const [openG, setOpenG] = useState({gap:true, att:true, unpaid:true, paid:true, ot:false});
  const [openRow, setOpenRow] = useState({});
  const [onlyGap, setOnlyGap] = useState(false);   // 橫幅上的「只看對不上的人」
  const g = k => !!openG[k];
  const toggleG = k => setOpenG(o=>({...o, [k]:!o[k]}));
  const toggleRow = id => setOpenRow(o=>({...o, [id]:!o[id]}));
  // 扣薪假／有薪假分開統計：兩者性質不同（一個扣薪影響全勤、一個不扣），
  // 合成單一「請假合計」會看不出嚴重性，且扣薪假小計要能直接對薪資表的請假扣款
  function unpaidSum(e){ return r1(n(e.personalLeave)+n(e.sickLeave)+n(e.familyCareLeave)+n(e.menstrualLeave)+n(e.disasterLeave)); }
  function occasional(e){
    const t = e.leaveByType || {};
    return OCCASIONAL_LEAVES.filter(k=>n(t[k])>0).map(k=>({type:k, hours:n(t[k])}));
  }
  function paidSum(e){
    const t = e.leaveByType || {};
    return r1(n(t['特休']) + n(t['補休']) + occasional(e).reduce((s,x)=>s+x.hours,0));
  }
  function r1(v){ return Math.round((Number(v)||0)*10)/10; }
  /* 出勤時數對帳：應出勤 −（實際出勤 ＋ 請假）＝ 缺口。
     缺口通常代表漏請假，但也可能是漏打卡或系統沒記到，所以畫面一律用「對不上」「疑似」的措辭，
     不寫成曠職 —— 判定曠職要人工確認過，而且會直接扣到錢。 */
  const gapRows = summary.filter(e=>n(e.gapHours) > 0);
  const gapTotal = r1(gapRows.reduce((s,e)=>s+n(e.gapHours), 0));
  // 待審核的假單批下去以後還會剩多少：兩個數字都要講，只講其中一個都會誤導 ——
  // 只看已核准會虛胖（假單其實送了、還沒批），只看含待審核會漏掉「批了也還是不夠」的人
  const gapAfterPending = r1(summary.reduce((s,e)=>s+n(e.gapHoursAfterPending), 0));
  const shown = onlyGap ? gapRows : summary;
  // 0 用淡字而不是留白：留白會讓人分不清「沒請假」和「資料還沒帶進來」
  const Z = ({v, cls}) => <td className={'center ' + (cls||'') + (n(v)===0 ? ' zero-dim' : '')}>{trimNum(v,1)}</td>;

  function load(){ setLoading(true); apiGet('getMonthlySummary', {month}).then(setSummary).catch(e=>alert(e.message)).finally(()=>setLoading(false)); }
  useEffect(load, [month]);

  function doExportCSV(){
    // CSV 一律匯出全部欄位（含收合起來的群組），畫面上的摺疊只是為了控制寬度，不該影響匯出內容
    const headers = ['姓名','應出勤日數','應出勤(hr)','已認列(hr)','缺口(hr)','缺口(批完待審後)(hr)','對不上的日期',
      '出勤日數','遲到次數','遲到分鐘','早退次數','早退分鐘',
      '事假(hr)','病假(hr)','家庭照顧假(hr)','生理假(hr)','災防假(hr)','扣薪假小計(hr)',
      '特休(hr)','補休(hr)','其他有薪假(hr)','其他有薪假明細','有薪假小計(hr)','待審核筆數','待審核時數(hr)',
      '平日1.34倍(hr)','平日1.67倍(hr)','單日超時日數','單日超時日期','休息日出勤(hr)','國定假日出勤(hr)','例假日出勤(hr)','總工時(hr)','平日加班上限是否超過','定位異常日數'];
    const rows = summary.map(e=>{
      const t = e.leaveByType || {};
      const occ = occasional(e);
      return [e.name,e.requiredDays,e.requiredHours,e.creditedHours,e.gapHours,e.gapHoursAfterPending,
        (e.gapDates||[]).map(x=>x.date+' '+x.reason+' 少'+x.gapHours+'h').join('、'),
        e.presentDays,e.lateCount,e.lateMinutes,e.earlyLeaveCount,e.earlyLeaveMinutes,
        e.personalLeave,e.sickLeave,e.familyCareLeave,e.menstrualLeave,e.disasterLeave,unpaidSum(e),
        n(t['特休']),n(t['補休']),occ.reduce((s,x)=>s+x.hours,0),occ.map(x=>x.type+' '+x.hours).join('、'),paidSum(e),
        e.pendingLeaveCount||0,e.pendingLeaveHours||0,
        e.otWeekday134,e.otWeekday167,e.dailyOtExceedDays.length,e.dailyOtExceedDays.join('、'),
        e.otRestDayHours,e.otHolidayHours,e.otMandatoryRestHours,e.workedHoursTotal,e.otCapExceeded?'是':'否',e.flaggedDays];
    });
    exportCSV(`出缺勤彙總_${month}.csv`, headers, rows);
  }
  async function doApply(){
    setApplying(true);
    try{ await onApply(); } finally { setApplying(false); }
  }

  return (
    <div>
      <div className="toolbar">
        <span className="grow"></span>
        <button className="ghost sm" onClick={doExportCSV}>匯出 CSV</button>
        <button onClick={doApply} disabled={applying || allLocked}
          title={allLocked ? '本月薪資已鎖定，時數不會被覆蓋。要修改請先到「薪資計算 / 明細」解鎖' : ''}>
          {applying?'套用中...':'套用出缺勤時數到薪資計算'}
        </button>
        {allLocked && <span className="hint" style={{fontSize:11.5}}>本月已鎖定</span>}
      </div>
      {!loading && summary.length > 0 && (
        gapRows.length > 0 ? (
          <div className="gap-banner warn">
            <span className="material-icons">rule</span>
            <div className="gb-body">
              <div className="gb-title">
                {gapRows.length} 人的出勤時數對不上，合計少 {trimNum(gapTotal,1)} 小時
              </div>
              <div className="gb-sub">
                {gapAfterPending > 0
                  ? <>把審核中的假單全部批准後，還會剩 <b style={{color:'var(--danger)'}}>{trimNum(gapAfterPending,1)}</b> 小時對不上 —— 這些是真的沒有假單。</>
                  : <>審核中的假單全部批准後就會補平，不必另外追。</>}
                　點姓名可以看是缺哪幾天。
              </div>
              <div className="gb-names">
                {gapRows.map(e=>(
                  <span key={e.employeeId} className="gb-name">{e.name} 少 {trimNum(e.gapHours,1)}h</span>
                ))}
              </div>
            </div>
            <button className={onlyGap ? 'sm' : 'ghost sm'} onClick={()=>setOnlyGap(v=>!v)}>
              {onlyGap ? '顯示全部人' : '只看對不上的'}
            </button>
          </div>
        ) : (
          <div className="gap-banner ok">
            <span className="material-icons">task_alt</span>
            <div className="gb-body">
              <div className="gb-title">全部對得上</div>
              <div className="gb-sub">每個人的「實際出勤＋已核准請假」都填滿了應出勤時數，沒有缺漏的假單。</div>
            </div>
          </div>
        )
      )}
      <div className="grp-bar">
        {[{k:'gap',t:'對帳'},{k:'att',t:'出勤'},{k:'unpaid',t:'扣薪假'},{k:'paid',t:'有薪假'},{k:'ot',t:'加班'}].map(x=>(
          <button key={x.k} type="button" className={'grp-chip' + (g(x.k)?' on':'')} onClick={()=>toggleG(x.k)}>
            <span className="grp-dot"></span>{x.t}
          </button>
        ))}
        <span className="hint" style={{marginLeft:'auto', fontSize:11.5}}>點姓名展開該員工當月逐筆假單</span>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table className="sum-tbl">
            <thead>
              <tr>
                <th className="center" rowSpan="2">姓名</th>
                {g('gap') && <th className="center grp-gap" colSpan="3">時數對帳（小時）</th>}
                {g('att') && <th className="center grp-att" colSpan="5">出勤</th>}
                {g('unpaid') && <th className="center grp-un" colSpan="6">扣薪假（小時）</th>}
