function AnnualLeaveTab({employees}){
  const [year, setYear] = useState(String(new Date().getFullYear()));
  const [system, setSystem] = useState('calendar');
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [edits, setEdits] = useState({});
  const [savingId, setSavingId] = useState(null);
  const [estimatingId, setEstimatingId] = useState(null);
  const [batchBox, setBatchBox] = useState(null); // 批次試算預覽 {items, saving}
  const [batchLoading, setBatchLoading] = useState(false);

  function load(){
    setLoading(true);
    apiGet('getAnnualLeaveList', {year}).then(d=>{ setData(d); setEdits({}); }).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [year]);

  async function save(empId){
    const hours = Number(edits[empId]);
    if(isNaN(hours) || hours < 0){ alert('請輸入正確的時數'); return; }
    setSavingId(empId);
    try{
      await apiPost('setAnnualLeave', {employeeId: empId, year, hours});
      await load();
    }catch(e){ alert(e.message); }
    finally{ setSavingId(null); }
  }
  async function estimate(empId){
    setEstimatingId(empId);
    try{
      const r = await apiGet('estimateAnnualLeave', {employeeId: empId, year, system});
      setEdits({...edits, [empId]: r.hours});
    }catch(e){ alert(e.message); }
    finally{ setEstimatingId(null); }
  }

  async function batchEstimate(){
    setBatchLoading(true);
    try{
      const items = await apiGet('batchEstimateAnnualLeave', {year, system});
      setBatchBox({items, saving:false});
    }catch(e){ alert(e.message); }
    finally{ setBatchLoading(false); }
  }
  async function batchApply(){
    setBatchBox({...batchBox, saving:true});
    try{
      const items = batchBox.items.filter(it=>it.hours!==null).map(it=>({employeeId:it.employeeId, hours:it.hours}));
      const r = await apiPost('batchSaveAnnualLeave', {year, items});
      alert(`批次套用完成，共更新 ${r.saved} 位員工，請個別確認後如需微調可在下方表格調整。`);
      setBatchBox(null);
      await load();
    }catch(e){ alert(e.message); setBatchBox({...batchBox, saving:false}); }
  }

  const years = [];
  const thisYear = new Date().getFullYear();
  for(let y = thisYear + 1; y >= thisYear - 2; y--) years.push(String(y));

  return (
    <div>
      <div className="toolbar">
        <label style={{marginBottom:0}}>年度</label>
        <select value={year} onChange={e=>setYear(e.target.value)}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        <label style={{marginBottom:0}}>試算方式</label>
        <select value={system} onChange={e=>setSystem(e.target.value)}>
          <option value="calendar">歷年制（每年1/1~12/31）</option>
          <option value="anniversary">週年制（到職日起算）</option>
        </select>
        <span className="grow"></span>
        <button onClick={batchEstimate} disabled={batchLoading}>{batchLoading?'試算中...':'批次試算全部員工'}</button>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>
        核定每位員工當年度的特休「時數」（1 日＝8小時）。按「試算」可依到職日自動帶入建議日數，仍可手動調整後再儲存。
        <br/>⚠ 系統試算僅供參考，正式日數請以<a href="https://calcr2.mol.gov.tw/RestDays" target="_blank" rel="noopener" style={{color:'var(--brand)'}}>勞動部特別休假日數試算系統</a>或人資顧問確認為準。
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading || !data ? <div className="hint">載入中...</div> : (
          <table style={{tableLayout:'fixed', minWidth:900}}>
            <colgroup>
              <col style={{width:'11%'}} /><col style={{width:'11%'}} /><col style={{width:'19%'}} />
              <col style={{width:'10%'}} /><col style={{width:'12%'}} /><col style={{width:'10%'}} />
              <col style={{width:'10%'}} /><col style={{width:'17%'}} />
            </colgroup>
            <thead><tr><th className="center">姓名</th><th className="center">部門</th><th className="left">到職日</th><th className="center">核定日數</th><th className="center">核定時數</th><th className="center">已用</th><th className="center">剩餘</th><th className="center">操作</th></tr></thead>
            <tbody>
              {employees.map(emp=>{
                const granted = data.granted[emp.id] ? data.granted[emp.id].hours : 0;
                const used = data.used[emp.id] || 0;
                const editVal = edits[emp.id] !== undefined ? edits[emp.id] : granted;
                const editDays = Number(editVal)>0 ? trimNum(Number(editVal)/8, 1) : '0';
                return (
                  <tr key={emp.id}>
                    <td className="center"><b>{emp.name}</b></td>
                    <td className="center">{emp.department}</td>
                    <td className="left">{emp.hireDate ? rocDate(emp.hireDate) : '-'}</td>
                    <td className="center hint">{editDays} 日</td>
                    <td className="center"><input type="number" min="0" step="0.01" value={editVal} onChange={e=>setEdits({...edits, [emp.id]: e.target.value})} style={{width:80, textAlign:'center'}} /></td>
                    <td className="center">{trimNum(used, 1)}<span className="hint" style={{marginLeft:4}}>（{trimNum(used/8, 1)} 日）</span></td>
                    <td className={'center' + (granted-used < 8 ? ' flag' : '')}>
                      {trimNum(Math.max(0, granted-used), 1)}
                      <span className="hint" style={{marginLeft:4}}>（{trimNum(Math.max(0, granted-used)/8, 1)} 日）</span>
                    </td>
                    <td className="center">
                      <button className="ghost sm" onClick={()=>estimate(emp.id)} disabled={estimatingId===emp.id || !emp.hireDate} title={!emp.hireDate?'請先設定到職日':''}>{estimatingId===emp.id?'試算中':'試算'}</button>{' '}
                      <button className="ghost sm" onClick={()=>save(emp.id)} disabled={savingId===emp.id}>{savingId===emp.id?'儲存中':'儲存'}</button>
                    </td>
                  </tr>
                );
              })}
              {employees.length===0 && <tr><td colSpan="8" className="hint" style={{textAlign:'center'}}>尚無員工</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {batchBox && (
        <div className="modal-bg">
          <div className="modal" style={{maxWidth:640}}>
            <h3><span className="material-icons">calculate</span>批次試算預覽（{year}年・{system==='calendar'?'歷年制':'週年制'}）</h3>
            <div className="hint" style={{marginBottom:10}}>以下為系統依到職日試算的建議日數，確認無誤後按「套用全部」，會覆蓋這些員工目前的核定時數。個別員工仍可在下方表格單獨微調。</div>
            <table>
              <colgroup>
                <col style={{width:'14%'}} /><col style={{width:'26%'}} /><col style={{width:'14%'}} />
                <col style={{width:'14%'}} /><col style={{width:'32%'}} />
              </colgroup>
              <thead><tr><th className="center">姓名</th><th className="left">到職日</th><th className="center">建議日數</th><th className="center">建議時數</th><th className="center">備註</th></tr></thead>
              <tbody>
                {batchBox.items.map(it=>(
                  <tr key={it.employeeId}>
                    <td className="center">{it.name}</td>
                    <td className="left">{(employees.find(e=>e.id===it.employeeId)||{}).hireDate ? rocDate((employees.find(e=>e.id===it.employeeId)||{}).hireDate) : '-'}</td>
                    <td className="center">{it.days===null?'-':trimNum(it.days,1)}</td>
                    <td className="center">{it.hours===null?'-':trimNum(it.hours,2)}</td>
                    <td className="center" style={{color:'var(--danger)'}}>{it.error}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setBatchBox(null)}>取消</button>
              <button onClick={batchApply} disabled={batchBox.saving}>{batchBox.saving?'套用中...':'套用全部'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// 內文用 **粗體** 標記重點，這裡轉成 <b>。不引外部 markdown 套件，只處理這一種語法。
function boldize(text){
  return String(text).split('**').map((seg, i)=> i%2 ? <b key={i}>{seg}</b> : <span key={i}>{seg}</span>);
}
function GuideTab({setTab}){

/* ========================= 加班補休明細表 ========================= */
function CompLedgerTab({employees}){
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [empFilter, setEmpFilter] = useState('');
  const [reminderDays, setReminderDays] = useState(30);

  function load(){
    setLoading(true);
    apiGet('getCompLedger', empFilter ? {employeeId:empFilter} : {}).then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [empFilter]);
  useEffect(()=>{ apiGet('getSettings').then(s=>setReminderDays(Number(s.compExpireReminderDays)||30)).catch(()=>{}); }, []);

  function expireStatus(expireDate){
    if(!expireDate) return '';
    const today = new Date().toISOString().slice(0,10);
    const deadline = new Date(Date.now() + reminderDays*86400000).toISOString().slice(0,10);
    if(expireDate < today) return 'expired';
    if(expireDate <= deadline) return 'soon';
    return '';
  }

  function doExport(){
    const headers = ['姓名','類型','時數','異動後餘額','說明','到期日','建立時間'];
    const rows = list.map(r=>[r.name, r.type, r.hours, r.balanceAfter, r.note, r.expireDate, r.createdAt]);
    exportCSV('加班補休明細表.csv', headers, rows);
  }

  return (
    <div>
      <div className="toolbar">
        <label style={{marginBottom:0}}>員工</label>
        <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)}>
          <option value="">全部員工</option>
          {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
        <button className="ghost sm" onClick={doExport}><span className="material-icons" style={{fontSize:16}}>download</span>匯出 CSV</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>每筆加班換補休核准後會自動「轉入」，員工請補休假核准後會自動「使用」扣抵，餘額為累計結果。到期日到了仍未使用完的補休，依規定應折算工資發給。到期日欄位：<span style={{color:'var(--danger)'}}>紅字</span>＝已過期，<span style={{color:'#B8860B'}}>橘字</span>＝即將到期（設定頁可調整提醒日數）。</div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table>
            <thead><tr><th className="left">姓名</th><th className="left">類型</th><th>時數</th><th>異動後餘額</th><th className="left">說明</th><th className="left">到期日</th><th className="left">時間</th></tr></thead>
            <tbody>
              {list.map(r=>{
                const st = expireStatus(r.expireDate);
                return (
                  <tr key={r.id}>
                    <td className="left"><b>{r.name}</b></td>
                    <td className="left">{r.type==='加班轉入' ? <span className="badge">加班轉入</span> : <span className="badge warn">請假使用</span>}</td>
                    <td className={r.hours>=0?'num-pos':'num-neg'}>{r.hours>=0?'+':''}{r.hours}</td>
                    <td>{r.balanceAfter}</td>
                    <td className="left">{r.note}</td>
                    <td className="left" style={st==='expired'?{color:'var(--danger)', fontWeight:700}:st==='soon'?{color:'#B8860B', fontWeight:700}:undefined}>{r.expireDate}</td>
                    <td className="left">{r.createdAt}</td>
                  </tr>
                );
              })}
              {list.length===0 && <tr><td colSpan="7" className="hint" style={{textAlign:'center'}}>尚無補休紀錄</td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ========================= 簡易格式編輯器（公告內容用） ========================= */
function RichTextEditor({value, onChange}){
  const editorRef = useRef(null);
  const savedRangeRef = useRef(null);
  const fileInputRef = useRef(null);
  const [uploading, setUploading] = useState(false);

  useEffect(()=>{
    if(editorRef.current) editorRef.current.innerHTML = value || '';
  }, []); // 只在掛載時同步一次，避免打字中被重置游標位置

  function saveSelection(){
    const sel = window.getSelection();
    if(sel && sel.rangeCount > 0 && editorRef.current && editorRef.current.contains(sel.anchorNode)){
      savedRangeRef.current = sel.getRangeAt(0);
    }
  }
  function restoreSelection(){
    if(!savedRangeRef.current) return;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRangeRef.current);
  }
  function exec(cmd, arg){
    editorRef.current.focus();
    restoreSelection();
    document.execCommand(cmd, false, arg || null);
    onChange(editorRef.current.innerHTML);
  }
  function toggleAccentColor(){
    editorRef.current.focus();
    restoreSelection();
    const current = document.queryCommandValue('foreColor');
    const isAccent = current === 'rgb(161, 61, 61)' || current === '#a13d3d';
    document.execCommand('foreColor', false, isAccent ? '#22242C' : '#a13d3d');
    onChange(editorRef.current.innerHTML);
  }
  function onLink(){
    const url = prompt('請輸入連結網址（需包含 https://）');
    if(!url) return;
    exec('createLink', url);
  }
  function onPickImage(){
    saveSelection();
    fileInputRef.current && fileInputRef.current.click();
  }
  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        const MAX = 1000;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX){ const s = MAX/Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
      img.src = url;
    });
  }
  async function onFileChange(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    setUploading(true);
    try{
      const base64 = await compressImage(file);
      const data = await apiPost('uploadAnnouncementImage', {imageBase64: base64, mimeType:'image/jpeg'});
      editorRef.current.focus();
      restoreSelection();
      document.execCommand('insertHTML', false, `<img src="${data.url}" style="max-width:100%;border-radius:8px;margin:6px 0;display:block;" />`);
      onChange(editorRef.current.innerHTML);
    }catch(err){ alert(err.message); }
    finally{ setUploading(false); }
  }

  const btnStyle = {padding:'4px 8px', minWidth:0};
  return (
    <div>
      <div style={{display:'flex', flexWrap:'wrap', gap:4, marginBottom:6, background:'var(--bg-2, #f2f2f2)', padding:6, borderRadius:8}}>
        <button type="button" className="ghost sm" style={btnStyle} title="粗體" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('bold')}><span className="material-icons" style={{fontSize:16}}>format_bold</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="斜體" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('italic')}><span className="material-icons" style={{fontSize:16}}>format_italic</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="底線" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('underline')}><span className="material-icons" style={{fontSize:16}}>format_underlined</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="強調色（先選取文字，再點一下套用，選取後再點一次可以復原）" onMouseDown={e=>e.preventDefault()} onClick={toggleAccentColor}><span className="material-icons" style={{fontSize:16, color:'var(--danger)'}}>format_color_text</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="項目符號" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('insertUnorderedList')}><span className="material-icons" style={{fontSize:16}}>format_list_bulleted</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="編號清單" onMouseDown={e=>e.preventDefault()} onClick={()=>exec('insertOrderedList')}><span className="material-icons" style={{fontSize:16}}>format_list_numbered</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="超連結" onMouseDown={e=>e.preventDefault()} onClick={onLink}><span className="material-icons" style={{fontSize:16}}>link</span></button>
        <button type="button" className="ghost sm" style={btnStyle} title="插入圖片" disabled={uploading} onMouseDown={e=>e.preventDefault()} onClick={onPickImage}><span className="material-icons" style={{fontSize:16}}>{uploading?'hourglass_top':'image'}</span></button>
        <input ref={fileInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={onFileChange} />
      </div>
      <div
        ref={editorRef}
        contentEditable
        suppressContentEditableWarning
        onInput={()=>onChange(editorRef.current.innerHTML)}
        onMouseUp={saveSelection}
        onKeyUp={saveSelection}
        style={{minHeight:120, maxHeight:320, overflowY:'auto', border:'1px solid var(--line)', borderRadius:6, padding:10, fontSize:13, lineHeight:1.7}}
      />
    </div>
  );
}

function AnnouncementsTab(){
  const [list, setList] = useState([]);
  const [companies, setCompanies] = useState([]);
  const [categories, setCategories] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [isNew, setIsNew] = useState(false);
  const [saving, setSaving] = useState(false);
  const [attachUploading, setAttachUploading] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const [categoryBox, setCategoryBox] = useState(null); // {newName, newColor, saving}
  const attachInputRef = useRef(null);

  function load(){
    setLoading(true);
    Promise.all([apiGet('getAnnouncementsAdmin'), apiGet('getCompanies'), apiGet('getAnnounceCategories')])
      .then(([a,c,cat])=>{ setList(a); setCompanies(c); setCategories(cat); })
      .catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, []);

  function openCategoryManager(){ setCategoryBox({newName:'', newColor:CATEGORY_COLORS[0], saving:false}); }
  async function addCategoryItem(){
    if(!categoryBox.newName.trim()){ alert('請輸入分類名稱'); return; }
    setCategoryBox({...categoryBox, saving:true});
    try{
      await apiPost('addAnnounceCategory', {name:categoryBox.newName.trim(), color:categoryBox.newColor});
      const cat = await apiGet('getAnnounceCategories'); setCategories(cat);
      setCategoryBox({newName:'', newColor:CATEGORY_COLORS[0], saving:false});
    }catch(e){ alert(e.message); setCategoryBox({...categoryBox, saving:false}); }
  }
  async function removeCategoryItem(id){
    if(!confirm('刪除這個分類？（已經套用過這個分類的公告不會受影響）')) return;
    try{ await apiPost('deleteAnnounceCategory', {id}); const cat = await apiGet('getAnnounceCategories'); setCategories(cat); }catch(e){ alert(e.message); }
  }

  function openNew(){ setEditing({id:null, title:'', content:'', companyId:'', pinned:false, status:'已發布', attachments:[], showOnHome:false, category:'', categoryColor:''}); setIsNew(true); }
  function openEdit(a){ setEditing({...a, attachments: a.attachments||[]}); setIsNew(false); }
  async function save(){
    if(!editing.title.trim()){ alert('請輸入標題'); return; }
    setSaving(true);
    try{
      if(isNew) await apiPost('addAnnouncement', editing);
      else await apiPost('updateAnnouncement', editing);
      setEditing(null); load();
    }catch(e){ alert(e.message); }
    finally{ setSaving(false); }
  }
  async function remove(id){
    if(!confirm('確定刪除這則公告？')) return;
    try{ await apiPost('deleteAnnouncement', {id}); load(); }catch(e){ alert(e.message); }
  }
  function companyName(id){ if(!id) return '全公司'; const c = companies.find(x=>x.id===id); return c?c.name:'-'; }

  async function onAttachFileChange(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(file.size > 10*1024*1024){ alert('檔案不能超過 10MB'); return; }
    setAttachUploading(true);
    try{
      const base64 = await fileToBase64(file);
      const data = await apiPost('uploadAnnouncementAttachment', {fileBase64: base64, mimeType: file.type, filename: file.name});
      setEditing(prev=>({...prev, attachments:[...(prev.attachments||[]), {name: data.name, url: data.url, size: data.size, mimeType: data.mimeType}]}));
    }catch(err){ alert(err.message); }
    finally{ setAttachUploading(false); }
  }
  function removeAttachment(idx){
    setEditing(prev=>({...prev, attachments: prev.attachments.filter((_,i)=>i!==idx)}));
  }

  return (
    <div>
      <div className="toolbar">
        <button onClick={openNew}><span className="material-icons">campaign</span>發布公告</button>

        const isOpen = expanded===a.id;
        return (
        <div className="card" key={a.id} style={{borderLeft: a.pinned?'4px solid var(--accent)':undefined, paddingLeft: a.pinned?12:undefined}}>
          <div className="row-between" style={{alignItems:'flex-start'}}>

              {a.pinned && <span className="material-icons" style={{fontSize:16, color:'var(--accent)', flexShrink:0}}>push_pin</span>}
              <span>{a.title}</span>
              {a.status!=='已發布' && <span className="badge warn">草稿</span>}
              {a.category && <span className="badge" style={{background:a.categoryColor||'var(--accent)', color:'#fff'}}>{a.category}</span>}

          {isOpen ? (
            <div>
              <div style={{fontSize:13}} dangerouslySetInnerHTML={{__html: linkifyBlank(a.content)}} />
              {a.attachments && a.attachments.length > 0 && (
                <div style={{display:'flex', flexWrap:'wrap', gap:6, marginTop:8}}>

                      <span className="material-icons" style={{fontSize:15}}>{attachIcon(att.name)}</span>{att.name}

            </div>
          </div>
        </div>
      )}

      {categoryBox && (
        <div className="modal-bg">
          <div className="modal" style={{maxWidth:420}}>
            <h3><span className="material-icons">sell</span>管理分類</h3>
            {categories.length===0 ? <div className="hint" style={{marginBottom:10}}>還沒有任何分類。</div> : (
              <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:14}}>
                {categories.map(c=>(
                  <div className="row-between" key={c.id} style={{background:'var(--bg-2,#f2f2f2)', padding:'8px 10px', borderRadius:6}}>
                    <div style={{display:'flex', alignItems:'center', gap:8}}>
                      <span style={{width:16, height:16, borderRadius:'50%', background:c.color, display:'inline-block'}}></span>
                      <span>{c.name}</span>
                    </div>
                    <button type="button" className="ghost sm" onClick={()=>removeCategoryItem(c.id)}><span className="material-icons" style={{fontSize:14}}>close</span></button>
                  </div>
                ))}
              </div>
            )}
            <div className="field">
              <label>新增分類</label>
              <div style={{display:'flex', gap:8, marginBottom:8}}>
                {CATEGORY_COLORS.map(c=>(
                  <div key={c} onClick={()=>setCategoryBox({...categoryBox, newColor:c})}
                    style={{width:26, height:26, borderRadius:'50%', background:c, cursor:'pointer', border: categoryBox.newColor===c ? '2px solid var(--ink)' : '2px solid transparent'}} />
                ))}
              </div>
              <div style={{display:'flex', gap:8}}>
                <input value={categoryBox.newName} onChange={e=>setCategoryBox({...categoryBox, newName:e.target.value})} placeholder="例如：緊急通知" style={{flex:1}} />
                <button onClick={addCategoryItem} disabled={categoryBox.saving}>{categoryBox.saving?'新增中...':'新增'}</button>
              </div>
            </div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setCategoryBox(null)}>關閉</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 系統設定 ========================= */
function SettingsTab({onSaved, initialCategory}){
  const [s, setS] = useState(null);
  const [loading, setLoading] = useState(true);
  const [locating, setLocating] = useState(false);
  const [category, setCategory] = useState(initialCategory || 'basic');
  const DOW = ['日','一','二','三','四','五','六'];
  const savedThemeRef = useRef('default'); // 記住「目前真正已儲存」的配色，離開頁面若沒按儲存要還原成這個
  const [companies, setCompanies] = useState([]);
  const [companyPickId, setCompanyPickId] = useState('');
  const [companyDisplayDraft, setCompanyDisplayDraft] = useState('');
  const [companySaving, setCompanySaving] = useState(false);
  const [faviconUploading, setFaviconUploading] = useState(''); // 'global' 或公司id，標示目前是哪個在上傳中
  const globalFaviconInputRef = useRef(null);
  const companyFaviconInputRef = useRef(null);

  async function uploadFavicon(file, companyId){
    if(!file) return;
    setFaviconUploading(companyId || 'global');
    try{
      const base64 = await fileToBase64(file);
      const data = await apiPost('uploadFaviconImage', {imageBase64: base64, mimeType: file.type, companyId: companyId || ''});
      if(companyId){ loadCompanies(); }
      else { setS(prev=>({...prev, faviconUrl: data.url})); }
    }catch(e){ alert(e.message); }
    finally{ setFaviconUploading(''); }
  }

  function loadCompanies(){ apiGet('getCompanies').then(setCompanies).catch(()=>{}); }
  function pickCompany(id){
    setCompanyPickId(id);
    const c = companies.find(x=>x.id===id);
    setCompanyDisplayDraft(c ? (c.displayName||'') : '');
  }
  async function saveCompanyDisplayName(){
    const c = companies.find(x=>x.id===companyPickId);
    if(!c) return;
    setCompanySaving(true);
    try{
      await apiPost('updateCompany', {...c, displayName: companyDisplayDraft});
      loadCompanies();
      alert('已儲存「'+c.name+'」的顯示名稱');
    }catch(e){ alert(e.message); }
    finally{ setCompanySaving(false); }
  }

  function load(){
    setLoading(true);
    apiGet('getSettings').then(data=>{ setS(data); savedThemeRef.current = data.themeColor || 'default'; }).catch(e=>alert(e.message)).finally(()=>setLoading(false));
    loadCompanies();
  }
  useEffect(load, []);
  // 離開設定頁時，如果配色只是預覽、沒有實際按儲存，還原成真正已儲存的配色
  useEffect(()=>{ return ()=>{ applyAdminTheme(savedThemeRef.current); }; }, []);

  async function save(){
    try{ await apiPost('updateSettings', s); savedThemeRef.current = s.themeColor || 'default'; alert('設定已儲存'); if(onSaved) onSaved(); }catch(e){ alert(e.message); }
  }
  function useCurrentLocation(){
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      pos => { setS({...s, lat: pos.coords.latitude, lng: pos.coords.longitude}); setLocating(false); },
      err => { alert('定位失敗：' + err.message); setLocating(false); },
      {enableHighAccuracy:true, timeout:8000}
    );
  }

  if(loading || !s) return <div className="hint">載入中...</div>;
  return (
    <div>
    <div className="toolbar" style={{marginBottom:14}}>
      <button className={category==='basic'?'':'ghost'} onClick={()=>setCategory('basic')}>基本資訊</button>
      <button className={category==='attendance'?'':'ghost'} onClick={()=>setCategory('attendance')}>出勤打卡規則</button>
      <button className={category==='leave'?'':'ghost'} onClick={()=>setCategory('leave')}>請假與獎金規則</button>
    </div>
    <div className="card" style={{maxWidth:560}}>
      {category==='basic' && (<>
      <h3><span className="material-icons">storefront</span> 店家 / 公司資訊</h3>
      <div className="field"><label>預設顯示名稱</label><input value={s.storeName} onChange={e=>setS({...s,storeName:e.target.value})} style={{width:'100%'}} /></div>
      <div className="hint" style={{marginTop:-8, marginBottom:10}}>前台首頁抬頭預設顯示這個名稱；如果去「公司管理」幫個別公司填了自己的顯示名稱，該公司員工會優先看到自己公司的名稱。</div>

      <div className="field">
        <label>瀏覽器分頁圖示（favicon，全站預設）</label>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          {s.faviconUrl && <img src={s.faviconUrl} style={{width:28, height:28, borderRadius:6, border:'1px solid var(--line)'}} />}
          <button type="button" className="ghost sm" disabled={faviconUploading==='global'} onClick={()=>globalFaviconInputRef.current && globalFaviconInputRef.current.click()}>
            {faviconUploading==='global' ? '上傳中...' : (s.faviconUrl ? '更換圖示' : '上傳圖示')}
          </button>
          <input ref={globalFaviconInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ uploadFavicon(e.target.files[0]); e.target.value=''; }} />
        </div>
        <div className="hint" style={{marginTop:4}}>後台跟沒有設定自己圖示的公司，員工前台都會用這個。建議用正方形圖片。</div>
      </div>

      <div className="field" style={{marginTop:14}}>
        <label>個別公司顯示名稱 / 圖示</label>
        <select value={companyPickId} onChange={e=>pickCompany(e.target.value)}>
          <option value="">請選擇公司</option>
          {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      {companyPickId && (
        <>
        <div style={{display:'flex', gap:8, marginBottom:10}}>
          <input value={companyDisplayDraft} onChange={e=>setCompanyDisplayDraft(e.target.value)} placeholder="例如：mammyshop 媽咪小站" style={{flex:1}} />
          <button onClick={saveCompanyDisplayName} disabled={companySaving}>{companySaving?'儲存中...':'儲存這間公司'}</button>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
          {(companies.find(c=>c.id===companyPickId)||{}).faviconUrl && <img src={companies.find(c=>c.id===companyPickId).faviconUrl} style={{width:28, height:28, borderRadius:6, border:'1px solid var(--line)'}} />}
          <button type="button" className="ghost sm" disabled={faviconUploading===companyPickId} onClick={()=>companyFaviconInputRef.current && companyFaviconInputRef.current.click()}>
            {faviconUploading===companyPickId ? '上傳中...' : '上傳這間公司的圖示'}
          </button>
          <input ref={companyFaviconInputRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ uploadFavicon(e.target.files[0], companyPickId); e.target.value=''; }} />
        </div>
        </>
      )}

      <h3 style={{marginTop:18}}><span className="material-icons">tab</span> 瀏覽器分頁標題</h3>
      <div className="grid-2">
        <div className="field"><label>前台標題</label><input value={s.frontTitle||''} onChange={e=>setS({...s,frontTitle:e.target.value})} /></div>
        <div className="field"><label>後台標題</label><input value={s.adminTitle||''} onChange={e=>setS({...s,adminTitle:e.target.value})} /></div>
      </div>
      <div className="hint" style={{marginTop:-4, marginBottom:10}}>前後台的瀏覽器分頁標題各自獨立，不會互相影響，也跟上面的「顯示名稱」脫鉤。</div>

      <h3 style={{marginTop:18}}><span className="material-icons">palette</span> 後台介面配色</h3>
      <div className="hint" style={{marginTop:-4, marginBottom:8}}>這裡選的配色，所有登入後台的人看到的都一樣。員工前台有自己獨立的配色選項（在前台右上角自己切換），不會互相影響。點選色塊會馬上預覽效果，離開這頁若沒按「儲存設定」不會真的套用。</div>
      <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
        {ADMIN_THEME_PALETTES.map(t=>(
          <div key={t.id} onClick={()=>{ setS({...s, themeColor:t.id}); applyAdminTheme(t.id); }}
            style={{display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor:'pointer', padding:8, borderRadius:10,
              border: (s.themeColor||'default')===t.id ? '2px solid '+t.accent : '1px solid var(--line)'}}>
            <span style={{width:32, height:32, borderRadius:'50%', background:t.dark, border:'3px solid '+t.accent}}></span>
            <span style={{fontSize:12}}>{t.name}</span>
          </div>
        ))}
      </div>

      <h3 style={{marginTop:18}}><span className="material-icons">wb_sunny</span> 首頁天氣顯示</h3>
      <div className="field">
        <label>資料來源</label>
        <select value={s.weatherSource||'open-meteo'} onChange={e=>setS({...s,weatherSource:e.target.value})}>
          <option value="open-meteo">Open-Meteo（免設定，直接用上方GPS座標）</option>
          <option value="cwa">中央氣象署（需自行申請API Key）</option>
        </select>
      </div>
      {s.weatherSource==='cwa' && (
        <div className="grid-2">
          <div className="field">
            <label>中央氣象署 API Key</label>
            <input value={s.cwaApiKey||''} onChange={e=>setS({...s,cwaApiKey:e.target.value})} placeholder="到 opendata.cwa.gov.tw 免費申請" />
          </div>
          <div className="field">
            <label>所在縣市</label>
            <select value={s.cwaCity||''} onChange={e=>setS({...s,cwaCity:e.target.value})}>
              <option value="">請選擇</option>
              {['臺北市','新北市','桃園市','臺中市','臺南市','高雄市','基隆市','新竹市','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','屏東縣','宜蘭縣','花蓮縣','臺東縣','澎湖縣','金門縣','連江縣'].map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
      )}
      <div className="hint">Open-Meteo 顯示即時單一溫度；中央氣象署顯示的是預報溫度區間（例如 24°～28°C）。</div>
      </>)}

      {category==='attendance' && (<>
      <h3><span className="material-icons">my_location</span> 地理圍籬（GPS 打卡範圍）</h3>
      <AddressGeocodeField lat={s.lat} lng={s.lng} onFound={(lat,lng)=>setS({...s, lat, lng})} />
      <div className="grid-2">
        <div className="field"><label>緯度</label><input value={s.lat} onChange={e=>setS({...s,lat:e.target.value})} /></div>
        <div className="field"><label>經度</label><input value={s.lng} onChange={e=>setS({...s,lng:e.target.value})} /></div>
      </div>
      <button className="ghost sm" onClick={useCurrentLocation} disabled={locating}>{locating?'定位中...':'使用目前裝置位置（建議在店內打開此頁操作一次）'}</button>
      <div className="field" style={{marginTop:10}}><label>允許誤差半徑（公尺）</label><input type="number" value={s.radius} onChange={e=>setS({...s,radius:e.target.value})} /></div>
      <div className="hint">超出範圍不會擋下打卡，但紀錄會標示「超出範圍」讓後台核對，避免員工在店外因訊號誤差被卡住。</div>

      <h3 style={{marginTop:18}}><span className="material-icons">schedule</span> 預設班表</h3>
      <div className="hint" style={{marginTop:-4, marginBottom:8}}>員工若在「員工資料」未指定班別，會套用這裡的預設班表。</div>
      <div className="grid-2">
        <div className="field"><label>上班時間</label><input type="time" value={s.workStart} onChange={e=>setS({...s,workStart:e.target.value})} /></div>
        <div className="field"><label>下班時間</label><input type="time" value={s.workEnd} onChange={e=>setS({...s,workEnd:e.target.value})} /></div>
        <div className="field"><label>午休扣除（分鐘）</label><input type="number" value={s.lunchBreak} onChange={e=>setS({...s,lunchBreak:e.target.value})} /></div>
        <div className="field"><label>遲到寬限（分鐘）</label><input type="number" value={s.lateGrace} onChange={e=>setS({...s,lateGrace:e.target.value})} /></div>
        <div className="field"><label>早退寬限（分鐘）</label><input type="number" value={s.earlyGrace} onChange={e=>setS({...s,earlyGrace:e.target.value})} /></div>
      </div>

      <h3 style={{marginTop:18}}><span className="material-icons">event_repeat</span> 一例一休（勞基法第36條）</h3>
      <div className="grid-2">
        <div className="field"><label>休息日（可出勤，需依加成給薪）</label>
          <select value={s.restDay} onChange={e=>setS({...s,restDay:Number(e.target.value)})}>{DOW.map((d,i)=><option key={i} value={i}>星期{d}</option>)}</select>
        </div>
        <div className="field"><label>例假日（原則不可出勤）</label>
          <select value={s.mandatoryRestDay} onChange={e=>setS({...s,mandatoryRestDay:Number(e.target.value)})}>{DOW.map((d,i)=><option key={i} value={i}>星期{d}</option>)}</select>
        </div>
        <div className="field"><label>平日加班月上限（小時）</label><input type="number" value={s.monthlyOtCap} onChange={e=>setS({...s,monthlyOtCap:e.target.value})} /></div>
        <div className="field">
          <label>例假日出勤薪資算法</label>
          <select value={s.mandatoryRestPayMode || 'double'} onChange={e=>setS({...s,mandatoryRestPayMode:e.target.value})}>
            <option value="double">優於勞基法（時薪 × 2倍）</option>
            <option value="legal">依勞基法（加發一日工資＋超過8小時比照平日加班費）</option>
          </select>
          <div className="hint" style={{marginTop:4}}>例假日原則不可出勤，僅天災事變等特殊狀況例外（勞基法第40條），事後仍須完成補休登記。</div>
        </div>
      </div>
      <div className="hint">依勞基法第32條，平日延長工時原則每月不得超過46小時（經工會或無工會則經勞資會議同意可延長至54小時，但每3個月不得逾138小時）；此上限不含國定假日與例假日出勤。</div>
      </>)}

      {category==='leave' && (<>
      <h3><span className="material-icons">event_available</span> 請假與補休規則</h3>
      <div className="grid-2">
        <div className="field"><label>請假最小單位</label>
          <select value={s.leaveUnit} onChange={e=>setS({...s,leaveUnit:Number(e.target.value)})}>
            <option value={1}>1 小時</option>
            <option value={0.5}>0.5 小時</option>
            <option value={4}>半日（4 小時）</option>
          </select>
        </div>
        <div className="field"><label>補休使用期限（月）</label><input type="number" min="1" value={s.compTimeExpireMonths} onChange={e=>setS({...s,compTimeExpireMonths:e.target.value})} /></div>
        <div className="field"><label>補休到期提醒（到期前幾日）</label><input type="number" min="1" value={s.compExpireReminderDays} onChange={e=>setS({...s,compExpireReminderDays:e.target.value})} /></div>
      </div>
      <div className="hint">補休期限自核准日起算，依勞基法第32條之1，補休期限屆滿或契約終止仍未休完的時數，應依原加班費標準折算工資。</div>

      <h3 style={{marginTop:18}}><span className="material-icons">shield</span> 投保薪資計算基準</h3>
      <div className="hint" style={{marginTop:-4, marginBottom:8}}>
        決定「員工資料」頁的投保級距建議值要用哪些項目加總。勾起來代表該項目計入投保薪資。
        <b>這只影響建議值，不會自動改動任何人的投保級距</b>——實際級距一律以向勞保局申報的值為準。
      </div>
      <div style={{display:'flex', flexWrap:'wrap', gap:'6px 22px'}}>
        {[
          ['insIncludeMeal','伙食津貼'],
          ['insIncludeTransport','交通津貼'],
          ['insIncludePosition','職務加給'],
          ['insIncludeFullAttendance','全勤獎金']
        ].map(([key,label])=>(
          <label key={key} style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--ink)'}}>
            <input type="checkbox" style={{width:'auto'}}
              checked={(s[key]===undefined ? (key==='insIncludeFullAttendance') : s[key]==='是')}
              onChange={e=>setS({...s,[key]:e.target.checked?'是':'否'})} />
            {label}計入
          </label>
        ))}
      </div>
      <div className="hint" style={{marginTop:6}}>公司現行做法：伙食、交通、職務加給不計入；全勤獎金自2026年8月起因法規變動已併入本薪，故計入。</div>

      <h3 style={{marginTop:18}}><span className="material-icons">verified</span> 全勤獎金比例扣除</h3>
      <div className="hint" style={{marginTop:-4, marginBottom:8}}>依2026年新制《勞工請假規則》第9條，全勤獎金扣發不得「全有全無」，一律按比例計算。病假、事假時數會依比例自動扣（時數÷240）；婚喪公傷病假、公假、生理假等法定假別不受影響。「事假」欄位仍會合併家庭照顧假一起輸入（家庭照顧假依法併入事假計算），薪資條顯示時系統會自動拆開顯示兩者各自時數，方便員工核對。</div>
      <div className="field"><label>遲到/早退計算方式</label>
        <select value={s.fullAttendanceLateEarlyMode || 'minutes'} onChange={e=>setS({...s,fullAttendanceLateEarlyMode:e.target.value})}>
          <option value="minutes">只算累積分鐘數比例</option>
          <option value="count">只算次數階梯扣除</option>
          <option value="both">兩者都算（分鐘數＋次數）</option>
        </select>
        <div className="hint" style={{marginTop:4}}>遲到、早退合併計算（同一組規則）。分鐘數比例＝全勤獎金÷240小時÷60分鐘×累積分鐘數。</div>
      </div>
      {(s.fullAttendanceLateEarlyMode==='count' || s.fullAttendanceLateEarlyMode==='both') && (
        <div className="grid-2">
          <div className="field"><label>前幾次不扣（遲到+早退合計）</label><input type="number" min="0" value={s.fullAttendanceLateEarlyFreeCount} onChange={e=>setS({...s,fullAttendanceLateEarlyFreeCount:e.target.value})} /></div>
          <div className="field"><label>超過後每次扣全勤獎金（%）</label><input type="number" min="0" max="100" value={s.fullAttendanceLateEarlyPercentPerCount} onChange={e=>setS({...s,fullAttendanceLateEarlyPercentPerCount:e.target.value})} /></div>
        </div>
      )}
      </>)}

      <div style={{marginTop:16}}><button onClick={save}><span className="material-icons" style={{fontSize:16}}>save</span>儲存設定</button></div>
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
(function(){
  function showError(msg){
    var box = document.getElementById('boot-error');
    if(box){ box.style.display='block'; box.textContent = msg; }
  }
  window.addEventListener('error', function(e){
    showError('頁面發生錯誤：' + (e.message||e.error) + '\n(檔案:' + (e.filename||'') + ' 行:' + (e.lineno||'') + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    showError('未處理的錯誤：' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = function(){ reject(new Error(src + ' 載入失敗')); };
      document.head.appendChild(s);
    });
  }
  function loadWithFallback(urls, idx){
    idx = idx || 0;
    if(idx >= urls.length) return Promise.reject(new Error('所有來源皆載入失敗：' + urls.join(' / ')));
    return loadScript(urls[idx]).catch(function(){ return loadWithFallback(urls, idx+1); });
  }

  var CDN = {
    react: ['https://unpkg.com/react@18/umd/react.production.min.js', 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'],
    reactDom: ['https://unpkg.com/react-dom@18/umd/react-dom.production.min.js', 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'],
    babel: ['https://unpkg.com/@babel/standalone/babel.min.js', 'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js']
  };

  /* 啟動加速：Babel standalone 約 2.9MB，且每次開頁都要重新編譯這份 JSX。
     把編譯結果存進 localStorage，用原始碼雜湊當版本識別；原始碼沒改就直接用快取，
     連 Babel 都不必下載。改了程式碼雜湊就變，快取自動失效，不需要手動清。 */
  var APP_SRC = document.getElementById('app-src').textContent;
  var CACHE_KEY = 'tap_admin_compiled';
  function hashStr(s){ var h = 5381, i = s.length; while(i) h = (h * 33) ^ s.charCodeAt(--i); return (h >>> 0).toString(36); }
  var srcHash = hashStr(APP_SRC);
  // 版本識別：顯示在側欄底部。瀏覽器有時會抓著舊的 admin.html 不放（快取機制本身沒問題，
  // 是連 HTML 都是舊的，所以雜湊也跟著是舊的），肉眼分不出手上是不是最新版。
  // 把雜湊印出來，回報問題時報這串就知道版本對不對。
  window.__APP_BUILD = srcHash;
  function readCompiledCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.h === srcHash) ? obj.c : null;
    }catch(e){ return null; }
  }
  function writeCompiledCache(code){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({h: srcHash, c: code})); }catch(e){}
  }

  var cached = readCompiledCache();
  // react-dom 需要 React 全域，兩者依序執行；babel 與它們無關可並行下載，有快取時則完全不載入
  Promise.all([
    loadWithFallback(CDN.react).then(function(){ return loadWithFallback(CDN.reactDom); }),
    cached ? Promise.resolve() : loadWithFallback(CDN.babel)
  ])
    .then(function(){
      var compiled = cached;
      if(!compiled){
        compiled = Babel.transform(APP_SRC, {presets:[['react',{runtime:'classic'}]]}).code;
        writeCompiledCache(compiled);
      }
      var statusEl = document.getElementById('boot-status');
      if(statusEl) statusEl.remove();
      try{
        (0, eval)(compiled);
      }catch(evalErr){
        // 快取損毀時清掉重載一次，用 sessionStorage 標記避免無限重整
        if(cached && !sessionStorage.getItem('tap_admin_cache_retried')){
          try{ sessionStorage.setItem('tap_admin_cache_retried','1'); localStorage.removeItem(CACHE_KEY); }catch(e){}
          location.reload();
          return;
        }
        throw evalErr;
      }
      try{ sessionStorage.removeItem('tap_admin_cache_retried'); }catch(e){}
    })
    .catch(function(err){
      showError('必要程式庫載入失敗，畫面因此空白。\n原因：' + err.message + '\n\n最常見情況：瀏覽器擴充功能（例如廣告攔截/隱私保護外掛）封鎖了 unpkg.com 或 jsdelivr.net，或目前網路無法連線到這兩個網域。\n\n請嘗試：\n1. 停用廣告攔截類擴充功能後重新整理本頁\n2. 改用無痕視窗開啟同一網址測試\n3. 確認網路能連上 unpkg.com 與 cdn.jsdelivr.net');
    });
})();
</script>
</body>
</html>
