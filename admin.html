                {g('paid') && <th className="center grp-pd" colSpan="4">有薪假（小時）</th>}
                {g('ot') && <th className="center grp-ot" colSpan="7">加班（小時）</th>}
              </tr>
              <tr>
                {g('gap') && <><th className="center">應出勤</th><th className="center">已認列</th><th className="center">缺口</th></>}
                {g('att') && <><th className="center">出勤日數</th><th className="center">遲到次數</th><th className="center">遲到分鐘</th><th className="center">早退次數</th><th className="center">早退分鐘</th></>}
                {g('unpaid') && <><th className="center">事假</th><th className="center">病假</th><th className="center">家庭照顧</th><th className="center">生理</th><th className="center">災防</th><th className="center">小計</th></>}

                    <tr className={(canOpen ? 'row-exp' : '') + (n(e.gapHours)>0 ? ' gap-row' : '')} onClick={canOpen ? (()=>toggleRow(e.employeeId)) : undefined}>
                      <td className="center emp-cell">
                        <b>{e.name}</b>
                        {canOpen && <span className={'exp-arrow' + (open?' open':'')}>›</span>}
                        {e.pendingLeaveCount > 0 && <span className="pend-badge" title={`待審核 ${trimNum(e.pendingLeaveHours,1)} 小時，未計入下方合計`}>待審 {e.pendingLeaveCount}</span>}
                      </td>
                      {g('gap') && <>
                        <td className="center" title={`當月應出勤 ${e.requiredDays||0} 天`}>{trimNum(e.requiredHours,1)}</td>
                        <Z v={e.creditedHours} />
                        <td className={'center gap-val' + (n(e.gapHours)>0 ? ' has' : ' zero-dim')}
                            title="應出勤扣掉「實際出勤＋已核准請假」。未達 1 小時的零碎差額不列入（由全勤獎金機制按比例扣），所以這個數字會等於展開後逐日清單的總和">
                          {trimNum(e.gapHours,1)}
                          {n(e.gapHours)>0 && n(e.gapHours)>n(e.gapHoursAfterPending) && (
                            <span className="gap-pend" title="其中這些時數已經有假單在審核中，批准後就會補平">
                              待審可補 {trimNum(r1(n(e.gapHours)-n(e.gapHoursAfterPending)),1)}
                            </span>
                          )}
                        </td>
                      </>}
                      {g('att') && <>
                        <Z v={e.presentDays} /><Z v={e.lateCount} /><Z v={e.lateMinutes} /><Z v={e.earlyLeaveCount} /><Z v={e.earlyLeaveMinutes} />
                      </>}
                      {g('unpaid') && <>
                        <Z v={e.personalLeave} /><Z v={e.sickLeave} /><Z v={e.familyCareLeave} /><Z v={e.menstrualLeave} /><Z v={e.disasterLeave} />
                        <Z v={unpaidSum(e)} cls="col-sum" />
                      </>}
                      {g('paid') && <>
                        <Z v={t['特休']} /><Z v={t['補休']} />
                        <td className={'center ' + (occ.length?'':'zero-dim')}>
                          {occ.length ? occ.map(x=><span key={x.type} className="occ-tag">{x.type} {trimNum(x.hours,1)}</span>) : '0'}
                        </td>
                        <Z v={paidSum(e)} cls="col-sum" />
                      </>}
                      {g('ot') && <>
                        <td className={'center ' + (e.otCapExceeded?'flag':'') + (n(e.otWeekday134)===0?' zero-dim':'')}>{trimNum(e.otWeekday134,1)}</td>
                        <td className={'center ' + (e.otCapExceeded?'flag':'') + (n(e.otWeekday167)===0?' zero-dim':'')}>{trimNum(e.otWeekday167,1)}</td>
                        <td className={'center ' + (e.dailyOtWarning?'flag':'zero-dim')} title={e.dailyOtExceedDays.join('、')}>
                          {e.dailyOtWarning ? <><span className="material-icons" style={{fontSize:15, verticalAlign:'middle'}}>warning</span>{` ${e.dailyOtExceedDays.length} 日`}</> : '0'}
                        </td>
                        <td className={'center ' + (e.otRestDayHours>0 ? (e.otCapExceeded?'flag':'') : 'zero-dim')}>{trimNum(e.otRestDayHours,1)}</td>
                        <Z v={e.otHolidayHours} />
                        <td className={'center ' + (e.otMandatoryRestHours>0?'flag':'zero-dim')} onClick={ev=>ev.stopPropagation()}>
                          {trimNum(e.otMandatoryRestHours,1)}
                          {e.mandatoryRestDates.length>0 && (
                            <button className="ghost sm" style={{marginLeft:6, padding:'2px 6px', fontSize:11}} onClick={()=>setMakeupBox({employeeId:e.employeeId, name:e.name, dates:e.mandatoryRestDates, unresolvedDates:e.mandatoryRestUnresolvedDates})}>
                              {e.mandatoryRestWarning ? '待補假' : '已補假'}
                            </button>
                          )}
                        </td>
                        <Z v={e.workedHoursTotal} />
                      </>}
                    </tr>
                    {open && canOpen && (
                      <tr className="detail-row">
                        <td colSpan={colCount}>
                          {gapDays.length > 0 && (
                            <div className="gap-days">
                              <div className="gd-title">對不上的日子（{gapDays.length} 天，共 {trimNum(e.gapHours,1)} 小時）</div>
                              {gapDays.map(d=>(
                                <div className="gd-row" key={d.date}>
                                  <span className="gd-date">{d.date.slice(5)}（{DOW_SHORT[new Date(d.date+'T00:00:00').getDay()]}）</span>
                                  <span className={'gd-why' + (d.reason==='漏打下班卡' ? ' punch' : '')}>{d.reason}</span>
                                  <span className="gd-hr">少 {trimNum(d.gapHours,1)}h</span>
                                  <span className="gd-note">
                                    {d.workedHours>0 && `出勤 ${trimNum(d.workedHours,1)}h`}
                                    {d.leaveHours>0 && `${d.workedHours>0?'／':''}已核准假 ${trimNum(d.leaveHours,1)}h`}
                                    {d.pendingHours>0 && `${(d.workedHours>0||d.leaveHours>0)?'／':''}審核中 ${trimNum(d.pendingHours,1)}h`}
                                  </span>
                                </div>
                              ))}
                            </div>
                          )}
                          {detail.length > 0 && <>
                          <div className="lv-head">
                            <span>狀態</span><span>假別</span><span className="lv-hr">時數</span><span>日期／時段</span>
                          </div>
                          <div className="lv-list">
                            {detail.map(d=><LeaveDetailRow key={d.requestId} d={d} />)}
                          </div>
                          </>}

                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {shown.length===0 && <tr><td colSpan="26" className="hint" style={{textAlign:'center'}}>{onlyGap ? '沒有時數對不上的人' : '本月尚無資料'}</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      <div className="hint">
        依勞基法第24條分類計算：平日超時前2小時1.34倍、其後1.67倍；休息日與國定假日出勤時數已依日期自動分類。按「套用出缺勤時數到薪資計算」可直接把這些時數帶入「薪資計算 / 明細」頁籤，帶入後仍可手動調整，最後記得按「儲存薪資紀錄」。<br/>
        <span className="flag">紅字</span>代表該員工當月平日加班已超過設定的月上限，或有例假日出勤紀錄尚未完成補假登記，請優先確認合法性。
      </div>
      {makeupBox && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">event_repeat</span>{makeupBox.name} － 例假日補假登記</h3>
            <div className="hint" style={{marginBottom:10}}>依勞基法第40條，例假日出勤事後須完成補假，請登記每一日實際補假的日期。</div>
            <MakeupList employeeId={makeupBox.employeeId} dates={makeupBox.dates} onSaved={()=>{ load(); }}/>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setMakeupBox(null)}>關閉</button>
            </div>
          </div>

      )}
    </div>
  );
}

function MakeupList({employeeId, dates, onSaved}){
  const [existing, setExisting] = useState(null);
  useEffect(()=>{
    apiGet('getMandatoryRestMakeups').then(list=>{
      const map = {};
      list.filter(m=>m.employeeId===employeeId).forEach(m=>{ map[m.workDate] = m.makeupDate || ''; });
      setExisting(map);
    }).catch(()=>setExisting({}));
  }, []);
  if(existing===null) return <div className="hint">載入中...</div>;
  return dates.map(d=>(
    <MakeupRow key={d} employeeId={employeeId} workDate={d} initialValue={existing[d] || ''} onSaved={onSaved}/>
  ));
}

function MakeupRow({employeeId, workDate, initialValue, onSaved}){
  const [makeupDate, setMakeupDate] = useState(initialValue || '');
  const [saving, setSaving] = useState(false);
  async function save(){
    setSaving(true);
    try{ await apiPost('registerMandatoryRestMakeup', {employeeId, workDate, makeupDate}); onSaved(); }
    catch(e){ alert(e.message); }
    finally{ setSaving(false); }
  }
  return (
    <div className="row-between" style={{marginBottom:8, gap:10}}>
      <div style={{fontSize:13, flexShrink:0}}>出勤日：{workDate}</div>
      <input type="date" value={makeupDate} onChange={e=>setMakeupDate(e.target.value)} style={{flex:1}} />
      <button onClick={save} disabled={saving}>{saving?'儲存中':'儲存'}</button>
    </div>
  );
}

/* 值為 0 時淡化顯示：整張表大多數格子都是 0，淡化後有值的格子才會跳出來 */
function NumCell({value, onChange, disabled}){
  const isZero = !Number(value);
  return <input type="number" value={value} disabled={disabled}
    className={isZero ? 'zero' : ''}
    style={isZero ? null : {fontWeight:600}}
    onFocus={e=>e.target.select()}
    onChange={e=>onChange(Number(e.target.value))} />;
}

/* ========================= 薪資計算 / 明細總表 ========================= */
function PayrollTab({employees, rows, setEntry, month, loading, onApply, onUndoApply, onSave, dirty, saving, onEditEmployee, onReload, menstrualBaseline, settings}){
  /* 「隱藏無薪資」：非正式員工、還沒設薪的掛名帳號在薪資表上是一整排 0，
     五六列夾在中間會把真正要看的人擠散。只隱藏**完全沒有金額**的列 ——
     本薪 0 但有 26 日獎金或扣款的人一定要留著，否則會漏付。
     ⚠️ 只是畫面過濾，合計、匯出 CSV、儲存都仍以完整名單為準。 */
  const [hideZero, setHideZero] = useState(()=>{ try{ return localStorage.getItem('payroll_hide_zero')==='1'; }catch(e){ return false; } });
  function toggleHideZero(){
    setHideZero(v=>{ const nv=!v; try{ localStorage.setItem('payroll_hide_zero', nv?'1':'0'); }catch(e){} return nv; });
  }
  const isBlankRow = r => !n(r.calc.effBaseSalary) && !n(r.calc.payableTotal) && !n(r.calc.deductTotal) && !n(r.calc.pay26);
  const blankCount = rows.filter(isBlankRow).length;
  const shownRows = hideZero ? rows.filter(r=>!isBlankRow(r)) : rows;
  const [subTab, setSubTab] = useState('06');
  const [settleBox, setSettleBox] = useState(null); // {year, items, loading, saving}
  const [lockBox, setLockBox] = useState(null); // {items, loading, saving}
  const [resignRowBox, setResignRowBox] = useState(null); // {employeeId, name, loading, data}
  const [locking, setLocking] = useState(false);
  const [summary, setSummary] = useState([]);
  const [noteBox, setNoteBox] = useState(null); // {employeeId, field, value}
  const [logBox, setLogBox] = useState(null);  // 薪資異動紀錄 {loading, items, scope}
  /* 薪資是全系統唯一「改了沒人知道」的地方：打卡有作廢軌跡、假單有簽核軌跡，
     薪資的一般欄位以前什麼都沒有。把加班時數從 10 改成 2，原本的 10 就永遠消失了。 */
  function openLog(scope){
    const onlyThisMonth = scope !== 'all';
    setLogBox({loading:true, items:[], onlyThisMonth});
    apiGet('getPayrollLog', onlyThisMonth ? {month} : {})
      .then(items=>setLogBox({loading:false, items: items||[], onlyThisMonth}))
      .catch(e=>{ alert(e.message); setLogBox(null); });
  }
  const scrollRef = useRef(null);
  // 欄位群組收合：整張表 20 餘欄，多數月份只有少數群組有資料，預設只展開有值的群組
  const GROUPS = [
    {key:'allow', label:'津貼明細'},
    {key:'ot',    label:'加班時數'},
    {key:'bonus', label:'獎金'},
    {key:'leave', label:'請假時數'},
    /* 遲到早退在 2026-09-02 以前只默默進「應扣小計」，表上沒有任何欄位 ——
       李嘉芬 8 月被扣 1,721 元，畫面上看不出那筆是什麼、也無從核對。 */
    {key:'late',  label:'遲到早退'}
  ];
  const [openGroups, setOpenGroups] = useState(null);
  const groupCounts = useMemo(()=>{
    const c = {allow:0, ot:0, bonus:0, leave:0, late:0};
    rows.forEach(({emp, entry})=>{
      if(n(emp.mealAllowance)||n(emp.transportAllowance)||n(emp.positionAllowance)||n(emp.fullAttendanceBonus)) c.allow++;
      if(n(entry.otWeekday134)||n(entry.otWeekday167)||n(entry.otRestDayHours)||n(entry.otHolidayHours)) c.ot++;
      if(n(entry.festivalBonus)||n(entry.yearEndBonus)||n(entry.performanceBonus)||n(entry.otherBonus)) c.bonus++;
      if(n(entry.personalLeave)||n(entry.sickLeave)||n(entry.menstrualLeave)||n(entry.disasterLeave)||n(entry.familyCareLeave)) c.leave++;
      if(n(entry.lateMinutes)||n(entry.earlyMinutes)||n(entry.absentHours)) c.late++;
    });
    return c;
  }, [rows]);
  useEffect(()=>{
    if(openGroups || !rows.length) return;
    setOpenGroups(GROUPS.filter(g=>groupCounts[g.key]>0).map(g=>g.key));
  }, [rows.length, groupCounts]);
  const shown = k => !openGroups || openGroups.indexOf(k) !== -1;
  // 本月是否已有任何輸入或鎖定紀錄，用來決定要不要顯示空狀態引導
  const hasAnyEntry = useMemo(()=> rows.some(({entry})=>
    entry.locked || Object.keys(entry).some(k=> typeof entry[k]==='number' && entry[k]!==0)
  ), [rows]);
  const toggleGroup = k => setOpenGroups(prev => {
    const cur = prev || GROUPS.map(g=>g.key);
    return cur.indexOf(k)===-1 ? cur.concat([k]) : cur.filter(x=>x!==k);
  });
  useEffect(()=>{ apiGet('getMonthlySummary', {month}).then(setSummary).catch(()=>{}); }, [month]);
  const summaryMap = useMemo(()=>{ const m={}; summary.forEach(s=>{ m[s.employeeId]=s; }); return m; }, [summary]);
  // 「系統實際算出的金額」對照：為 0 時不顯示，避免整張表被 200 多個「實際 0」灌滿
  /* 換算金額改成貼在輸入框右邊（原本另起一行，害每列高矮不一）。
     值是 0 也要輸出這個 span —— 它負責佔位，同一欄的框才會左右對齊。 */
  function refBelow(v){
    const has = !(v===undefined || v===null || !Number(v));
    return <span className="ref">{has ? '＝'+money(v) : ''}</span>;
  }
  function scrollToStart(){ if(!scrollRef.current) return; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:0, behavior:'smooth'}); else scrollRef.current.scrollLeft = 0; }
  function scrollToEnd(){ if(!scrollRef.current) return; const w = scrollRef.current.scrollWidth; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:w, behavior:'smooth'}); else scrollRef.current.scrollLeft = w; }
  const totals = useMemo(()=>{
    const t = {base:0, basicSalary:0, fullAttCut:0, overtime:0, allowance:0, bonus:0, payable:0, labor:0, health:0, leaveDeduct:0, lateEarlyDeduct:0, absentDeduct:0, otherDeduct:0, deduct:0, pay06:0, pay26:0, grand:0,
      businessExpense:0, salesPerformance:0, salesBonus26:0, otherExpense26:0, deduction26:0,
      meal:0, transport:0, position:0, fullAtt:0,
      festivalBonus:0, yearEndBonus:0, performanceBonus:0, otherBonus:0, annualLeaveSettlement:0,
      ot134:0, ot167:0, otRest:0, otHoliday:0,
      personalLeave:0, sickLeave:0, menstrualLeave:0, disasterLeave:0,
      lateMoney:0, earlyMoney:0};
    /* ⚠️ 合計一律「各列四捨五入之後再相加」，不是「相加之後才四捨五入」。
       每一格顯示的都是進位後的整數，若合計用原始小數加總，使用者自己逐列加一次就會差 1～2 元
       （實測：遲到扣款 1,721＋68＝1,789，舊算法顯示 1,788）。薪資表上對不起來的數字沒有人會信。
       而且員工實際領到的就是進位後的金額，Σ round 才是真正付出去的錢。 */
    const r = v => Math.round(Number(v) || 0);
    rows.forEach(({emp, entry, calc})=>{
      t.base += r(calc.effBaseSalary);
      t.overtime += r(calc.overtimePay);
      t.allowance += r(calc.allowanceTotal);
      t.bonus += r(calc.bonusTotal);
      t.payable += r(calc.payableTotal);
      t.labor += r(calc.laborFee);
      t.health += r(calc.healthFee);
      t.leaveDeduct += r(calc.leaveDeduct);
      t.lateEarlyDeduct += r(calc.lateEarlyDeduct);
      t.absentDeduct += r(calc.absentDeduct);
      t.otherDeduct += r(entry.otherDeduction);
      t.deduct += r(calc.deductTotal);
      t.pay06 += r(calc.pay06);
      t.pay26 += r(calc.pay26);
      t.grand += r(calc.grandTotal);
      // 津貼／獎金／特休結算：合計列原本整段空白，逐欄補上
      t.meal += r(calc.effMealAllowance); t.transport += r(calc.effTransportAllowance);
      t.position += r(calc.effPositionAllowance); t.fullAtt += r(calc.effFullAttendanceBonus);
      t.basicSalary += r(calc.basicSalary); t.fullAttCut += r(calc.fullAttendanceCut);
      t.festivalBonus += r(entry.festivalBonus); t.yearEndBonus += r(entry.yearEndBonus);
      t.performanceBonus += r(entry.performanceBonus); t.otherBonus += r(entry.otherBonus);
      t.annualLeaveSettlement += r(entry.annualLeaveSettlement);
      /* ⚠️ **合計列一律是金額，不是各自的單位**（2026-09-03 Evan 指正）。
         時數欄的每一格底下本來就有「＝金額」的換算，合計就沿用同一個口徑 ——
         否則整列會混著「2.82 小時」與「258,168 元」，使用者一加就對不上。
         群組明細的金額加起來會等於旁邊的彙總欄（加班時數 4 欄 ＝ 加班費），可以互相驗算。 */
      t.ot134 += r(calc.hourly * 1.34 * n(entry.otWeekday134));
      t.ot167 += r(calc.hourly * 1.67 * n(entry.otWeekday167));
      t.otRest += r(calc.restDayPay); t.otHoliday += r(calc.holidayPay);
      t.personalLeave += r(calc.hourly * n(entry.personalLeave));
      t.sickLeave += r(calc.hourly * 0.5 * n(calc.sickHalfPayHours) + calc.hourly * n(calc.sickUnpaidHours));
      t.menstrualLeave += r(calc.hourly * 0.5 * n(calc.menstrualHalfPayHours) + calc.hourly * n(calc.menstrualUnpaidHours));
      t.disasterLeave += r(calc.hourly * n(entry.disasterLeave));
      /* 遲到／早退分開換算，兩者相加即右側「遲到扣款」欄的合計。
         ⚠️ 逐項進位與合併進位在極端組合下可能差 1 元；遲到扣款欄一律以
            Σ round(calc.lateEarlyDeduct) 為準，那才是實際扣的錢。 */
      t.lateMoney += r(calc.hourly * n(entry.lateMinutes) / 60);
      t.earlyMoney += r(calc.hourly * n(entry.earlyMinutes) / 60);
      t.businessExpense += r(entry.businessExpense);
      t.salesPerformance += r(entry.salesPerformance);
      t.salesBonus26 += r(entry.salesBonus26);
      t.otherExpense26 += r(entry.otherExpense26);
      t.deduction26 += r(entry.deduction26);
    });
    return t;
  }, [rows]);

  // 整月總覽是唯讀閱讀畫面：沒有值的欄位就不顯示，避免整欄都是 0
  const ovHasLate = rows.some(({calc})=>n(calc.lateEarlyDeduct) > 0);
  const ovHasAbsent = rows.some(({calc})=>n(calc.absentDeduct) > 0);
  const otCapAlerts = rows.filter(({calc})=>calc.monthlyOtHours > MONTHLY_OT_CAP_DEFAULT);
  const minWageAlerts = rows.filter(({calc})=>calc.belowMinWage);
  const restDayCapAlerts = rows.filter(({calc})=>calc.restDayOverCap);
  const sickCapAlerts = rows.filter(({calc})=>calc.sickCapExceeded);
  const allLocked = rows.length>0 && rows.every(({entry})=>entry.locked);
  const anyLocked = rows.some(({entry})=>entry.locked);

  async function openLockPreview(){
    setLockBox({items:null, loading:true, saving:false});
    try{
      const items = await apiGet('getPayrollLockPreview', {month});
      setLockBox({items, loading:false, saving:false});
    }catch(e){ alert(e.message); setLockBox(null); }

  async function confirmLock(){
    const overrides = {};
    lockBox.items.forEach(it=>{ overrides[it.employeeId] = {laborFee: it.laborFee, healthFee: it.healthFee}; });
    setLockBox(prev=>({...prev, saving:true}));
    try{
      await apiPost('lockPayrollMonth', {month, overrides});
      setLockBox(null);
      await onReload();
      alert('本月薪資已鎖定，欄位改為唯讀。要修改需先按「解除鎖定」。');
    }catch(e){ alert(e.message); setLockBox(prev=>({...prev, saving:false})); }

      '解除後這個月可以再編輯，但要注意：重新鎖定時，系統會用「員工主檔當下的薪資結構」重新產生快照。\n' +
      '若期間有人調薪或改過投保級距，這個月的歷史薪資條金額就會跟著變動。\n\n' +
      '確定要解除嗎？'
    )) return;
    setLocking(true);
    try{
      await apiPost('unlockPayrollMonth', {month});
      await onReload();
    }catch(e){ alert(e.message); } finally{ setLocking(false); }
  }

  async function openSettleEstimate(){
    const viewMonth = Number(String(month).split('-')[1]);
    let msg = '「結算試算」建議只在「年度終了」或「員工離職時」使用。\n\n其他時間使用，可能會把員工之後還會請的特休也一併結算掉，造成金額不準確。';
    if (viewMonth !== 12) {
      msg += `\n\n⚠ 目前試算的是 ${viewMonth} 月，不是年底（12月）。除非是要幫離職員工結算，否則請再次確認這個時機是否正確。`;
    }
    msg += '\n\n確定要繼續試算嗎？';
    if (!confirm(msg)) return;
    const year = String(new Date().getFullYear());
    setSettleBox({year, items:null, loading:true, saving:false});
    try{
      const data = await apiGet('getAnnualLeaveList', {year});
      const items = rows.map(({emp})=>{
        const grantedHours = data.granted[emp.id] ? data.granted[emp.id].hours : 0;
        const usedHours = data.used[emp.id] || 0;
        const rawHours = Math.round((grantedHours - usedHours) * 100) / 100;
        const overUsed = rawHours < 0;
        const remainHours = Math.max(0, rawHours);
        const wageBase = n(emp.baseSalary); // 本薪已包含4項津貼，不重複相加
        const hourly = wageBase > 0 ? wageBase/240 : 0;
        const amount = Math.round(remainHours * hourly);
        return {employeeId: emp.id, name: emp.name, remainHours, hourly: Math.round(hourly*100)/100, amount, overUsed, overHours: overUsed ? Math.abs(rawHours) : 0};
      });
      setSettleBox({year, items, loading:false, saving:false});
    }catch(e){ alert(e.message); setSettleBox(null); }
  }
  function applySettleEstimate(){
    settleBox.items.forEach(it=>{ setEntry(it.employeeId, {annualLeaveSettlement: it.amount}); });
    setSettleBox(null);

  }

      calc.allowanceTotal, calc.bonusTotal, n(entry.annualLeaveSettlement),

      Math.round(calc.lateEarlyDeduct || 0), Math.round(calc.absentDeduct || 0), n(entry.otherDeduction),
      Math.round(calc.deductTotal), Math.round(calc.pay06), Math.round(calc.pay26), Math.round(calc.grandTotal)
    ]);
    exportCSV(`薪資明細_${month}.csv`, headers, data);

                      沒有異動紀錄。這張表是 2026-09-02 才開始記的，之前的修改沒有留下軌跡。
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setLogBox(null)}>關閉</button></div>
          </div>
        </div>
      )}

      {noteBox && (
        <div className="modal-bg">
          <div className="modal" style={{maxWidth:420}}>
            <h3><span className="material-icons">edit_note</span>{noteBox.label}：{noteBox.name}</h3>
            <textarea value={noteBox.value} onChange={e=>setNoteBox({...noteBox, value:e.target.value})} rows="3" placeholder="說明這筆金額的原因" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>

            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function hrsLabel(hours){
  const h = Number(hours) || 0;
  if(h <= 0) return '';
  const days = Math.round((h/8)*10)/10;
  return `${h}小時（${days} 日）`;
}

function getActualPayDateJS(year, month, day, holidaySet){
  let d = new Date(year, month-1, day);
  while(true){
    const dow = d.getDay();
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(dow!==0 && dow!==6 && !holidaySet[dateStr]) return dateStr;
    d.setDate(d.getDate()-1);
  }
}
function PayslipTab({employees, payrollEntries, dirty, month, settings, menstrualBaseline}){
  const [selected, setSelected] = useState('all');

  useEffect(()=>{ apiGet('getHolidays').then(setHolidays).catch(()=>{}); }, []);
  const holidaySet = {}; holidays.forEach(h=>{ if(h.type==='國定假日') holidaySet[h.date]=true; });
  const [py, pm] = month.split('-').map(Number);
  // 薪資於「次月」發放：計薪月份 2026-06 的實際發放日是 2026-07-06 與 2026-07-26（遇假日提前）。
  // 傳 pm + 1，12 月變 13 時 new Date 會自動進位成隔年 1 月，年度交界不需另外處理。
  const payDate06 = getActualPayDateJS(py, pm + 1, 6, holidaySet);
  const payDate26 = getActualPayDateJS(py, pm + 1, 26, holidaySet);
  const list = selected==='all' ? employees : employees.filter(e=>e.id===selected);
  // 只有「該月真的有薪資紀錄」的人才產出薪資條，與前台 getMyPayslip 的 hasRecord 判斷一致。
  // 沒有這道防呆的話，切到還沒結算的月份會用員工主檔「當下」的薪資結構即時算出一整批
  // 薪資條 —— 那是一份根本還沒發生的薪資，卻可以直接列印出去交給員工。
  // payrollEntries 這裡收到的是「已儲存」的快照（App 傳的是 savedEntries），不是編輯中的狀態
  const withRecord = list.filter(e=>payrollEntries[e.id]);
  const missing = list.filter(e=>!payrollEntries[e.id]);
  return (
    <div>
      {dirty && (
        <div className="hint no-print" style={{marginBottom:8, color:'var(--danger)'}}>

          不含那些改動 —— 要讓它反映最新數字，請先回薪資計算頁按「儲存薪資紀錄」。
        </div>
      )}
      <div className="toolbar no-print">
        <label style={{marginBottom:0}}>選擇員工</label>
        <select value={selected} onChange={e=>setSelected(e.target.value)}>
          <option value="all">— 全部員工（可一次列印）—</option>
          {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <span className="grow"></span>
        <label style={{display:'flex', alignItems:'center', gap:6, marginBottom:0, fontWeight:400}}>
          <input type="checkbox" checked={hideZero} onChange={e=>setHideZero(e.target.checked)} style={{width:'auto'}} />
          隱藏金額為0的項目
        </label>
        <button className="ghost sm" disabled={withRecord.length===0}
          title={withRecord.length===0 ? '這個月份沒有薪資紀錄，沒有東西可以列印' : ''}
          onClick={()=>{
          const [yy,mo] = month.split('-');
          const who = selected==='all' ? '全部員工' : ((employees.find(e=>e.id===selected)||{}).name || '');
          printWithFilename(`${yy}年${mo}月份-薪資條-${who}`);
        }}>列印薪資條</button>
      </div>
      {list.length===0 && <div className="empty card">尚無員工資料</div>}

      {list.length>0 && withRecord.length===0 && (
        <div className="card" style={{textAlign:'center', padding:'34px 20px'}}>
          <span className="material-icons" style={{fontSize:38, color:'var(--muted)'}}>event_busy</span>
          <div style={{fontWeight:700, fontSize:15, margin:'10px 0 6px'}}>{month} 還沒有薪資紀錄，沒有薪資條可以產出</div>
          <div className="hint" style={{lineHeight:1.7, maxWidth:'46em', margin:'0 auto'}}>
            薪資於<b>次月</b>發放，{month} 的薪資要到次月 1–6 日才會結算。
            請先到「薪資表」輸入並儲存，這裡才會出現內容。
          </div>
        </div>
      )}

      {withRecord.length>0 && missing.length>0 && (
        <div className="hint" style={{marginBottom:10}}>
          <span className="material-icons" style={{fontSize:15, verticalAlign:'-2px'}}>info</span>{' '}
          {missing.length} 人在 {month} 沒有薪資紀錄，未產出薪資條：{missing.map(e=>e.name).join('、')}
        </div>
      )}

      {withRecord.map(emp=>{
        const entry = payrollEntries[emp.id];
        const calc = calcForEmployee(emp, entry, settings, menstrualBaseline[emp.id]||{menstrual:0,sick:0}, month);
        return <Payslip key={emp.id} emp={emp} entry={entry} calc={calc} month={month} payDate06={payDate06} payDate26={payDate26} hideZero={hideZero} />;
      })}
    </div>
  );
}

function TransferTab({rows, month}){
  const [period, setPeriod] = useState('06');
  const [holidays, setHolidays] = useState([]);
  useEffect(()=>{ apiGet('getHolidays').then(setHolidays).catch(()=>{}); }, []);
  // 只列有薪資紀錄的人：匯款明細表是要拿去銀行的付款清單，
  // 還沒結算的月份不該生出任何一列，更不該有金額。
  const paidRows = useMemo(()=> rows.filter(r=>r.hasRecord), [rows]);
  const byCompany = useMemo(()=>{
    const g = {};
    paidRows.forEach(r => { const key = r.emp.company||'其他'; (g[key] = g[key]||[]).push(r); });
    return g;
  }, [paidRows]);

  // 薪資是「次月」發放（6 日發正常薪資、26 日發業務獎金），遇假日往前提早。
  // 原本這裡只印「26日發放」，月份會被誤解成計薪月份，實際上 2026-06 是 2026-07-26 才發。
  const holidaySet = {}; holidays.forEach(h=>{ if(h.type==='國定假日') holidaySet[h.date]=true; });
  const [tpy, tpm] = month.split('-').map(Number);
  const payDate = getActualPayDateJS(tpy, tpm + 1, period==='06' ? 6 : 26, holidaySet);
  const payDateShort = payDate.replace(/^\d+-/,'').replace('-','/');

  function exportGroup(company, list){
    const headers = ['項次','姓名','銀行','帳號','金額','備註'];
    const data = list.map((r,idx)=>[idx+1, r.emp.name, r.emp.bankName, r.emp.bankAccount, Math.round(period==='06'?r.calc.pay06:r.calc.pay26), r.emp.note]);
    exportCSV(`匯款明細_${company}_${period}日_${month}.csv`, headers, data);
  }

  // 列印／另存 PDF：多數瀏覽器會拿 document.title 當預設檔名，
  // 列印前暫時換成「2026年06月份-匯款明細表-6號」，列印後還原。
  function printTransfer(){
    const [yy, mo] = month.split('-');
    const prevTitle = document.title;
    document.title = `${yy}年${mo}月份-匯款明細表-${Number(period)}號`;
    setTimeout(()=>{
      window.print();
      setTimeout(()=>{ document.title = prevTitle; }, 300);
    }, 60);
  }

  const companyEntries = Object.entries(byCompany).map(([company, list])=>{
    const active = list.filter(r => (period==='06'?r.calc.pay06:r.calc.pay26) !== 0);
    const total = active.reduce((s,r)=>s+(period==='06'?r.calc.pay06:r.calc.pay26),0);
    return {company, active, total};
  }).filter(g=>g.active.length>0);

  return (
    <div>
      <div className="toolbar no-print">
        <div style={{display:'flex', gap:6}}>
          <button className={period==='06'?'':'ghost'} onClick={()=>setPeriod('06')}>6號明細</button>
          <button className={period==='26'?'':'ghost'} onClick={()=>setPeriod('26')}>26號明細</button>
        </div>
        <span className="grow"></span>
        <span className="hint">依公司分組列出應匯款人員與帳號，金額為 0 者不列出。</span>
        <span className="badge" title="薪資為次月發放，遇假日往前提早">實際發放日 {payDate}</span>
        <button className="ghost sm" onClick={printTransfer}>列印 / 存 PDF</button>
      </div>

      {/* 「還沒結算」與「結算了但這期沒人要領」是兩件事，訊息要分開講，
          否則看到「尚無需匯款資料」會誤以為這個月真的不用匯款 */}
      {companyEntries.length===0 && (
        paidRows.length===0
          ? <div className="empty card">
              <b>{month} 還沒有薪資紀錄</b>
              <div className="hint" style={{marginTop:6}}>薪資於次月發放，請先到「薪資表」輸入並儲存，這裡才會產生匯款清單。</div>
            </div>
          : <div className="empty card">本期（{Number(period)} 號）沒有需要匯款的人員，金額皆為 0。</div>
      )}

      {companyEntries.map(({company, active, total})=>(
        <div className="card" key={company} style={{overflowX:'auto'}}>
          {/* 用 .card-head 而非 .toolbar：列印樣式會把 .toolbar 整個隱藏，
              先前公司標題印不出來就是這個原因 */}
          <div className="card-head">
            <h3 style={{margin:0}}>{company}</h3>
            <span className="grow"></span>
            <span className="hint no-print">{monthLabel(month)}薪資．{Number(period)}日批次．發放日 {payDateShort}．共 {active.length} 人</span>
            <button className="ghost sm no-print" onClick={()=>exportGroup(company, active)}>匯出 CSV</button>
          </div>
          {/* 列印專用的副標，畫面上不重複顯示 */}
          <div className="print-only" style={{fontSize:12, color:'#555', margin:'0 0 8px'}}>
            {monthLabel(month)}薪資　{Number(period)}日批次　實際發放日：{payDate}　（共 {active.length} 人）
          </div>
          <table style={{tableLayout:'fixed', width:'100%', minWidth:640}}>
            <colgroup>
              <col style={{width:'8%'}} /><col style={{width:'16%'}} /><col style={{width:'16%'}} />
              <col style={{width:'20%'}} /><col style={{width:'16%'}} /><col style={{width:'24%'}} />
            </colgroup>
            <thead><tr><th>項次</th><th>姓名</th><th>銀行</th><th>帳號</th><th>金額</th><th>備註</th></tr></thead>
            <tbody>
              {active.map((r,idx)=>(
                <tr key={r.emp.id}>
                  <td className="center">{idx+1}</td>
                  <td className="center">{r.emp.name}</td>
                  <td className="center">{r.emp.bankName}</td>
                  <td className="center mono">{r.emp.bankAccount || '（未登錄帳號）'}</td>
                  <td className="mono" style={{textAlign:'right'}}>{money(period==='06'?r.calc.pay06:r.calc.pay26)}</td>
                  <td className="center">{r.emp.note}</td>
                </tr>
              ))}
              <tr className="total-row"><td colSpan="4" className="center">總計</td><td className="mono" style={{textAlign:'right'}}>{money(total)}</td><td></td></tr>
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

/* ========================= 薪資印領清冊(全年度) ========================= */
/* ============ 印領清冊：SVG 精確排版列印 ============
   為什麼不用 HTML 列印：HTML 的版面是「瀏覽器算出來的」，同一份檔案在不同瀏覽器、
   不同縮放、不同印表機驅動下結果可能不同 —— 實測就遇過「第一頁左緣被裁掉約 8px」
   這種只在特定情境出現、加大頁面邊界也無效的問題，來回試印很難收斂。

   改用 SVG：每個文字與線條都寫死座標（單位直接用 mm），瀏覽器只負責顯示、
   不參與排版計算，所以「看到什麼就印出什麼」。文字仍是真的文字（可選取、可搜尋、
   任何解析度都清晰），不是圖片。 */
const REG_PAGE = { w:297, h:210, m:6 };          // A4 橫式（mm）
const REG_COL  = { label:22, month:20, ytd:20 }; // 欄寬：項目／每月／全年合計
const REG_SIG_H = 20;                             // 簽名格高度，至少 2cm 才蓋得下印章

function regEsc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// 產生一位員工的一頁 SVG
function regEmployeeSvg(emp, company, year){
  const P = REG_PAGE, C = REG_COL;
  const x0 = P.m, tableW = C.label + C.month*12 + C.ytd;
  const rows = REGISTER_ROW_DEFS;
  // 版面高度分配：抬頭 → 員工橫幅 → 表頭 → 說明 → 資料列 → 簽名格
  const yHead = P.m + 4.2, yLaw = yHead + 3.4, yBar = yLaw + 3.0;
  const barH = 6.2, hdrH = 5.6, capH = 4.6;
  const yTable = yBar + barH;
  const bodyTop = yTable + hdrH + capH;
  const avail = P.h - P.m - REG_SIG_H - bodyTop;
  const rowH = Math.min(6.2, avail / rows.length);
  const colX = i => x0 + C.label + C.month*i;          // 第 i 個月的左緣
  const ytdX = x0 + C.label + C.month*12;
  const bottom = bodyTop + rowH*rows.length;

  const L = [];   // 線條
  const T = [];   // 文字
  const R = [];   // 色塊
  const line = (a,b,c,d,col,w)=>L.push(`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="${w||0.15}"/>`);
  const text = (x,y,t,o={})=>T.push(
    `<text x="${x}" y="${y}" font-size="${o.size||2.5}" fill="${o.fill||'#1a1d21'}"`+
    ` text-anchor="${o.anchor||'start'}"${o.weight?` font-weight="${o.weight}"`:''}>${regEsc(t)}</text>`);
  const rect = (x,y,w,h,f)=>R.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`);

  // ── 抬頭 ──
  text(x0, yHead, company, {size:3.6, weight:700});
  text(x0 + company.length*3.7 + 2.5, yHead, `${year} 年度薪資印領清冊`, {size:2.4, fill:'#5c646e'});
  text(x0, yLaw, '依勞基法第 23 條規定製作，記載工資總額、各項目金額、扣除項目金額與實發金額，須保存 5 年。每人每月留一欄供簽名或蓋章確認領取。',
       {size:1.9, fill:'#5c646e'});

  // ── 員工橫幅 ──
  rect(x0, yBar, tableW, barH, '#F2F0E8');
  text(x0+2, yBar+4.2, emp.name, {size:3.0, weight:700});
  let bx = x0 + 2 + emp.name.length*3.1 + 3;
  text(bx, yBar+4.2, '身分證字號', {size:1.8, fill:'#7a828a'});  bx += 9.5;
  text(bx, yBar+4.2, emp.nationalId || '未填寫', {size:2.1});    bx += (emp.nationalId||'未填寫').length*1.25 + 5;
  text(bx, yBar+4.2, '戶籍地', {size:1.8, fill:'#7a828a'});      bx += 6.2;
  text(bx, yBar+4.2, emp.householdAddress || '未填寫', {size:2.1});

  // ── 表頭 ──
  rect(x0, yTable, tableW, hdrH, '#EDEDED');
  text(x0+2, yTable+3.8, '項目', {size:2.3, weight:700, fill:'#3b4148'});
  for(let i=0;i<12;i++){
    const settled = emp.monthly[i] && emp.monthly[i].hasEntry !== false;
    text(colX(i)+C.month/2, yTable+3.8, (i+1)+'月',
         {size:2.3, weight:700, anchor:'middle', fill: settled?'#3b4148':'#b0b6bc'});
  }
  text(ytdX+C.ytd/2, yTable+3.8, '全年合計', {size:2.3, weight:700, anchor:'middle', fill:'#3b4148'});

  // ── 說明列 ──
  text(x0+C.label+2, yTable+hdrH+3.2, '以下為本薪內含明細，僅供對照，不另外加總', {size:2.0, fill:'#5c646e'});

  // ── 資料列 ──
  rows.forEach((def, ri)=>{
    const y = bodyTop + rowH*ri, yc = y + rowH*0.7;
    if(def.kind==='add') rect(x0, y, tableW, rowH, 'rgba(47,125,79,.05)');
    if(def.kind==='cut') rect(x0, y, tableW, rowH, 'rgba(161,61,61,.05)');
    if(def.kind==='grand') rect(x0, y, tableW, rowH, 'rgba(0,173,181,.10)');
    if(def.kind==='add'||def.kind==='cut')
      rect(x0, y, 0.7, rowH, def.kind==='add' ? '#2f7d4f' : '#a13d3d');
    const strong = def.bold || def.kind==='grand';
    const fill = def.kind==='grand' ? '#00767C' : (def.indent ? '#5c646e' : '#1a1d21');
    const size = def.indent ? 2.0 : (def.kind==='grand' ? 2.5 : 2.3);
    text(x0 + (def.indent ? 5.5 : 2.2), yc, def.label,
         {size, weight: strong?700:400, fill});
    const fmt = v => {
      const n0 = Number(v)||0;
      const t = n0.toLocaleString('en-US');
      return def.kind==='cut' && n0!==0 ? '−'+t : t;
    };
    emp.monthly.forEach((mo, i)=>{
      const empty = mo.hasEntry === false;
      const v = empty ? '—' : fmt(mo[def.key]);
      const zero = !empty && (Number(mo[def.key])||0)===0;
      text(colX(i)+C.month-1.6, yc, v,
           {size, anchor:'end', weight: strong?700:400,
            fill: empty ? '#c3c8cd' : (zero ? '#a8aeb5' : fill)});
    });
    const yv = emp.yearTotal[def.key];
    text(ytdX+C.ytd-1.6, yc, fmt(yv),
         {size, anchor:'end', weight:700,
          fill: (Number(yv)||0)===0 ? '#a8aeb5' : fill});
  });

  // ── 簽名格 ──
  const ySig = bottom;
  text(x0+2.2, ySig+REG_SIG_H/2+1, '簽名／蓋章', {size:2.2, fill:'#5c646e'});

  // ── 框線（最後畫，蓋在色塊上）──
  const G='#DCDCDC', D='#9AA1A8', B='#00ADB5';
  for(let ri=0; ri<=rows.length; ri++){
    const y = bodyTop + rowH*ri;
    const def = rows[ri], prev = rows[ri-1];
    let col=G, w=0.15;
    if(def && def.sum){ col=D; w=0.22; }
    if((def && def.kind==='grand') || (prev && prev.kind==='grand')){ col=B; w=0.25; }
    line(x0, y, x0+tableW, y, col, w);
  }
  line(x0, yTable, x0+tableW, yTable, D, 0.22);
  line(x0, yTable+hdrH, x0+tableW, yTable+hdrH, D, 0.22);
  line(x0, ySig+REG_SIG_H, x0+tableW, ySig+REG_SIG_H, D, 0.22);
  line(x0, yBar, x0+tableW, yBar, D, 0.22);
  for(let i=0;i<=12;i++) line(colX(i), yTable, colX(i), ySig+REG_SIG_H, i===0?D:G, i===0?0.22:0.15);
  line(ytdX, yTable, ytdX, ySig+REG_SIG_H, D, 0.22);
  line(x0, yTable, x0, ySig+REG_SIG_H, D, 0.22);
  line(x0+tableW, yTable, x0+tableW, ySig+REG_SIG_H, D, 0.22);

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${P.w}mm" height="${P.h}mm"`+
    ` viewBox="0 0 ${P.w} ${P.h}" class="reg-page">`+
    `<style>text{font-family:'Noto Sans TC','PingFang TC',sans-serif}</style>`+
    R.join('') + L.join('') + T.join('') + `</svg>`;
}

// 開新視窗列印。刻意不在原頁面列印 —— 新視窗只有 SVG，完全不受後台 CSS 影響
function printRegisterSvg(list, company, year){
  const pages = list.map(emp=>regEmployeeSvg(emp, company, year)).join('');
  const title = `${year}年度-薪資印領清冊-${company||''}`.replace(/[\\/:*?"<>|]/g,'-');
  const w = window.open('', '_blank');
  if(!w){ alert('瀏覽器封鎖了彈出視窗，請允許後再試一次'); return; }
  w.document.write(
    `<!doctype html><html><head><meta charset="utf-8"><title>${regEsc(title)}</title><style>`+
    `@page{size:A4 landscape;margin:0}`+
    `html,body{margin:0;padding:0;background:#fff}`+
    `.reg-page{display:block;page-break-after:always;break-after:page}`+
    `.reg-page:last-child{page-break-after:auto;break-after:auto}`+
    `@media screen{body{background:#e9ecef;padding:16px}`+
    `.reg-page{margin:0 auto 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff}}`+
    `</style></head><body>${pages}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); }, 400);
}

const REGISTER_ROW_DEFS = [
  /* kind 決定左側色條與正負號：
       add  加項（綠條）
       cut  減項（紅條，金額前加負號）
       grand 實發總計（加框強調）
     原本所有項目平鋪，只靠「合計」列的粗體分段，讀的人要自己記住哪幾行要減；
     沒有負號時「應發 42,168、勞保 758」看起來像兩筆收入。 */
  {key:'base', label:'本薪', kind:'add', anchor:true},
  {key:'mealAllowance', label:'伙食津貼', kind:'add', indent:true},
  {key:'transportAllowance', label:'交通津貼', kind:'add', indent:true},
  {key:'positionAllowance', label:'職務加給', kind:'add', indent:true},
  {key:'fullAttendanceBonus', label:'全勤獎金', kind:'add', indent:true},
  {key:'overtimePay', label:'加班費', kind:'add'},
  {key:'bonusTotal', label:'獎金', kind:'add'},
  {key:'annualLeaveSettlement', label:'特休結算', kind:'add'},
  {key:'payableTotal', label:'應發合計', kind:'add', bold:true, sum:true},
  {key:'laborFee', label:'勞保費', kind:'cut'},
  {key:'healthFee', label:'健保費', kind:'cut'},
  {key:'leaveDeduct', label:'請假扣款', kind:'cut'},
  {key:'otherDeduction', label:'其他扣款', kind:'cut'},
  {key:'deductTotal', label:'應扣合計', kind:'cut', bold:true, sum:true},
  /* 26 日發放的項目逐項列出，不併成一筆「26日應發」——
     清冊是簽收憑證，員工要看得出這筆錢的名目。
     不另設「6日實發」列：那等於「應發合計 − 應扣合計」，讀表的人自己減得出來。
     整份的算式是：應發合計 − 應扣合計 ＋ 26 日各項 − 26日扣款 ＝ 實發總計 */
  {key:'businessExpense', label:'業務費用', kind:'add', indent:true},
  {key:'salesPerformance', label:'業績獎金', kind:'add', indent:true},
  {key:'salesBonus26', label:'其他獎金', kind:'add', indent:true},
  {key:'otherExpense26', label:'其他費用', kind:'add', indent:true},
  {key:'deduction26', label:'其他扣款', kind:'cut', indent:true},
  {key:'netPay', label:'實發總計', kind:'grand', bold:true}
];
function PayrollRegisterTab(){
  const [year, setYear] = useState(String(new Date().getFullYear()));
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeCompany, setActiveCompany] = useState(null);
  const scrollRef = useRef(null);
  // ⚠️ 這裡原本有一段從 PayrollTab 複製過來的「欄位群組收合」程式碼（GROUPS／groupCounts／
  //    openGroups／shown／toggleGroup／hasAnyEntry），但那段依賴 PayrollTab 的 `rows` prop，
  //    而本元件沒有 rows（資料來源是 data[activeCompany]），且整段在畫面裡從未被使用。
  //    結果是元件一初始化就 `rows is not defined`，整個後台變空白頁、只留 "Script error."
  //    （React 正式版會把細節藏起來，很難查）。2026-08-14 移除。
  //    複製元件邏輯時務必確認依賴的變數在新位置存在，不要只看語法過得去。
  function scrollToStart(){ if(!scrollRef.current) return; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:0, behavior:'smooth'}); else scrollRef.current.scrollLeft = 0; }
  function scrollToEnd(){ if(!scrollRef.current) return; const w = scrollRef.current.scrollWidth; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:w, behavior:'smooth'}); else scrollRef.current.scrollLeft = w; }

  function load(){
    setLoading(true);
    apiGet('getAnnualPayrollRegister', {year}).then(d=>{ setData(d); const keys=Object.keys(d||{}); setActiveCompany(prev=> prev && keys.includes(prev) ? prev : (keys[0]||null)); }).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [year]);

  const years = [];
  const thisYear = new Date().getFullYear();
  for(let y = thisYear + 1; y >= thisYear - 2; y--) years.push(String(y));
  const companies = data ? Object.keys(data) : [];
  const list = (data && activeCompany) ? data[activeCompany] : [];

  return (
    <div>
      <div className="toolbar no-print">
        <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
          {companies.map(co=>(
            <button key={co} className={co===activeCompany?'':'ghost'} onClick={()=>setActiveCompany(co)}>{co}</button>
          ))}
        </div>
        <label style={{marginBottom:0}}>年度</label>
        <select value={year} onChange={e=>setYear(e.target.value)}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        <span className="grow"></span>
        <button className="ghost sm" onClick={scrollToStart} title="跳到最左邊"><span className="material-icons" style={{fontSize:16}}>first_page</span></button>
        <button className="ghost sm" onClick={scrollToEnd} title="跳到最右邊看全年合計"><span className="material-icons" style={{fontSize:16}}>last_page</span></button>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
        <button onClick={()=>printRegisterSvg(list, activeCompany, year)} disabled={!list.length}
          title="以固定座標繪製，列印結果與畫面完全一致，不受瀏覽器排版影響">列印 / 另存 PDF</button>
      </div>
      {loading ? <div className="hint">載入中...</div> : !data || companies.length===0 ? <div className="empty card">尚無資料</div> : (
          /* 每位員工一張獨立卡片。列印本來就是一人一頁，畫面卻擠成連續的一張大表，
             兩邊的心智模型不一致；分成卡片之後，畫面上看到的區塊就等於印出來的頁。
             ⚠️ 公司名與法源說明必須放在「每一張卡片裡」，不能只放在最上面一次 ——
             那樣列印時它會自己佔掉第一頁，而後面每一頁都看不出是哪家公司的清冊。 */
          <div ref={scrollRef}>
            {list.map(emp=>(
              <div className="card reg-card" key={emp.employeeId} style={{overflowX:'auto'}}>
                <div className="reg-head">
                  <div className="reg-head-title">
                    <b>{activeCompany}</b>
                    <span>{year} 年度薪資印領清冊</span>
                  </div>
                  <div className="reg-head-law">
                    依勞基法第 23 條規定製作，記載工資總額、各項目金額、扣除項目金額與實發金額，須保存 5 年。每人每月留一欄供簽名或蓋章確認領取。
                  </div>
                </div>
                <table className="reg-table" style={{minWidth:1500}}>
              <tbody>
                {[emp].map(emp=>{
                  const regRows = [
                    {type:'emp'},
                    {type:'header'},
                    {type:'caption'},
                    ...REGISTER_ROW_DEFS.map(def=>({type:'data', def})),
                    {type:'signature'}
                  ];
                  return (
                    <React.Fragment key={emp.employeeId}>
                      {regRows.map((row,idx)=>{
                        /* 員工資料改成橫幅（見下方 type==='emp' 的那一列），不再佔用左側整欄。
                           原本那格約 40mm 寬卻只有中間幾行字，而簽名欄要求每格至少 2×2cm ——
                           橫式 A4 可用寬度 285mm，12 個月各 20mm 就要 240mm，
                           再加項目欄與全年合計已經 282mm，留不下 40mm 給姓名欄。 */
                        const nameCell = null;
                        if(row.type==='emp'){
                          return (
                            /* emp-start：列印時每位員工從新的一頁開始 */
                            <tr key="emp" className="emp-start">
                              <td className="reg-emp-bar" colSpan={14}>
                                <span className="nm">{emp.name}</span>
                                <span className="f"><b>身分證字號</b>{emp.nationalId || '未填寫'}</span>
                                <span className="f"><b>戶籍地</b>{emp.householdAddress || '未填寫'}</span>
                              </td>
                            </tr>
                          );
                        }
                        if(row.type==='header'){
                          return (
                            /* emp-start：列印時每位員工從新的一頁開始（見 @media print）。
                               一人一頁的好處是每個人簽自己那張、發放時不會看到同事的薪資；
                               更重要的是保證「一個人的資料不會被切成兩頁」——
                               靠「剛好放不下」自然分頁是不可靠的，字級一改就會切開。 */
                            <tr key="header">
                              {nameCell}
                              <th className="left reg-freeze-2" style={{minWidth:90}}>項目</th>
                              {/* 尚未結算的月份標題也淡化，一眼看得出這一整欄都還沒發生 */}
                              {Array.from({length:12},(_,i)=>i+1).map(m=>{
                                const settled = emp.monthly[m-1] && emp.monthly[m-1].hasEntry !== false;
                                return <th key={m} className={settled?'':'reg-empty'}>{m}月</th>;
                              })}
                              <th className="reg-ytd">全年合計</th>
                            </tr>
                          );
                        }
                        if(row.type==='caption'){
                          return (
                            <tr key="caption">
                              {nameCell}
                              <td className="reg-freeze-2"></td>
                              <td colSpan="13" className="left hint" style={{fontSize:11, paddingLeft:20}}>以下為本薪內含明細，僅供對照，不另外加總</td>
                            </tr>
                          );
                        }
                        if(row.type==='signature'){
                          return (
                            <tr key="signature">
                              {nameCell}
                              <td className="left reg-freeze-2">簽名/蓋章</td>
                              {/* 簽名／蓋章每格至少 2×2cm：印章直徑常見 1.5～2cm，
                                     格子小於印章就蓋不進去。寬度由 colgroup 控制，這裡定高度。 */}
                              {Array.from({length:12},(_,i)=><td key={i} className="sig-cell"></td>)}
                              <td className="reg-ytd sig-cell"></td>
                            </tr>
                          );
                        }
                        const def = row.def;
                        /* 減項的金額前面加負號。清冊是給人驗算的，符號本身就是資訊 ——
                           沒有負號時「應發 42,168、勞保 758」看起來像兩筆收入。0 不加負號。 */
                        const fmt = v => (def.kind==='cut' && n(v) !== 0) ? '−' + money(v) : money(v);
                        /* 真的 0 淡化：這張表有大量 0，滿版黑字會搶走注意力。
                           但不能留白 —— 留白會讓人以為漏填。 */
                        const zc = v => n(v)===0 ? ' reg-zero' : '';
                        const rowCls = [
                          'reg-row',
                          def.kind ? 'k-'+def.kind : '',
                          def.indent ? 'reg-ind' : '',
                          def.sum ? 'reg-sum' : ''
                        ].filter(Boolean).join(' ');
                        return (
                          <tr key={def.key} className={rowCls}>
                            {nameCell}
                            <td className="left reg-freeze-2">{def.label}</td>
                            {emp.monthly.map(mo=>(
                              /* 尚未結算的月份顯示「—」而不是 0。印領清冊記載的是「實際發放」的
                                 工資（勞基法第 23 條），0 代表「有發薪、金額為零」，是不實記載 */
                              mo.hasEntry === false ? (
                                <td key={mo.month} className="reg-empty" title="本月尚無薪資紀錄，未列入全年合計">—</td>
                              ) : (
                                <td key={mo.month} className={zc(mo[def.key])}>{fmt(mo[def.key])}</td>
                              )
                            ))}
                            <td className={'reg-ytd' + zc(emp.yearTotal[def.key])}>{fmt(emp.yearTotal[def.key])}</td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </tbody>
                </table>
              </div>
            ))}
          </div>
      )}
    </div>
  );
}

          <button onClick={()=>importOfficial('2026')} disabled={importing}>{importing?'匯入中...':'匯入 2026 年（115年）行事曆'}</button>
          <button onClick={()=>importOfficial('2027')} disabled={importing}>{importing?'匯入中...':'匯入 2027 年（116年）行事曆'}</button>
        </div>
        <div className="hint">目前系統內建 2025、2026、2027 年資料；未來年度公告後（每年約6月底）請再請開發者更新，或於下方手動新增。</div>
      </div>
      <div className="card">
        <h3><span className="material-icons">event_busy</span> 新增假日</h3>
        <div className="hint">國定假日出勤依法加發一日工資；公司自訂休假日（例如店休日）出勤則比照休息日，依4/8/12小時級距加成計算。</div>
        <div className="toolbar" style={{marginTop:10}}>
          <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})} />
          <input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="假日名稱（例：中秋節）" />
          <select value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>
            <option value="國定假日">國定假日</option>
            <option value="公司休假日">公司休假日</option>
          </select>
          <button onClick={add}><span className="material-icons" style={{fontSize:16}}>add</span>新增</button>
        </div>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{minWidth:500}}>
            <thead><tr><th className="left">日期</th><th className="left">名稱</th><th className="left">類型</th><th>操作</th></tr></thead>
            <tbody>
              {holidays.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>(
                <tr key={h.date}>
                  <td className="left">{h.date}</td><td className="left">{h.name}</td>
                  <td className="left">{h.type==='公司休假日' ? <span className="badge warn">公司休假日</span> : <span className="badge">國定假日</span>}</td>
                  <td><button className="danger sm" onClick={()=>remove(h.date)}>刪除</button></td>
                </tr>
              ))}
              {holidays.length===0 && <tr><td colSpan="4" className="hint" style={{textAlign:'center'}}>尚未設定假日</td></tr>}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

/* ========================= 帳號管理 ========================= */
function AccountsTab({employees}){
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [resetBox, setResetBox] = useState(null);

  function load(){ setLoading(true); apiGet('getAccounts').then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false)); }
  useEffect(load, []);

  function empName(id){ const e = employees.find(x=>x.id===id); return e ? e.name : (id ? '（已離職員工）' : '（未綁定員工，如：管理者帳號）'); }
  async function toggleStatus(a){
    try{ await apiPost('setAccountStatus', {accountId:a.id, status: a.status==='啟用'?'停用':'啟用'}); load(); }
    catch(e){ alert(e.message); }
  }
  async function removeAccount(a){
    if(!confirm(`確定要刪除帳號「${a.account}」嗎？此動作無法復原。`)) return;
    try{ await apiPost('deleteAccount', {accountId:a.id}); load(); }
    catch(e){ alert(e.message); }
  }
  async function doReset(){
    try{
      await apiPost('resetPassword', {accountId: resetBox.id, newPassword: resetBox.newPassword});
      alert('密碼已重設為：' + resetBox.newPassword);
      setResetBox(null);
    }catch(e){ alert(e.message); }
  }

  return (
    <div>
      <div className="toolbar">
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>要新增員工登入帳號，請至「員工資料」頁籤，編輯該位員工後點選「帳號」按鈕建立。</div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{minWidth:700}}>
            <thead><tr><th className="left">帳號</th><th className="left">對應員工</th><th>角色</th><th>狀態</th><th className="left">最後登入</th><th>操作</th></tr></thead>
            <tbody>
              {list.map(a=>(
                <tr key={a.id}>
                  <td className="left mono">{a.account}</td>
                  <td className="left">{empName(a.employeeId)}</td>
                  <td>{a.role==='admin' ? <span className="badge">管理者</span> : '員工'}</td>
                  <td>{a.status==='啟用' ? <span className="badge">啟用</span> : <span className="badge warn">停用</span>}</td>
                  <td className="left">{a.lastLogin || '尚未登入'}</td>
                  <td>
                    <button className="ghost sm" onClick={()=>setResetBox({id:a.id, account:a.account, newPassword: Math.random().toString(36).slice(2,8)})}>重設密碼</button>{' '}
                    <button className="danger sm" onClick={()=>toggleStatus(a)}>{a.status==='啟用'?'停用':'啟用'}</button>{' '}
                    <button className="danger sm" onClick={()=>removeAccount(a)}>刪除</button>
                  </td>
                </tr>
              ))}
              {list.length===0 && <tr><td colSpan="6" className="hint" style={{textAlign:'center'}}>尚無帳號資料</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {resetBox && (
        <div className="modal-bg">
          <div className="modal" style={{width:380}}>
            <h3><span className="material-icons">lock_reset</span>重設密碼：{resetBox.account}</h3>
            <div className="field"><label>新密碼</label><input value={resetBox.newPassword} onChange={e=>setResetBox({...resetBox,newPassword:e.target.value})} /></div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setResetBox(null)}>取消</button><button onClick={doReset}>確認重設</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 假單審核 ========================= */
function RequestsTab({month, employees, setTab}){
  const [list, setList] = useState([]);
  // 出勤時數對帳：審單的當下就要看得到「這個月還有誰的時數對不上」，
  // 否則要等到月底結算才發現漏了假單，那時人早就忘記那天發生什麼事了。
  const [gapInfo, setGapInfo] = useState(null);
  // 申請單本身沒有存員工類型，用員工ID對照員工主檔取得（避免另外打一支 API）
  const empTypeById = useMemo(()=>{
    const m = {};
    (employees||[]).forEach(e=>{ m[e.id] = e.employeeType || '正式員工'; });
    return m;
  }, [employees]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('');
  const [empFilter, setEmpFilter] = useState('');
  const [reviewBox, setReviewBox] = useState(null);
  const [busy, setBusy] = useState(false);

  function load(){
    setLoading(true);
    apiGet('listAllRequests', {month, status: statusFilter}).then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(()=>{ setEmpFilter(''); load(); }, [month, statusFilter]);
  // 對帳資料獨立載入，失敗就整條橫幅不顯示 —— 假單審核本身不能被它拖住
  useEffect(()=>{
    setGapInfo(null);
    apiGet('getMonthlySummary', {month}).then(rows=>{
      const gaps = (rows||[]).filter(e=>n(e.gapHours)>0);
      setGapInfo({
        people: gaps.length,
        hours: Math.round(gaps.reduce((s,e)=>s+n(e.gapHours),0)*10)/10,
        afterPending: Math.round((rows||[]).reduce((s,e)=>s+n(e.gapHoursAfterPending),0)*10)/10,
        names: gaps.map(e=>e.name + ' 少 ' + trimNum(e.gapHours,1) + 'h')
      });
    }).catch(()=>{});
  }, [month]);

  async function doReview(){
    setBusy(true);
    try{
      const result = await apiPost(reviewBox.mode==='approve'?'approveRequest':'rejectRequest', {id: reviewBox.req.id, comment: reviewBox.comment||''});
      setReviewBox(null); load();
      if(result && result.warning) alert(result.warning);
    }catch(e){ alert(e.message); }
    finally{ setBusy(false); }
  }
  const STATUS_BADGE = {'待審核':'warn', '初核通過':'warn', '已核准':'', '已駁回':'warn', '已取消':''};

  // 員工篩選在前端做：資料本來就都在手上，不必為了篩選再打一次 API（省一趟往返）
  const shownList = useMemo(
    () => empFilter ? list.filter(r => r.employeeId === empFilter) : list,
    [list, empFilter]
  );
  // 下拉只列出本月真的有申請單的人，避免一長串沒資料的名字
  const empOptions = useMemo(() => {
    const seen = new Map();
    list.forEach(r => { if(r.employeeId && !seen.has(r.employeeId)) seen.set(r.employeeId, r.name); });
    return [...seen.entries()].map(([id, name]) => ({id, name}));
  }, [list]);

  return (
    <div>
      <div className="toolbar">
        <label style={{marginBottom:0}}>狀態</label>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="">全部</option>
          <option value="待審核">待審核（等主管初核）</option>
          <option value="初核通過">初核通過（等我複核）</option>
          <option value="已核准">已核准</option>
          <option value="已駁回">已駁回</option>
          <option value="已取消">已取消</option>
        </select>
        <label style={{marginBottom:0, marginLeft:10}}>員工</label>
        <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)}>
          <option value="">全部（{list.length} 筆）</option>
          {empOptions.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
        {empFilter && <button className="ghost sm" onClick={()=>setEmpFilter('')}>清除</button>}
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      {gapInfo && gapInfo.people > 0 && (
        <div className="gap-banner warn">
          <span className="material-icons">rule</span>
          <div className="gb-body">
            <div className="gb-title">{month} 有 {gapInfo.people} 人的出勤時數對不上，合計少 {trimNum(gapInfo.hours,1)} 小時</div>
            <div className="gb-sub">
              {gapInfo.afterPending > 0
                ? <>把下面審核中的假單全部批准後，還會剩 <b style={{color:'var(--danger)'}}>{trimNum(gapInfo.afterPending,1)}</b> 小時沒有假單可以對應，要找當事人確認。</>
                : <>下面審核中的假單批准後就會全部補平。</>}
            </div>
            <div className="gb-names">{gapInfo.names.map(t=><span key={t} className="gb-name">{t}</span>)}</div>
          </div>
          <button className="ghost sm" onClick={()=>setTab('attendance')}>看是缺哪幾天</button>
        </div>
      )}
      <div className="hint" style={{marginBottom:12}}>
        員工的請假與加班換補休申請。部門主管可在前台審核；你也可以在此直接核准或駁回（含沒有設定主管的部門）。<br/>
        <b>待審核的假單不受月份篩選限制，一律顯示</b>（標「N 月」的就是其他月份的單）——
        補登到別的月份的單如果被月份濾掉，就永遠不會有人翻回去批。已核准的則嚴格依請假起始日歸月。
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table>
            <thead><tr><th className="center">姓名</th><th className="center">員工類型</th><th className="center">類型</th><th className="center">假別</th><th className="center">起訖 / 加班日期</th><th className="center">時數</th><th className="center">代理人</th><th className="center">事由</th><th className="center">附件</th><th className="center">狀態</th><th className="center">審核人</th><th className="center">操作</th></tr></thead>
            <tbody>
              {shownList.map(r=>{
                // 待審核的單不受月份篩選限制（後端 listAllRequests 刻意如此，免得補登到其他
                // 月份的單從清單消失、永遠沒人批）。但畫面上要標出來，否則選了 8 月卻看到
                // 9 月的資料，看起來就像篩選壞掉。
                const reqMonth = String(r.startTime || '').slice(0, 7);
                const otherMonth = reqMonth && month && reqMonth !== month;
                return (
                <tr key={r.id}>
                  <td className="center"><b>{r.name}</b></td>
                  <td className="center">{(()=>{ const t = empTypeById[r.employeeId] || '—';
                    return t === '正式員工' ? <span className="hint">{t}</span> : <span className="badge warn">{t}</span>; })()}</td>
                  <td className="center">{r.type}</td>
                  <td className="center">{r.leaveType || '-'}</td>
                  {/* 起訖分兩行。擠成一行時「2026-08-31(一) 08:30 ~ 2026-08-31(一) 09:15」中間那個
                      ~ 前後都是長字串，眼睛要來回找才知道哪個是開始、哪個是結束；
                      拆成上下兩行，同一個位置對齊，一眼就對得起來。 */}
                  <td className="center req-when">
                    {r.type==='請假' ? (
                      // 外層置中、內層靠左：第一行尾端多一個 ~，兩行直接置中的話左右都會錯開
                      <div className="req-when-in">
                        <div>
                          {withWeekday(r.startTime)} <span className="tilde">~</span>
                          {otherMonth && <span className="other-month" title={'這張是 '+reqMonth+' 的假單。待審核的單不受月份篩選限制，一律顯示，避免被漏批。'}>{Number(reqMonth.slice(5))} 月</span>}
                        </div>
                        <div>{withWeekday(r.endTime)}</div>
                      </div>
                    ) : withWeekday(String(r.startTime).split(' ')[0])}
                  </td>
                  <td className="center">{r.hours}</td>
                  <td className="center">{r.delegateName || '-'}</td>
                  <td className="center">{r.reason}</td>
                  <td className="center">{r.attachmentUrl ? <a href={r.attachmentUrl} target="_blank" rel="noopener"><span className="material-icons" style={{fontSize:18}}>attachment</span></a> : '-'}</td>
                  <td className="center">{(r.status==='待審核'||r.status==='初核通過') ? <span className="badge warn">{r.status}</span> : <span className="badge">{r.status}</span>}</td>
                  <td className="center">{r.reviewer}{r.reviewComment ? '（'+r.reviewComment+'）' : ''}</td>
                  <td className="center">
                    {(r.status==='待審核' || r.status==='初核通過') && (
                      <>
                        {/* 管理者核「待審核」等於一次完成兩段；核「初核通過」則是第二關定案 */}
                        <button className="ghost sm" onClick={()=>setReviewBox({req:r, mode:'approve', comment:''})}>
                          {r.status==='初核通過' ? '確認核准' : '核准'}
                        </button>{' '}
                        <button className="danger sm" onClick={()=>setReviewBox({req:r, mode:'reject', comment:''})}>駁回</button>
                      </>
                    )}
                  </td>
                </tr>
                );
              })}
              {shownList.length===0 && <tr><td colSpan="12" className="hint" style={{textAlign:'center'}}>{list.length===0 ? '本月尚無申請單' : '這位員工本月沒有符合條件的申請單'}</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {reviewBox && (
        <div className="modal-bg">
          <div className="modal" style={{width:420}}>
            <h3><span className="material-icons">{reviewBox.mode==='approve'?'check_circle':'cancel'}</span>{reviewBox.mode==='approve'?'核准':'駁回'}：{reviewBox.req.name} 的{reviewBox.req.type==='請假'?reviewBox.req.leaveType:'加班換補休'}</h3>
            {reviewBox.req.attachmentUrl && <div className="hint" style={{marginBottom:8}}><a href={reviewBox.req.attachmentUrl} target="_blank" rel="noopener">查看附件</a></div>}
            <div className="field"><label>審核意見（選填）</label><input value={reviewBox.comment} onChange={e=>setReviewBox({...reviewBox, comment:e.target.value})} style={{width:'100%'}} /></div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setReviewBox(null)}>取消</button>
              <button onClick={doReview} disabled={busy}>{busy?'處理中...':'確認'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 特休設定 ========================= */
function AnnualLeaveTab({employees}){
  const [year, setYear] = useState(String(new Date().getFullYear()));
  const [system, setSystem] = useState('calendar');
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [edits, setEdits] = useState({});
  const [savingId, setSavingId] = useState(null);
  const [estimatingId, setEstimatingId] = useState(null);
  const [batchBox, setBatchBox] = useState(null); // 批次試算預覽 {items, saving}
  const [batchLoading, setBatchLoading] = useState(false);

  function load(){
    setLoading(true);
    apiGet('getAnnualLeaveList', {year}).then(d=>{ setData(d); setEdits({}); }).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [year]);

  async function save(empId){
    const hours = Number(edits[empId]);
    if(isNaN(hours) || hours < 0){ alert('請輸入正確的時數'); return; }
    setSavingId(empId);
    try{
      await apiPost('setAnnualLeave', {employeeId: empId, year, hours});
      await load();
    }catch(e){ alert(e.message); }
    finally{ setSavingId(null); }
  }
  async function estimate(empId){
    setEstimatingId(empId);
    try{
      const r = await apiGet('estimateAnnualLeave', {employeeId: empId, year, system});
      setEdits({...edits, [empId]: r.hours});
    }catch(e){ alert(e.message); }
    finally{ setEstimatingId(null); }
  }

  async function batchEstimate(){
    setBatchLoading(true);
    try{
      const items = await apiGet('batchEstimateAnnualLeave', {year, system});
      setBatchBox({items, saving:false});
    }catch(e){ alert(e.message); }
    finally{ setBatchLoading(false); }
  }
  async function batchApply(){
    setBatchBox({...batchBox, saving:true});
    try{
      const items = batchBox.items.filter(it=>it.hours!==null).map(it=>({employeeId:it.employeeId, hours:it.hours}));
      const r = await apiPost('batchSaveAnnualLeave', {year, items});
      alert(`批次套用完成，共更新 ${r.saved} 位員工，請個別確認後如需微調可在下方表格調整。`);
      setBatchBox(null);
      await load();
    }catch(e){ alert(e.message); setBatchBox({...batchBox, saving:false}); }
  }

  const years = [];
  const thisYear = new Date().getFullYear();
  for(let y = thisYear + 1; y >= thisYear - 2; y--) years.push(String(y));

  return (
    <div>
      <div className="toolbar">
        <label style={{marginBottom:0}}>年度</label>
        <select value={year} onChange={e=>setYear(e.target.value)}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        <label style={{marginBottom:0}}>試算方式</label>
        <select value={system} onChange={e=>setSystem(e.target.value)}>
          <option value="calendar">歷年制（每年1/1~12/31）</option>
          <option value="anniversary">週年制（到職日起算）</option>
        </select>
        <span className="grow"></span>
        <button onClick={batchEstimate} disabled={batchLoading}>{batchLoading?'試算中...':'批次試算全部員工'}</button>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>
        核定每位員工當年度的特休「時數」（1 日＝8小時）。按「試算」可依到職日自動帶入建議日數，仍可手動調整後再儲存。
        <br/>⚠ 系統試算僅供參考，正式日數請以<a href="https://calcr2.mol.gov.tw/RestDays" target="_blank" rel="noopener" style={{color:'var(--brand)'}}>勞動部特別休假日數試算系統</a>或人資顧問確認為準。
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading || !data ? <div className="hint">載入中...</div> : (
          <table style={{tableLayout:'fixed', minWidth:900}}>
            <colgroup>
              <col style={{width:'11%'}} /><col style={{width:'11%'}} /><col style={{width:'19%'}} />
              <col style={{width:'10%'}} /><col style={{width:'12%'}} /><col style={{width:'10%'}} />
              <col style={{width:'10%'}} /><col style={{width:'17%'}} />
            </colgroup>
            <thead><tr><th className="center">姓名</th><th className="center">部門</th><th className="left">到職日</th><th className="center">核定日數</th><th className="center">核定時數</th><th className="center">已用</th><th className="center">剩餘</th><th className="center">操作</th></tr></thead>
            <tbody>
              {employees.map(emp=>{
                const granted = data.granted[emp.id] ? data.granted[emp.id].hours : 0;
                const used = data.used[emp.id] || 0;
                const editVal = edits[emp.id] !== undefined ? edits[emp.id] : granted;
                const editDays = Number(editVal)>0 ? trimNum(Number(editVal)/8, 1) : '0';
                return (
                  <tr key={emp.id}>
                    <td className="center"><b>{emp.name}</b></td>
                    <td className="center">{emp.department}</td>
                    <td className="left">{emp.hireDate ? rocDate(emp.hireDate) : '-'}</td>
                    <td className="center hint">{editDays} 日</td>
                    <td className="center"><input type="number" min="0" step="0.01" value={editVal} onChange={e=>setEdits({...edits, [emp.id]: e.target.value})} style={{width:80, textAlign:'center'}} /></td>
                    <td className="center">{trimNum(used, 1)}<span className="hint" style={{marginLeft:4}}>（{trimNum(used/8, 1)} 日）</span></td>
                    <td className={'center' + (granted-used < 8 ? ' flag' : '')}>
                      {trimNum(Math.max(0, granted-used), 1)}
                      <span className="hint" style={{marginLeft:4}}>（{trimNum(Math.max(0, granted-used)/8, 1)} 日）</span>
                    </td>
                    <td className="center">
                      <button className="ghost sm" onClick={()=>estimate(emp.id)} disabled={estimatingId===emp.id || !emp.hireDate} title={!emp.hireDate?'請先設定到職日':''}>{estimatingId===emp.id?'試算中':'試算'}</button>{' '}
                      <button className="ghost sm" onClick={()=>save(emp.id)} disabled={savingId===emp.id}>{savingId===emp.id?'儲存中':'儲存'}</button>
                    </td>
                  </tr>
                );
              })}
              {employees.length===0 && <tr><td colSpan="8" className="hint" style={{textAlign:'center'}}>尚無員工</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {batchBox && (
        <div className="modal-bg">
          <div className="modal" style={{maxWidth:640}}>
            <h3><span className="material-icons">calculate</span>批次試算預覽（{year}年・{system==='calendar'?'歷年制':'週年制'}）</h3>
            <div className="hint" style={{marginBottom:10}}>以下為系統依到職日試算的建議日數，確認無誤後按「套用全部」，會覆蓋這些員工目前的核定時數。個別員工仍可在下方表格單獨微調。</div>
            <table>
              <colgroup>
                <col style={{width:'14%'}} /><col style={{width:'26%'}} /><col style={{width:'14%'}} />
                <col style={{width:'14%'}} /><col style={{width:'32%'}} />
              </colgroup>
              <thead><tr><th className="center">姓名</th><th className="left">到職日</th><th className="center">建議日數</th><th className="center">建議時數</th><th className="center">備註</th></tr></thead>
              <tbody>
                {batchBox.items.map(it=>(
                  <tr key={it.employeeId}>
                    <td className="center">{it.name}</td>
                    <td className="left">{(employees.find(e=>e.id===it.employeeId)||{}).hireDate ? rocDate((employees.find(e=>e.id===it.employeeId)||{}).hireDate) : '-'}</td>
                    <td className="center">{it.days===null?'-':trimNum(it.days,1)}</td>
                    <td className="center">{it.hours===null?'-':trimNum(it.hours,2)}</td>
                    <td className="center" style={{color:'var(--danger)'}}>{it.error}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setBatchBox(null)}>取消</button>
              <button onClick={batchApply} disabled={batchBox.saving}>{batchBox.saving?'套用中...':'套用全部'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// 內文用 **粗體** 標記重點，這裡轉成 <b>。不引外部 markdown 套件，只處理這一種語法。
function boldize(text){
  return String(text).split('**').map((seg, i)=> i%2 ? <b key={i}>{seg}</b> : <span key={i}>{seg}</span>);
}

function DashboardTab({setTab}){
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [remind, setRemind] = useState(null); // 薪資作業提醒，失敗不影響其他統計顯示
  const [markBusy, setMarkBusy] = useState(false);

  function load(){
    setLoading(true);
    apiGet('getDashboardStats').then(setStats).catch(e=>alert(e.message)).finally(()=>setLoading(false));
    apiGet('getPayrollReminders').then(setRemind).catch(()=>setRemind(null));
  }

  // 標記／取消標記「這一期薪資作業已完成」。
  // 標記存在後端的設定表（不是 localStorage），換裝置換瀏覽器都看得到同一份狀態。
  async function markStage(undo){
    if(!remind || remind.階段==='idle') return;
    setMarkBusy(true);
    try{
      await apiPost('markPayrollStageDone', {month: remind.上個月, stage: remind.階段, undo: !!undo});
      // 重新抓一次而不是本地改狀態：完成時間與標記者由後端決定
      const fresh = await apiGet('getPayrollReminders');
      setRemind(fresh);
    }catch(e){ alert(e.message); }
    finally{ setMarkBusy(false); }
  }
  useEffect(load, []);

  // 每月薪資分兩段（6日正常薪資、26日業務獎金與代墊費用），依今天幾號提示現在該做哪一段
  const STAGE_STYLE = {
    input06: {color:'var(--brand)', icon:'edit_calendar'},
    input26: {color:'#c98a4b', icon:'payments'},
    lock:    {color:'var(--danger)', icon:'lock'},
    idle:    {color:'#8a9080', icon:'check_circle'}
  };

  const CARDS = stats ? [
    {label:'在職員工', value:stats.employeeCount, icon:'people', color:'var(--brand)', onClick:()=>setTab('employees')},
    {label:'今日已打卡', value:`${stats.presentToday} / ${stats.attendanceRequiredCount}`, icon:'fact_check', color:'var(--brand)', onClick:()=>setTab('records')},
    {label:'待審核申請', value:stats.pendingRequests, icon:'approval', color: stats.pendingRequests>0 ? 'var(--danger)' : 'var(--brand)', onClick:()=>setTab('requests')},
    {label:'本月平日加班時數', value:stats.monthlyOtHoursTotal, icon:'schedule', color:'var(--brand)', onClick:()=>setTab('attendance')},
  ] : [];

  return (
    <div>
      <div className="toolbar">
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      {remind && (()=>{
        // 已標記完成的階段，整張卡片轉為低調的「已完成」樣式；
        // 但「未鎖定月份」「假單待審逾期」照常顯示 —— 那是查表算出來的事實，
        // 不該被一顆按鈕蓋掉，否則會變成把真正的問題藏起來。
        const done = !!remind.已完成;
        const tone = done ? {color:'var(--green, #4f9b6f)', icon:'task_alt'} : STAGE_STYLE[remind.階段];
        return (
        <div className="card" style={{marginBottom:18, borderLeft:'4px solid '+tone.color, opacity: done ? .82 : 1}}>
          <div style={{display:'flex', alignItems:'flex-start', gap:12}}>
            <span className="material-icons" style={{fontSize:28, color:tone.color}}>{tone.icon}</span>
            <div style={{flex:1}}>
              {/* 已完成時不要再用祈使句當標題（「請補入…」做完了還在叫人做很怪），
                  改用後端給的中性名稱，前面直接標「已完成」。 */}
              <div style={{fontSize:15, fontWeight:700, color:tone.color}}>
                {done ? <>已完成：{remind.項目名稱 || remind.標題}</> : remind.標題}
              </div>
              <div className="hint" style={{marginTop:4}}>
                {done
                  ? <>{remind.完成標記者} 在 {remind.完成時間} 標記的。這個月不會再提醒你，也不會再寄信；下個月時間到了會自動重新提醒。</>
                  : remind.說明}
              </div>

              {remind.未鎖定月份.length>0 && (
                <div style={{marginTop:10}}>
                  <div style={{fontSize:12, fontWeight:600}}>尚未鎖定結案的月份</div>
                  <div className="hint" style={{marginTop:2}}>
                    {remind.未鎖定月份.map(m=>m.月份+'（'+m.未鎖定人數+' 人）').join('、')}
                    　— 鎖定後才會凍結當月薪資結構，日後調薪不會改到歷史薪資條
                  </div>
                </div>
              )}

              {remind.假單待審逾期.length>0 && (
                <div style={{marginTop:10}}>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--danger)'}}>假單待審超過 {remind.假單逾期日數門檻} 日</div>
                  <div className="hint" style={{marginTop:2}}>
                    {remind.假單待審逾期.map(x=>x.姓名+'（'+x.類型+'，'+x.申請時間+'）').join('、')}
                  </div>
                </div>
              )}

              {/* 出勤時數對不上：結算前最後一道檢查。用「對不上」而不是「曠職」——
                  成因可能是漏請假、漏打卡或系統沒記到，判定曠職要人工確認過，而且會直接扣到錢。 */}
              {(remind.出勤對不上||[]).length>0 && (
                <div style={{marginTop:10}}>
                  <div style={{fontSize:12, fontWeight:600, color:'var(--danger)'}}>
                    {remind.上個月} 有 {remind.出勤對不上.length} 人的出勤時數對不上，合計少 {trimNum(remind.出勤對不上合計,1)} 小時
                  </div>
                  <div className="hint" style={{marginTop:2}}>
                    {remind.出勤對不上.map(x=>x.姓名+' 少 '+trimNum(x.缺口小時,1)+'h'
                      + (x.批完待審後仍缺>0 ? '' : '（假單審核中）')).join('、')}
                    　— 應出勤時數減掉「實際出勤＋已核准請假」的差額，結算前要逐一確認
                  </div>
                </div>
              )}

              <div style={{marginTop:10, display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>
                <button className="ghost sm" onClick={()=>setTab('payroll')}>前往薪資計算</button>
                {(remind.出勤對不上||[]).length>0 && <button className="ghost sm" onClick={()=>setTab('attendance')}>前往出缺勤彙總</button>}
                {remind.假單待審逾期.length>0 && <button className="ghost sm" onClick={()=>setTab('requests')}>前往假單審核</button>}
                <span className="grow"></span>
                {/* 按鈕文字直接寫「按下去會發生什麼」，不要用「取消／還原」這種要反著想的詞 */}
                {remind.階段!=='idle' && (
                  done
                    ? <button className="ghost sm" disabled={markBusy}
                        title="標錯了？改回未完成，卡片會恢復提醒"
                        onClick={()=>markStage(true)}>
                        <span className="material-icons" style={{fontSize:15}}>undo</span>
                        {markBusy?'處理中...':'改回未完成'}
                      </button>
                    : <button className="sm" disabled={markBusy}
                        title="標記為已完成，這個月就不再提醒，下個月自動恢復"
                        onClick={()=>markStage(false)}>
                        <span className="material-icons" style={{fontSize:15}}>done</span>
                        {markBusy?'處理中...':'我做完了，別再提醒'}
                      </button>
                )}
              </div>
            </div>
          </div>
        </div>
        );
      })()}

      {loading || !stats ? <div className="hint">載入中...</div> : (
        <>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:14, marginBottom:18}}>
            {CARDS.map(c=>(
              <div className="card" key={c.label} style={{cursor:'pointer', textAlign:'center'}} onClick={c.onClick}>
                <span className="material-icons" style={{fontSize:26, color:c.color}}>{c.icon}</span>
                <div style={{fontSize:26, fontWeight:700, color:c.color, marginTop:6}}>{c.value}</div>
                <div className="hint">{c.label}</div>
              </div>
            ))}
          </div>

          {(stats.otCapAlerts>0 || stats.minWageAlerts>0) && (
