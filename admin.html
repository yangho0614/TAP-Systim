                    <tr key={emp.id}>
                      <td className="left">{emp.department}</td>
                      <td className="left" style={{cursor:'pointer'}} onClick={()=>onEdit(emp)}><b>{emp.name}</b>{emp.employeeType && emp.employeeType !== '正式員工' && <span className="badge warn" style={{marginLeft:6}}>{emp.employeeType}</span>}{emp.exemptFromAttendance && (!emp.employeeType || emp.employeeType === '正式員工') && <span className="badge warn" style={{marginLeft:6}}>免打卡</span>}</td>
                      <td className="left mono">{emp.phone}</td>
                      <td>{emp.shift ? emp.shift.name : <span className="hint">預設</span>}</td>
                      <td>{emp.hireDate || '-'}</td>
                      <td>{tenureShortText(emp.hireDate, emp.tenureBreakStart, emp.tenureBreakEnd)}</td>
                      <td>{emp.insuranceGrade || 0}</td>
                      <td>{emp.dependentCount || 0}</td>
                      <td>{money(emp.baseSalary)}</td>
                      <td className="left mono">{emp.bankAccount}</td>
                      <td style={{whiteSpace:'normal'}}>
                        <button className="ghost sm" onClick={()=>onEdit(emp)}><span className="material-icons" style={{fontSize:14}}>edit</span>編輯</button>{' '}
                        <button className="ghost sm" onClick={()=>setAccountBox({employeeId:emp.id, name:emp.name, account:emp.phone||'', password: Math.random().toString(36).slice(2,8)})}><span className="material-icons" style={{fontSize:14}}>vpn_key</span>帳號</button>{' '}
                        <button className="danger sm" onClick={()=>{ alert(`請在編輯視窗中手動填寫「${emp.name}」的離職日，儲存後即會標記為離職。`); onEdit(emp); }}><span className="material-icons" style={{fontSize:14}}>person_remove</span>離職</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
        </>
      )}

      {accountBox && (
        <div className="modal-bg">
          <div className="modal" style={{width:400}}>
            <h3><span className="material-icons">vpn_key</span>建立登入帳號：{accountBox.name}</h3>
            <div className="field"><label>帳號（建議用手機號碼或員工編號）</label><input value={accountBox.account} onChange={e=>setAccountBox({...accountBox, account:e.target.value})} /></div>
            <div className="field"><label>初始密碼</label><input value={accountBox.password} onChange={e=>setAccountBox({...accountBox, password:e.target.value})} /></div>
            <div className="hint">建立後請把帳號密碼告訴員工，員工登入後可自行修改密碼。</div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setAccountBox(null)}>取消</button>
              <button onClick={createAccountSubmit}>建立帳號</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RecordsTab({employees, month}){
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [manual, setManual] = useState(null);
  const [editing, setEditing] = useState(null);
  const [filterCompany, setFilterCompany] = useState('全部');
  const [filterName, setFilterName] = useState('全部');
  const [onlyAbnormal, setOnlyAbnormal] = useState(false);
  // 已作廢的紀錄預設隱藏（它們不算數），勾選才撈出來查看與還原
  const [showVoided, setShowVoided] = useState(false);

  function load(){
    setLoading(true);
    apiGet('getRecords', {month, includeVoided: showVoided ? 'true' : 'false'})
      .then(setRecords).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [month, showVoided]);

  async function saveManual(){
    try{ await apiPost('addManualRecord', manual); setManual(null); load(); }catch(e){ alert(e.message); }
  }
  async function saveEdit(){
    try{ await apiPost('adjustRecord', editing); setEditing(null); load(); }catch(e){ alert(e.message); }
  }
  // 作廢而非刪除：原始資料完整保留，只是不再列入任何統計與薪資計算。
  // 依勞基法第 30 條第 5 項出勤紀錄應保存 5 年，硬刪除等於銷毀憑證、勞檢時無法舉證。
  async function voidRecordAsk(id, info){
    const who = info ? `${info.date}　${info.name}　${info.checkIn||'—'} / ${info.checkOut||'—'}\n\n` : '';
    const reason = prompt(
      '作廢打卡紀錄\n\n' + who +
      '作廢後這筆不再列入出缺勤統計與薪資計算，但原始資料會完整保留，\n' +
      '並記錄操作者與時間，日後可還原（勞基法第 30 條要求出勤紀錄保存 5 年）。\n\n' +
      '請填寫作廢原因：', '');
    if(reason === null) return;               // 按取消
    if(!reason.trim()){ alert('請填寫作廢原因，這是稽核軌跡的一部分'); return; }
    try{ await apiPost('voidRecord', {id, reason: reason.trim()}); load(); }catch(e){ alert(e.message); }
  }
  async function restoreRecordAsk(id, info){
    const who = info ? `${info.date}　${info.name}` : '這筆紀錄';
    if(!confirm(`還原「${who}」？\n\n還原後會重新列入出缺勤統計與薪資計算。`)) return;
    try{ await apiPost('restoreRecord', {id}); load(); }catch(e){ alert(e.message); }
  }

  const empMap = {}; employees.forEach(e=>{ empMap[e.id] = e; });
  const companies = ['全部', ...Array.from(new Set(employees.map(e=>e.company||'(未分類)')))];
  const namesInCompany = filterCompany==='全部' ? employees : employees.filter(e=>(e.company||'(未分類)')===filterCompany);
  const namesWithRecords = new Set(records.map(r=>r.name)); // 免打卡員工若本月確實有紀錄（例如手動補登），還是要能被篩選到
  const eligibleForFilter = namesInCompany.filter(e=>!(e.exemptFromAttendance || (e.employeeType && e.employeeType!=='正式員工')) || namesWithRecords.has(e.name));
  const names = ['全部', ...Array.from(new Set(eligibleForFilter.map(e=>e.name)))];

  const filtered = records.filter(r=>{
    const emp = empMap[r.employeeId];
    const empCompany = emp ? (emp.company||'(未分類)') : '(未分類)';
    if(filterCompany!=='全部' && empCompany!==filterCompany) return false;
    if(filterName!=='全部' && r.name!==filterName) return false;
    if(onlyAbnormal && !isAbnormalStatus(r.checkInStatus) && !isAbnormalStatus(r.checkOutStatus) && !isAbnormalStatus(r.outgoStatus) && !isAbnormalStatus(r.returnStatus)) return false;
    return true;
  });

  function punchCell(time, status){
    const t = (time||'').split(' ')[1] || '-';
    return (
      <td className="center">
        <div className="mono">{t}</div>
        {isAbnormalStatus(status) && <div className="flag" style={{fontSize:11, marginTop:2}}>{status}</div>}
      </td>
    );
  }

  return (
    <div>
      <div className="toolbar" style={{flexWrap:'wrap', gap:8}}>
        <select value={filterCompany} onChange={e=>{ setFilterCompany(e.target.value); setFilterName('全部'); }} style={{width:'auto'}}>
          {companies.map(c=><option key={c} value={c}>{c==='全部'?'全部公司':c}</option>)}
        </select>
        <select value={filterName} onChange={e=>setFilterName(e.target.value)} style={{width:'auto'}}>
          {names.map(n=><option key={n} value={n}>{n==='全部'?'全部姓名':n}</option>)}
        </select>
        <label style={{display:'flex', alignItems:'center', gap:5, fontSize:13, color:'var(--ink)'}}>
          <input type="checkbox" checked={onlyAbnormal} onChange={e=>setOnlyAbnormal(e.target.checked)} style={{width:'auto'}} />只顯示異常記錄
        </label>
        <label style={{display:'flex', alignItems:'center', gap:5, fontSize:13, color:'var(--ink)'}}>
          <input type="checkbox" checked={showVoided} onChange={e=>setShowVoided(e.target.checked)} style={{width:'auto'}} />顯示已作廢
        </label>
        <span className="grow"></span>
        <button className="ghost sm" onClick={()=>setManual({employeeId:'', name:'', companyFilter:'全部', date: month+'-01', checkIn:'', checkOut:'', note:''})}>＋ 補登紀錄</button>
        <button className="ghost sm" onClick={load}>重新整理</button>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{tableLayout:'fixed', minWidth:1080}}>
            <colgroup>
              <col style={{width:'9%'}} /><col style={{width:'11%'}} /><col style={{width:'9%'}} />
              <col style={{width:'9%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} /><col style={{width:'9%'}} />
              <col style={{width:'8%'}} /><col style={{width:'13%'}} /><col style={{width:'14%'}} />
            </colgroup>
            <thead><tr><th className="center">姓名</th><th className="center">公司</th><th className="center">日期</th><th>上班</th><th>下班</th><th>外出</th><th>返回</th><th className="center">來源</th><th className="left">備註</th><th className="center">操作</th></tr></thead>
            <tbody>
              {filtered.map(r=>{
                const emp = empMap[r.employeeId];
                return (
                <tr key={r.id} className={r.voided ? 'voided-row' : ''}>
                  <td className="center"><b>{r.name}</b>{r.voided && <span className="void-tag">已作廢</span>}</td>
                  <td className="center">{emp ? (emp.company||'(未分類)') : '-'}</td>
                  <td className="center">{r.date}</td>
                  {punchCell(r.checkIn, r.checkInStatus)}
                  {punchCell(r.checkOut, r.checkOutStatus)}
                  {punchCell(r.outgo, r.outgoStatus)}
                  {punchCell(r.returnTime, r.returnStatus)}
                  <td className="center">{r.source}</td>
                  <td className="left">
                    {r.note}
                    {r.voided && <div className="void-meta">{r.voidedBy} 於 {r.voidedAt} 作廢{r.voidReason ? '：' + r.voidReason : ''}</div>}
                  </td>
                  <td>
                    {r.voided ? (
                      <button className="ghost sm" onClick={()=>restoreRecordAsk(r.id, r)}>還原</button>
                    ) : (<>
                      <button className="ghost sm" onClick={()=>setEditing({id:r.id, checkIn:r.checkIn, checkOut:r.checkOut, note:r.note, lat:r.checkInLat||r.checkOutLat||'', lng:r.checkInLng||r.checkOutLng||''})}>修改</button>{' '}
                      <button className="danger sm" onClick={()=>voidRecordAsk(r.id, r)}>作廢</button>
                    </>)}
                  </td>
                </tr>
                );
              })}
              {filtered.length===0 && <tr><td colSpan="10" className="hint" style={{textAlign:'center'}}>{records.length===0?'本月尚無打卡紀錄':'沒有符合篩選條件的紀錄'}</td></tr>}
            </tbody>
          </table>
        )}
      </div>

      {manual && (
        <div className="modal-bg">
          <div className="modal">
            <h3>補登打卡紀錄</h3>
            <div className="field"><label>公司</label>
              <select value={manual.companyFilter||'全部'} onChange={e=>setManual({...manual, companyFilter:e.target.value, employeeId:'', name:''})}>
                {companies.map(c=><option key={c} value={c}>{c==='全部'?'全部公司':c}</option>)}
              </select>
            </div>
            <div className="field"><label>員工</label>
              <select value={manual.employeeId} onChange={e=>{ const emp=employees.find(x=>x.id===e.target.value); setManual({...manual, employeeId:e.target.value, name: emp?emp.name:''}); }}>
                <option value="">請選擇</option>
                {employees.filter(e=>(manual.companyFilter||'全部')==='全部' || (e.company||'(未分類)')===manual.companyFilter).map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
            </div>
            <div className="grid-2">
              <div className="field"><label>日期</label><input type="date" value={manual.date} onChange={e=>setManual({...manual,date:e.target.value})} /></div>
              <div className="field"></div>
              <div className="field"><label>上班時間</label><input type="datetime-local" onChange={e=>setManual({...manual, checkIn:e.target.value.replace('T',' ')+':00'})} /></div>
              <div className="field"><label>下班時間</label><input type="datetime-local" onChange={e=>setManual({...manual, checkOut:e.target.value.replace('T',' ')+':00'})} /></div>
            </div>
            <div className="field">
              <label>備註</label>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:6}}>
                {NOTE_PRESETS.map(p=>(
                  <button key={p} type="button" className="ghost sm" onClick={()=>setManual({...manual, note: manual.note ? manual.note+'；'+p : p})}>{p}</button>
                ))}
              </div>
              <textarea value={manual.note} onChange={e=>setManual({...manual,note:e.target.value})} rows="3" placeholder="例如：員工反映忘記打卡，經口頭確認補登" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>
            </div>
            <AddressGeocodeField lat={manual.lat} lng={manual.lng} onFound={(lat,lng)=>setManual({...manual, lat, lng})} />
            <div className="hint" style={{marginTop:-6, marginBottom:10}}>選填，如果知道員工當時實際所在地點，可以輸入地址核對是否在打卡範圍內。</div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setManual(null)}>取消</button><button onClick={saveManual}>儲存</button></div>
          </div>
        </div>
      )}
      {editing && (
        <div className="modal-bg">
          <div className="modal">
            <h3>修改打卡紀錄</h3>
            <div className="grid-2">
              <div className="field"><label>上班時間</label><input type="datetime-local" defaultValue={(editing.checkIn||'').replace(' ','T').slice(0,16)} onChange={e=>setEditing({...editing, checkIn:e.target.value.replace('T',' ')+':00'})} /></div>
              <div className="field"><label>下班時間</label><input type="datetime-local" defaultValue={(editing.checkOut||'').replace(' ','T').slice(0,16)} onChange={e=>setEditing({...editing, checkOut:e.target.value.replace('T',' ')+':00'})} /></div>
            </div>
            <div className="field">
              <label>備註</label>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:6}}>
                {NOTE_PRESETS.map(p=>(
                  <button key={p} type="button" className="ghost sm" onClick={()=>setEditing({...editing, note: editing.note ? editing.note+'；'+p : p})}>{p}</button>
                ))}
              </div>
              <textarea value={editing.note} onChange={e=>setEditing({...editing,note:e.target.value})} rows="3" placeholder="例如：定位偏移是因為店內訊號問題，已跟員工確認實際有在店內" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>
            </div>
            <AddressGeocodeField lat={editing.lat} lng={editing.lng} onFound={(lat,lng)=>setEditing({...editing, lat, lng})} />
            <div className="hint" style={{marginTop:-6, marginBottom:10}}>選填，如果要修正這筆紀錄的定位，可以輸入正確地址後儲存，狀態欄會依新座標重新比對是否超出範圍。</div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setEditing(null)}>取消</button><button onClick={saveEdit}>儲存</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 出缺勤彙總 ========================= */
// 偶發假別共用「其他有薪假」一欄：這些假一年可能只請一次，各給固定欄位會有 7 欄整年是 0
const OCCASIONAL_LEAVES = ['婚假','喪假','公假','公傷病假','產假','產檢假','陪產假'];
// 展開明細的一列。狀態放最前，最左邊形成一條顏色帶，待審核的幾筆往下掃就找得到
function LeaveDetailRow({d}){
  const pending = (d.status === '待審核' || d.status === '初核通過');
  const sameDay = String(d.startTime).slice(0,10) === String(d.endTime).slice(0,10);
  const when = sameDay
    ? `${String(d.startTime).slice(5,10)}　${String(d.startTime).slice(11,16)}–${String(d.endTime).slice(11,16)}`
    : `${String(d.startTime).slice(5,10)} ～ ${String(d.endTime).slice(5,10)}`;
  return (
    <div className="lv-row">
      <span className={'lv-st' + (pending ? ' wait' : '')}>{d.status}</span>
      <span className="lv-ty">{d.leaveType}</span>
      <span className="lv-hr">{trimNum(d.hours,1)} 小時</span>
      <span className="lv-when">{when}{d.reason ? <span className="lv-why">· {d.reason}</span> : null}</span>
    </div>
  );
}

function AttendanceTab({month, onApply, allLocked}){
  const [summary, setSummary] = useState([]);
  const [loading, setLoading] = useState(true);
  const [applying, setApplying] = useState(false);
  const [makeupBox, setMakeupBox] = useState(null); // {employeeId, name, dates}
  // 欄位分組摺疊：預設展開出勤與兩組請假、收起加班，一屏看得完不必橫向捲
  const [openG, setOpenG] = useState({att:true, unpaid:true, paid:true, ot:false});
  const [openRow, setOpenRow] = useState({});
  const g = k => !!openG[k];
  const toggleG = k => setOpenG(o=>({...o, [k]:!o[k]}));
  const toggleRow = id => setOpenRow(o=>({...o, [id]:!o[id]}));
  // 扣薪假／有薪假分開統計：兩者性質不同（一個扣薪影響全勤、一個不扣），
  // 合成單一「請假合計」會看不出嚴重性，且扣薪假小計要能直接對薪資表的請假扣款
  function unpaidSum(e){ return r1(n(e.personalLeave)+n(e.sickLeave)+n(e.familyCareLeave)+n(e.menstrualLeave)+n(e.disasterLeave)); }
  function occasional(e){
    const t = e.leaveByType || {};
    return OCCASIONAL_LEAVES.filter(k=>n(t[k])>0).map(k=>({type:k, hours:n(t[k])}));
  }
  function paidSum(e){
    const t = e.leaveByType || {};
    return r1(n(t['特休']) + n(t['補休']) + occasional(e).reduce((s,x)=>s+x.hours,0));
  }
  function r1(v){ return Math.round((Number(v)||0)*10)/10; }
  // 0 用淡字而不是留白：留白會讓人分不清「沒請假」和「資料還沒帶進來」
  const Z = ({v, cls}) => <td className={'center ' + (cls||'') + (n(v)===0 ? ' zero-dim' : '')}>{trimNum(v,1)}</td>;

  function load(){ setLoading(true); apiGet('getMonthlySummary', {month}).then(setSummary).catch(e=>alert(e.message)).finally(()=>setLoading(false)); }
  useEffect(load, [month]);

  function doExportCSV(){
    // CSV 一律匯出全部欄位（含收合起來的群組），畫面上的摺疊只是為了控制寬度，不該影響匯出內容
    const headers = ['姓名','出勤日數','遲到次數','遲到分鐘','早退次數','早退分鐘',
      '事假(hr)','病假(hr)','家庭照顧假(hr)','生理假(hr)','災防假(hr)','扣薪假小計(hr)',
      '特休(hr)','補休(hr)','其他有薪假(hr)','其他有薪假明細','有薪假小計(hr)','待審核筆數','待審核時數(hr)',
      '平日1.34倍(hr)','平日1.67倍(hr)','單日超時日數','單日超時日期','休息日出勤(hr)','國定假日出勤(hr)','例假日出勤(hr)','總工時(hr)','平日加班上限是否超過','定位異常日數'];
    const rows = summary.map(e=>{
      const t = e.leaveByType || {};
      const occ = occasional(e);
      return [e.name,e.presentDays,e.lateCount,e.lateMinutes,e.earlyLeaveCount,e.earlyLeaveMinutes,
        e.personalLeave,e.sickLeave,e.familyCareLeave,e.menstrualLeave,e.disasterLeave,unpaidSum(e),
        n(t['特休']),n(t['補休']),occ.reduce((s,x)=>s+x.hours,0),occ.map(x=>x.type+' '+x.hours).join('、'),paidSum(e),
        e.pendingLeaveCount||0,e.pendingLeaveHours||0,
        e.otWeekday134,e.otWeekday167,e.dailyOtExceedDays.length,e.dailyOtExceedDays.join('、'),
        e.otRestDayHours,e.otHolidayHours,e.otMandatoryRestHours,e.workedHoursTotal,e.otCapExceeded?'是':'否',e.flaggedDays];
    });
    exportCSV(`出缺勤彙總_${month}.csv`, headers, rows);
  }
  async function doApply(){
    setApplying(true);
    try{ await onApply(); } finally { setApplying(false); }
  }

  return (
    <div>
      <div className="toolbar">
        <span className="grow"></span>
        <button className="ghost sm" onClick={doExportCSV}>匯出 CSV</button>
        <button onClick={doApply} disabled={applying || allLocked}
          title={allLocked ? '本月薪資已鎖定，時數不會被覆蓋。要修改請先到「薪資計算 / 明細」解鎖' : ''}>
          {applying?'套用中...':'套用出缺勤時數到薪資計算'}
        </button>
        {allLocked && <span className="hint" style={{fontSize:11.5}}>本月已鎖定</span>}
      </div>
      <div className="grp-bar">
        {[{k:'att',t:'出勤'},{k:'unpaid',t:'扣薪假'},{k:'paid',t:'有薪假'},{k:'ot',t:'加班'}].map(x=>(
          <button key={x.k} type="button" className={'grp-chip' + (g(x.k)?' on':'')} onClick={()=>toggleG(x.k)}>
            <span className="grp-dot"></span>{x.t}
          </button>
        ))}
        <span className="hint" style={{marginLeft:'auto', fontSize:11.5}}>點姓名展開該員工當月逐筆假單</span>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table className="sum-tbl">
            <thead>
              <tr>
                <th className="center" rowSpan="2">姓名</th>
                {g('att') && <th className="center grp-att" colSpan="5">出勤</th>}
                {g('unpaid') && <th className="center grp-un" colSpan="6">扣薪假（小時）</th>}
                {g('paid') && <th className="center grp-pd" colSpan="4">有薪假（小時）</th>}
                {g('ot') && <th className="center grp-ot" colSpan="7">加班（小時）</th>}
              </tr>
              <tr>
                {g('att') && <><th className="center">出勤日數</th><th className="center">遲到次數</th><th className="center">遲到分鐘</th><th className="center">早退次數</th><th className="center">早退分鐘</th></>}
                {g('unpaid') && <><th className="center">事假</th><th className="center">病假</th><th className="center">家庭照顧</th><th className="center">生理</th><th className="center">災防</th><th className="center">小計</th></>}
                {g('paid') && <><th className="center">特休</th><th className="center">補休</th><th className="center">其他有薪假</th><th className="center">小計</th></>}
                {g('ot') && <><th className="center">平日1.34</th><th className="center">平日1.67</th><th className="center">單日超時</th><th className="center">休息日</th><th className="center">國定假日</th><th className="center">例假日</th><th className="center">總工時</th></>}
              </tr>
            </thead>
            <tbody>
              {summary.map(e=>{
                const t = e.leaveByType || {};
                const occ = occasional(e);
                const detail = e.leaveDetail || [];
                const open = !!openRow[e.employeeId];
                const colCount = 1 + (g('att')?5:0) + (g('unpaid')?6:0) + (g('paid')?4:0) + (g('ot')?7:0);
                return (
                  <React.Fragment key={e.employeeId}>
                    <tr className={detail.length ? 'row-exp' : ''} onClick={detail.length ? (()=>toggleRow(e.employeeId)) : undefined}>
                      <td className="center emp-cell">
                        <b>{e.name}</b>
                        {detail.length > 0 && <span className={'exp-arrow' + (open?' open':'')}>›</span>}
                        {e.pendingLeaveCount > 0 && <span className="pend-badge" title={`待審核 ${trimNum(e.pendingLeaveHours,1)} 小時，未計入下方合計`}>待審 {e.pendingLeaveCount}</span>}
                      </td>
                      {g('att') && <>
                        <Z v={e.presentDays} /><Z v={e.lateCount} /><Z v={e.lateMinutes} /><Z v={e.earlyLeaveCount} /><Z v={e.earlyLeaveMinutes} />
                      </>}
                      {g('unpaid') && <>
                        <Z v={e.personalLeave} /><Z v={e.sickLeave} /><Z v={e.familyCareLeave} /><Z v={e.menstrualLeave} /><Z v={e.disasterLeave} />
                        <Z v={unpaidSum(e)} cls="col-sum" />
                      </>}
                      {g('paid') && <>
                        <Z v={t['特休']} /><Z v={t['補休']} />
                        <td className={'center ' + (occ.length?'':'zero-dim')}>
                          {occ.length ? occ.map(x=><span key={x.type} className="occ-tag">{x.type} {trimNum(x.hours,1)}</span>) : '0'}
                        </td>
                        <Z v={paidSum(e)} cls="col-sum" />
                      </>}
                      {g('ot') && <>
                        <td className={'center ' + (e.otCapExceeded?'flag':'') + (n(e.otWeekday134)===0?' zero-dim':'')}>{trimNum(e.otWeekday134,1)}</td>
                        <td className={'center ' + (e.otCapExceeded?'flag':'') + (n(e.otWeekday167)===0?' zero-dim':'')}>{trimNum(e.otWeekday167,1)}</td>
                        <td className={'center ' + (e.dailyOtWarning?'flag':'zero-dim')} title={e.dailyOtExceedDays.join('、')}>
                          {e.dailyOtWarning ? <><span className="material-icons" style={{fontSize:15, verticalAlign:'middle'}}>warning</span>{` ${e.dailyOtExceedDays.length} 日`}</> : '0'}
                        </td>
                        <td className={'center ' + (e.otRestDayHours>0 ? (e.otCapExceeded?'flag':'') : 'zero-dim')}>{trimNum(e.otRestDayHours,1)}</td>
                        <Z v={e.otHolidayHours} />
                        <td className={'center ' + (e.otMandatoryRestHours>0?'flag':'zero-dim')} onClick={ev=>ev.stopPropagation()}>
                          {trimNum(e.otMandatoryRestHours,1)}
                          {e.mandatoryRestDates.length>0 && (
                            <button className="ghost sm" style={{marginLeft:6, padding:'2px 6px', fontSize:11}} onClick={()=>setMakeupBox({employeeId:e.employeeId, name:e.name, dates:e.mandatoryRestDates, unresolvedDates:e.mandatoryRestUnresolvedDates})}>
                              {e.mandatoryRestWarning ? '待補假' : '已補假'}
                            </button>
                          )}
                        </td>
                        <Z v={e.workedHoursTotal} />
                      </>}
                    </tr>
                    {open && detail.length > 0 && (
                      <tr className="detail-row">
                        <td colSpan={colCount}>
                          <div className="lv-head">
                            <span>狀態</span><span>假別</span><span className="lv-hr">時數</span><span>日期／時段</span>
                          </div>
                          <div className="lv-list">
                            {detail.map(d=><LeaveDetailRow key={d.requestId} d={d} />)}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
              {summary.length===0 && <tr><td colSpan="23" className="hint" style={{textAlign:'center'}}>本月尚無資料</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      <div className="hint">
        依勞基法第24條分類計算：平日超時前2小時1.34倍、其後1.67倍；休息日與國定假日出勤時數已依日期自動分類。按「套用出缺勤時數到薪資計算」可直接把這些時數帶入「薪資計算 / 明細」頁籤，帶入後仍可手動調整，最後記得按「儲存薪資紀錄」。<br/>
        <span className="flag">紅字</span>代表該員工當月平日加班已超過設定的月上限，或有例假日出勤紀錄尚未完成補假登記，請優先確認合法性。
      </div>
      {makeupBox && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">event_repeat</span>{makeupBox.name} － 例假日補假登記</h3>
            <div className="hint" style={{marginBottom:10}}>依勞基法第40條，例假日出勤事後須完成補假，請登記每一日實際補假的日期。</div>
            <MakeupList employeeId={makeupBox.employeeId} dates={makeupBox.dates} onSaved={()=>{ load(); }}/>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setMakeupBox(null)}>關閉</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MakeupList({employeeId, dates, onSaved}){
  const [existing, setExisting] = useState(null);
  useEffect(()=>{
    apiGet('getMandatoryRestMakeups').then(list=>{
      const map = {};
      list.filter(m=>m.employeeId===employeeId).forEach(m=>{ map[m.workDate] = m.makeupDate || ''; });
      setExisting(map);
    }).catch(()=>setExisting({}));
  }, []);
  if(existing===null) return <div className="hint">載入中...</div>;
  return dates.map(d=>(
    <MakeupRow key={d} employeeId={employeeId} workDate={d} initialValue={existing[d] || ''} onSaved={onSaved}/>
  ));
}

function MakeupRow({employeeId, workDate, initialValue, onSaved}){
  const [makeupDate, setMakeupDate] = useState(initialValue || '');
  const [saving, setSaving] = useState(false);
  async function save(){
    setSaving(true);
    try{ await apiPost('registerMandatoryRestMakeup', {employeeId, workDate, makeupDate}); onSaved(); }
    catch(e){ alert(e.message); }
    finally{ setSaving(false); }
  }
  return (
    <div className="row-between" style={{marginBottom:8, gap:10}}>
      <div style={{fontSize:13, flexShrink:0}}>出勤日：{workDate}</div>
      <input type="date" value={makeupDate} onChange={e=>setMakeupDate(e.target.value)} style={{flex:1}} />
      <button onClick={save} disabled={saving}>{saving?'儲存中':'儲存'}</button>
    </div>
  );
}

/* 值為 0 時淡化顯示：整張表大多數格子都是 0，淡化後有值的格子才會跳出來 */
function NumCell({value, onChange, disabled}){
  const isZero = !Number(value);
  return <input type="number" value={value} disabled={disabled}
    style={isZero ? {opacity:.38} : {fontWeight:600}}
    onFocus={e=>e.target.select()}
    onChange={e=>onChange(Number(e.target.value))} />;
}

/* ========================= 薪資計算 / 明細總表 ========================= */
function PayrollTab({employees, rows, setEntry, month, loading, onApply, onUndoApply, onSave, dirty, saving, onEditEmployee, onReload, menstrualBaseline}){
  const [subTab, setSubTab] = useState('06');
  const [settleBox, setSettleBox] = useState(null); // {year, items, loading, saving}
  const [lockBox, setLockBox] = useState(null); // {items, loading, saving}
  const [resignRowBox, setResignRowBox] = useState(null); // {employeeId, name, loading, data}
  const [locking, setLocking] = useState(false);
  const [summary, setSummary] = useState([]);
  const [noteBox, setNoteBox] = useState(null); // {employeeId, field, value}
  const scrollRef = useRef(null);
  // 欄位群組收合：整張表 20 餘欄，多數月份只有少數群組有資料，預設只展開有值的群組
  const GROUPS = [
    {key:'allow', label:'津貼明細'},
    {key:'ot',    label:'加班時數'},
    {key:'bonus', label:'獎金'},
    {key:'leave', label:'請假時數'}
  ];
  const [openGroups, setOpenGroups] = useState(null);
  const groupCounts = useMemo(()=>{
    const c = {allow:0, ot:0, bonus:0, leave:0};
    rows.forEach(({emp, entry})=>{
      if(n(emp.mealAllowance)||n(emp.transportAllowance)||n(emp.positionAllowance)||n(emp.fullAttendanceBonus)) c.allow++;
      if(n(entry.otWeekday134)||n(entry.otWeekday167)||n(entry.otRestDayHours)||n(entry.otHolidayHours)) c.ot++;
      if(n(entry.festivalBonus)||n(entry.yearEndBonus)||n(entry.performanceBonus)||n(entry.otherBonus)) c.bonus++;
      if(n(entry.personalLeave)||n(entry.sickLeave)||n(entry.menstrualLeave)||n(entry.disasterLeave)||n(entry.familyCareLeave)) c.leave++;
    });
    return c;
  }, [rows]);
  useEffect(()=>{
    if(openGroups || !rows.length) return;
    setOpenGroups(GROUPS.filter(g=>groupCounts[g.key]>0).map(g=>g.key));
  }, [rows.length, groupCounts]);
  const shown = k => !openGroups || openGroups.indexOf(k) !== -1;
  // 本月是否已有任何輸入或鎖定紀錄，用來決定要不要顯示空狀態引導
  const hasAnyEntry = useMemo(()=> rows.some(({entry})=>
    entry.locked || Object.keys(entry).some(k=> typeof entry[k]==='number' && entry[k]!==0)
  ), [rows]);
  const toggleGroup = k => setOpenGroups(prev => {
    const cur = prev || GROUPS.map(g=>g.key);
    return cur.indexOf(k)===-1 ? cur.concat([k]) : cur.filter(x=>x!==k);
  });
  useEffect(()=>{ apiGet('getMonthlySummary', {month}).then(setSummary).catch(()=>{}); }, [month]);
  const summaryMap = useMemo(()=>{ const m={}; summary.forEach(s=>{ m[s.employeeId]=s; }); return m; }, [summary]);
  // 「系統實際算出的金額」對照：為 0 時不顯示，避免整張表被 200 多個「實際 0」灌滿
  function refBelow(v){
    if(v===undefined || v===null || !Number(v)) return null;
    return <div className="hint" style={{fontSize:10, marginTop:2, textAlign:'center', color:'var(--brand)'}}>＝{money(v)}</div>;
  }
  function scrollToStart(){ if(!scrollRef.current) return; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:0, behavior:'smooth'}); else scrollRef.current.scrollLeft = 0; }
  function scrollToEnd(){ if(!scrollRef.current) return; const w = scrollRef.current.scrollWidth; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:w, behavior:'smooth'}); else scrollRef.current.scrollLeft = w; }
  const totals = useMemo(()=>{
    const t = {base:0, overtime:0, allowance:0, bonus:0, payable:0, labor:0, health:0, leaveDeduct:0, otherDeduct:0, deduct:0, pay06:0, pay26:0, grand:0};
    rows.forEach(({emp, entry, calc})=>{
      t.base += calc.effBaseSalary;
      t.overtime += calc.overtimePay;
      t.allowance += calc.allowanceTotal;
      t.bonus += calc.bonusTotal;
      t.payable += calc.payableTotal;
      t.labor += calc.laborFee;
      t.health += calc.healthFee;
      t.leaveDeduct += calc.leaveDeduct;
      t.otherDeduct += n(entry.otherDeduction);
      t.deduct += calc.deductTotal;
      t.pay06 += calc.pay06;
      t.pay26 += calc.pay26;
      t.grand += calc.grandTotal;
    });
    return t;
  }, [rows]);

  const otCapAlerts = rows.filter(({calc})=>calc.monthlyOtHours > MONTHLY_OT_CAP_DEFAULT);
  const minWageAlerts = rows.filter(({calc})=>calc.belowMinWage);
  const restDayCapAlerts = rows.filter(({calc})=>calc.restDayOverCap);
  const sickCapAlerts = rows.filter(({calc})=>calc.sickCapExceeded);
  const allLocked = rows.length>0 && rows.every(({entry})=>entry.locked);
  const anyLocked = rows.some(({entry})=>entry.locked);

  async function openLockPreview(){
    setLockBox({items:null, loading:true, saving:false});
    try{
      const items = await apiGet('getPayrollLockPreview', {month});
      setLockBox({items, loading:false, saving:false});
    }catch(e){ alert(e.message); setLockBox(null); }
  }
  async function confirmLock(){
    const overrides = {};
    lockBox.items.forEach(it=>{ overrides[it.employeeId] = {laborFee: it.laborFee, healthFee: it.healthFee}; });
    setLockBox(prev=>({...prev, saving:true}));
    try{
      await apiPost('lockPayrollMonth', {month, overrides});
      setLockBox(null);
      await onReload();
      alert('本月薪資已鎖定，欄位改為唯讀。要修改需先按「解除鎖定」。');
    }catch(e){ alert(e.message); setLockBox(prev=>({...prev, saving:false})); }
  }
  async function doUnlock(){
    if(!confirm(
      `解除 ${month} 的鎖定\n\n` +
      '解除後這個月可以再編輯，但要注意：重新鎖定時，系統會用「員工主檔當下的薪資結構」重新產生快照。\n' +
      '若期間有人調薪或改過投保級距，這個月的歷史薪資條金額就會跟著變動。\n\n' +
      '確定要解除嗎？'
    )) return;
    setLocking(true);
    try{
      await apiPost('unlockPayrollMonth', {month});
      await onReload();
    }catch(e){ alert(e.message); } finally{ setLocking(false); }
  }

  async function openSettleEstimate(){
    const viewMonth = Number(String(month).split('-')[1]);
    let msg = '「結算試算」建議只在「年度終了」或「員工離職時」使用。\n\n其他時間使用，可能會把員工之後還會請的特休也一併結算掉，造成金額不準確。';
    if (viewMonth !== 12) {
      msg += `\n\n⚠ 目前試算的是 ${viewMonth} 月，不是年底（12月）。除非是要幫離職員工結算，否則請再次確認這個時機是否正確。`;
    }
    msg += '\n\n確定要繼續試算嗎？';
    if (!confirm(msg)) return;
    const year = String(new Date().getFullYear());
    setSettleBox({year, items:null, loading:true, saving:false});
    try{
      const data = await apiGet('getAnnualLeaveList', {year});
      const items = rows.map(({emp})=>{
        const grantedHours = data.granted[emp.id] ? data.granted[emp.id].hours : 0;
        const usedHours = data.used[emp.id] || 0;
        const rawHours = Math.round((grantedHours - usedHours) * 100) / 100;
        const overUsed = rawHours < 0;
        const remainHours = Math.max(0, rawHours);
        const wageBase = n(emp.baseSalary); // 本薪已包含4項津貼，不重複相加
        const hourly = wageBase > 0 ? wageBase/240 : 0;
        const amount = Math.round(remainHours * hourly);
        return {employeeId: emp.id, name: emp.name, remainHours, hourly: Math.round(hourly*100)/100, amount, overUsed, overHours: overUsed ? Math.abs(rawHours) : 0};
      });
      setSettleBox({year, items, loading:false, saving:false});
    }catch(e){ alert(e.message); setSettleBox(null); }
  }
  function applySettleEstimate(){
    settleBox.items.forEach(it=>{ setEntry(it.employeeId, {annualLeaveSettlement: it.amount}); });
    setSettleBox(null);
    alert('已套用特休結算金額，記得檢查後按「儲存薪資紀錄」。');
  }

  async function openResignRowSettle(emp){
    setResignRowBox({employeeId: emp.id, name: emp.name, loading:true, data:null});
    try{
      const data = await apiGet('calcResignationLeaveSettlement', {employeeId: emp.id, resignDate: emp.resignDate, baseOverride: emp.baseSalary});
      setResignRowBox({employeeId: emp.id, name: emp.name, loading:false, data});
    }catch(e){ alert(e.message); setResignRowBox(null); }
  }
  function applyResignRowSettle(){
    setEntry(resignRowBox.employeeId, {annualLeaveSettlement: resignRowBox.data.settlePay});
    setResignRowBox(null);
  }

  function doExport(){
    const headers = ['公司','部門','姓名','投保級距','本薪','平日加班費','休息日加班費','國定假日加班費','加班費合計','津貼合計','獎金合計','特休結算','應付小計','勞保自付','健保自付','請假扣款','其他扣款','應扣小計','06日應付','26日應付','應付總計'];
    const data = rows.map(({emp, entry, calc})=>[
      emp.company, emp.department, emp.name, emp.insuranceGrade, calc.effBaseSalary,
      Math.round(calc.weekdayOtPay), Math.round(calc.restDayPay), Math.round(calc.holidayPay), Math.round(calc.overtimePay),
      calc.allowanceTotal, calc.bonusTotal, n(entry.annualLeaveSettlement),
      Math.round(calc.payableTotal), calc.laborFee, calc.healthFee, Math.round(calc.leaveDeduct), n(entry.otherDeduction),
      Math.round(calc.deductTotal), Math.round(calc.pay06), Math.round(calc.pay26), Math.round(calc.grandTotal)
    ]);
    exportCSV(`薪資明細_${month}.csv`, headers, data);
  }

  return (
    <div>
      <div className="toolbar no-print">
        <div style={{display:'flex', gap:6}}>
          <button className={subTab==='06'?'':'ghost'} onClick={()=>setSubTab('06')}>06日明細</button>
          <button className={subTab==='26'?'':'ghost'} onClick={()=>setSubTab('26')}>26日明細</button>
          <button className={subTab==='all'?'':'ghost'} onClick={()=>setSubTab('all')}>整月總覽</button>
        </div>
        <span className="grow"></span>
        {allLocked ? (
          <>
            <span className="badge warn"><span className="material-icons" style={{fontSize:14}}>lock</span>本月已鎖定</span>
            <button className="danger sm" onClick={doUnlock} disabled={locking}>{locking?'處理中...':'解除鎖定'}</button>
          </>
        ) : (
          <button className="ghost sm" onClick={openLockPreview}><span className="material-icons" style={{fontSize:14}}>lock</span>鎖定本月</button>
        )}
        <button className="ghost sm" onClick={scrollToStart} title="跳到最左邊"><span className="material-icons" style={{fontSize:16}}>first_page</span></button>
        <button className="ghost sm" onClick={scrollToEnd} title="跳到最右邊看總計"><span className="material-icons" style={{fontSize:16}}>last_page</span></button>
        <button className="ghost sm" onClick={onApply} disabled={allLocked}>套用出缺勤時數</button>
        {onUndoApply && <button className="ghost sm" onClick={onUndoApply} title="回到套用前的數值，儲存後即失效"><span className="material-icons" style={{fontSize:14}}>undo</span>復原套用</button>}
        <button className="ghost sm" onClick={()=>window.print()}>列印本頁</button>
        <button className="ghost sm" onClick={doExport}>匯出 CSV</button>
        <button onClick={onSave} disabled={saving || !dirty || allLocked}
          style={dirty && !allLocked ? {position:'relative', boxShadow:'0 0 0 2px var(--danger)'} : null}
          title={dirty ? '有未儲存的變更' : ''}>
          {saving?'儲存中...':'儲存薪資紀錄'}
          {dirty && !allLocked && <span style={{position:'absolute', top:-4, right:-4, width:9, height:9, borderRadius:'50%', background:'var(--danger)', border:'2px solid #fff'}}></span>}
        </button>
      </div>
      <div className="toolbar no-print">
        <span className="hint">加班費依勞基法第24條分類計算：平日前2hr 1.34倍/其後1.67倍；休息日依4/8/12小時級距算1.34/1.67/2.67倍；國定假日加發一日工資（休息日出勤時數與平日加班合計列入每月46小時上限）。請假扣款：事假100%、病假50%、生理假（歷年制，每年前3 日全薪、第4 日起50%）、災防假100%（公司採不支薪，惟不影響全勤與考績）；病假與生理假(超過3 日部分)共用年度30 日上限，超過後不給薪</span>
      </div>

      {(otCapAlerts.length>0 || minWageAlerts.length>0 || restDayCapAlerts.length>0 || sickCapAlerts.length>0) && (
        <div className="card no-print" style={{borderColor:'var(--danger)', background:'#fdf2f0'}}>

                    <tr><td className="left">可結算日數</td><td><b>{resignRowBox.data.settleDays} 日</b>（{resignRowBox.data.settleHours} 小時）</td></tr>
                    <tr><td className="left">日薪基準</td><td>{money(resignRowBox.data.dailyWage)}</td></tr>
                    <tr><td className="left">結算金額</td><td><b>{money(resignRowBox.data.settlePay)}</b></td></tr>
                  </tbody>
                </table>
                {resignRowBox.data.overUsed && (
                  <div className="hint" style={{color:'var(--danger)', marginTop:8}}>⚠ 已超休 {resignRowBox.data.overDays} 日，依規定公司不能扣薪，結算金額以0計，僅提醒留意。</div>
                )}
              </div>
            )}
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setResignRowBox(null)}>取消</button>
              <button onClick={applyResignRowSettle} disabled={resignRowBox.loading || !resignRowBox.data}>帶入特休結算欄位</button>
            </div>
          </div>
        </div>
      )}

      {noteBox && (
        <div className="modal-bg">
          <div className="modal" style={{maxWidth:420}}>
            <h3><span className="material-icons">edit_note</span>{noteBox.label}：{noteBox.name}</h3>
            <textarea value={noteBox.value} onChange={e=>setNoteBox({...noteBox, value:e.target.value})} rows="3" placeholder="說明這筆金額的原因" style={{width:'100%', fontFamily:'inherit', fontSize:13, padding:8, borderRadius:6, border:'1px solid var(--line)'}}></textarea>

              <button onClick={()=>{ setEntry(noteBox.employeeId, {[noteBox.field]: noteBox.value}); setNoteBox(null); }}>確定</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function hrsLabel(hours){
  const h = Number(hours) || 0;
  if(h <= 0) return '';
  const days = Math.round((h/8)*10)/10;
  return `${h}小時（${days} 日）`;
}

function getActualPayDateJS(year, month, day, holidaySet){
  let d = new Date(year, month-1, day);
  while(true){
    const dow = d.getDay();
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(dow!==0 && dow!==6 && !holidaySet[dateStr]) return dateStr;
    d.setDate(d.getDate()-1);
  }
}
function PayslipTab({employees, payrollEntries, month, settings, menstrualBaseline}){
  const [selected, setSelected] = useState('all');
  const [holidays, setHolidays] = useState([]);
  const [hideZero, setHideZero] = useState(true);
  useEffect(()=>{ apiGet('getHolidays').then(setHolidays).catch(()=>{}); }, []);
  const holidaySet = {}; holidays.forEach(h=>{ if(h.type==='國定假日') holidaySet[h.date]=true; });
  const [py, pm] = month.split('-').map(Number);
  // 薪資於「次月」發放：計薪月份 2026-06 的實際發放日是 2026-07-06 與 2026-07-26（遇假日提前）。
  // 傳 pm + 1，12 月變 13 時 new Date 會自動進位成隔年 1 月，年度交界不需另外處理。
  const payDate06 = getActualPayDateJS(py, pm + 1, 6, holidaySet);
  const payDate26 = getActualPayDateJS(py, pm + 1, 26, holidaySet);
  const list = selected==='all' ? employees : employees.filter(e=>e.id===selected);
  return (
    <div>
      <div className="toolbar no-print">
        <label style={{marginBottom:0}}>選擇員工</label>
        <select value={selected} onChange={e=>setSelected(e.target.value)}>
          <option value="all">— 全部員工（可一次列印）—</option>
          {employees.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>
        <span className="grow"></span>
        <label style={{display:'flex', alignItems:'center', gap:6, marginBottom:0, fontWeight:400}}>
          <input type="checkbox" checked={hideZero} onChange={e=>setHideZero(e.target.checked)} style={{width:'auto'}} />
          隱藏金額為0的項目
        </label>
        <button className="ghost sm" onClick={()=>{
          const [yy,mo] = month.split('-');
          const who = selected==='all' ? '全部員工' : ((employees.find(e=>e.id===selected)||{}).name || '');
          printWithFilename(`${yy}年${mo}月份-薪資條-${who}`);
        }}>列印薪資條</button>
      </div>
      {list.length===0 && <div className="empty card">尚無員工資料</div>}
      {list.map(emp=>{
        const entry = payrollEntries[emp.id] || emptyEntry();
        const calc = calcForEmployee(emp, entry, settings, menstrualBaseline[emp.id]||{menstrual:0,sick:0}, month);
        return <Payslip key={emp.id} emp={emp} entry={entry} calc={calc} month={month} payDate06={payDate06} payDate26={payDate26} hideZero={hideZero} />;
      })}
    </div>
  );
}

function TransferTab({rows, month}){
  const [period, setPeriod] = useState('06');
  const [holidays, setHolidays] = useState([]);
  useEffect(()=>{ apiGet('getHolidays').then(setHolidays).catch(()=>{}); }, []);
  const byCompany = useMemo(()=>{
    const g = {};
    rows.forEach(r => { const key = r.emp.company||'其他'; (g[key] = g[key]||[]).push(r); });
    return g;
  }, [rows]);

  // 薪資是「次月」發放（6 日發正常薪資、26 日發業務獎金），遇假日往前提早。
  // 原本這裡只印「26日發放」，月份會被誤解成計薪月份，實際上 2026-06 是 2026-07-26 才發。
  const holidaySet = {}; holidays.forEach(h=>{ if(h.type==='國定假日') holidaySet[h.date]=true; });
  const [tpy, tpm] = month.split('-').map(Number);
  const payDate = getActualPayDateJS(tpy, tpm + 1, period==='06' ? 6 : 26, holidaySet);
  const payDateShort = payDate.replace(/^\d+-/,'').replace('-','/');

  function exportGroup(company, list){
    const headers = ['項次','姓名','銀行','帳號','金額','備註'];
    const data = list.map((r,idx)=>[idx+1, r.emp.name, r.emp.bankName, r.emp.bankAccount, Math.round(period==='06'?r.calc.pay06:r.calc.pay26), r.emp.note]);
    exportCSV(`匯款明細_${company}_${period}日_${month}.csv`, headers, data);
  }

  // 列印／另存 PDF：多數瀏覽器會拿 document.title 當預設檔名，
  // 列印前暫時換成「2026年06月份-匯款明細表-6號」，列印後還原。
  function printTransfer(){
    const [yy, mo] = month.split('-');
    const prevTitle = document.title;
    document.title = `${yy}年${mo}月份-匯款明細表-${Number(period)}號`;
    setTimeout(()=>{
      window.print();
      setTimeout(()=>{ document.title = prevTitle; }, 300);
    }, 60);
  }

  const companyEntries = Object.entries(byCompany).map(([company, list])=>{
    const active = list.filter(r => (period==='06'?r.calc.pay06:r.calc.pay26) !== 0);
    const total = active.reduce((s,r)=>s+(period==='06'?r.calc.pay06:r.calc.pay26),0);
    return {company, active, total};
  }).filter(g=>g.active.length>0);

  return (
    <div>
      <div className="toolbar no-print">
        <div style={{display:'flex', gap:6}}>
          <button className={period==='06'?'':'ghost'} onClick={()=>setPeriod('06')}>6號明細</button>
          <button className={period==='26'?'':'ghost'} onClick={()=>setPeriod('26')}>26號明細</button>
        </div>
        <span className="grow"></span>
        <span className="hint">依公司分組列出應匯款人員與帳號，金額為 0 者不列出。</span>
        <span className="badge" title="薪資為次月發放，遇假日往前提早">實際發放日 {payDate}</span>
        <button className="ghost sm" onClick={printTransfer}>列印 / 存 PDF</button>
      </div>

      {companyEntries.length===0 && <div className="empty card">本期尚無需匯款資料</div>}

      {companyEntries.map(({company, active, total})=>(
        <div className="card" key={company} style={{overflowX:'auto'}}>
          {/* 用 .card-head 而非 .toolbar：列印樣式會把 .toolbar 整個隱藏，
              先前公司標題印不出來就是這個原因 */}
          <div className="card-head">
            <h3 style={{margin:0}}>{company}</h3>
            <span className="grow"></span>
            <span className="hint no-print">{monthLabel(month)}薪資．{Number(period)}日批次．發放日 {payDateShort}．共 {active.length} 人</span>
            <button className="ghost sm no-print" onClick={()=>exportGroup(company, active)}>匯出 CSV</button>
          </div>
          {/* 列印專用的副標，畫面上不重複顯示 */}
          <div className="print-only" style={{fontSize:12, color:'#555', margin:'0 0 8px'}}>
            {monthLabel(month)}薪資　{Number(period)}日批次　實際發放日：{payDate}　（共 {active.length} 人）
          </div>
          <table style={{tableLayout:'fixed', width:'100%', minWidth:640}}>
            <colgroup>
              <col style={{width:'8%'}} /><col style={{width:'16%'}} /><col style={{width:'16%'}} />
              <col style={{width:'20%'}} /><col style={{width:'16%'}} /><col style={{width:'24%'}} />
            </colgroup>

/* ========================= 薪資印領清冊(全年度) ========================= */
const REGISTER_ROW_DEFS = [
  /* kind 決定左側色條與正負號：
       add  加項（綠條）
       cut  減項（紅條，金額前加負號）
       grand 實發總計（加框強調）
     原本所有項目平鋪，只靠「合計」列的粗體分段，讀的人要自己記住哪幾行要減；
     沒有負號時「應發 42,168、勞保 758」看起來像兩筆收入。 */
  {key:'base', label:'本薪', kind:'add', anchor:true},
  {key:'mealAllowance', label:'伙食津貼', kind:'add', indent:true},
  {key:'transportAllowance', label:'交通津貼', kind:'add', indent:true},
  {key:'positionAllowance', label:'職務加給', kind:'add', indent:true},
  {key:'fullAttendanceBonus', label:'全勤獎金', kind:'add', indent:true},
  {key:'overtimePay', label:'加班費', kind:'add'},
  {key:'bonusTotal', label:'獎金', kind:'add'},
  {key:'annualLeaveSettlement', label:'特休結算', kind:'add'},
  {key:'payableTotal', label:'應發合計', kind:'add', bold:true, sum:true},
  {key:'laborFee', label:'勞保費', kind:'cut'},
  {key:'healthFee', label:'健保費', kind:'cut'},
  {key:'leaveDeduct', label:'請假扣款', kind:'cut'},
  {key:'otherDeduction', label:'其他扣款', kind:'cut'},
  {key:'deductTotal', label:'應扣合計', kind:'cut', bold:true, sum:true},
  /* 26 日發放的項目逐項列出，不併成一筆「26日應發」——
     清冊是簽收憑證，員工要看得出這筆錢的名目。
     不另設「6日實發」列：那等於「應發合計 − 應扣合計」，讀表的人自己減得出來。
     整份的算式是：應發合計 − 應扣合計 ＋ 26 日各項 − 26日扣款 ＝ 實發總計 */
  {key:'businessExpense', label:'業務費用', kind:'add', indent:true},
  {key:'salesPerformance', label:'業績獎金', kind:'add', indent:true},
  {key:'salesBonus26', label:'其他獎金', kind:'add', indent:true},
  {key:'otherExpense26', label:'其他費用', kind:'add', indent:true},
  {key:'deduction26', label:'其他扣款', kind:'cut', indent:true},
  {key:'netPay', label:'實發總計', kind:'grand', bold:true}
];
function PayrollRegisterTab(){
  const [year, setYear] = useState(String(new Date().getFullYear()));
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [activeCompany, setActiveCompany] = useState(null);
  const scrollRef = useRef(null);
  // ⚠️ 這裡原本有一段從 PayrollTab 複製過來的「欄位群組收合」程式碼（GROUPS／groupCounts／
  //    openGroups／shown／toggleGroup／hasAnyEntry），但那段依賴 PayrollTab 的 `rows` prop，
  //    而本元件沒有 rows（資料來源是 data[activeCompany]），且整段在畫面裡從未被使用。
  //    結果是元件一初始化就 `rows is not defined`，整個後台變空白頁、只留 "Script error."
  //    （React 正式版會把細節藏起來，很難查）。2026-08-14 移除。
  //    複製元件邏輯時務必確認依賴的變數在新位置存在，不要只看語法過得去。
  function scrollToStart(){ if(!scrollRef.current) return; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:0, behavior:'smooth'}); else scrollRef.current.scrollLeft = 0; }
  function scrollToEnd(){ if(!scrollRef.current) return; const w = scrollRef.current.scrollWidth; if(scrollRef.current.scrollTo) scrollRef.current.scrollTo({left:w, behavior:'smooth'}); else scrollRef.current.scrollLeft = w; }

  function load(){
    setLoading(true);
    apiGet('getAnnualPayrollRegister', {year}).then(d=>{ setData(d); const keys=Object.keys(d||{}); setActiveCompany(prev=> prev && keys.includes(prev) ? prev : (keys[0]||null)); }).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(load, [year]);

  const years = [];
  const thisYear = new Date().getFullYear();
  for(let y = thisYear + 1; y >= thisYear - 2; y--) years.push(String(y));
  const companies = data ? Object.keys(data) : [];
  const list = (data && activeCompany) ? data[activeCompany] : [];

  return (
    <div>
      <div className="toolbar no-print">
        <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
          {companies.map(co=>(
            <button key={co} className={co===activeCompany?'':'ghost'} onClick={()=>setActiveCompany(co)}>{co}</button>
          ))}
        </div>
        <label style={{marginBottom:0}}>年度</label>
        <select value={year} onChange={e=>setYear(e.target.value)}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        <span className="grow"></span>
        <button className="ghost sm" onClick={scrollToStart} title="跳到最左邊"><span className="material-icons" style={{fontSize:16}}>first_page</span></button>
        <button className="ghost sm" onClick={scrollToEnd} title="跳到最右邊看全年合計"><span className="material-icons" style={{fontSize:16}}>last_page</span></button>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
        <button className="ghost sm" onClick={()=>printWithFilename(`${year}年度-薪資印領清冊-${activeCompany||''}`)}>列印本頁</button>
      </div>
      {loading ? <div className="hint">載入中...</div> : !data || companies.length===0 ? <div className="empty card">尚無資料</div> : (
          /* 每位員工一張獨立卡片。列印本來就是一人一頁，畫面卻擠成連續的一張大表，
             兩邊的心智模型不一致；分成卡片之後，畫面上看到的區塊就等於印出來的頁。
             ⚠️ 公司名與法源說明必須放在「每一張卡片裡」，不能只放在最上面一次 ——
             那樣列印時它會自己佔掉第一頁，而後面每一頁都看不出是哪家公司的清冊。 */
          <div ref={scrollRef}>
            {list.map(emp=>(
              <div className="card reg-card" key={emp.employeeId} style={{overflowX:'auto'}}>
                <div className="reg-head">
                  <div className="reg-head-title">
                    <b>{activeCompany}</b>
                    <span>{year} 年度薪資印領清冊</span>
                  </div>
                  <div className="reg-head-law">
                    依勞基法第 23 條規定製作，記載工資總額、各項目金額、扣除項目金額與實發金額，須保存 5 年。每人每月留一欄供簽名或蓋章確認領取。
                  </div>
                </div>
                <table className="reg-table" style={{minWidth:1500}}>
              <tbody>
                {[emp].map(emp=>{
                  const regRows = [
                    {type:'emp'},
                    {type:'header'},
                    {type:'caption'},
                    ...REGISTER_ROW_DEFS.map(def=>({type:'data', def})),
                    {type:'signature'}
                  ];
                  return (
                    <React.Fragment key={emp.employeeId}>
                      {regRows.map((row,idx)=>{
                        /* 員工資料改成橫幅（見下方 type==='emp' 的那一列），不再佔用左側整欄。
                           原本那格約 40mm 寬卻只有中間幾行字，而簽名欄要求每格至少 2×2cm ——
                           橫式 A4 可用寬度 285mm，12 個月各 20mm 就要 240mm，
                           再加項目欄與全年合計已經 282mm，留不下 40mm 給姓名欄。 */
                        const nameCell = null;
                        if(row.type==='emp'){
                          return (
                            /* emp-start：列印時每位員工從新的一頁開始 */
                            <tr key="emp" className="emp-start">
                              <td className="reg-emp-bar" colSpan={14}>
                                <span className="nm">{emp.name}</span>
                                <span className="f"><b>身分證字號</b>{emp.nationalId || '未填寫'}</span>
                                <span className="f"><b>戶籍地</b>{emp.householdAddress || '未填寫'}</span>
                              </td>
                            </tr>
                          );
                        }
                        if(row.type==='header'){
                          return (
                            /* emp-start：列印時每位員工從新的一頁開始（見 @media print）。
                               一人一頁的好處是每個人簽自己那張、發放時不會看到同事的薪資；
                               更重要的是保證「一個人的資料不會被切成兩頁」——
                               靠「剛好放不下」自然分頁是不可靠的，字級一改就會切開。 */
                            <tr key="header">
                              {nameCell}
                              <th className="left reg-freeze-2" style={{minWidth:90}}>項目</th>
                              {/* 尚未結算的月份標題也淡化，一眼看得出這一整欄都還沒發生 */}
                              {Array.from({length:12},(_,i)=>i+1).map(m=>{
                                const settled = emp.monthly[m-1] && emp.monthly[m-1].hasEntry !== false;
                                return <th key={m} className={settled?'':'reg-empty'}>{m}月</th>;
                              })}
                              <th className="reg-ytd">全年合計</th>
                            </tr>
                          );
                        }
                        if(row.type==='caption'){
                          return (
                            <tr key="caption">
                              {nameCell}
                              <td className="reg-freeze-2"></td>
                              <td colSpan="13" className="left hint" style={{fontSize:11, paddingLeft:20}}>以下為本薪內含明細，僅供對照，不另外加總</td>
                            </tr>
                          );
                        }
                        if(row.type==='signature'){
                          return (
                            <tr key="signature">
                              {nameCell}
                              <td className="left reg-freeze-2">簽名/蓋章</td>
                              {/* 簽名／蓋章每格至少 2×2cm：印章直徑常見 1.5～2cm，
                                     格子小於印章就蓋不進去。寬度由 colgroup 控制，這裡定高度。 */}
                              {Array.from({length:12},(_,i)=><td key={i} className="sig-cell"></td>)}
                              <td className="reg-ytd sig-cell"></td>
                            </tr>
                          );
                        }
                        const def = row.def;
                        /* 減項的金額前面加負號。清冊是給人驗算的，符號本身就是資訊 ——
                           沒有負號時「應發 42,168、勞保 758」看起來像兩筆收入。0 不加負號。 */
                        const fmt = v => (def.kind==='cut' && n(v) !== 0) ? '−' + money(v) : money(v);
                        /* 真的 0 淡化：這張表有大量 0，滿版黑字會搶走注意力。
                           但不能留白 —— 留白會讓人以為漏填。 */
                        const zc = v => n(v)===0 ? ' reg-zero' : '';
                        const rowCls = [
                          'reg-row',
                          def.kind ? 'k-'+def.kind : '',
                          def.indent ? 'reg-ind' : '',
                          def.sum ? 'reg-sum' : ''
                        ].filter(Boolean).join(' ');
                        return (
                          <tr key={def.key} className={rowCls}>
                            {nameCell}
                            <td className="left reg-freeze-2">{def.label}</td>
                            {emp.monthly.map(mo=>(
                              /* 尚未結算的月份顯示「—」而不是 0。印領清冊記載的是「實際發放」的
                                 工資（勞基法第 23 條），0 代表「有發薪、金額為零」，是不實記載 */
                              mo.hasEntry === false ? (
                                <td key={mo.month} className="reg-empty" title="本月尚無薪資紀錄，未列入全年合計">—</td>
                              ) : (
                                <td key={mo.month} className={zc(mo[def.key])}>{fmt(mo[def.key])}</td>
                              )
                            ))}
                            <td className={'reg-ytd' + zc(emp.yearTotal[def.key])}>{fmt(emp.yearTotal[def.key])}</td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </tbody>
                </table>
              </div>
            ))}
          </div>
      )}
    </div>
  );
}

function CompanyTab(){
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [isNew, setIsNew] = useState(false);

  function load(){ setLoading(true); apiGet('getCompanies').then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false)); }
  useEffect(load, []);

  function openNew(){ setEditing({id:null, name:'', taxId:'', address:'', owner:'', phone:'', excludeFromStats:false}); setIsNew(true); }
  function openEdit(c){ setEditing({...c}); setIsNew(false); }
  async function save(){
    if(!editing.name.trim()){ alert('請輸入公司名稱'); return; }
    try{
      if(isNew) await apiPost('addCompany', editing);
      else await apiPost('updateCompany', editing);
      setEditing(null); load();
    }catch(e){ alert(e.message); }
  }
  async function remove(id){
    if(!confirm('確定刪除這間公司？（若仍有員工使用會無法刪除）')) return;
    try{ await apiPost('deleteCompany', {id}); load(); }catch(e){ alert(e.message); }
  }

  return (
    <div>
      <div className="toolbar">
        <button onClick={openNew}><span className="material-icons">add_business</span>新增公司</button>
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{minWidth:800}}>
            <thead><tr><th className="left">公司名稱</th><th className="left">統一編號</th><th className="left">地址</th><th className="left">負責人</th><th className="left">電話</th><th>操作</th></tr></thead>
            <tbody>
              {list.map(c=>(
                <tr key={c.id}>
                  <td className="left"><b>{c.name}</b>{c.excludeFromStats && <span className="badge warn" style={{marginLeft:6}}>不列入統計</span>}</td>
                  <td className="left mono">{c.taxId}</td>
                  <td className="left">{c.address}</td>
                  <td className="left">{c.owner}</td>
                  <td className="left">{c.phone}</td>
                  <td><button className="ghost sm" onClick={()=>openEdit(c)}>編輯</button>{' '}<button className="danger sm" onClick={()=>remove(c.id)}>刪除</button></td>
                </tr>
              ))}
              {list.length===0 && <tr><td colSpan="6" className="hint" style={{textAlign:'center'}}>尚無公司資料</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {editing && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">business</span>{isNew?'新增公司':'編輯公司'}</h3>
            <div className="grid-2">
              <div className="field"><label>公司名稱 *</label><input value={editing.name} onChange={e=>setEditing({...editing,name:e.target.value})} /></div>
              <div className="field"><label>統一編號</label><input value={editing.taxId} onChange={e=>setEditing({...editing,taxId:e.target.value})} /></div>
              <div className="field"><label>負責人</label><input value={editing.owner} onChange={e=>setEditing({...editing,owner:e.target.value})} /></div>
              <div className="field"><label>電話</label><input value={editing.phone} onChange={e=>setEditing({...editing,phone:e.target.value})} /></div>
            </div>
            <div className="field"><label>地址</label><input value={editing.address} onChange={e=>setEditing({...editing,address:e.target.value})} style={{width:'100%'}} /></div>
            <div className="field"><label>顯示名稱（選填）</label><input value={editing.displayName||''} onChange={e=>setEditing({...editing,displayName:e.target.value})} style={{width:'100%'}} placeholder="例如：mammyshop 媽咪小站" /></div>
            <div className="hint" style={{marginTop:-8, marginBottom:10}}>這間公司的員工登入前台，首頁上方會顯示這個名稱；沒填的話會顯示系統設定裡的預設名稱。</div>
            <label style={{display:'flex', alignItems:'center', gap:6, fontSize:13, color:'var(--ink)', marginTop:10}}>
              <input type="checkbox" checked={!!editing.excludeFromStats} onChange={e=>setEditing({...editing, excludeFromStats:e.target.checked})} style={{width:'auto'}} />不列入儀表板統計
            </label>
            <div className="hint" style={{marginTop:4}}>勾選後，這間公司底下的員工不會算進總覽頁的在職員工數、打卡狀況、部門數等任何數字（適合用於測試/停用中的公司）。</div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setEditing(null)}>取消</button><button onClick={save}>儲存</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 班別設定 ========================= */
function ShiftTab({employees}){
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(null);
  const [isNew, setIsNew] = useState(false);

  function load(){ setLoading(true); apiGet('getShifts').then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false)); }
  useEffect(load, []);

  function openNew(){ setEditing({id:null, name:'', workStart:'09:00', workEnd:'18:00', lunchBreak:60}); setIsNew(true); }
  function openEdit(s){ setEditing({...s}); setIsNew(false); }
  async function save(){
    if(!editing.name.trim()){ alert('請輸入班別名稱'); return; }
    try{
      if(isNew) await apiPost('addShift', editing);
      else await apiPost('updateShift', editing);
      setEditing(null); load();
    }catch(e){ alert(e.message); }
  }
  async function remove(id){
    if(!confirm('確定刪除這個班別？（若仍有員工使用會無法刪除）')) return;
    try{ await apiPost('deleteShift', {id}); load(); }catch(e){ alert(e.message); }
  }
  function countEmp(id){ return employees.filter(e=>e.shiftId===id).length; }

  return (
    <div>
      <div className="toolbar">
        <button onClick={openNew}><span className="material-icons">add</span>新增班別</button>
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>目前每位員工固定對應一種班別；每天輪班不同班別的排班表功能之後有需要再開發。</div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table style={{minWidth:600}}>
            <thead><tr><th className="left">班別名稱</th><th>上班時間</th><th>下班時間</th><th>午休扣除(分)</th><th>使用人數</th><th>操作</th></tr></thead>
            <tbody>
              {list.map(s=>(
                <tr key={s.id}>
                  <td className="left"><b>{s.name}</b></td>
                  <td>{s.workStart}</td><td>{s.workEnd}</td><td>{s.lunchBreak}</td>
                  <td>{countEmp(s.id)}</td>
                  <td><button className="ghost sm" onClick={()=>openEdit(s)}>編輯</button>{' '}<button className="danger sm" onClick={()=>remove(s.id)}>刪除</button></td>
                </tr>
              ))}
              {list.length===0 && <tr><td colSpan="6" className="hint" style={{textAlign:'center'}}>尚無班別，未指定班別的員工會套用「系統設定」裡的預設班表</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {editing && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">schedule_send</span>{isNew?'新增班別':'編輯班別'}</h3>
            <div className="field"><label>班別名稱 *</label><input value={editing.name} onChange={e=>setEditing({...editing,name:e.target.value})} placeholder="例：早班" /></div>
            <div className="grid-2">
              <div className="field"><label>上班時間</label><input type="time" value={editing.workStart} onChange={e=>setEditing({...editing,workStart:e.target.value})} /></div>
              <div className="field"><label>下班時間</label><input type="time" value={editing.workEnd} onChange={e=>setEditing({...editing,workEnd:e.target.value})} /></div>
              <div className="field"><label>午休扣除（分鐘）</label><input type="number" value={editing.lunchBreak} onChange={e=>setEditing({...editing,lunchBreak:Number(e.target.value)})} /></div>
            </div>
            <div className="modal-actions"><button className="ghost" onClick={()=>setEditing(null)}>取消</button><button onClick={save}>儲存</button></div>
          </div>
        </div>
      )}

  );
}

/* ========================= 公司休假設定 ========================= */
function HolidaysTab(){

  useEffect(load, []);

  async function add(){
    if(!form.date){ alert('請選擇日期'); return; }
    try{ await apiPost('addHoliday', form); setForm({date:'',name:'',type:'國定假日'}); load(); }
    catch(e){ alert(e.message); }
  }
  async function remove(date){
    try{ await apiPost('deleteHoliday', {date}); load(); }catch(e){ alert(e.message); }

        {loading ? <div className="hint">載入中...</div> : (
          <table style={{minWidth:500}}>
            <thead><tr><th className="left">日期</th><th className="left">名稱</th><th className="left">類型</th><th>操作</th></tr></thead>

}

/* ========================= 假單審核 ========================= */
function RequestsTab({month, employees}){
  const [list, setList] = useState([]);
  // 申請單本身沒有存員工類型，用員工ID對照員工主檔取得（避免另外打一支 API）
  const empTypeById = useMemo(()=>{
    const m = {};
    (employees||[]).forEach(e=>{ m[e.id] = e.employeeType || '正式員工'; });
    return m;
  }, [employees]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('');
  const [empFilter, setEmpFilter] = useState('');
  const [reviewBox, setReviewBox] = useState(null);
  const [busy, setBusy] = useState(false);

  function load(){
    setLoading(true);
    apiGet('listAllRequests', {month, status: statusFilter}).then(setList).catch(e=>alert(e.message)).finally(()=>setLoading(false));
  }
  useEffect(()=>{ setEmpFilter(''); load(); }, [month, statusFilter]);

  async function doReview(){
    setBusy(true);
    try{
      const result = await apiPost(reviewBox.mode==='approve'?'approveRequest':'rejectRequest', {id: reviewBox.req.id, comment: reviewBox.comment||''});
      setReviewBox(null); load();
      if(result && result.warning) alert(result.warning);
    }catch(e){ alert(e.message); }
    finally{ setBusy(false); }
  }
  const STATUS_BADGE = {'待審核':'warn', '初核通過':'warn', '已核准':'', '已駁回':'warn', '已取消':''};

  // 員工篩選在前端做：資料本來就都在手上，不必為了篩選再打一次 API（省一趟往返）
  const shownList = useMemo(
    () => empFilter ? list.filter(r => r.employeeId === empFilter) : list,
    [list, empFilter]
  );
  // 下拉只列出本月真的有申請單的人，避免一長串沒資料的名字
  const empOptions = useMemo(() => {
    const seen = new Map();
    list.forEach(r => { if(r.employeeId && !seen.has(r.employeeId)) seen.set(r.employeeId, r.name); });
    return [...seen.entries()].map(([id, name]) => ({id, name}));
  }, [list]);

  return (
    <div>
      <div className="toolbar">
        <label style={{marginBottom:0}}>狀態</label>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="">全部</option>
          <option value="待審核">待審核（等主管初核）</option>
          <option value="初核通過">初核通過（等我複核）</option>
          <option value="已核准">已核准</option>
          <option value="已駁回">已駁回</option>
          <option value="已取消">已取消</option>
        </select>
        <label style={{marginBottom:0, marginLeft:10}}>員工</label>
        <select value={empFilter} onChange={e=>setEmpFilter(e.target.value)}>
          <option value="">全部（{list.length} 筆）</option>
          {empOptions.map(o=><option key={o.id} value={o.id}>{o.name}</option>)}
        </select>
        {empFilter && <button className="ghost sm" onClick={()=>setEmpFilter('')}>清除</button>}
        <span className="grow"></span>
        <button className="ghost sm" onClick={load}><span className="material-icons" style={{fontSize:15}}>refresh</span>重新整理</button>
      </div>
      <div className="hint" style={{marginBottom:12}}>員工的請假與加班換補休申請。部門主管可在前台審核；你也可以在此直接核准或駁回（含沒有設定主管的部門）。</div>
      <div className="card" style={{overflowX:'auto'}}>
        {loading ? <div className="hint">載入中...</div> : (
          <table>
            <thead><tr><th className="center">姓名</th><th className="center">員工類型</th><th className="center">類型</th><th className="center">假別</th><th className="center">起訖 / 加班日期</th><th className="center">時數</th><th className="center">代理人</th><th className="center">事由</th><th className="center">附件</th><th className="center">狀態</th><th className="center">審核人</th><th className="center">操作</th></tr></thead>
            <tbody>
              {shownList.map(r=>(
                <tr key={r.id}>
                  <td className="center"><b>{r.name}</b></td>
                  <td className="center">{(()=>{ const t = empTypeById[r.employeeId] || '—';
                    return t === '正式員工' ? <span className="hint">{t}</span> : <span className="badge warn">{t}</span>; })()}</td>
                  <td className="center">{r.type}</td>
                  <td className="center">{r.leaveType || '-'}</td>
                  <td className="center">{r.type==='請假' ? (withWeekday(r.startTime) + ' ~ ' + withWeekday(r.endTime)) : withWeekday(String(r.startTime).split(' ')[0])}</td>
                  <td className="center">{r.hours}</td>
                  <td className="center">{r.delegateName || '-'}</td>
                  <td className="center">{r.reason}</td>
                  <td className="center">{r.attachmentUrl ? <a href={r.attachmentUrl} target="_blank" rel="noopener"><span className="material-icons" style={{fontSize:18}}>attachment</span></a> : '-'}</td>
                  <td className="center">{(r.status==='待審核'||r.status==='初核通過') ? <span className="badge warn">{r.status}</span> : <span className="badge">{r.status}</span>}</td>
                  <td className="center">{r.reviewer}{r.reviewComment ? '（'+r.reviewComment+'）' : ''}</td>
                  <td className="center">
                    {(r.status==='待審核' || r.status==='初核通過') && (
                      <>
                        {/* 管理者核「待審核」等於一次完成兩段；核「初核通過」則是第二關定案 */}
                        <button className="ghost sm" onClick={()=>setReviewBox({req:r, mode:'approve', comment:''})}>
                          {r.status==='初核通過' ? '確認核准' : '核准'}
                        </button>{' '}
                        <button className="danger sm" onClick={()=>setReviewBox({req:r, mode:'reject', comment:''})}>駁回</button>
                      </>
                    )}
                  </td>
                </tr>
              ))}
              {shownList.length===0 && <tr><td colSpan="12" className="hint" style={{textAlign:'center'}}>{list.length===0 ? '本月尚無申請單' : '這位員工本月沒有符合條件的申請單'}</td></tr>}
            </tbody>
          </table>
        )}
      </div>
      {reviewBox && (
        <div className="modal-bg">
          <div className="modal" style={{width:420}}>
            <h3><span className="material-icons">{reviewBox.mode==='approve'?'check_circle':'cancel'}</span>{reviewBox.mode==='approve'?'核准':'駁回'}：{reviewBox.req.name} 的{reviewBox.req.type==='請假'?reviewBox.req.leaveType:'加班換補休'}</h3>
            {reviewBox.req.attachmentUrl && <div className="hint" style={{marginBottom:8}}><a href={reviewBox.req.attachmentUrl} target="_blank" rel="noopener">查看附件</a></div>}
            <div className="field"><label>審核意見（選填）</label><input value={reviewBox.comment} onChange={e=>setReviewBox({...reviewBox, comment:e.target.value})} style={{width:'100%'}} /></div>
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setReviewBox(null)}>取消</button>
              <button onClick={doReview} disabled={busy}>{busy?'處理中...':'確認'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
