<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>後台管理 · 出缺勤與薪資系統</title>
<link rel="icon" id="favicon-link" href="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --ink:#22242C; --paper:#F2F2F2; --paper-2:#ffffff; --line:#DCDCDC;
    --brand:#00ADB5; --brand-dark:#222831; --accent:#00ADB5; --danger:#a13d3d; --muted:#6D7278;
    --income:#00858C; --outcome:#a13d3d;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Noto Sans TC',sans-serif; font-size:14px;}
  h1,h2,h3{font-family:'Noto Sans TC',sans-serif; font-weight:700; margin:0 0 6px 0;}
  .mono{font-family:'Roboto Mono',monospace;}
  .material-icons{font-size:19px; vertical-align:middle; line-height:1;}
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{width:212px; flex-shrink:0; background:var(--brand-dark); color:#EEEEEE; padding:22px 0; display:flex; flex-direction:column;}
  .brand{padding:0 18px 18px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:10px;}
  .brand .mark{font-family:'Noto Sans TC',sans-serif; font-size:19px; font-weight:700; color:#f3ead3;}
  .brand .sub{font-size:11px; color:#b9c9bf; margin-top:2px;}
  .navitem{padding:10px 18px; cursor:pointer; font-size:13px; border-left:3px solid transparent; color:#d9dfd5; display:flex; align-items:center; gap:9px;}
  .navitem:hover{background:rgba(255,255,255,.06);}
  .navitem.active{background:rgba(255,255,255,.1); border-left-color:var(--accent); color:#fff; font-weight:700;}
  .navitem .material-icons{font-size:18px; color:#A6ACB3;}
  .navitem.active .material-icons{color:var(--accent);}
  .nav-group-label{padding:14px 18px 4px 18px; font-size:10.5px; letter-spacing:1px; color:#8fa397; text-transform:uppercase;}
  .sidebar{transition:width .18s ease;}
  .sidebar.collapsed{width:64px;}
  .sidebar.collapsed .navitem{justify-content:center; padding:12px 0; gap:0;}
  .sidebar.collapsed .navitem .material-icons{font-size:21px;}
  .main{flex:1; min-width:0;}
  .topbar{background:var(--paper-2); border-bottom:1px solid var(--line); padding:12px 26px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .topbar h1{font-size:17px; display:flex; align-items:center; gap:8px;}
  .content{padding:22px 26px 60px 26px; overflow-x:auto;}
  button{font-size:13px; background:var(--brand); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  button:hover{background:var(--brand-dark);}
  button.ghost{background:transparent; color:var(--brand); border:1px solid var(--brand);}
  button.ghost:hover{background:var(--brand); color:#fff;}
  button.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
  button.danger:hover{background:var(--danger); color:#fff;}
  button.sm{padding:4px 9px; font-size:12px;}
  button.icon-btn{background:transparent; color:var(--muted); padding:5px; border-radius:50%;}
  button.icon-btn:hover{background:#EDEDED; color:var(--brand-dark);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  input,select{font-size:13px; border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:#fff; color:var(--ink);}
  input[type=number]{font-family:'Roboto Mono',monospace;}
  input[type=date]::-webkit-calendar-picker-indicator{ margin-right:2px; padding:3px; }
  label{font-size:12px; color:var(--muted); display:block; margin-bottom:3px;}
  .field{margin-bottom:10px;}
  .field>input,.field>select{width:100%; box-sizing:border-box;}
  table{border-collapse:collapse; width:100%; background:var(--paper-2); font-size:12.5px;}
  thead{position:sticky; top:0; z-index:2;}
  th,td{border:1px solid var(--line); padding:6px 8px; text-align:right; white-space:nowrap;}
  th{background:#EDEDED; color:var(--brand-dark); text-align:center;}
  td.left,th.left{text-align:left;}
  td.center,th.center{text-align:center;}
  td input[type=number]{width:64px; text-align:right; padding:4px 5px;}
  tr.total-row td{background:#EDEDED; font-weight:700;}
  .num-pos{color:var(--income);}
  .num-neg{color:var(--outcome);}
  .freeze-1, .freeze-2{ position:sticky; z-index:3; background:#F2F0E8; }
  .freeze-1{ left:0; min-width:85px; }
  .freeze-2{ left:85px; min-width:80px; border-right:2px solid var(--brand); }
  th.freeze-1, th.freeze-2{ z-index:4; background:#EDEDED; }
  tr.total-row .freeze-1, tr.total-row .freeze-2{ background:#EDEDED; }
  /* 尚未結算月份的儲存格：淡灰破折號，跟真的 0 明顯不同 */
  .reg-empty{ color:#B8BDC4 !important; font-weight:400 !important; }
  /* 員工資料橫幅：跨整個表寬的一列，取代原本佔掉 40mm 的左側欄位。
     資訊橫向排列，該有的都在，卻不吃掉數字欄的寬度。 */
  .reg-emp-bar{ background:#F2F0E8; text-align:left !important; padding:8px 12px !important;
                white-space:normal; }
  .reg-emp-bar .nm{ font-size:15px; font-weight:700; letter-spacing:.02em; margin-right:10px; }
  .reg-emp-bar .dp{ font-size:11.5px; color:var(--muted); margin-right:18px; }
  .reg-emp-bar .f{ font-size:11px; color:var(--ink); margin-right:18px; white-space:nowrap;
                   font-variant-numeric:tabular-nums; }
  .reg-emp-bar .f b{ color:var(--muted); font-weight:700; font-size:9.5px;
                     letter-spacing:.06em; margin-right:5px; }
  /* 簽名／蓋章：印章直徑常見 1.5～2cm，格子小於印章就蓋不進去 */
  .sig-cell{ height:20mm; min-width:20mm; }

  /* 每位員工一張卡片，畫面上的區塊 = 印出來的一頁 */
  .reg-card{ margin-bottom:18px; padding:0; }
  /* 抬頭放在每張卡片裡：列印時每一頁都要看得出是哪家公司、哪個年度的清冊 */
  .reg-head{ padding:10px 14px 8px; border-bottom:1px solid var(--line); }
  .reg-head-title{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .reg-head-title b{ font-size:15px; font-weight:700; }
  .reg-head-title span{ font-size:12px; color:var(--muted); }
  .reg-head-law{ margin-top:3px; font-size:10.5px; color:var(--muted); line-height:1.6; }
  .reg-card:last-child{ margin-bottom:0; }

  /* 加項綠條、減項紅條。原本所有項目平鋪，只靠「合計」列的粗體分段，
     讀的人要自己記住哪幾行是要減的。 */
  .reg-table td.reg-freeze-2{ position:relative; }
  .reg-row.k-add td.reg-freeze-2::before,
  .reg-row.k-cut td.reg-freeze-2::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .reg-row.k-add td.reg-freeze-2::before{ background:#2f7d4f; opacity:.5; }
  .reg-row.k-cut td.reg-freeze-2::before{ background:var(--danger); opacity:.5; }
  .reg-row.k-add > td{ background:rgba(47,125,79,.05); }
  .reg-row.k-cut > td{ background:rgba(161,61,61,.05); }
  .reg-row td.reg-freeze-2{ padding-left:12px; }
  .reg-row.reg-ind td.reg-freeze-2{ padding-left:32px; color:var(--muted); font-size:11px; }
  .reg-row.reg-ind > td{ font-size:11px; color:var(--muted); }
  /* 框線一律 1px，層次只用「顏色深淺」表現。
     先前一般格線 1px 淺灰、分區線 2px 亮青，粗細落差太大，畫面很跳；
     同一張表裡出現多種線寬本來就不容易收乾淨。 */
  .reg-row.reg-sum > td{ font-weight:700; border-top:1px solid #9AA1A8; }
  /* 整張表最重要的數字，原本只是粗體，翻頁核對時要逐行找 */
  .reg-row.k-grand > td{ font-weight:800; background:rgba(0,173,181,.10); color:#00767C;
                         border-top:1px solid var(--brand); border-bottom:1px solid var(--brand); }
  /* 真的 0 淡化：滿版黑字會搶走注意力。但不能留白 —— 留白會讓人以為漏填 */
  .reg-table td.reg-zero{ color:#A8AEB5; }
  /* 全年合計獨立於各月，用較重的分隔線切開 */
  .reg-table th, .reg-table td{ border:1px solid #DCDCDC; }
  .reg-table .reg-ytd{ border-left:1px solid #9AA1A8 !important; font-weight:700; }
  .build-tag{ margin-top:8px; text-align:center; font-size:10.5px; color:#6D7278;
              cursor:pointer; letter-spacing:.04em; }
  .build-tag:hover{ color:#00ADB5; text-decoration:underline; }
  /* 只剩「項目」欄需要凍結（姓名欄已改成橫幅）。
     ⚠️ 這裡的 left 偏移必須是 0：先前是 150px，用來讓開姓名欄；
     姓名欄拿掉後那 150px 就變成最左邊一整欄空白，還把 1 月推到底下蓋住。 */
  .reg-freeze-2{ position:sticky; left:0; z-index:3; background:#F2F0E8; }
  /* ⚠️ 不要再加 border-top:none / border-bottom:none。
     那是「姓名欄還沒合併」時代的殘留：當時每一列都輸出一格，要藏掉它們之間的橫線
     才能看起來像一整格。改用 rowSpan 真正合併之後，這兩行反而讓整塊的上下邊界消失，
     列印出來每位員工區塊的左上／左下角是開口的。 */
  .reg-freeze-2{ min-width:96px; border-right:1px solid #9AA1A8; }
  th.reg-freeze-2{ z-index:4; background:#EDEDED; }
  .col-add{background:#EAF6ED;}
  .col-deduct{background:#FBEDEA;}
  .col-result{background:#FBF3D9; font-weight:700;}
  thead .col-add{background:#CDEAD4;}
  thead .col-deduct{background:#F5D6CE;}
  thead .col-result{background:#F3E0A0;}
  .card{background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px;}
  .mobile-warn{display:none;}
  @media (max-width: 820px){
    .mobile-warn{
      display:flex; gap:10px; align-items:flex-start;
      background:#FBF1DE; border:1px solid #E8C88A; color:#8A5A00;
      border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13px; line-height:1.6;
    }
  }
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 18px;}
  /* Grid 子項預設 min-width:auto，長說明文字會撐破欄寬溢出到容器外，必須歸零 */
  .grid-2>*{min-width:0;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 9px; border-radius:20px; background:#D6F1F2; color:var(--brand-dark); font-weight:700;}
  .badge.warn{background:#f6d9ce; color:#7a3b1e;}
  .badge .material-icons{font-size:13px;}
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  .toolbar .grow{flex:1;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .empty{padding:40px; text-align:center; color:var(--muted);}
  .modal-bg{position:fixed; inset:0; background:rgba(16,20,16,.62); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:50;}
  /* 伺服器喚醒中的提示條：請求超過門檻秒數才出現，結束就淡出 */
  #api-slow-hint{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 8px);
    max-width:88vw; z-index:200; pointer-events:none;
    background:rgba(34,40,49,.92); color:#EEE; border:1px solid var(--line);
    border-radius:20px; padding:9px 16px; font-size:12px; line-height:1.5; text-align:center;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  #api-slow-hint.show{ opacity:1; transform:translate(-50%, 0); }
  .modal{background:#fff; border-radius:10px; padding:22px 26px; width:640px; max-width:100%; box-shadow:0 18px 50px rgba(0,0,0,.28);}
  .modal h3{margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; border-top:1px solid var(--line); padding-top:14px;}
  /* 長表單彈窗：標題與按鈕列固定，中間內容獨立捲動，欄位以區塊分組 */
  .modal.modal-form{width:780px; padding:0; background:var(--paper); max-height:calc(100vh - 80px); display:flex; flex-direction:column; overflow:hidden;}
  .modal.modal-form>h3{margin:0; flex:0 0 auto; padding:16px 22px; background:var(--paper-2); border-bottom:1px solid var(--line); font-size:16px;}
  .modal.modal-form>h3 .material-icons{color:var(--brand);}
  .modal-body{flex:1 1 auto; overflow-y:auto; padding:16px 22px 4px 22px;}
  .modal.modal-form .modal-actions{flex:0 0 auto; margin:0; padding:13px 22px; background:var(--paper-2); border-top:1px solid var(--line);}
  .fieldset{background:var(--paper-2); border:1px solid var(--line); border-radius:10px; padding:13px 15px 3px 15px; margin-bottom:13px;}
  .fs-title{font-size:12px; font-weight:700; color:var(--brand-dark); letter-spacing:.6px; display:flex; align-items:center; gap:6px; margin-bottom:11px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .fs-title .material-icons{font-size:16px; color:var(--brand);}
  .fs-note{font-size:11.5px; color:var(--muted); line-height:1.65; background:var(--paper); border-radius:7px; padding:8px 10px; margin-bottom:10px;}
  .check-row{display:flex; align-items:flex-start; gap:7px; font-size:13px; color:var(--ink); margin-bottom:10px; cursor:pointer;}
  .check-row input[type=checkbox]{width:auto; margin-top:2px; flex:0 0 auto;}
  .config-warn{background:#3a2317; border:1px solid #6b4326; color:#f0caa0; padding:14px 18px; border-radius:10px; max-width:640px; font-size:13px; margin-bottom:20px;}
  .config-warn code{background:#00000030; padding:1px 5px; border-radius:3px;}
  .flag{color:var(--danger); font-weight:700;}

  .payslip{
    background:#fff; border:1.5px solid var(--brand-dark); padding:18px 20px;
    max-width:640px; margin:0 auto 24px auto; page-break-after:always;
  }
  .payslip h2{font-size:15px; text-align:center; border-bottom:2px solid var(--brand-dark); padding-bottom:8px; margin-bottom:10px;}
  .payslip .meta{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:10px;}
  .payslip table{font-size:12px;}
  .payslip th{background:#EDEDED;}
  .payslip td, .payslip th{border-left:none; border-right:none;}
  .payslip td.hrs{color:var(--muted); font-size:11px; text-align:left;}
  .payslip .grand{
    display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:10px;
    background:#EDEDED; padding:10px 14px; margin-top:10px; border-radius:4px;
  }
  .payslip .grand-item{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .payslip .grand-label{font-size:11.5px; color:var(--muted);}
  .payslip .grand-num{font-family:'Roboto Mono',monospace; font-size:15px; font-weight:700; color:var(--brand-dark);}
  .payslip .grand-total{border-left:1px solid var(--line); padding-left:10px;}
  .payslip .grand-total .grand-num{font-size:18px; color:var(--brand);}
  .payslip .foot-note{font-size:11px; color:var(--muted); margin-top:10px;}

  /* 登入畫面 */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% -10%, #282E38, #1a1e24 65%);
    padding:20px;
  }
  .login-card{
    background:#fff; border-radius:14px; padding:38px 34px; width:360px; max-width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center;
  }
  .login-card .mark-icon{
    width:52px; height:52px; border-radius:14px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;
  }
  .login-card h2{font-size:17px; margin-bottom:4px;}
  .login-card .sub{font-size:12px; color:var(--muted); margin-bottom:22px;}
  .login-card .field{text-align:left;}
  .login-card input{width:100%; padding:11px 12px;}
  .login-card button{width:100%; justify-content:center; padding:11px 0; font-size:14px; margin-top:6px;}
  .login-card .err{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}

  /* 報表卡片的標題列：不要用 .toolbar，否則會被下面的列印規則整個隱藏 */
  .card-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .card-head .grow{flex:1;}
  .print-only{display:none;}

  @media print{
    /* 薪資印領清冊有 14 欄（12 個月＋項目＋全年合計），直式 A4 一定印不下 ——
       實測會把 8 月之後與「全年合計」整片裁掉，而那是清冊最重要的一欄。
       橫式並縮小邊界，讓整張表完整落在一頁寬度內。 */
    /* 邊界壓到 6mm：可用寬 297−12 = 285mm，剛好容納
       項目 22 ＋ 12 個月各 20（240）＋ 全年合計 20 ＝ 282mm。
       用 8mm 的話只剩 281mm，簽名格就達不到 2cm。 */
    @page{ size:A4 landscape; margin:6mm; }
    .no-print{display:none !important;}
    .sidebar,.topbar,.toolbar{display:none !important;}
    body{background:#fff;}
    /* ⚠️ 左邊必須留 4mm 緩衝，否則列印的「第一頁」左緣會被裁掉約 8px ——
       實測（無頭 Chrome，獨立測試檔）：第一頁固定被切，第二頁之後完全正常；
       在第一張卡片前插一頁封面，原本被切的那張移到第 2 頁就恢復正常。
       加大 @page margin 沒有用（20mm 也照切），因為裁切是跟著「內容框」而不是頁面邊界。
       所以改成讓內容本身往右退 4mm，被吃掉的就是空白而不是文字。
       後面幾頁只是多 4mm 內縮，看不出差別。 */
    .content{padding:0 0 0 4mm; overflow:visible !important; overflow-x:visible !important;}
    html, body{ overflow:visible !important; }
    .card{border:none; overflow:visible !important; padding:0; margin-bottom:22px;}
    .print-only{display:block;}

    /* thead 在畫面上是 position:sticky，列印時會脫離表格流被丟到文件最後
       （原本三張表的表頭都跑到最後一頁），必須改回一般流。
       table-header-group 可讓表頭在跨頁時自動重複。 */
    thead{ position:static !important; display:table-header-group; }
    tr{ page-break-inside:avoid; }
    table{ page-break-inside:auto; }

    /* 瀏覽器列印預設不印背景色，表頭與總計列會變全白而看不出層次，
       改用明確的框線與灰階，並要求保留背景色 */
    th, td{ border:1px solid #999 !important; }
    th{ background:#e8e8e8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* 框線比照畫面的淺灰，不用列印專用的深灰 #999（那是為了黑白列印可辨識） */
    .reg-table th, .reg-table td{ border:1px solid #DCDCDC !important; }
    .reg-table .reg-row.reg-sum > td{ border-top:1px solid #9AA1A8 !important; }
    .reg-table .reg-row.k-grand > td{ border-top:1px solid #00ADB5 !important;
                                      border-bottom:1px solid #00ADB5 !important; }
    .reg-table .reg-ytd{ border-left:1px solid #9AA1A8 !important; }
    .reg-table .reg-freeze-2{ border-right:1px solid #9AA1A8 !important; }
    tr.total-row td{ background:#f0f0f0 !important; font-weight:700;
                     -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    /* 凍結欄在列印時不需要，且 sticky 會造成錯位 */
    .freeze-1, .freeze-2, .reg-freeze-2{ position:static !important; }

    /* 印領清冊：畫面上為了好讀給了 minWidth:1500，列印時必須放掉，
       否則表格比紙寬、右側會被裁切。字級與內距一併縮小以塞進一頁寬。 */
    .reg-table{ min-width:0 !important; width:100% !important; table-layout:fixed; font-size:8.5px; }
    /* ⚠️ 縮排列在螢幕上是 font-size:11px，特異性比 .reg-table 的 8.5px 高，
       列印時會變成「內含明細比本薪還大」——整個反過來。這裡必須明確壓回去。 */
    .reg-table .reg-row.reg-ind > td{ font-size:7.5px !important; }
    .reg-table .reg-row > td{ font-size:8.5px; }
    .reg-table .reg-row.k-grand > td{ font-size:9.5px !important; }
    .reg-table .reg-row.reg-sum > td{ font-size:9px !important; }
    /* ⚠️ word-break:break-all 只能套在數字欄。套到員工資料格會把身分證號斷成
       「L1236 / 87827」、地址斷在詞中間，看起來像資料壞掉。 */
    .reg-table th, .reg-table td{ padding:2px 3px !important; }
    /* ⚠️ 上面那行的 !important 會把標籤欄的縮排一起蓋掉，列印出來
       「伙食津貼」會跟「本薪」齊頭，看不出是內含明細。這裡要補回來。 */
    .reg-table .reg-row > td.reg-freeze-2{ padding-left:10px !important; }
    .reg-table .reg-row.reg-ind > td.reg-freeze-2{ padding-left:24px !important; }
    .reg-table tr > td.reg-freeze-2, .reg-table tr > th.reg-freeze-2{ padding-left:10px !important; }
    .reg-table td:not(.reg-freeze-2):not(.reg-emp-bar){ word-break:break-all; }
    /* 欄寬用 mm 明確指定，確保簽名格達到 2×2cm。
       橫式 A4 可用寬 297−12=285mm：項目 22 ＋ 12 個月各 20（240）＋ 全年合計 20 ＝ 282mm。
       這也是為什麼員工資料必須改成橫幅 —— 留不下 40mm 給姓名欄。 */
    .reg-table{ table-layout:fixed; }
    .reg-table .reg-freeze-2{ width:22mm !important; min-width:0 !important; }
    .reg-table td:not(.reg-freeze-2):not(.reg-emp-bar),
    .reg-table th:not(.reg-freeze-2){ width:20mm; }
    .reg-table .sig-cell{ height:20mm !important; }
    /* 列印完全比照畫面配色（碳粉不是考量）。
       瀏覽器預設不印背景色，所以整張表強制開啟 print-color-adjust。 */
    .reg-card{ margin-bottom:0 !important; border:none !important; box-shadow:none !important;
               overflow:visible !important; overflow-x:visible !important; }
    .reg-card, .reg-card *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    .reg-row.k-add > td{ background:rgba(47,125,79,.05) !important; }
    .reg-row.k-cut > td{ background:rgba(161,61,61,.05) !important; }
    .reg-row.k-grand > td{ background:rgba(0,173,181,.10) !important; color:#00767C !important; }
    .reg-emp-bar{ background:#F2F0E8 !important; }
    .reg-freeze-2{ background:#F2F0E8 !important; }
    .reg-table td.reg-zero{ color:#A8AEB5 !important; }
    .reg-table .reg-empty{ color:#B8BDC4 !important; }
    .reg-head{ padding:0 0 5px !important; border-bottom:1px solid #999; margin-bottom:4px; }
    .reg-head-title b{ font-size:11.5px; }
    .reg-head-title span{ font-size:9px; }
    .reg-head-law{ font-size:7.5px; margin-top:2px; }
    .reg-table .reg-emp-bar{ padding:5px 8px !important; }
    .reg-table .reg-emp-bar .nm{ font-size:11.5px; }
    .reg-table .reg-emp-bar .dp{ font-size:8.5px; }
    .reg-table .reg-emp-bar .f{ font-size:8.5px; }
    .reg-table .reg-emp-bar .f b{ font-size:7.5px; }
    /* 每位員工從新的一頁開始（第一位除外，否則會多出一張空白頁）。
       一個人的資料絕不能被切成兩頁，這是印領清冊當作簽收憑證的前提。 */
    .reg-table tbody > tr{ page-break-inside:avoid; }
    /* 分頁改在卡片層級。⚠️ 用「相鄰兄弟」而不是 :first-of-type ——
       卡片前面還有 <h3> 與說明文字兩個 div，第一張卡片不是「第一個 div」，
       :first-of-type 比對不到，結果連第一張也加了分頁，印出一整頁空白。 */
    .reg-card{ page-break-inside:avoid; }
    .reg-card + .reg-card{ page-break-before:always; }
    /* 未結算月份的「—」列印時用淺灰，跟真的 0 仍要分得出來 */
    .reg-empty{ color:#999 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  /* ===================== 操作流程 ===================== */

  /* ===================== 打卡紀錄作廢 ===================== */
  /* 作廢的列整列淡化並加刪除線，一眼看得出「這筆保留但不算數」；資料仍完整可讀 */

            font-weight:700; text-decoration:none;}

  /* ===================== 出缺勤彙總 ===================== */
  :root{--sum-namew:150px;}

  .grp-bar{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:8px;}
  .grp-chip{background:transparent; color:var(--muted); border:1px solid var(--line);
            border-radius:100px; padding:5px 12px; font-size:12px; font-weight:700;}

  .grp-chip .grp-dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.3;}

  /* 0 用淡字而不是留白：留白分不清「沒請假」與「資料還沒帶進來」 */

  .sum-tbl td.col-sum{font-weight:800;}

  .sum-tbl tr.row-exp:hover td{background:rgba(0,173,181,.05);}
  .sum-tbl .exp-arrow{display:inline-block; margin-left:6px; color:var(--muted); transition:transform .15s;}
  .sum-tbl .exp-arrow.open{transform:rotate(90deg);}
  .sum-tbl .pend-badge{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:5px;
                       background:rgba(160,106,16,.14); color:#8a5a0d; font-size:11px; font-weight:700;}
  .sum-tbl .occ-tag{display:inline-block; margin:1px 2px; padding:1px 7px; border-radius:5px;
                    background:rgba(107,83,184,.12); color:#5a45a0; font-size:11.5px; font-weight:700;}

  /* 展開的逐筆假單。⚠️ 表頭與資料列是兩個獨立的 grid，軌道必須完全一致才會對齊；
     最後一欄用 auto 會讓兩邊依各自內容算出不同寬度，中間的 1fr 吸收差額就對不上。

  .sum-tbl th:first-child, .sum-tbl td.emp-cell{width:var(--sum-namew); min-width:var(--sum-namew);}
  .sum-tbl tr.detail-row > td{background:#EFEFEF; text-align:left;

  .lv-head, .lv-row{display:grid; grid-template-columns:5.4em 6.6em 5em minmax(0,1fr);

<body>
<div id="root"></div>
<div id="boot-status" style="padding:60px 20px;text-align:center;color:#6b7268;font-family:sans-serif;font-size:13px;">頁面載入中，請稍候...</div>
<div id="boot-error" style="display:none; position:fixed; left:12px; right:12px; bottom:12px; max-width:640px; margin:0 auto; background:#3a1717; color:#fbd7d0; border:1px solid #7a3b34; padding:14px 18px; border-radius:8px; font-size:12px; font-family:monospace; white-space:pre-wrap; z-index:9999;"></div>

<script type="text/plain" id="app-src">
const {useState, useEffect, useMemo, useRef} = React;

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzW7073VQtPGa9cIn-pBNdfLClDdkEn8eBGVzDSkv26ZZWiHGcD5wikhx7KL5l4mlsC/exec';
const TOKEN_KEY = 'admin_session_token';

let CURRENT_TOKEN = null;
try{ CURRENT_TOKEN = localStorage.getItem(TOKEN_KEY) || null; }catch(e){}
function setToken(t){
  CURRENT_TOKEN = t;
  try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }catch(e){}
}
function isSessionError(msg){
  return typeof msg === 'string' && (msg.indexOf('登入已逾時') !== -1 || msg.indexOf('請先登入') !== -1);
}
function forceReLogin(){
  setToken(null);
  try{ location.reload(); }catch(e){}
}

// 連線失敗自動重試1次，避免手機瀏覽器偶發的網路中斷（例如冷啟動、切背景）就直接跳錯誤訊息
/* GAS 部署後第一次呼叫要重新編譯腳本，冷啟動可能 20~40 秒；fetch 預設沒有逾時，
   遇到這種情況畫面會無限停在載入狀態，看起來像當掉。設定逾時上限並在等太久時提示。 */
const API_TIMEOUT_MS = 35000;
const SLOW_HINT_MS = 6000;
let _slowPending = 0, _slowTimer = null;
function slowHintShow(){
  let el = document.getElementById('api-slow-hint');
  if(!el){
    el = document.createElement('div');
    el.id = 'api-slow-hint';
    el.textContent = '伺服器喚醒中，請稍候…（系統閒置一段時間後的第一次連線較慢）';
    document.body.appendChild(el);
  }
  el.classList.add('show');
}
function slowStart(){
  _slowPending++;
  if(_slowTimer) return;
  _slowTimer = setTimeout(()=>{ if(_slowPending > 0) slowHintShow(); }, SLOW_HINT_MS);
}
function slowEnd(){
  _slowPending = Math.max(0, _slowPending - 1);
  if(_slowPending === 0){
    if(_slowTimer){ clearTimeout(_slowTimer); _slowTimer = null; }
    const el = document.getElementById('api-slow-hint');
    if(el) el.classList.remove('show');
  }
}

async function fetchWithRetry(url, options, retries=1, delayMs=1000){
  slowStart();
  try{
    let lastErr;
    for(let i=0; i<=retries; i++){
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), API_TIMEOUT_MS);
      try{
        return await fetch(url, Object.assign({}, options || {}, {signal: ctrl.signal}));
      }catch(e){
        lastErr = (e && e.name === 'AbortError')
          ? new Error('連線逾時（超過 ' + Math.round(API_TIMEOUT_MS/1000) + ' 秒沒有回應）。請確認網路後再試一次；若剛更新過系統，稍等一下再開通常就會恢復。')
          : e;
        if(i === retries) throw lastErr;
        await new Promise(r=>setTimeout(r, delayMs));
      }finally{
        clearTimeout(timer);
      }
    }
    throw lastErr;
  } finally {
    slowEnd();
  }
}
// 後端偶爾會回傳 HTML（例如 GAS 錯誤頁、登入逾期被導向），直接 res.json() 會丟出看不懂的
// 「Unexpected token '<'」。統一在這裡轉成人看得懂的訊息。
async function parseApiResponse(res){
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(e){
    if(text.indexOf('<!DOCTYPE') === 0 || text.indexOf('<html') === 0){
      throw new Error('伺服器回傳了非預期的內容（可能是 Google 服務暫時忙碌或連線逾時），請稍候再試一次。');
    }
    throw new Error('伺服器回應格式錯誤：' + text.slice(0, 80));
  }
}
/* 新後端（Cloudflare Workers）。
   讀的是同一份 Google 試算表，只是換掉執行環境：GAS 每次請求要 2～15 秒，
   新後端約 0.6 秒。下列 action 都已與 GAS 逐欄比對確認結果完全一致才切換。
   寫入類與尚未搬移的查詢仍走 GAS。 */
const API_URL = 'https://tap-api.mammyshop-tw.workers.dev';
const NEW_BACKEND_ACTIONS = ['getAdminBootstrap'];

async function callApiGet(base, action, params){
  const qs = new URLSearchParams({action, token: CURRENT_TOKEN||'', ...params}).toString();
  const res = await fetchWithRetry(`${base}?${qs}`);
  const json = await parseApiResponse(res);
  if(json.status !== 'success'){
    if(isSessionError(json.message)) forceReLogin();
    throw new Error(json.message || '發生錯誤');
  }
  return json.data;
}

async function apiGet(action, params={}){
  const useNew = NEW_BACKEND_ACTIONS.indexOf(action) !== -1;
  if(!useNew) return callApiGet(GAS_URL, action, params);
  try{
    return await callApiGet(API_URL, action, params);
  }catch(e){
    // 新後端若有任何問題（部署異常、憑證過期、網路），自動改走 GAS。
    // 最壞情況只是回到原本的速度，不會讓員工卡住無法作業。
    if(isSessionError(e.message)) throw e; // 登入問題兩邊一樣，不必重試
    console.warn('新後端失敗，改用 GAS：', e.message);
    return callApiGet(GAS_URL, action, params);
  }
}
async function apiPost(action, body={}){
  const res = await fetchWithRetry(GAS_URL, {method:'POST', body: JSON.stringify({action, token: CURRENT_TOKEN, ...body})});
  const json = await parseApiResponse(res);
  if(json.status !== 'success'){
    if(isSessionError(json.message)) forceReLogin();
    throw new Error(json.message || '發生錯誤');
  }
  return json.data;
}
function todayMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(m){
  if(!m) return '';
  const [y,mo] = m.split('-');
  return y + '年' + Number(mo) + '月';
}
function exportCSV(filename, headers, rows){
  const esc = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [headers.map(esc).join(',')].concat(rows.map(r=>r.map(esc).join(',')));

async function geocodeAddress(address){

// 共用的「輸入地址→查詢座標」元件，供地理圍籬設定跟打卡補登/修改共用
function AddressGeocodeField({lat, lng, onFound}){
  const [address, setAddress] = useState('');
  const [loading, setLoading] = useState(false);
  async function doSearch(){
    setLoading(true);
    try{
      const r = await geocodeAddress(address);
      onFound(r.lat, r.lng, r.formattedAddress);
    }catch(e){ alert(e.message); }
    finally{ setLoading(false); }
  }
  return (
    <div className="field">
      <label>地址（輸入後自動查詢座標，不用手動查GPS）</label>
      <div style={{display:'flex', gap:8}}>
        <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="例如：台中市南屯區文心路一段100號" style={{flex:1}} onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); doSearch(); } }} />

      </div>

  );
}

/* 列印（或另存 PDF）時的檔名。
   瀏覽器把 document.title 當成預設檔名，所以列印前先換掉、列印完再換回來。
   不做的話存出來會是「mammyshop 媽咪小站 - 後台管理 · 出缺勤與薪資系統.pdf」，
   一堆檔案疊在下載資料夾裡完全分不出誰是誰。
   afterprint 有些瀏覽器不觸發，所以再補一個 setTimeout 保險。 */
function printWithFilename(name){
  /* 列印前把所有捲動位移歸零。這是防禦性的（表格若比視窗寬，捲動狀態會影響輸出），
     但要注意：先前以為「第一頁左緣被裁」是捲動造成的，那個推論是錯的 ——
     真正的原因見列印樣式裡 .content 的 padding-left 說明。 */
  document.querySelectorAll('*').forEach(el=>{
    if(el.scrollLeft) el.scrollLeft = 0;
    if(el.scrollTop) el.scrollTop = 0;
  });
  window.scrollTo(0, 0);
  const original = document.title;
  const restore = () => {
    document.title = original;
    window.removeEventListener('afterprint', restore);
  };
  document.title = String(name || original).replace(/[\\/:*?"<>|]/g, '-');
  window.addEventListener('afterprint', restore);
  setTimeout(()=>window.print(), 0);
  setTimeout(restore, 3000);
}

function tenureShortText(hireDate, breakStart, breakEnd){
  if(!hireDate) return '-';
  let h = new Date(hireDate);
  if(isNaN(h.getTime())) return '-';
  if(breakStart && breakEnd){
    const [by,bm] = String(breakStart).split('-').map(Number);
    const [ey,em] = String(breakEnd).split('-').map(Number);
    if(by && bm && ey && em){
      const breakMonths = (ey-by)*12 + (em-bm) + 1;
      if(breakMonths > 0) h = new Date(h.setMonth(h.getMonth()+breakMonths));
    }
  }
  const now = new Date();
  let months = (now.getFullYear()-h.getFullYear())*12 + (now.getMonth()-h.getMonth());
  if(now.getDate() < h.getDate()) months -= 1;
  months = Math.max(0, months);
  const y = Math.floor(months/12), m = months%12;
  return y>0 ? `${y}年${m}個月` : `${m}個月`;
}
function tenureText(hireDate, breakStart, breakEnd){
  if(!hireDate) return '未設定到職日';
  let h = new Date(hireDate);
  if(isNaN(h.getTime())) return '到職日格式錯誤';
  let breakNote = '';
  if(breakStart && breakEnd){
    const [by,bm] = String(breakStart).split('-').map(Number);
    const [ey,em] = String(breakEnd).split('-').map(Number);
    if(by && bm && ey && em){
      const breakMonths = (ey-by)*12 + (em-bm) + 1;
      if(breakMonths > 0){
        h = new Date(h); h.setMonth(h.getMonth()+breakMonths);
        const by2 = Math.floor(breakMonths/12), bm2 = breakMonths%12;
        breakNote = `（已扣除中斷${by2>0?by2+'年':''}${bm2>0?bm2+'個月':''}）`;
      }
    }
  }
  const now = new Date();
  let months = (now.getFullYear()-h.getFullYear())*12 + (now.getMonth()-h.getMonth());
  if(now.getDate() < h.getDate()) months -= 1;
  months = Math.max(0, months);
  const y = Math.floor(months/12), m = months%12;
  let leave = 0;
  const years = months/12;
  if(years >= 10) leave = Math.min(30, 16 + Math.floor(years-10));
  else if(years >= 5) leave = 15;
  else if(years >= 3) leave = 14;
  else if(years >= 2) leave = 10;
  else if(years >= 1) leave = 7;
  else if(months >= 6) leave = 3;
  return `到職年資約 ${y} 年 ${m} 個月${breakNote}，依勞基法第 38 條參考特休日數：約 ${leave} 日（僅供參考，請以實際規定核算）`;
}

function findInsurance(grade){
  if(!grade) return null;
  let exact = INSURANCE_TABLE.find(r => r.grade === Number(grade));
  if(exact) return exact;
  const sorted = [...INSURANCE_TABLE].sort((a,b)=>a.grade-b.grade);
  let candidate = sorted.find(r => r.grade >= Number(grade));
  return candidate || sorted[sorted.length-1];
}
function suggestGrade(salary){
  const s = Number(salary)||0;
  const sorted = [...INSURANCE_TABLE].filter(r=>r.grade>=11100).sort((a,b)=>a.grade-b.grade);
  const c = sorted.find(r => r.grade >= s);
  return c ? c.grade : sorted[sorted.length-1].grade;
}

   回傳算式明細供畫面條列顯示。 */
function insuranceBaseDetail(emp, settings){
  const v = x => Number(x)||0;
  const s = settings || {};
  const on = key => s[key] === '是' || s[key] === true;
  const items = [
    {label:'伙食津貼', amount:v(emp.mealAllowance), included:on('insIncludeMeal')},
    {label:'交通津貼', amount:v(emp.transportAllowance), included:on('insIncludeTransport')},
    {label:'職務加給', amount:v(emp.positionAllowance), included:on('insIncludePosition')},
    {label:'全勤獎金', amount:v(emp.fullAttendanceBonus), included:s.insIncludeFullAttendance === undefined ? true : on('insIncludeFullAttendance')}
  ];
  const deducted = items.filter(x=>!x.included && x.amount>0);
  const base = Math.max(0, v(emp.baseSalary) - deducted.reduce((a,b)=>a+b.amount,0));
  return {base, deducted, items};
}
function insuranceBase(emp, settings){ return insuranceBaseDetail(emp, settings).base; }

const MIN_WAGE_MONTHLY = 29500;
const MIN_WAGE_HOURLY = 196;
const MONTHLY_OT_CAP_DEFAULT = 46;

function emptyEntry(){
  return {
    otWeekday134:0, otWeekday167:0, otRestDayHours:0, otHolidayHours:0, otMandatoryRestHours:0,
    festivalBonus:0, yearEndBonus:0, otherBonus:0, performanceBonus:0,
    personalLeave:0, sickLeave:0, menstrualLeave:0, disasterLeave:0, otherLeave:0, familyCareLeave:0,
    annualLeaveSettlement:0,
    businessExpense:0, salesPerformance:0, otherExpense26:0, salesBonus26:0, deduction26:0,
    otherDeduction:0, note:'',
    locked:false, lockedAt:'', lockedBaseSalary:0, lockedMealAllowance:0, lockedTransportAllowance:0,
    lockedPositionAllowance:0, lockedFullAttendanceBonus:0, lockedInsuranceGrade:0, lockedDependentCount:0,
    lockedLaborFee:0, lockedHealthFee:0,
    lateMinutes:0, lateCount:0, earlyMinutes:0, earlyCount:0, presentDays:0
  };
}
function calcRestDayPay(hourly, hours){
  const h = n(hours);
  if(h<=0) return {pay:0, countedHours:0, overCap:false};
  const counted = h<=4 ? 4 : (h<=8 ? 8 : (h<=12 ? 12 : h));
  const t1 = Math.min(counted,2);
  const t2 = Math.min(Math.max(counted-2,0),6);
  const t3 = Math.max(counted-8,0);
  const pay = hourly*1.34*t1 + hourly*1.67*t2 + hourly*2.67*t3;
  return {pay, countedHours:counted, overCap: h>12};
}
function calcHolidayPay(hourly, dailyWage, hours){
  const h = n(hours);
  if(h<=0) return {pay:0};
  const excess = Math.max(0, h-8);
  const ot134 = Math.min(excess,2);
  const ot167 = Math.max(excess-2,0);
  return {pay: dailyWage + hourly*1.34*ot134 + hourly*1.67*ot167};
}
function calcMandatoryRestPay(hourly, dailyWage, hours, mode){
  const h = n(hours);
  if(h<=0) return 0;
  if(mode === 'legal'){
    return calcHolidayPay(hourly, dailyWage, h).pay; // 依勞基法：加發一日工資＋超過8小時比照平日加班費
  }
  return hourly*2*h; // 優於勞基法：時薪×2
}
// 以下兩個函式僅供薪資表欄位下方「系統實際」參考金額換算用，不影響實際請假扣款計算（實際計算仍以 calcForEmployee 內以本次輸入時數為準）
function calcSickLeaveRefMoney(hourly, sickHours, leaveBaseline){
  const MENSTRUAL_FULL_PAY_HOURS = 24, SICK_LEAVE_ANNUAL_CAP_HOURS = 240;
  const menstrualUsedBefore = n(leaveBaseline && leaveBaseline.menstrual);
  const sickUsedBefore = n(leaveBaseline && leaveBaseline.sick);
  const menstrualOverageBefore = Math.max(0, menstrualUsedBefore - MENSTRUAL_FULL_PAY_HOURS);
  const capRemaining = Math.max(0, SICK_LEAVE_ANNUAL_CAP_HOURS - sickUsedBefore - menstrualOverageBefore);
  const h = n(sickHours);
  const halfPayHours = Math.min(h, capRemaining);
  const unpaidHours = h - halfPayHours;
  return hourly*0.5*halfPayHours + hourly*1.0*unpaidHours;
}
function calcMenstrualLeaveRefMoney(hourly, menstrualHours, leaveBaseline){
  const MENSTRUAL_FULL_PAY_HOURS = 24, SICK_LEAVE_ANNUAL_CAP_HOURS = 240;
  const menstrualUsedBefore = n(leaveBaseline && leaveBaseline.menstrual);
  const sickUsedBefore = n(leaveBaseline && leaveBaseline.sick);
  const remainFullPay = Math.max(0, MENSTRUAL_FULL_PAY_HOURS - menstrualUsedBefore);
  const h = n(menstrualHours);
  const overageThisMonth = Math.max(0, h - remainFullPay);
  const menstrualOverageBefore = Math.max(0, menstrualUsedBefore - MENSTRUAL_FULL_PAY_HOURS);
  const capRemaining = Math.max(0, SICK_LEAVE_ANNUAL_CAP_HOURS - sickUsedBefore - menstrualOverageBefore);
  const halfPayHours = Math.min(overageThisMonth, capRemaining);
  const unpaidHours = overageThisMonth - halfPayHours;
  return hourly*0.5*halfPayHours + hourly*1.0*unpaidHours; // 全薪部分金額為0，不列入
}
// 計算勞健保加退保狀態：勞保依「當月在職日數/30」比例計算；健保看「當月最後一天」是否仍在職，是則收整月保費，否則本月不收
function getInsuranceStatusForMonth(hireDate, resignDate, month){
  const parts = String(month||'').split('-').map(Number);
  const y = parts[0], m = parts[1];
  if(!y || !m) return {laborDays:30, activeAtMonthEnd:true, fullMonth:true};
  const monthStart = new Date(y, m-1, 1);
  const monthEnd = new Date(y, m, 0);
  let start = monthStart;
  if(hireDate){ const h = new Date(hireDate); if(!isNaN(h.getTime()) && h>monthStart) start = h; }
  let end = monthEnd;
  let activeAtMonthEnd = true;
  if(resignDate){ const r = new Date(resignDate); if(!isNaN(r.getTime()) && r<monthEnd){ end = r; activeAtMonthEnd = false; } }
  if(start>end) return {laborDays:0, activeAtMonthEnd:false, fullMonth:false};
  const laborDays = Math.floor((end-start)/86400000)+1;
  const fullMonth = (start.getTime()===monthStart.getTime()) && (end.getTime()===monthEnd.getTime());
  return {laborDays, activeAtMonthEnd, fullMonth};
}
function calcForEmployee(emp, entryRaw, settings, leaveBaseline, month){
  const entry = {...emptyEntry(), ...(entryRaw||{})};
  const isLocked = !!entry.locked;
  // 本薪已包含伙食/交通/職務加給/全勤獎金，以下4個欄位僅為拆解說明用途，不重複相加
  // 若該月已鎖定，改用鎖定當下凍結的數值，不受員工資料日後異動影響
  const base = isLocked ? n(entry.lockedBaseSalary) : n(emp.baseSalary);
  const effMeal = isLocked ? n(entry.lockedMealAllowance) : n(emp.mealAllowance);
  const effTransport = isLocked ? n(entry.lockedTransportAllowance)
    : (emp.transportAllowanceMode === 'daily' ? Math.round(n(emp.transportAllowance) * n(entry.presentDays)) : n(emp.transportAllowance));
  const effPosition = isLocked ? n(entry.lockedPositionAllowance) : n(emp.positionAllowance);
  const effFullAttendance = isLocked ? n(entry.lockedFullAttendanceBonus) : n(emp.fullAttendanceBonus);
  const hourly = base>0 ? base/240 : 0;
  const dailyWage = base>0 ? base/30 : 0;

  const weekdayOtPay = hourly*1.34*n(entry.otWeekday134) + hourly*1.67*n(entry.otWeekday167);
  const restDay = calcRestDayPay(hourly, entry.otRestDayHours);
  const holiday = calcHolidayPay(hourly, dailyWage, entry.otHolidayHours);
  const mandatoryRestMode = (settings && settings.mandatoryRestPayMode) || 'double';
  const mandatoryRestPay = calcMandatoryRestPay(hourly, dailyWage, entry.otMandatoryRestHours, mandatoryRestMode);
  const overtimePay = weekdayOtPay + restDay.pay + holiday.pay + mandatoryRestPay;
  const monthlyOtHours = n(entry.otWeekday134) + n(entry.otWeekday167) + n(entry.otRestDayHours); // 依勞動部見解，休息日出勤時數也算入延長工作時間月上限

  const allowanceTotal = effMeal+effTransport+effPosition+effFullAttendance; // 僅供顯示參考，已含在本薪內
  const bonusTotal = n(entry.festivalBonus)+n(entry.yearEndBonus)+n(entry.otherBonus)+n(entry.performanceBonus);

  let laborFee, healthFee, insStatus;
  if(isLocked){
    laborFee = n(entry.lockedLaborFee);
    healthFee = n(entry.lockedHealthFee);
    insStatus = {laborDays:30, activeAtMonthEnd:true, fullMonth:true};
  } else {
    const ins = findInsurance(emp.insuranceGrade);
    insStatus = getInsuranceStatusForMonth(emp.hireDate, emp.resignDate, month);
    laborFee = ins ? (insStatus.fullMonth ? ins.empLabor : Math.round(ins.empLabor * insStatus.laborDays / 30)) : 0;
    // 眷屬保費同本人金額，超過3人以3人計；再扣掉由政府補助而免繳的眷屬口數
    const dependentCount = Math.max(0, Math.min(n(emp.dependentCount), 3) - n(emp.exemptDependentCount));
    healthFee = (ins && insStatus.activeAtMonthEnd) ? ins.empHealth * (1 + dependentCount) : 0;
  }

  // 全勤獎金：依2026年新制《勞工請假規則》第9條，扣發不得「全有全無」，須按比例計算
  let fullAttendanceDeductRatio = 0, fullAttendanceRatio = 1, adjustedFullAttendance = effFullAttendance;
  if(!isLocked){
    const s = settings || {};
    // 家庭照顧假與生理假依性平法第21條第2項不得影響全勤獎金，不列入分子
    const leaveHours = n(entry.sickLeave) + n(entry.personalLeave);
    let deductRatio = leaveHours / 240;

    const mode = s.fullAttendanceLateEarlyMode || 'minutes';
    const lateEarlyMinutes = n(entry.lateMinutes) + n(entry.earlyMinutes);
    const lateEarlyCount = n(entry.lateCount) + n(entry.earlyCount);
    if(mode==='minutes' || mode==='both'){
      deductRatio += lateEarlyMinutes / (240*60);
    }
    if(mode==='count' || mode==='both'){
      const freeCount = n(s.fullAttendanceLateEarlyFreeCount) || 0;
      const percentPerCount = n(s.fullAttendanceLateEarlyPercentPerCount) || 0;
      const excessCount = Math.max(0, lateEarlyCount - freeCount);
      deductRatio += excessCount * (percentPerCount/100);
    }
    fullAttendanceDeductRatio = Math.max(0, Math.min(1, deductRatio));

    const parts = String(month||'').split('-').map(Number);
    const daysInMonthTotal = (parts[0] && parts[1]) ? new Date(parts[0], parts[1], 0).getDate() : 30;
    fullAttendanceRatio = insStatus.fullMonth ? 1 : Math.max(0, Math.min(1, insStatus.laborDays / daysInMonthTotal));
    adjustedFullAttendance = Math.round(effFullAttendance * (1-fullAttendanceDeductRatio) * fullAttendanceRatio);
  }
  const fullAttendanceAdjustment = adjustedFullAttendance - effFullAttendance;

  const payableA = base + bonusTotal + n(entry.annualLeaveSettlement) + fullAttendanceAdjustment;
  const payableTotal = payableA + overtimePay;


  const MENSTRUAL_FULL_PAY_HOURS = 24; // 每年前3 日(以8hr/天計)生理假全薪
  const SICK_LEAVE_ANNUAL_CAP_HOURS = 240; // 病假年度30 日(以8hr/天計)上限，生理假超過3 日部分需併入計算
  const menstrualUsedBefore = n(leaveBaseline && leaveBaseline.menstrual);
  const sickUsedBefore = n(leaveBaseline && leaveBaseline.sick);
  const remainFullPay = Math.max(0, MENSTRUAL_FULL_PAY_HOURS - menstrualUsedBefore);
  const menstrualPaidHours = Math.min(n(entry.menstrualLeave), remainFullPay);
  const menstrualOverageThisMonth = n(entry.menstrualLeave) - menstrualPaidHours;

  // 病假＋生理假(超過3 日部分)共用年度30 日上限；超過部分不給薪(0%)，未超過部分半薪(50%)
  const menstrualOverageBefore = Math.max(0, menstrualUsedBefore - MENSTRUAL_FULL_PAY_HOURS);
  const combinedUsedBefore = sickUsedBefore + menstrualOverageBefore;
  let sickCapRemaining = Math.max(0, SICK_LEAVE_ANNUAL_CAP_HOURS - combinedUsedBefore);
  const sickHalfPayHours = Math.min(n(entry.sickLeave), sickCapRemaining);
  const sickUnpaidHours = n(entry.sickLeave) - sickHalfPayHours;
  sickCapRemaining = Math.max(0, sickCapRemaining - sickHalfPayHours);
  const menstrualHalfPayHours = Math.min(menstrualOverageThisMonth, sickCapRemaining);
  const menstrualUnpaidHours = menstrualOverageThisMonth - menstrualHalfPayHours;
  const menstrualHalfHours = menstrualOverageThisMonth; // 沿用舊欄位名稱：本月生理假超過3 日(全薪)的部分小時數
  const sickCapExceeded = (sickUnpaidHours + menstrualUnpaidHours) > 0;

  const leaveDeduct = hourly*1.0*n(entry.personalLeave)
    + hourly*1.0*n(entry.familyCareLeave) // 不給工資，但不扣全勤
    + hourly*0.5*sickHalfPayHours + hourly*1.0*sickUnpaidHours
    + hourly*0.5*menstrualHalfPayHours + hourly*1.0*menstrualUnpaidHours
    + hourly*1.0*n(entry.disasterLeave) + hourly*1.0*n(entry.otherLeave);
  const deductTotal = laborFee + healthFee + leaveDeduct + n(entry.otherDeduction);

  const pay06 = payableTotal - deductTotal;
  const pay26 = n(entry.businessExpense)+n(entry.salesPerformance)+n(entry.otherExpense26)+n(entry.salesBonus26)-n(entry.deduction26);
  const grandTotal = pay06 + pay26;

  const recurringPay = base; // 本薪已包含伙食/交通/職務加給，不重複相加
  const belowMinWage = base>0 && recurringPay < MIN_WAGE_MONTHLY;

  return {
    hourly, dailyWage, overtimePay, weekdayOtPay, restDayPay:restDay.pay, holidayPay:holiday.pay, mandatoryRestPay,
    restDayCountedHours: restDay.countedHours, restDayOverCap: restDay.overCap, monthlyOtHours,
    allowanceTotal, bonusTotal, payableA, payableTotal,
    laborFee, healthFee, leaveDeduct, deductTotal, menstrualPaidHours, menstrualHalfHours,
    sickHalfPayHours, sickUnpaidHours, menstrualHalfPayHours, menstrualUnpaidHours, sickCapExceeded,
    pay06, pay26, grandTotal, belowMinWage,
    insLaborDays: insStatus.laborDays, insFullMonth: insStatus.fullMonth, insActiveAtMonthEnd: insStatus.activeAtMonthEnd,
    locked: isLocked, effBaseSalary: base, effMealAllowance: effMeal, effTransportAllowance: effTransport,
    effPositionAllowance: effPosition, effFullAttendanceBonus: effFullAttendance,
    fullAttendanceDeductRatio, fullAttendanceRatio, fullAttendanceAdjusted: adjustedFullAttendance, fullAttendanceAdjustment
  };
}

function LoginScreen({onLoggedIn, storeName}){
  const [account, setAccount] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit(ev){
    ev.preventDefault();
    setErr(''); setLoading(true);
    try{
      const data = await apiPost('login', {account, password});
      if(data.role !== 'admin'){ setErr('此帳號沒有後台管理權限'); setLoading(false); return; }
      setToken(data.token);
      onLoggedIn(data);
    }catch(e){ setErr(e.message); }
    finally{ setLoading(false); }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="mark-icon"><span className="material-icons" style={{fontSize:28}}>admin_panel_settings</span></div>
        <h2>後台管理登入</h2>
        <div className="sub">{storeName || '出缺勤與薪資系統'}</div>
        <form onSubmit={submit}>
          <div className="field">
            <label>帳號</label>
            <input value={account} onChange={e=>setAccount(e.target.value)} autoFocus />
          </div>
          <div className="field">
            <label>密碼</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} />
          </div>
          <button type="submit" disabled={loading}>
            <span className="material-icons" style={{fontSize:18}}>login</span>
            {loading ? '登入中...' : '登入'}
          </button>
          <div className="err">{err}</div>
        </form>
      </div>
    </div>
  );
}

// 年份/月份兩段式下拉選單，取代原生 <input type="month">（避免行動裝置瀏覽器渲染不一致）
function YearMonthPicker({value, onChange}){
  const [y, m] = value.split('-');
  const thisYear = new Date().getFullYear();
  const years = [];
  for(let yy = thisYear + 1; yy >= thisYear - 5; yy--) years.push(String(yy));
  return (
    <div style={{display:'flex', gap:6}}>
      <select value={y} onChange={e=>onChange(e.target.value+'-'+m)}>
        {years.map(yy=><option key={yy} value={yy}>{yy}年</option>)}
      </select>
      <select value={m} onChange={e=>onChange(y+'-'+e.target.value)}>
        {Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')).map(mm=><option key={mm} value={mm}>{Number(mm)}月</option>)}
      </select>
    </div>
  );
}
const ADMIN_THEME_PALETTES = [
  { id:'default', name:'湖水藍', dark:'#222831', accent:'#00ADB5' },
  { id:'yellow', name:'焦糖黃', dark:'#3D3527', accent:'#D9C08C' },
  { id:'red', name:'陶土紅', dark:'#42302C', accent:'#C08D7F' },
  { id:'green', name:'鼠尾草綠', dark:'#333A2E', accent:'#A3AD8C' },
  { id:'milktea', name:'奶茶棕', dark:'#3E332A', accent:'#D6BFA0' }
];
function applyAdminTheme(themeId){
  const t = ADMIN_THEME_PALETTES.find(p=>p.id===themeId) || ADMIN_THEME_PALETTES[0];
  const root = document.documentElement.style;
  root.setProperty('--brand-dark', t.dark);
  root.setProperty('--brand', t.accent);
  root.setProperty('--accent', t.accent);
}
function App(){
  const [configError] = useState(GAS_URL.indexOf('請填入') !== -1);
  const [session, setSession] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [tab, setTab] = useState('dashboard');
  const [month, setMonth] = useState(todayMonth());

  const [employees, setEmployees] = useState([]);
  const [employeesLoading, setEmployeesLoading] = useState(true);
  const [payrollEntries, setPayrollEntries] = useState({});
  const [payrollLoading, setPayrollLoading] = useState(true);
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [settings, setSettings] = useState(null);
  const [settingsCategory, setSettingsCategory] = useState('basic');
  const [applyBox, setApplyBox] = useState(null);   // 套用出缺勤時數的差異確認框
  const [applyUndo, setApplyUndo] = useState(null); // 套用前的還原點，儲存或換月後清空
  useEffect(()=>{

    if(settings?.adminTitle) document.title = brand ? `${brand} - ${settings.adminTitle}` : settings.adminTitle;
    const link = document.getElementById('favicon-link');
    if(link && settings?.faviconUrl) link.href = settings.faviconUrl;

  // 共用的員工編輯狀態（員工資料頁籤、薪資明細頁籤都會用到，確保資料連動）
  const [companies, setCompanies] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [editingEmployee, setEditingEmployee] = useState(null);
  const [isNewEmployee, setIsNewEmployee] = useState(false);
  const [savingEmployee, setSavingEmployee] = useState(false);
  const [accountBox, setAccountBox] = useState(null); // {employeeId, name, account, password}

  function loadRefs(){
    Promise.all([apiGet('getCompanies'), apiGet('getDepartments'), apiGet('getShifts')])
      .then(([co,dept,sh])=>{ setCompanies(co); setDepartments(dept); setShifts(sh); })
      .catch(e=>alert(e.message));
  }
  function openNewEmployee(){
    setEditingEmployee({id:null, name:'', department:'', company:'', status:'在職', hireDate:'', insuranceGrade:0, baseSalary:0,
      mealAllowance:0, transportAllowance:0, positionAllowance:0, fullAttendanceBonus:0, bankName:'', bankAccount:'', note:'',
      companyId:'', departmentId:'', shiftId:'', phone:'', canBeDelegate:true, exemptFromAttendance:false, employeeType:'正式員工', exemptDependentCount:0,
      nationalId:'', householdAddress:'', dependentCount:0, resignDate:'', gender:'', birthday:'', transportAllowanceMode:'fixed', tenureBreakStart:'', tenureBreakEnd:''});
    setIsNewEmployee(true);
  }
  function openEditEmployee(emp){ setEditingEmployee({...emp}); setIsNewEmployee(false); }
  async function saveEmployee(){
    if(!editingEmployee.name.trim()){ alert('請輸入姓名'); return; }
    setSavingEmployee(true);
    const wasNew = isNewEmployee;
    const snap = {...editingEmployee};
    try{
      let id = snap.id;
      if(wasNew){ const r = await apiPost('addEmployee', snap); id = r.id; }
      else await apiPost('updateEmployee', snap);
      setEditingEmployee(null);
      await reloadEmployees();
      if(wasNew && confirm('員工已新增，要不要現在就幫他建立登入帳號？')){
        setAccountBox({employeeId:id, name:snap.name, account:snap.phone||'', password: Math.random().toString(36).slice(2,8)});
      }
    }catch(e){ alert(e.message); }
    finally{ setSavingEmployee(false); }
  }
  async function createAccountSubmit(){
    if(!accountBox.account.trim()){ alert('請輸入帳號'); return; }
    try{
      await apiPost('createAccount', {employeeId: accountBox.employeeId, account: accountBox.account, password: accountBox.password, role:'employee'});
      alert(`帳號建立完成！\n帳號：${accountBox.account}\n初始密碼：${accountBox.password}\n請告知員工，登入後可自行修改密碼。`);
      setAccountBox(null);
    }catch(e){ alert(e.message); }
  }

  function reloadSettings(){
    return apiGet('getSettings').then(setSettings).catch(()=>{});
  }

  // 頁面載入時，若本機已有登入 token，先樂觀還原登入狀態
  // 若 token 其實已逾時，後續任何 API 呼叫都會偵測到並自動導回登入畫面
  useEffect(()=>{
    if(configError){ setCheckingSession(false); return; }
    if(CURRENT_TOKEN){ setSession({token: CURRENT_TOKEN, restored: true}); }
    setCheckingSession(false);
  }, []);

  function reloadEmployees(){
    setEmployeesLoading(true);
    return apiGet('getEmployees').then(setEmployees).catch(e=>alert(e.message)).finally(()=>setEmployeesLoading(false));
  }
  function reloadPayroll(m){
    setPayrollLoading(true);
    return apiGet('getPayrollEntries', {month:m}).then(data=>{ setPayrollEntries(data||{}); setDirty(false); }).catch(e=>alert(e.message)).finally(()=>setPayrollLoading(false));
  }
  /* 首屏改走合併端點：原本登入後要連打 7 支請求（員工／薪資／設定／公司／部門／班別／出缺勤彙總），
     每支都要各付一次 GAS 固定開銷（實測 2.5～15 秒），這是後台一直在等待的主因。
     切換月份時也走同一支——雖然會多帶回員工與設定等不會變的資料，
     但那些在後端都有快取、幾乎不花時間，比起多開一次連線划算得多。
     個別的 reloadXxx() 保留，供存檔後的局部更新使用。 */

  function setEntry(empId, patch){
    setPayrollEntries(prev => ({...prev, [empId]: {...emptyEntry(), ...(prev[empId]||{}), ...patch}}));
    setDirty(true);
  }
  async function savePayroll(){
    setSaving(true);
    try{ await apiPost('savePayrollMonth', {month, entries: payrollEntries}); setDirty(false); }
    catch(e){ alert(e.message); }
    finally{ setSaving(false); }
  }
  const [menstrualBaseline, setMenstrualBaseline] = useState({});

  function applyMenstrualBaseline(summary){
    const map = {};
    (summary||[]).forEach(s=>{ map[s.employeeId] = {menstrual: s.menstrualLeaveUsedBefore || 0, sick: s.sickLeaveUsedBefore || 0}; });
    setMenstrualBaseline(map);
  }
  function refreshMenstrualBaseline(){
    apiGet('getMonthlySummary', {month}).then(applyMenstrualBaseline).catch(()=>{});
  }

  // 後台首屏／換月份：一次請求取回全部所需資料（取代原本的 7 支）
  function loadAdminBootstrap(m){
    setEmployeesLoading(true);
    setPayrollLoading(true);
    return apiGet('getAdminBootstrap', {month:m})
      .then(d=>{
        // 後端每段各自 try/catch，單項失敗回 null，這裡沿用「拿不到就維持原值」的行為
        if(d.employees) setEmployees(d.employees);
        if(d.payrollEntries !== null && d.payrollEntries !== undefined){ setPayrollEntries(d.payrollEntries || {}); setDirty(false); }
        if(d.settings) setSettings(d.settings);
        if(d.companies) setCompanies(d.companies);
        if(d.departments) setDepartments(d.departments);
        if(d.shifts) setShifts(d.shifts);
        if(d.monthlySummary) applyMenstrualBaseline(d.monthlySummary);
      })
      .catch(e=>alert(e.message))
      .finally(()=>{ setEmployeesLoading(false); setPayrollLoading(false); });
  }
  useEffect(()=>{ if(session) loadAdminBootstrap(month); }, [session, month]);

  // 「套用出缺勤時數」會用打卡計算結果覆蓋薪資表的時數欄位，包括手動填過的值。
  // 為避免靜默蓋掉，改成兩段式：先算出差異給使用者確認，套用後再保留一份還原點供一鍵復原。
  const APPLY_FIELDS = [
    {key:'otWeekday134', label:'平日1.34'}, {key:'otWeekday167', label:'平日1.67'},
    {key:'otRestDayHours', label:'休息日'}, {key:'otHolidayHours', label:'國定假日'},
    {key:'otMandatoryRestHours', label:'例假日'},
    {key:'personalLeave', label:'事假'}, {key:'sickLeave', label:'病假'},
    {key:'familyCareLeave', label:'家庭照顧假'}, {key:'menstrualLeave', label:'生理假'},
    {key:'disasterLeave', label:'災防假'},
    {key:'lateMinutes', label:'遲到分鐘'}, {key:'lateCount', label:'遲到次數'},
    {key:'earlyMinutes', label:'早退分鐘'}, {key:'earlyCount', label:'早退次數'},
    {key:'presentDays', label:'出勤日數'}
  ];
  function summaryToEntry(s){
    return {
      otWeekday134: s.otWeekday134 || 0, otWeekday167: s.otWeekday167 || 0,
      otRestDayHours: s.otRestDayHours || 0, otHolidayHours: s.otHolidayHours || 0,
      otMandatoryRestHours: s.otMandatoryRestHours || 0,
      personalLeave: s.personalLeave || 0, sickLeave: s.sickLeave || 0,
      familyCareLeave: s.familyCareLeave || 0, menstrualLeave: s.menstrualLeave || 0,
      disasterLeave: s.disasterLeave || 0,
      lateMinutes: s.lateMinutes || 0, lateCount: s.lateCount || 0,
      earlyMinutes: s.earlyLeaveMinutes || 0, earlyCount: s.earlyLeaveCount || 0,
      presentDays: s.presentDays || 0
    };
  }
  async function applyAttendanceToPayroll(){
    try{
      const summary = await apiGet('getMonthlySummary', {month});
      const nameOf = {}; employees.forEach(e=>nameOf[e.id]=e.name);
      const lockedOf = {};
      const changes = [];
      summary.forEach(s=>{
        const cur = payrollEntries[s.employeeId] || emptyEntry();
        if(cur.locked){ lockedOf[s.employeeId] = true; return; }
        const nextVals = summaryToEntry(s);
        APPLY_FIELDS.forEach(f=>{
          const from = n(cur[f.key]), to = n(nextVals[f.key]);
          if(from !== to) changes.push({empId:s.employeeId, name:nameOf[s.employeeId]||s.name, field:f.label, from, to, wasManual: from!==0});
        });
      });
      setApplyBox({
        loading:false, summary, changes,
        lockedNames: Object.keys(lockedOf).map(id=>nameOf[id]||id),
        untouched: employees.length - new Set(changes.map(c=>c.empId)).size
      });
    }catch(e){ alert(e.message); }
  }
  function confirmApply(){
    const box = applyBox; if(!box) return;
    setApplyUndo({entries: JSON.parse(JSON.stringify(payrollEntries)), month, count: box.changes.length});
    const map = {};
    box.summary.forEach(s=>{ map[s.employeeId] = {menstrual: s.menstrualLeaveUsedBefore || 0, sick: s.sickLeaveUsedBefore || 0}; });
    setMenstrualBaseline(map);
    setPayrollEntries(prev => {
      const next = {...prev};
      box.summary.forEach(s=>{
        const cur = next[s.employeeId] || emptyEntry();
        if(cur.locked) return; // 已鎖定不覆蓋
        next[s.employeeId] = {...emptyEntry(), ...cur, ...summaryToEntry(s)};
      });
      return next;
    });
    setDirty(true);
    setApplyBox(null);
  }
  function undoApply(){
    if(!applyUndo) return;
    setPayrollEntries(applyUndo.entries);
    setApplyUndo(null);
    setDirty(true);
  }

  // 換月份時清掉還原點與確認框，避免把 A 月的值復原到 B 月
  useEffect(()=>{ setApplyUndo(null); setApplyBox(null); }, [month]);

  // 有未儲存的薪資異動時，關閉分頁或重新整理前提醒（切換月份的提醒在 setMonth 處另外處理）
  useEffect(()=>{
    if(!dirty) return;
    const warn = e => { e.preventDefault(); e.returnValue = ''; };
    window.addEventListener('beforeunload', warn);
    return ()=> window.removeEventListener('beforeunload', warn);
  }, [dirty]);

  const rows = useMemo(()=> employees.map(emp=>{
    const entry = payrollEntries[emp.id] || emptyEntry();
    return {emp, entry, calc: calcForEmployee(emp, entry, settings, menstrualBaseline[emp.id]||{menstrual:0,sick:0}, month)};
  }), [employees, payrollEntries, settings, menstrualBaseline, month]);

  const needsMonth = ['records','requests','attendance','payroll','payslip','transfer'].includes(tab);

  function logout(){
    setToken(null);
    setSession(null);

  }
  if(checkingSession){

  }
  if(!session){
    return <LoginScreen onLoggedIn={setSession} />;
  }

  let lastGroup = null;

    <div className="app-shell">
      <div className={'sidebar' + (sidebarCollapsed ? ' collapsed' : '')}>

            <button className="ghost sm" style={{background:'transparent', color:'#EEEEEE', borderColor:'#454B55', justifyContent:'center', width:'100%'}} title="前往打卡頁面">
              <span className="material-icons" style={{fontSize:16}}>open_in_new</span>{!sidebarCollapsed && '前往打卡頁面'}
            </button>
          </a>
          <button className="ghost sm" style={{background:'transparent', color:'#EEEEEE', borderColor:'#454B55', justifyContent:'center'}} onClick={()=>{ if(confirm('確定要登出嗎？')) logout(); }} title="登出">
            <span className="material-icons" style={{fontSize:16}}>logout</span>{!sidebarCollapsed && '登出'}
          </button>
          {/* 版本識別。瀏覽器偶爾會抓著舊的 admin.html 不放，肉眼分不出手上是不是最新版；
              回報問題時附上這串，就能確認版本對不對（點一下可強制重載並清掉編譯快取）。 */}
          {!sidebarCollapsed && (
            <div className="build-tag" title="點一下強制重新載入最新版"

      <div className="main">

          <div style={{display:'flex', gap:10, alignItems:'center'}}>
            {dirty && <span className="badge warn"><span className="material-icons">warning</span>尚有未儲存的薪資異動</span>}
            {needsMonth && (
              <>
                <label style={{marginBottom:0}}>月份</label>
                <YearMonthPicker value={month} onChange={setMonth} />

            )}
            {dirty && <button onClick={savePayroll} disabled={saving}>{saving?'儲存中...':'儲存薪資紀錄'}</button>}

        </div>
        <div className="content">
          {tab==='dashboard' && <DashboardTab setTab={setTab}/>}
          {tab==='guide' && <GuideTab setTab={setTab}/>}
          {tab==='employees' && <EmployeesTab employees={employees} loading={employeesLoading} reload={reloadEmployees} onEdit={openEditEmployee} onNew={openNewEmployee} accountBox={accountBox} setAccountBox={setAccountBox} createAccountSubmit={createAccountSubmit}/>}
          {tab==='records' && <RecordsTab employees={employees} month={month}/>}
          {tab==='requests' && <RequestsTab month={month} employees={employees}/>}
          {tab==='annual' && <AnnualLeaveTab employees={employees}/>}
          {tab==='comp' && <CompLedgerTab employees={employees}/>}
          {/* allLocked 一起傳進去：這顆「套用」跟薪資頁那顆是同一支函式，
              按鈕的可用狀態也該一致，否則在彙總頁按下去只會跳出「沒有任何欄位需要變動」，
              讓人誤以為資料有問題，其實是該月已鎖定、本來就不會被覆蓋 */}
          {tab==='attendance' && <AttendanceTab month={month} onApply={applyAttendanceToPayroll}
            allLocked={rows.length>0 && rows.every(({entry})=>entry.locked)}/>}
          {tab==='payroll' && <PayrollTab employees={employees} rows={rows} setEntry={setEntry} month={month} loading={payrollLoading} onApply={applyAttendanceToPayroll} onUndoApply={applyUndo?undoApply:null} onSave={savePayroll} dirty={dirty} saving={saving} onEditEmployee={openEditEmployee} onReload={()=>reloadPayroll(month)} menstrualBaseline={menstrualBaseline}/>}
          {tab==='payslip' && <PayslipTab employees={employees} payrollEntries={payrollEntries} month={month} settings={settings} menstrualBaseline={menstrualBaseline}/>}
          {tab==='transfer' && <TransferTab rows={rows} month={month}/>}
          {tab==='register' && <PayrollRegisterTab/>}
          {tab==='insurance' && <InsuranceTab/>}
          {tab==='companies' && <CompanyTab/>}
          {tab==='departments' && <DepartmentTab employees={employees}/>}
          {tab==='shifts' && <ShiftTab employees={employees}/>}
          {tab==='holidays' && <HolidaysTab/>}
          {tab==='announcements' && <AnnouncementsTab/>}
          {tab==='accounts' && <AccountsTab employees={employees}/>}
          {tab==='settings' && <SettingsTab onSaved={reloadSettings} key={settingsCategory} initialCategory={settingsCategory}/>}
        </div>
      </div>
      {applyBox && (
        <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) setApplyBox(null); }}>
          <div className="modal" style={{width:560}}>
            <h3 style={{marginTop:0}}><span className="material-icons">sync_alt</span> 套用出缺勤時數</h3>
            {applyBox.changes.length===0 ? (
              <div className="hint" style={{padding:'10px 0'}}>
                打卡計算結果與目前薪資表的時數<b>完全相同</b>，沒有任何欄位需要變動。
              </div>
            ) : (
              <>
                <div className="hint" style={{marginBottom:8}}>
                  將以 {month} 的打卡紀錄重新計算，以下
                  <b> {new Set(applyBox.changes.map(c=>c.empId)).size} </b>人的
                  <b> {applyBox.changes.length} </b>個欄位會變動：
                </div>
                <div style={{maxHeight:280, overflowY:'auto', border:'1px solid var(--line)', borderRadius:6}}>
                  <table style={{fontSize:13}}>
                    <thead><tr><th className="left">姓名</th><th className="left">欄位</th><th>變動</th></tr></thead>
                    <tbody>
                      {applyBox.changes.map((c,i)=>(
                        <tr key={i}>
                          <td className="left">{c.name}</td>
                          <td className="left">{c.field}{c.wasManual && c.to===0 && <span className="badge warn" style={{marginLeft:6}}>手動值將被清掉</span>}</td>
                          <td className="mono center">
                            <span style={{color:'var(--muted)', textDecoration:'line-through'}}>{c.from}</span>
                            {' → '}
                            <b style={{color:'var(--brand)'}}>{c.to}</b>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="hint" style={{marginTop:8}}>
                  其餘 {applyBox.untouched} 人無變化。
                  {applyBox.lockedNames.length>0 && <> 已鎖定而略過：{applyBox.lockedNames.join('、')}。</>}
                  套用後可用工具列的「復原套用」一鍵還原，儲存前都有效。
                </div>
              </>
            )}
            <div className="modal-actions">
              <button className="ghost" onClick={()=>setApplyBox(null)}>取消</button>
              {applyBox.changes.length>0 && <button onClick={confirmApply}>確認套用</button>}
            </div>
          </div>
        </div>
      )}
      <EmployeeEditModal editing={editingEmployee} setEditing={setEditingEmployee} isNew={isNewEmployee} saving={savingEmployee} onSave={saveEmployee} companies={companies} departments={departments} shifts={shifts} settings={settings} onGoSettings={cat=>{ setEditingEmployee(null); setSettingsCategory(cat); setTab('settings'); }}/>
    </div>
  );
}

/* ========================= 員工資料 ========================= */
function EmployeeEditModal({editing, setEditing, isNew, saving, onSave, companies, departments, shifts, settings, onGoSettings}){

  const [resignPreviewLoading, setResignPreviewLoading] = useState(false);
  useEffect(()=>{ setResignPreview(null); }, [editing && editing.id]);
  async function loadResignPreview(){
    setResignPreviewLoading(true);
    try{
      const data = await apiGet('calcResignationLeaveSettlement', {employeeId: editing.id, resignDate: editing.resignDate, baseOverride: editing.baseSalary});
      setResignPreview(data);
    }catch(e){ alert(e.message); } finally{ setResignPreviewLoading(false); }

  return (
    <div className="modal-bg">
      <div className="modal modal-form">
        <h3><span className="material-icons">badge</span>{isNew ? '新增員工' : '編輯員工：' + editing.name}</h3>
        <div className="modal-body">
        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">person</span>基本資料</div>
        <div className="grid-2">
          <div className="field"><label>所屬公司</label>
            <select value={editing.companyId} onChange={e=>{ const c=companies.find(x=>x.id===e.target.value); setEditing({...editing, companyId:e.target.value, company: c?c.name:''}); }}>
              <option value="">請選擇</option>
              {companies.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <div className="field"><label>部門</label>
            <select value={editing.departmentId} onChange={e=>{ const d=departments.find(x=>x.id===e.target.value); setEditing({...editing, departmentId:e.target.value, department: d?d.name:''}); }}>
              <option value="">請選擇</option>
              {departments.filter(d=>!editing.companyId || d.companyId===editing.companyId).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div className="field"><label>姓名 *</label><input value={editing.name} onChange={e=>setEditing({...editing, name:e.target.value})} /></div>
          <div className="field"><label>手機</label><input value={editing.phone} onChange={e=>setEditing({...editing, phone:e.target.value})} placeholder="09xxxxxxxx" /></div>
          <div className="field"><label>身分證字號</label><input value={editing.nationalId} onChange={e=>setEditing({...editing, nationalId:e.target.value})} placeholder="A123456789" /></div>
          {/* 性別下拉本身很窄，右半邊是空的，生日就放在同一格右側 */}
          <div className="field"><label>性別 / 生日</label>
            <div style={{display:'flex', gap:6}}>
              <select style={{flex:'0 0 34%', minWidth:0}} value={editing.gender||''} onChange={e=>setEditing({...editing, gender:e.target.value})}>
                <option value="">不提供</option>
                <option value="女">女</option>
                <option value="男">男</option>
              </select>
              <input type="date" style={{flex:'1 1 auto', minWidth:0}} value={editing.birthday||''} onChange={e=>setEditing({...editing, birthday:e.target.value})} />
            </div>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}><label>戶籍地</label><input value={editing.householdAddress} onChange={e=>setEditing({...editing, householdAddress:e.target.value})} style={{width:'100%'}} /></div>
        </div>
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">event_available</span>任職與出勤</div>
        <div className="grid-2">
          <div className="field"><label>到職日</label><input type="date" value={editing.hireDate} onChange={e=>setEditing({...editing, hireDate:e.target.value})} /></div>
          <div className="field">
            <label>離職日</label>
            <input type="date" value={editing.resignDate||''} onChange={e=>{ setEditing({...editing, resignDate:e.target.value, status: e.target.value ? '離職' : editing.status}); setResignPreview(null); }} />
            <div className="hint" style={{marginTop:4}}>有填離職日時，勞保費當月按在職日數比例計算，健保費則看月底當天是否仍在職（在職才收整月保費）</div>
            {editing.resignDate && editing.hireDate && !isNew && (
              <div style={{marginTop:6}}>
                <button type="button" className="ghost sm" disabled={resignPreviewLoading} onClick={loadResignPreview}>
                  <span className="material-icons" style={{fontSize:14}}>calculate</span>{resignPreviewLoading?'試算中...':'試算特休結算'}
                </button>
                {resignPreview && (
                  <div className="hint" style={{marginTop:6, background:'var(--bg-soft, #f5f5f5)', padding:8, borderRadius:6, lineHeight:1.7}}>
                    週年制重新計算期間：{resignPreview.periodStart} ～ {resignPreview.periodEnd}<br/>
                    應有 {trimNum(resignPreview.entitledDays,1)} 日，已休 {trimNum(resignPreview.usedDays,1)} 日，可結算 {trimNum(resignPreview.settleDays,1)} 日（{trimNum(resignPreview.settleHours,1)} 小時）<br/>
                    {resignPreview.overUsed && <span style={{color:'var(--danger)'}}>⚠ 已超休 {resignPreview.overDays} 日，公司不能扣薪，結算金額以0計<br/></span>}
                    以本薪 {money(editing.baseSalary)} 估算，結算金額約 <b>{money(resignPreview.settlePay)}</b> 元
                    <div style={{marginTop:4, color:'var(--muted, #888)'}}>正式金額請至「薪資結算」頁該員工當月薪資列，按同樣的試算按鈕帶入。</div>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="field">
            <label>年資中斷起（選填）</label>
            <input type="month" value={editing.tenureBreakStart||''} onChange={e=>setEditing({...editing, tenureBreakStart:e.target.value})} />
          </div>
          <div className="field">
            <label>年資中斷迄（選填）</label>
            <input type="month" value={editing.tenureBreakEnd||''} onChange={e=>setEditing({...editing, tenureBreakEnd:e.target.value})} />
            <div className="hint" style={{marginTop:4}}>員工曾離職又復職時填寫，這段期間會從特休年資中扣除，不影響上面的到職日顯示</div>
          </div>

          <div className="field"><label>班別</label>
            <select value={editing.shiftId} onChange={e=>setEditing({...editing, shiftId:e.target.value})}>
              <option value="">依系統預設班別</option>
              {shifts.map(s=><option key={s.id} value={s.id}>{s.name}（{s.workStart}-{s.workEnd}）</option>)}
            </select>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}>
            <label>員工類型</label>
            <select value={editing.employeeType || '正式員工'} onChange={e=>setEditing({...editing, employeeType:e.target.value})} style={{width:'100%'}}>
              <option value="正式員工">正式員工（受僱勞工，需打卡，適用特休與加班費）</option>
              <option value="負責人">負責人（委任關係非勞工，不需出勤紀錄，不適用特休與加班費）</option>
              <option value="非正式員工">非正式員工（外包／兼職，不需打卡）</option>
            </select>
            <div className="hint" style={{marginTop:4}}>
              {(editing.employeeType && editing.employeeType !== '正式員工')
                ? '此類型已自動視為免打卡，不列入出缺勤彙總、今日打卡統計與特休試算。'
                : '正式員工需打卡；若個別情況不需打卡（例如外派、彈性工時），可另外勾選下方的免打卡。'}
            </div>
          </div>
        </div>
        <label className="check-row">
          <input type="checkbox" checked={editing.exemptFromAttendance === true} onChange={e=>setEditing({...editing, exemptFromAttendance:e.target.checked})} />
          <span>免打卡（個別例外用；不列入出缺勤彙總與薪資自動試算，薪資項目需手動填寫）</span>
        </label>
        <label className="check-row">
          <input type="checkbox" checked={editing.canBeDelegate !== false} onChange={e=>setEditing({...editing, canBeDelegate:e.target.checked})} />
          <span>可被員工指定為請假代理人</span>
        </label>
        {editing.hireDate && <div className="fs-note">{tenureText(editing.hireDate, editing.tenureBreakStart, editing.tenureBreakEnd)}</div>}
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">health_and_safety</span>投保與健保</div>
        <div className="grid-2">
          <div className="field">
            <label>投保級距</label>
            <div style={{display:'flex', gap:6}}>
              <select value={editing.insuranceGrade} onChange={e=>setEditing({...editing, insuranceGrade:Number(e.target.value)})} style={{flex:1}}>
                <option value={0}>未設定</option>
                {INSURANCE_TABLE.map(r=><option key={r.grade} value={r.grade}>{r.grade.toLocaleString()}</option>)}
              </select>
              <button type="button" className="ghost sm" onClick={()=>setEditing({...editing, insuranceGrade: suggestGrade(insuranceBase(editing, settings))})} title="依投保基準建議級距">依基準建議</button>
            </div>
            {(()=>{
              const d = insuranceBaseDetail(editing, settings);
              const sug = suggestGrade(d.base);
              return (
                <div className="hint" style={{marginTop:6}}>
                  <div style={{display:'grid', gridTemplateColumns:'auto 1fr', columnGap:10, rowGap:3, maxWidth:240}}>
                    <span>本薪合計</span>
                    <span className="mono" style={{textAlign:'right'}}>{money(editing.baseSalary)}</span>
                    {d.deducted.map(x=>(
                      <React.Fragment key={x.label}>
                        <span>− {x.label}</span>
                        <span className="mono" style={{textAlign:'right'}}>{money(x.amount)}</span>
                      </React.Fragment>
                    ))}
                    <span style={{borderTop:'1px solid var(--line)', paddingTop:3, fontWeight:600}}>投保基準</span>
                    <span className="mono" style={{borderTop:'1px solid var(--line)', paddingTop:3, textAlign:'right', fontWeight:600}}>{money(d.base)}</span>
                    <span style={{fontWeight:600, color: sug===Number(editing.insuranceGrade) ? 'inherit' : 'var(--danger)'}}>建議級距</span>
                    <span className="mono" style={{textAlign:'right', fontWeight:600, color: sug===Number(editing.insuranceGrade) ? 'inherit' : 'var(--danger)'}}>{sug.toLocaleString()}</span>
                  </div>
                  <div style={{marginTop:5}}>
                    扣除項目可在
                    <a href="#" onClick={e=>{e.preventDefault(); onGoSettings && onGoSettings('leave');}} style={{color:'var(--brand)', textDecoration:'underline', margin:'0 2px'}}>系統設定 → 請假與獎金規則</a>
                    調整（會離開此畫面，未儲存的變更會遺失）。實際級距以向勞保局申報的值為準，建議值僅供對照。
                  </div>
                </div>
              );
            })()}
          </div>
          {/* 兩個健保欄位包成同一格：投保級距那格較高，若各佔一格會被 grid 擠到下一列的左欄，
              與健保眷屬人數分開很不直覺。包起來就會一起留在右欄、上下排列。 */}
          <div>
            <div className="field">
              <label>健保眷屬人數（不含本人）</label>
              <input type="number" min="0" max="3" value={editing.dependentCount} onChange={e=>setEditing({...editing, dependentCount:Number(e.target.value)})} />
              <div className="hint" style={{marginTop:4}}>健保費＝一口金額 ×（本人 1 口 ＋ 應繳眷屬口數），眷屬超過 3 口以 3 口計。健保繳費表上的「人數」是含本人的，這裡要填不含本人的眷屬數。</div>
            </div>
            <div className="field">
              <label>其中免繳保費的眷屬人數</label>
              <input type="number" min="0" max="3" value={editing.exemptDependentCount || 0} onChange={e=>setEditing({...editing, exemptDependentCount:Number(e.target.value)})} />
              <div className="hint" style={{marginTop:4}}>
                眷屬中保費由政府補助、不需繳費的人數，例如<b>65 歲以上且設籍的縣市有補助</b>、或具低收入戶等身分。
                這些眷屬仍在保，只是不必為他們繳費，所以從應繳口數扣除，<b>不要用少填眷屬人數的方式處理</b>（會讓投保人數失真）。
                目前應繳 <b>{Math.max(0, Math.min(n(editing.dependentCount),3) - n(editing.exemptDependentCount)) + 1}</b> 口（本人 1 ＋ 眷屬 {Math.max(0, Math.min(n(editing.dependentCount),3) - n(editing.exemptDependentCount))}）。
              </div>
              <div className="hint" style={{marginTop:4}}>眷屬保費同本人金額，超過3人一律以3人計算</div>
            </div>
          </div>
        </div>
        </div>

        <div className="grid-2">
          <div className="field"><label>本薪</label><input type="number" value={editing.baseSalary} onChange={e=>setEditing({...editing, baseSalary:Number(e.target.value)})} /></div>

          <div className="field"><label>伙食津貼</label><input type="number" value={editing.mealAllowance} onChange={e=>setEditing({...editing, mealAllowance:Number(e.target.value)})} /></div>
          {/* 交通津貼與計算方式併成同一格，金額在左、方式在右，不各佔一格 */}
          <div className="field">
            <label>{editing.transportAllowanceMode==='daily' ? '交通津貼（每日補貼金額）' : '交通津貼'}</label>
            <div style={{display:'flex', gap:6}}>
              <input type="number" style={{flex:'1 1 90px', minWidth:0}} value={editing.transportAllowance} onChange={e=>setEditing({...editing, transportAllowance:Number(e.target.value)})} />
              <select style={{flex:'0 0 auto', width:'auto'}} value={editing.transportAllowanceMode||'fixed'} onChange={e=>setEditing({...editing, transportAllowanceMode:e.target.value})}>
                <option value="fixed">固定／月</option>
                <option value="daily">依出勤日數</option>
              </select>
            </div>
            {editing.transportAllowanceMode==='daily' && <div className="hint" style={{marginTop:4}}>系統會用「套用出缺勤時數」抓當月實際出勤日數 × 這個金額，自動算出當月交通津貼</div>}
          </div>
          <div className="field"><label>職務加給</label><input type="number" value={editing.positionAllowance} onChange={e=>setEditing({...editing, positionAllowance:Number(e.target.value)})} /></div>
          <div className="field"><label>全勤獎金（固定）</label><input type="number" value={editing.fullAttendanceBonus} onChange={e=>setEditing({...editing, fullAttendanceBonus:Number(e.target.value)})} /></div>
        </div>
        {editing.baseSalary>0 && (n(editing.baseSalary)+n(editing.mealAllowance)+n(editing.transportAllowance)+n(editing.positionAllowance)) < MIN_WAGE_MONTHLY && (
          <div className="hint" style={{color:'var(--danger)'}}>⚠ 本薪＋伙食＋交通＋職務加給合計 {money(n(editing.baseSalary)+n(editing.mealAllowance)+n(editing.transportAllowance)+n(editing.positionAllowance))} 元，低於2026年最低工資 {money(MIN_WAGE_MONTHLY)} 元，可能違反《最低工資法》（全勤獎金為條件式給予，不列入計算基準）</div>
        )}
        <div className="fs-note">依2026年新制《勞工請假規則》第9條，婚假、喪假、公傷病假、公假、生理假、家庭照顧事假等法定假別不得作為扣發全勤獎金的理由。病假、事假、遲到、早退依「設定」頁的比例規則自動扣除（不是全有全無），這裡填的是正常整月應發的金額。</div>
        </div>

        <div className="fieldset">
        <div className="fs-title"><span className="material-icons">account_balance</span>匯款與備註</div>
        <div className="grid-2">
          {/* 銀行與帳號併成同一格：銀行名稱較短放左，帳號放右 */}
          <div className="field" style={{gridColumn:'span 2'}}><label>銀行 / 帳號</label>
            <div style={{display:'flex', gap:6}}>
              <input style={{flex:'0 0 30%', minWidth:0}} placeholder="銀行" value={editing.bankName} onChange={e=>setEditing({...editing, bankName:e.target.value})} />
              <input style={{flex:'1 1 auto', minWidth:0}} placeholder="帳號" value={editing.bankAccount} onChange={e=>setEditing({...editing, bankAccount:e.target.value})} />
            </div>
          </div>
          <div className="field" style={{gridColumn:'span 2'}}><label>備註</label><input value={editing.note} onChange={e=>setEditing({...editing, note:e.target.value})} style={{width:'100%'}} /></div>
        </div>
        </div>
        </div>
        <div className="modal-actions">
          <button className="ghost" onClick={()=>setEditing(null)}>取消</button>
          <button onClick={onSave} disabled={saving}>{saving?'儲存中...':'儲存'}</button>
        </div>
      </div>
    </div>
  );
}
