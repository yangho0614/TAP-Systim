/* ========================= 打卡位置地圖 ========================= */
function PunchMap({companyLat, companyLng, radius, deviceLat, deviceLng, companyName}){
  const mapDivRef = useRef(null);
  const mapObjRef = useRef(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    let cancelled = false;
    loadGoogleMaps().then(()=>{
      if(cancelled || !mapDivRef.current) return;
      const hasCompany = companyLat && companyLng;
      const center = hasCompany ? {lat:Number(companyLat), lng:Number(companyLng)} : (deviceLat ? {lat:deviceLat, lng:deviceLng} : {lat:25.0330, lng:121.5654});
      const map = new google.maps.Map(mapDivRef.current, {
        center, zoom:17, disableDefaultUI:false, streetViewControl:false, mapTypeControl:false, fullscreenControl:false,
        styles:[
          {elementType:'geometry', stylers:[{color:'#222831'}]},
          {elementType:'labels.text.stroke', stylers:[{color:'#222831'}]},
          {elementType:'labels.text.fill', stylers:[{color:'#9CA3AC'}]},
          {featureType:'road', elementType:'geometry', stylers:[{color:'#393E46'}]},
          {featureType:'water', elementType:'geometry', stylers:[{color:'#2C3540'}]},
          {featureType:'poi', elementType:'geometry', stylers:[{color:'#2A3138'}]}
        ]
      });
      mapObjRef.current = map;
      if(hasCompany){
        const companyPos = {lat:Number(companyLat), lng:Number(companyLng)};
        // 公司標記＝湖水藍膠囊徽章（公事包圖示＋「公司」），下方尖角指出實際座標。
        // 「我的位置」維持米金色小圓點，兩者「形狀」就不同，不必靠顏色分辨。
        // ⚠️ 文字不畫在 SVG 裡：SVG 當成圖片載入時，中文字型不一定會被解析，
        //    不同瀏覽器可能變成方框或直接不顯示。膠囊與圖示用 SVG，「公司」兩字交給
        //    Google Maps 的 label（由瀏覽器以 DOM 繪製），中文一定正常。
        const PIN_W = 78, PIN_H = 30, TAIL = 8;
        const pinSvg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="' + PIN_W + '" height="' + (PIN_H + TAIL) + '">' +
            '<rect x="1" y="1" width="' + (PIN_W - 2) + '" height="' + (PIN_H - 2) + '" rx="' + ((PIN_H - 2) / 2) + '"' +
              ' fill="#00ADB5" stroke="#EEEEEE" stroke-width="2"/>' +
            '<path d="M' + (PIN_W / 2 - 6) + ',' + (PIN_H - 1) + ' h12 l-6,' + (TAIL - 1) + ' z" fill="#00ADB5"/>' +
            // 公事包（Material 的 work，縮到 14px 置於左側）
            '<g transform="translate(10,8) scale(0.583)" fill="#08343a">' +
              '<path d="M20 6h-4V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-6 0h-4V4h4v2z"/>' +
            '</g>' +
          '</svg>';
        new google.maps.Marker({
          position:companyPos, map, title:companyName || '公司位置',
          icon:{
            url:'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(pinSvg),
            scaledSize:new google.maps.Size(PIN_W, PIN_H + TAIL),
            // anchor 設在尖角，圖示才會「指」在座標上而不是壓在座標上
            anchor:new google.maps.Point(PIN_W / 2, PIN_H + TAIL),
            // Icon（非 Symbol）的 labelOrigin 單位是像素，相對圖片左上角。
            // 往右偏一點避開左側的公事包圖示。
            labelOrigin:new google.maps.Point(PIN_W / 2 + 8, PIN_H / 2)
          },
          label:{ text:'公司', color:'#08343a', fontSize:'13px', fontWeight:'800', className:'map-pin-label' },
          zIndex: 2
        });
        const circle = new google.maps.Circle({
          center:companyPos, radius:Number(radius||200), map,
          fillColor:'#00ADB5', fillOpacity:0.12, strokeColor:'#00ADB5', strokeOpacity:0.6, strokeWeight:1.5
        });
        // 用圍籬本身的範圍決定縮放，而不是寫死 zoom:17。
        // 寫死的話半徑一改（系統設定可調）畫面就不對——半徑大就爆出畫面、半徑小就過遠。
        const bounds = circle.getBounds();
        if(deviceLat && deviceLng) bounds.extend({lat:deviceLat, lng:deviceLng}); // 人在圍籬外時也要看得到自己
        // ⚠️ padding 必須依容器高度按比例算，不能寫死像素：
        // 地圖是滿版鋪底，上方的今日打卡狀態面板與下方的時鐘＋打卡按鈕面板都蓋在它上面，
        // 實際看得到的只有中間那條。手機與桌機的面板高度佔比差很多，固定像素在小螢幕會
        // 把圓圈推到面板底下（就是原本圓圈下緣被時鐘吃掉的原因）。
        const h = mapDivRef.current.offsetHeight || 640;
        const w = mapDivRef.current.offsetWidth || 360;
        map.fitBounds(bounds, {
          top: Math.round(h * 0.22),      // 上方狀態面板
          bottom: Math.round(h * 0.46),   // 下方時鐘與打卡按鈕面板（較高）
          left: Math.round(w * 0.08),
          right: Math.round(w * 0.08)
        });
        // 圍籬很小時 fitBounds 會放到最大，街景細節反而干擾判讀，設個上限
        google.maps.event.addListenerOnce(map, 'idle', ()=>{ if(map.getZoom() > 17) map.setZoom(17); });
      }
      if(deviceLat && deviceLng){
        new google.maps.Marker({
          position:{lat:deviceLat, lng:deviceLng}, map, title:'我的位置',
          icon:{path:google.maps.SymbolPath.CIRCLE, scale:7, fillColor:'#E6D59A', fillOpacity:1, strokeColor:'#222831', strokeWeight:2}
        });
      }
      setLoading(false);
    }).catch(e=>{ if(!cancelled){ setError(e.message); setLoading(false); } });
    return ()=>{ cancelled = true; };
  }, [companyLat, companyLng, radius, deviceLat, deviceLng, companyName]);

  if(error){
    return (
      <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center', padding:20, textAlign:'center'}} className="hint">
        地圖無法顯示（{error}），不影響打卡功能正常使用。
      </div>
    );
  }
  return (
    <>
      {loading && <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center'}} className="hint">地圖載入中...</div>}
      <div ref={mapDivRef} style={{position:'absolute', inset:0, opacity:loading?0:1}}></div>
    </>
  );
}

function PunchPage({session, status, refreshStatus, showToast, settings}){
  const now = useClock();
  const [modal, setModal] = useState(null); // 'in'|'out'|'outgo'|'return'
  const [deviceLoc, setDeviceLoc] = useState(null);
  const [locState, setLocState] = useState('idle'); // idle|loading

  // ⚠️ 刻意「不」在進頁面時自動定位。iOS Safari 對一般網頁的定位授權大約一天就過期，
  //    自動定位等於每天一進打卡頁（就算只是看一眼今天打了沒）都被要求授權一次。
  //    位置只在兩種時機取得：使用者主動按「顯示我的位置」，或真正按下打卡確認時。
  async function showMyLocation(){
    setLocState('loading');
    const loc = await getLocation();
    setLocState('idle');
    if(loc.lat) setDeviceLoc(loc);
    else showToast(loc.error || '無法取得定位', 'err');
  }

  const LABEL = {in:'上班打卡', out:'下班打卡', outgo:'外出', 'return':'返回'};
  // 失敗卡片上的「重新打卡」要回到同一種，由顯示名稱反查
  function punchTypeOf(label){ return Object.keys(LABEL).find(k=>LABEL[k]===label) || 'in'; }
  const ACTION = {in:'clockIn', out:'clockOut', outgo:'clockOutgo', 'return':'clockReturn'};
  const CLS = {in:'in', out:'out', outgo:'mid', 'return':'mid'};

  const [punchResult, setPunchResult] = useState(null); // 打卡結果卡：phase 為 sending / ok / fail
  // 樂觀鎖：按下去就先當作已打卡，讓按鈕立刻反灰；失敗時才解除
  const [optimistic, setOptimistic] = useState({});

  /* 樂觀 UI：按下確認就**立刻**關掉視窗、把時間顯示出來，定位與送出在背景做。
     員工不必盯著轉圈等 GAS（閒置後第一次要 2.5～15 秒）。

     ⚠️ 但打卡不能做成「純樂觀」—— 員工看到成功就把手機收起來走了，
        實際上失敗的話他不會知道，那比讓他等 5 秒嚴重得多。
        所以分三態，而且視覺上要分得夠開：
          送出中（灰藍、轉圈）→ 完成（綠、打勾）／失敗（紅、可重試）
        只有綠色打勾才代表完成。

     ⚠️ 卡片先顯示的是「按下當下」的時間，成功後會用後端回傳的真實時間覆蓋。
        **不把前端時間送給後端**：出勤時間是薪資與勞檢的依據，一旦可由前端指定
        就等於開了竄改的門。兩者通常只差一兩秒。 */
  async function confirmPunch(){
    const type = modal;
    const pressedAt = new Date();
    setModal(null);
    setOptimistic(o=>({...o, [type]: true}));          // 立刻鎖住按鈕，避免重複送出
    setPunchResult({label: LABEL[type], time: hhmm(pressedAt.toISOString()), issues: [], phase: 'sending'});

    const loc = await getLocation();
    if(loc.lat) setDeviceLoc(loc);
    try{
      const data = await apiPost(ACTION[type], {employeeId: session.employeeId, lat: loc.lat, lng: loc.lng, source:'mobile'});
      const tag = String(data.statusTag || '');
      // 把後端回傳的狀態字串拆成可個別呈現的異常項目
      const issues = [];
      const mDist = tag.match(/超出範圍約([^、]+)/);
      if(mDist) issues.push({icon:'wrong_location', title:'超出打卡範圍', value:mDist[1], note:'若因公外出，請主動向主管說明'});
      const mLate = tag.match(/遲到(\d+)分鐘/);
      if(mLate) issues.push({icon:'schedule', title:'遲到', value:mLate[1]+' 分鐘', note:'遲到會依比例影響全勤獎金'});
      const mEarly = tag.match(/早退(\d+)分鐘/);
      if(mEarly) issues.push({icon:'logout', title:'早退', value:mEarly[1]+' 分鐘', note:'早退會依比例影響全勤獎金'});
      if(tag.indexOf('未取得定位')===0) issues.push({icon:'location_off', title:'未取得定位', value:'—', note:'系統已記錄，但無法確認打卡地點'});

      setPunchResult({label: LABEL[type], time: hhmm(data.time) || hhmm(pressedAt.toISOString()),
                      issues, distance: data.distance, phase: 'ok'});
      refreshStatus();
    }catch(e){
      // 失敗要很明顯：把樂觀鎖解除、卡片轉紅並留在畫面上，不用一閃即逝的 toast
      setOptimistic(o=>({...o, [type]: false}));
      setPunchResult({label: LABEL[type], time: hhmm(pressedAt.toISOString()), issues: [],
                      phase: 'fail', error: e.message});
    }
  }

  const dateStr = `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}　星期${'日一二三四五六'[now.getDay()]}`;
  /* 把「按下但還沒回來」的打卡疊在後端狀態之上，按鈕才會立刻反應。
     時間顯示也一樣：送出當下就先秀出來（淡化＋轉圈），成功後由 refreshStatus 換成真實值。
     ⚠️ 這只是畫面上的樂觀，後端仍以它自己記的時間為準，失敗時 optimistic 會被清掉。 */
  const optTime = punchResult && punchResult.phase==='sending' ? punchResult.time : null;
  const eff = {
    clockedIn:  !!status?.clockedIn  || !!optimistic.in,
    clockedOut: !!status?.clockedOut || !!optimistic.out,
    outgoTime:  status?.outgoTime  || (optimistic.outgo ? 'opt' : null),
    returnTime: status?.returnTime || (optimistic['return'] ? 'opt' : null),
  };
  const canOutgo = eff.clockedIn && !eff.clockedOut && !eff.outgoTime;
  const canReturn = eff.clockedIn && !eff.clockedOut && eff.outgoTime && !eff.returnTime;
  // 該格若正在送出中，顯示按下當下的時間並淡化，代表「還沒確認」
  function cellTime(realTime, key){
    if(realTime) return hhmm(realTime);
    if(optimistic[key] && optTime) return <span style={{opacity:.6}}>{optTime}</span>;
    return hhmm(realTime);
  }

  return (
    <div className="page">
      {punchResult && (()=>{
        /* 三態的顏色與文案。送出中刻意用「中性的藍灰」而不是綠色 ——
           綠色代表完成，送出中若也是綠的，員工會以為已經好了就走人。 */
        const ph = punchResult.phase || 'ok';
        const warn = ph==='ok' && punchResult.issues.length>0;
        const skin = ph==='sending' ? {bg:'#243447', bd:'#3f5a78', ic:'#8fb8e0', icon:null}
                   : ph==='fail'    ? {bg:'#4a2424', bd:'#8a4040', ic:'#e08a8a', icon:'error'}
                   : warn           ? {bg:'#4a3423', bd:'#8a6b3d', ic:'#e0b45c', icon:'warning'}
                                    : {bg:'#1f3d2e', bd:'#3d7a5c', ic:'#7fcba6', icon:'check_circle'};
        const title = ph==='sending' ? `${punchResult.label}　${punchResult.time}`
                    : ph==='fail'    ? `${punchResult.label}失敗`
                                     : `${punchResult.label}完成　${punchResult.time}`;
        return (
        <div style={{position:'fixed', left:12, right:12, bottom:78, zIndex:60}}
             onClick={()=>{ if(ph!=='sending') setPunchResult(null); }}>
          <div style={{
            background: skin.bg, border:'1px solid ' + skin.bd,
            borderRadius:14, padding:'14px 16px', boxShadow:'0 10px 28px rgba(0,0,0,.45)'
          }}>
            <div style={{display:'flex', alignItems:'center', gap:9, marginBottom: (punchResult.issues.length||ph==='fail')?9:0}}>
              {skin.icon
                ? <span className="material-icons" style={{fontSize:22, color: skin.ic}}>{skin.icon}</span>
                : <span className="spinner" style={{width:18, height:18, borderColor:'rgba(255,255,255,.25)', borderTopColor: skin.ic}}></span>}
              <div style={{flex:1}}>
                <div style={{fontWeight:700, fontSize:15}}>{title}</div>
                {ph==='sending' && <div style={{fontSize:12, opacity:.75, marginTop:1}}>送出中，請等綠色勾勾出現再離開</div>}
                {ph==='fail' && <div style={{fontSize:12, opacity:.85, marginTop:1}}>{punchResult.error || '請重新打卡'}</div>}
                {ph==='ok' && !punchResult.issues.length && <div style={{fontSize:12, opacity:.75, marginTop:1}}>位置正常，無異常紀錄</div>}
              </div>
              {ph!=='sending' && <span className="material-icons" style={{fontSize:18, opacity:.5}}>close</span>}
            </div>
            {ph==='fail' && (
              <div style={{paddingTop:9, borderTop:'1px solid rgba(255,255,255,.12)'}}>
                <button className="go" style={{width:'100%'}} onClick={ev=>{ ev.stopPropagation(); setPunchResult(null); setModal(punchTypeOf(punchResult.label)); }}>
                  重新{punchResult.label}
                </button>
              </div>
            )}
            {punchResult.issues.map((x,i)=>(
              <div key={i} style={{display:'flex', gap:10, alignItems:'flex-start', paddingTop:9, borderTop:'1px solid rgba(255,255,255,.12)'}}>
                <span className="material-icons" style={{fontSize:18, opacity:.8, marginTop:2}}>{x.icon}</span>
                <div style={{flex:1}}>
                  <div style={{display:'flex', alignItems:'baseline', gap:7}}>
                    <span style={{fontSize:19, fontWeight:700, fontVariantNumeric:'tabular-nums'}}>{x.value}</span>
                    <span style={{fontSize:13}}>{x.title}</span>
                  </div>
                  <div style={{fontSize:11.5, opacity:.72, marginTop:1}}>{x.note}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        );
      })()}
      <div className="punch-hero" style={{position:'relative', overflow:'hidden', minHeight:480, background:'var(--bg-1)'}}>
        <PunchMap companyLat={settings?.lat} companyLng={settings?.lng} radius={settings?.radius} deviceLat={deviceLoc?.lat} deviceLng={deviceLoc?.lng} companyName={session?.employee?.company} />

        <button onClick={showMyLocation} disabled={locState==='loading'} style={{
          position:'absolute', right:14, top:'31%', display:'flex', alignItems:'center', gap:6,
          background:'rgba(57,62,70,0.86)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)',
          border:'1px solid var(--line)', borderRadius:999, padding:'8px 13px 8px 11px',
          color: deviceLoc ? 'var(--gold)' : 'var(--text)', fontSize:12.5, fontWeight:600,
          boxShadow:'0 6px 16px rgba(0,0,0,.38)', cursor:'pointer', opacity: locState==='loading' ? .7 : 1, zIndex:2
        }}>
          {locState==='loading'
            ? <span className="spinner"></span>
            : <span className="material-icons" style={{fontSize:17}}>my_location</span>}
          {locState==='loading' ? '定位中…' : (deviceLoc ? '重新定位' : '顯示我的位置')}
        </button>

        <div style={{position:'absolute', left:8, right:8, top:8, background:'rgba(57,62,70,0.8)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:'1px solid var(--line)', borderRadius:14, padding:'12px 14px', boxShadow:'0 8px 20px rgba(0,0,0,.4)'}}>
          <div className="status-grid" style={{marginTop:0}}>
            <div className="status-cell"><div className="lbl">上班</div><div className="val">{cellTime(status?.checkInTime, 'in')}</div></div>
            <div className="status-cell"><div className="lbl">下班</div><div className="val">{cellTime(status?.checkOutTime, 'out')}</div></div>
            <div className="status-cell"><div className="lbl">外出</div><div className="val">{cellTime(status?.outgoTime, 'outgo')}</div></div>
            <div className="status-cell"><div className="lbl">返回</div><div className="val">{cellTime(status?.returnTime, 'return')}</div></div>
          </div>
          <div className="hint" style={{marginTop:8}}>打卡位置如超出公司設定範圍，仍會完成打卡，但需經管理者核對。</div>
        </div>

        <div style={{position:'absolute', left:8, right:8, bottom:8, background:'rgba(57,62,70,0.8)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', border:'1px solid var(--line)', borderRadius:14, padding:'14px', boxShadow:'0 10px 28px rgba(0,0,0,.4)'}}>
          <div className="clock-big" style={{margin:'2px 0 12px 0'}}>
            <div className="time">{pad(now.getHours())}:{pad(now.getMinutes())}:{pad(now.getSeconds())}</div>
            <div className="date">{dateStr}</div>
          </div>

          {!status && !optimistic.in ? (
            <div className="hint" style={{textAlign:'center'}}>載入打卡狀態中...</div>
          ) : !eff.clockedIn ? (
            <button className="big-btn in" onClick={()=>{setModal('in');}}><span className="material-icons">login</span>上班打卡</button>
          ) : !eff.clockedOut ? (
            <button className="big-btn out" onClick={()=>{setModal('out');}}><span className="material-icons">logout</span>下班打卡</button>
          ) : (
            <button className="big-btn done"><span className="material-icons">check_circle</span>今日已完成打卡</button>
          )}

          <div className="sub-btn-row">
            <button className="sub-btn" disabled={!canOutgo} onClick={()=>{setModal('outgo');}}>
              <span className="material-icons">directions_walk</span>外出
            </button>
            <button className="sub-btn" disabled={!canReturn} onClick={()=>{setModal('return');}}>
              <span className="material-icons">keyboard_return</span>返回
            </button>
          </div>
        </div>
      </div>

      {modal && (
        <div className="modal-bg" onClick={e=>{ if(e.target===e.currentTarget) setModal(null); }}>
          <div className="modal punch-confirm">
            <div style={{fontSize:17, fontWeight:700}}>{session.employee?.name}</div>
            <div className={'action-label ' + CLS[modal]}>{LABEL[modal]}</div>
            <div className="time">{pad(now.getHours())}:{pad(now.getMinutes())}:{pad(now.getSeconds())}</div>
            <div className="hint" style={{minHeight:18, marginBottom:14}}>請確認後按下確認</div>
            <div className="modal-actions" style={{marginTop:4}}>
              <button className="stay" onClick={()=>setModal(null)}>取消</button>
              <button className="go" onClick={confirmPunch}>確認{LABEL[modal]}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 表單頁（請假/換補休/審核） ========================= */
function FormsPage({session, isManager, pending, refreshPending, showToast, settings}){
  const [myList, setMyList] = useState([]);
  const [balances, setBalances] = useState(null);
  const [loading, setLoading] = useState(true);
  const [leaveBox, setLeaveBox] = useState(null);
  const [compBox, setCompBox] = useState(null);
  const [reviewBox, setReviewBox] = useState(null); // {req, mode:'approve'|'reject', comment}
  const [busy, setBusy] = useState(false);
  const [colleagues, setColleagues] = useState([]);
  const [pickerFor, setPickerFor] = useState(null); // 'start' | 'end' | null
  const [menstrualStatus, setMenstrualStatus] = useState(null);
  const [quotas, setQuotas] = useState(null);      // 法定假別的已用／上限
  const [showLeaveRules, setShowLeaveRules] = useState(false);
  const [myOvertime, setMyOvertime] = useState(null);

  const unit = Number(settings?.leaveUnit) || 1;
  const shift = session.employee?.shift;
  function safeHHMM(v, fallback){
    if(typeof v !== 'string') return fallback;
    const m = v.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return fallback;
    return m[1].padStart(2,'0') + ':' + m[2];
  }
  const shiftStart = safeHHMM(shift?.workStart, safeHHMM(settings?.workStart, '09:00'));
  const shiftEnd = safeHHMM(shift?.workEnd, safeHHMM(settings?.workEnd, '18:00'));

  function roundToUnit(h){
    return Math.round(h / unit) * unit;
  }
  function computeHours(startDT, endDT){
    if(!startDT || !endDT) return '';
    const start = new Date(startDT);
    const end = new Date(endDT);
    if(isNaN(start.getTime()) || isNaN(end.getTime()) || end<=start) return '';
    let diff = (end-start)/3600000;
    // 若請假時段橫跨午休(12:00~13:00)，自動扣除班別設定的午休分鐘數
    const startMin = start.getHours()*60 + start.getMinutes();
    const endMin = end.getHours()*60 + end.getMinutes();
    if(startMin < 12*60 && endMin >= 13*60){
      const lunchMin = shift ? shift.lunchBreak : (settings?.lunchBreak || 60);
      diff -= (Number(lunchMin) || 0) / 60;
    }
    return roundToUnit(Math.max(0, diff));
  }
  function updateLeaveField(patch){
    const next = {...leaveBox, ...patch};
    const auto = computeHours(next.startDT, next.endDT);
    if(auto !== '') next.hours = auto;
    setLeaveBox(next);
  }

  // 進頁面時原本要打 3 支（我的假單／假別餘額／同事清單），合併成一支。
  // 之後手動 reload（送出、取消假單後）也走同一支，一樣只花一次請求。
  function load(){
    setLoading(true);
    apiGet('getRequestsBootstrap')
      .then(d=>{
        if(d.requests) setMyList(d.requests);
        if(d.balances) setBalances(d.balances);
        if(d.colleagues) setColleagues(d.colleagues);
      })
      .catch(e=>showToast(e.message,'err')).finally(()=>setLoading(false));
  }
  useEffect(load, []);
  useEffect(()=>{ if(leaveBox) apiGet('getMyMenstrualLeaveStatus').then(setMenstrualStatus).catch(()=>{}); }, [!!leaveBox]);
  useEffect(()=>{ if(leaveBox) apiGet('getLeaveQuotas').then(setQuotas).catch(()=>{}); }, [!!leaveBox]);
  useEffect(()=>{
    if(compBox){
      const d = new Date();
      const month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      apiGet('getMyOvertimeSummary', {month}).then(setMyOvertime).catch(()=>{});
    }
  }, [!!compBox]);

  async function submitLeave(){
    if(!leaveBox.leaveType){ showToast('請選擇假別','err'); return; }
    if(!leaveBox.startDT || !leaveBox.endDT){ showToast('請填寫起訖時間','err'); return; }
    if(new Date(leaveBox.endDT) <= new Date(leaveBox.startDT)){ showToast('結束時間必須晚於開始時間','err'); return; }
    const startTimeOnly = leaveBox.startDT.slice(11,16);
    const endTimeOnly = leaveBox.endDT.slice(11,16);
    if(startTimeOnly < shiftStart || endTimeOnly > shiftEnd){
      showToast(`請假時間需在班別時間內（${shiftStart}~${shiftEnd}），請重新選擇`, 'err');
      return;
    }
    if(!(Number(leaveBox.hours) > 0)){ showToast('請填寫時數','err'); return; }
    setBusy(true);
    try{
      let attachmentUrl = '';
      if(leaveBox.attachmentFile){
        const {base64, mimeType} = await compressImageFile(leaveBox.attachmentFile, 1000, 0.75);
        const uploaded = await apiPost('uploadLeaveAttachment', {imageBase64: base64, mimeType, leaveType: leaveBox.leaveType, date: leaveBox.startDT.slice(0,10)});
        attachmentUrl = uploaded.url;
      }
      await apiPost('submitRequest', {
        type:'請假', leaveType: leaveBox.leaveType,
        startTime: leaveBox.startDT.replace('T',' '),
        endTime: leaveBox.endDT.replace('T',' '),
        hours: Number(leaveBox.hours), reason: leaveBox.reason || '', delegateId: leaveBox.delegateId || '',
        attachmentUrl
      });
      showToast('請假申請已送出','ok');
      setLeaveBox(null); load();
    }catch(e){ showToast(e.message,'err'); }
    finally{ setBusy(false); }
  }
  async function submitComp(){
    if(!compBox.date){ showToast('請填寫加班日期','err'); return; }
    if(!(Number(compBox.hours) > 0)){ showToast('請填寫時數','err'); return; }
    setBusy(true);
    try{
      await apiPost('submitRequest', {type:'換補休', startTime: compBox.date + ' 00:00', hours: Number(compBox.hours), reason: compBox.reason || ''});
      showToast('換補休申請已送出','ok');
      setCompBox(null); load();
    }catch(e){ showToast(e.message,'err'); }
    finally{ setBusy(false); }
  }
  async function cancelReq(id){
    if(!confirm('確定取消這筆申請？')) return;
    try{ await apiPost('cancelRequest', {id}); showToast('已取消','ok'); load(); }
    catch(e){ showToast(e.message,'err'); }
  }
  async function doReview(){
    setBusy(true);
    try{
      await apiPost(reviewBox.mode==='approve'?'approveRequest':'rejectRequest', {id: reviewBox.req.id, comment: reviewBox.comment||''});
      showToast(reviewBox.mode==='approve'?'已核准':'已駁回','ok');
      setReviewBox(null); refreshPending(); load();
    }catch(e){ showToast(e.message,'err'); }
    finally{ setBusy(false); }
  }

  function reqSummary(r){
    // 代理人不併進這一行：加了星期之後起訖已經很長，再接代理人會在手機上折行折得很難讀。
    // 由呼叫端用 <reqDelegate> 另起一行顯示。
    if(r.type==='請假') return `${r.leaveType}　${withWeekday(r.startTime)} ~ ${withWeekday(r.endTime)}　${r.hours}小時`;
    return `加班日期 ${withWeekday(String(r.startTime).split(' ')[0])}　${r.hours}小時`;
  }
  function reqDelegate(r){
    return r.delegateName ? <><br/>代理人：{r.delegateName}</> : null;
  }

  return (
    <div className="page">
      {balances && (
        <div className="balance-row">
          {/* 大字一律是「小時」（系統實際結算的單位），小字用 dayPart() 的日＋小時混合寫法，不做四捨五入 */}
          <div className="balance-cell"><div className="num">{trim1(balances.annualRemain)}</div><div className="lbl">特休剩餘（小時）{dayPart(balances.annualRemain) && <><br/>{dayPart(balances.annualRemain)}</>}</div></div>
          <div className="balance-cell"><div className="num">{trim1(balances.compRemain)}</div><div className="lbl">補休剩餘（小時）{dayPart(balances.compRemain) && <><br/>{dayPart(balances.compRemain)}</>}</div></div>
        </div>
      )}
      {balances && (balances.compExpiredHours > 0 || balances.compExpiringHours > 0) && (
        <div className="hint" style={{color:'var(--gold)', marginTop:-6, marginBottom:10}}>
          {balances.compExpiredHours > 0 ? `已過期 ${balances.compExpiredHours} 小時` : `即將到期 ${balances.compExpiringHours} 小時（${balances.compNearestExpire}前）`}
        </div>
      )}

      <div className="form-actions">
        <button className="leave" onClick={()=>{
          const today = new Date().toISOString().slice(0,10);
          const defStart = today+'T'+shiftStart, defEnd = today+'T'+shiftEnd;
          setLeaveBox({leaveType:'', startDT: defStart, endDT: defEnd, hours: computeHours(defStart, defEnd), reason:'', delegateId:''});
        }}>
          <span className="material-icons">event_available</span>請假申請
        </button>
        <button className="comp" onClick={()=>setCompBox({date:'', hours:'', reason:''})}>
          <span className="material-icons">swap_horiz</span>加班換補休
        </button>
      </div>

      {isManager && pending.length > 0 && (
        <>
          <h2><span className="material-icons" style={{color:'var(--gold)'}}>pending_actions</span>待我審核（{pending.length}）</h2>
          {pending.map(r=>(
            <div className="card req-item" key={r.id}>
              <div className="title-row">
                <div className="type">{r.name}　<span style={{color:'var(--gold)'}}>{r.type==='請假'?r.leaveType:'加班換補休'}</span></div>
                <span className="status-badge pending">待審核</span>
              </div>
              <div className="meta">{reqSummary(r)}{reqDelegate(r)}{r.reason && <><br/>事由：{r.reason}</>}{r.attachmentUrl && <><br/><a href={r.attachmentUrl} target="_blank" rel="noopener" style={{color:'var(--gold)'}}>查看附件</a></>}<br/>申請於 {withWeekday(r.createdAt)}</div>
              <div className="req-actions">
                <button className="btn-approve" onClick={()=>setReviewBox({req:r, mode:'approve', comment:''})}>核准</button>
                <button className="btn-reject" onClick={()=>setReviewBox({req:r, mode:'reject', comment:''})}>駁回</button>
              </div>
            </div>
          ))}
        </>
      )}

      <h2><span className="material-icons" style={{color:'var(--muted)'}}>list_alt</span>我的申請</h2>
      {loading ? <div className="hint">載入中...</div> : myList.length===0 ? (
        <div className="card hint" style={{textAlign:'center', padding:'26px 14px'}}>尚無申請紀錄</div>
      ) : myList.map(r=>(
        <div className="card req-item" key={r.id}>
          <div className="title-row">
            <div className="type">{r.type==='請假' ? r.leaveType : '加班換補休'}</div>
            <span className={'status-badge ' + (STATUS_CLASS[r.status]||'cancel')}>{r.status}</span>
          </div>
          <div className="meta">
            {reqSummary(r)}
            {reqDelegate(r)}
            {r.reason && <><br/>事由：{r.reason}</>}
            {r.attachmentUrl && <><br/><a href={r.attachmentUrl} target="_blank" rel="noopener" style={{color:'var(--gold)'}}>查看附件</a></>}
            {STATUS_HINT[r.status] && <><br/><span style={{color:'var(--gold)'}}>{STATUS_HINT[r.status]}</span></>}
            {r.reviewer && <><br/>審核：{r.reviewer}{r.reviewComment ? '（' + r.reviewComment + '）' : ''}</>}
          </div>
          {(r.status==='待審核' || r.status==='初核通過') && (
            <div className="req-actions">
              <button className="btn-cancel-req" onClick={()=>cancelReq(r.id)}>取消申請</button>
            </div>
          )}
        </div>
      ))}

      {leaveBox && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">event_available</span>請假申請</h3>
            <div className="field"><label>假別</label>
              <select value={leaveBox.leaveType} onChange={e=>setLeaveBox({...leaveBox, leaveType:e.target.value})} style={{textAlign:'center', textAlignLast:'center'}}>
                <option value="">請選擇</option>
                {LEAVE_TYPES.filter(t=> t!=='生理假' || session.employee?.gender !== '男').map(t=>{
                  let extra = '';
                  if(t==='特休' && balances) extra = remainText(balances.annualRemain);
                  if(t==='補休' && balances) extra = remainText(balances.compRemain);
                  if(t==='生理假' && menstrualStatus) extra = `（剩 ${trim1(menstrualStatus.remainingFullPayHours)} 小時全薪）`;
                  // 事假／病假／家庭照顧假比照特休，直接把剩餘寫在選項上，不必選了才在下方額度條看到。
                  // 事假與家庭照顧假共用全年 14 日上限（性平法第 20 條），剩餘要取兩個限制的較小值，
                  // 否則會顯示一個送出時反而被後端擋下來的數字。
                  if(t!=='生理假' && quotas && quotas[t]){
                    const q = quotas[t];
                    let remain = (Number(q.上限)||0) - (Number(q.已用)||0);
                    if(t==='事假' || t==='家庭照顧假'){
                      const combined = quotas['家庭照顧假'] ? (Number(quotas['家庭照顧假'].併入事假合計)||0) : 0;
                      remain = Math.min(remain, (Number(quotas['事假'].上限)||0) - combined);
                    }
                    extra = remainText(Math.max(0, remain));
                  }
                  return <option key={t} value={t}>{t}{extra}</option>;
                })}
              </select>
              {leaveBox.leaveType==='生理假' && menstrualStatus && (
                <div className="hint" style={{marginTop:6}}>
                  依勞基法第14條之1，生理假每年前3 日（24小時）全薪，超過部分比照病假折半發給。你今年已使用 {menstrualStatus.usedHours} 小時，還有 {menstrualStatus.remainingFullPayHours} 小時全薪額度。
                </div>
              )}

              {/* 特休不在 quotas 裡（它的分母是個人核定時數、不是法定上限），所以另外畫一條。
                  後端 createRequest 對特休超額一樣會擋，這裡的紅色狀態與那個檢核對應。 */}
              {leaveBox.leaveType==='特休' && balances && (()=>{
                const granted = Number(balances.annualGranted)||0;
                const used = Number(balances.annualUsed)||0;
                const remain = Math.max(0, Number(balances.annualRemain)||0);
                if(granted <= 0) return (
                  <div style={{marginTop:8, padding:'10px 12px', border:'1px solid var(--line,#3a3a3a)', borderRadius:8, fontSize:12, opacity:.75}}>
                    本年度尚無特休核定時數，請洽管理部
                  </div>
                );
                const pct = Math.min(100, Math.round(used/granted*100));
                const full = remain <= 0;
                return (
                  <div style={{marginTop:8, padding:'10px 12px', border:'1px solid var(--line,#3a3a3a)', borderRadius:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8, fontSize:12, marginBottom:6}}>
                      <span style={{fontWeight:700}}>特休</span>
                      <span style={{opacity:.75, fontVariantNumeric:'tabular-nums', textAlign:'right'}}>
                        本年度核定 {trim1(granted)} 小時{dayPart(granted) && <><br/>{dayPart(granted)}</>}
                      </span>
                    </div>
                    <div style={{height:6, borderRadius:3, background:'rgba(128,128,128,.25)', overflow:'hidden'}}>
                      <div style={{height:'100%', width:pct+'%', background: full ? '#c05a4f' : 'var(--gold,#00ADB5)'}}></div>
                    </div>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, fontSize:12, marginTop:6}}>
                      <span style={{opacity:.75}}><Amount label="已休" hours={used} /></span>
                      <span style={{textAlign:'right'}}><Amount label="剩" hours={remain} strong danger={full} /></span>
                    </div>
                    <ClearLeftover remain={remain} unit={unit} onUse={h=>setLeaveBox({...leaveBox, hours:h})} />
                    {full && <div style={{fontSize:11.5, color:'#c05a4f', marginTop:5}}>特休已休完，本次申請會被系統擋下</div>}
                  </div>
                );
              })()}

              {/* 法定假別的額度條：選了假別就顯示已用／剩餘，讓員工送出前就知道，而不是被擋下來才發現 */}
              {quotas && quotas[leaveBox.leaveType] && (()=>{
                const q = quotas[leaveBox.leaveType];
                const used = Number(q.已用)||0, cap = Number(q.上限)||0;
                // 事假與家庭照顧假共用全年 14 日上限（性平法第 20 條），所以「剩餘」要取兩個限制的
                // 較小值，才會跟上方下拉選單的數字一致，也才不會顯示一個送出時反而被擋下來的額度。
                const combined = quotas['家庭照顧假'] ? (Number(quotas['家庭照顧假'].併入事假合計)||0) : 0;
                const shared = (leaveBox.leaveType==='事假' || leaveBox.leaveType==='家庭照顧假');
                const remain = Math.max(0, shared
                  ? Math.min(cap - used, (Number(quotas['事假'].上限)||0) - combined)
                  : cap - used);
                const pct = cap ? Math.min(100, Math.round((cap-remain)/cap*100)) : 0;
                const full = remain <= 0;
                return (
                  <div style={{marginTop:8, padding:'10px 12px', border:'1px solid var(--line,#3a3a3a)', borderRadius:8}}>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8, fontSize:12, marginBottom:6}}>
                      <span style={{fontWeight:700}}>{leaveBox.leaveType}</span>
                      <span style={{opacity:.75, fontVariantNumeric:'tabular-nums', textAlign:'right'}}>
                        {q.週期}上限 {trim1(cap)} 小時{dayPart(cap) && <><br/>{dayPart(cap)}</>}
                      </span>
                    </div>
                    <div style={{height:6, borderRadius:3, background:'rgba(128,128,128,.25)', overflow:'hidden'}}>
                      <div style={{height:'100%', width:pct+'%', background: full ? '#c05a4f' : 'var(--gold,#00ADB5)'}}></div>
                    </div>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, fontSize:12, marginTop:6}}>
                      <span style={{opacity:.75}}><Amount label="已用" hours={used} /></span>
                      <span style={{textAlign:'right'}}><Amount label="剩" hours={remain} strong danger={full} /></span>
                    </div>
                    <ClearLeftover remain={remain} unit={unit} onUse={h=>setLeaveBox({...leaveBox, hours:h})} />
                    {full && <div style={{fontSize:11.5, color:'#c05a4f', marginTop:5}}>額度已用完，本次申請會被系統擋下</div>}
                    {leaveBox.leaveType==='家庭照顧假' && (
                      <div style={{fontSize:11.5, opacity:.7, marginTop:5}}>
                        家庭照顧假的日數併入事假計算，兩者合計全年以 14 日（112 小時）為限，目前合計 {trim1(combined)} 小時{dayPart(combined) ? "（" + dayPart(combined) + "）" : ""}
                      </div>
                    )}
                    {leaveBox.leaveType==='事假' && (
                      <div style={{fontSize:11.5, opacity:.7, marginTop:5}}>
                        家庭照顧假的日數也併入這個額度計算，目前合計 {trim1(combined)} 小時{dayPart(combined) ? "（" + dayPart(combined) + "）" : ""}
                      </div>
                    )}
                  </div>
                );
              })()}

              <div style={{marginTop:8}}>
                {/* inline-flex + alignItems center：button 預設是 baseline 對齊，中文字在小字級下
                    會偏上、看起來沒對齊；配合固定行高與上下 padding 讓文字真正垂直置中 */}
                <button type="button" onClick={()=>setShowLeaveRules(v=>!v)}
                  style={{display:'inline-flex', alignItems:'center', gap:4, minHeight:28, padding:'4px 0',
                          lineHeight:1, background:'none', border:'none', fontSize:12, opacity:.75,
                          textDecoration:'underline', cursor:'pointer', color:'inherit'}}>
                  {showLeaveRules ? '收起請假規定' : '各假別請假規定一覽'}
                </button>
                {showLeaveRules && (
                  /* 用實體卡片包住：加底色、外框與內距，避免展開後跟下方「班別時間」那段說明文字糊在一起 */
                  <div style={{marginTop:8, padding:'12px 14px', fontSize:11.5, lineHeight:1.7,
                               background:'rgba(128,128,128,.10)', border:'1px solid var(--line,#3a3a3a)', borderRadius:10}}>
                    <div style={{fontSize:12, fontWeight:700, letterSpacing:'.05em', opacity:.8, marginBottom:8}}>各假別請假規定</div>
                    <div style={{display:'grid', gridTemplateColumns:'auto auto 1fr', gap:'4px 12px', opacity:.9}}>
                      <b>假別</b><b>上限</b><b>說明</b>
                      <span>事假</span><span>全年 14 日</span><span>不給工資（勞工請假規則 7 條）</span>
                      <span>病假</span><span>全年 30 日</span><span>工資折半，超過部分不給薪（請假規則 4 條）</span>
                      <span>家庭照顧假</span><span>全年 7 日</span><span>不給工資，日數併入事假計算（性平法 20 條）</span>
                      <span>生理假</span><span>每月 1 日</span><span>公司政策前 3 日全薪，其餘折半（性平法 14 條）</span>
                      <span>特休</span><span>依年資</span><span>全薪，剩餘時數見上方選單</span>
                      <span>補休</span><span>依加班時數</span><span>全薪，期限內未休完折算工資</span>
                      <span>婚假 / 喪假</span><span>依法定日數</span><span>全薪</span>
                      <span>公假 / 公傷病假</span><span>依實際需要</span><span>全薪</span>
                      <span>災防假</span><span>—</span><span>不支薪，但不影響全勤與考績</span>
                    </div>
                    <div style={{marginTop:10, paddingTop:9, borderTop:'1px solid var(--line,#3a3a3a)', opacity:.75}}>
                      生理假、家庭照顧假、婚喪假、公假、公傷病假<b>不會扣全勤獎金</b>（性別平等工作法 21 條）。
                      病假、事假、遲到、早退則依時數比例扣。
                    </div>
                  </div>
                )}
              </div>
            </div>
            <div className="field">
              {/* 班別時間的限制條件直接附在「開始時間」標籤上，讓規則跟它約束的欄位待在一起，
                  不再獨立成一行浮在假別區塊與時間欄位之間 */}
              <label>開始時間<span style={{fontWeight:400, opacity:.65, marginLeft:6}}>（班別時間 {shiftStart}~{shiftEnd}，請假時段需在此範圍內）</span></label>
              <button type="button" className="ghost-btn" style={{textAlign:'center', display:'flex', justifyContent:'center', alignItems:'center', gap:8, background:'#1B2027', color:'var(--text)', border:'1px solid var(--line)'}} onClick={()=>setPickerFor('start')}>
                <span>{leaveBox.startDT ? formatDateTimeReadable(leaveBox.startDT) : '請選擇'}</span>
                <span className="material-icons" style={{fontSize:18}}>event</span>
              </button>
            </div>
            <div className="field">
              <label>結束時間</label>
              <button type="button" className="ghost-btn" style={{textAlign:'center', display:'flex', justifyContent:'center', alignItems:'center', gap:8, background:'#1B2027', color:'var(--text)', border:'1px solid var(--line)'}} onClick={()=>setPickerFor('end')}>
                <span>{leaveBox.endDT ? formatDateTimeReadable(leaveBox.endDT) : '請選擇'}</span>
                <span className="material-icons" style={{fontSize:18}}>event</span>
              </button>
            </div>
            {/* step 刻意用 any 而不是 unit：清零那一筆（例如剩 0.2 小時）不是最小單位的倍數，
                用 step={unit} 會被瀏覽器自己擋掉，連送都送不出去。倍數檢核由後端負責，且允許清零例外。 */}
            <div className="field"><label>請假時數（依起訖時間自動計算，最小單位 {unit} 小時，可手動調整）</label><input type="number" step="any" min="0" value={leaveBox.hours} onChange={e=>setLeaveBox({...leaveBox, hours:e.target.value})} style={{textAlign:'center'}} /></div>
            <div className="field"><label>代理人（選填）</label>
              <select value={leaveBox.delegateId} onChange={e=>setLeaveBox({...leaveBox, delegateId:e.target.value})} style={{textAlign:'center', textAlignLast:'center'}}>
                <option value="">不指定</option>
                {colleagues.filter(c=>c.id!==session.employeeId).map(c=>(
                  <option key={c.id} value={c.id}>{c.name}{c.department?'（'+c.department+'）':''}</option>
                ))}
              </select>
            </div>
            <div className="field"><label>事由</label><textarea rows="2" value={leaveBox.reason} onChange={e=>setLeaveBox({...leaveBox, reason:e.target.value})}></textarea></div>
            <div className="field">
              <label>附件（選填，例如診斷證明）</label>
              <label className="ghost-btn" style={{display:'flex', alignItems:'center', justifyContent:'center', gap:8, cursor:'pointer'}}>
                <span className="material-icons" style={{fontSize:18}}>attach_file</span>
                <span>{leaveBox.attachmentFile ? leaveBox.attachmentFile.name : '選擇照片或拍照'}</span>
                <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(f) setLeaveBox({...leaveBox, attachmentFile:f}); }} />
              </label>
            </div>
            <div className="modal-actions">
              <button className="stay" onClick={()=>setLeaveBox(null)}>取消</button>
              <button className="go" onClick={submitLeave} disabled={busy}>{busy?'送出中...':'送出申請'}</button>
            </div>
          </div>
        </div>
      )}

      {compBox && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">swap_horiz</span>加班換補休</h3>
            <div className="hint" style={{marginBottom:12}}>將已加班的時數轉換為補休額度，經主管核准後即可於請假時選擇「補休」使用。</div>
            {myOvertime && (
              <div className="hint" style={{marginBottom:12, padding:10, background:'var(--panel-2)', borderRadius:8}}>
                本月累計加班參考：平日 {myOvertime.otWeekday134+myOvertime.otWeekday167} 小時、休息日 {myOvertime.otRestDayHours} 小時、國定假日 {myOvertime.otHolidayHours} 小時
              </div>
            )}
            <div className="field">
              <label>加班日期</label>
              <button type="button" className="ghost-btn" style={{textAlign:'center', display:'flex', justifyContent:'center', alignItems:'center', gap:8, background:'#1B2027', color:'var(--text)', border:'1px solid var(--line)'}} onClick={()=>setPickerFor('comp')}>
                <span>{compBox.date ? formatDateReadable(compBox.date) : '請選擇'}</span>
                <span className="material-icons" style={{fontSize:18}}>event</span>
              </button>
            </div>
            <div className="field"><label>換補休時數（最小單位 {unit} 小時）</label><input type="number" step={unit} min={unit} value={compBox.hours} onChange={e=>setCompBox({...compBox, hours:e.target.value})} style={{textAlign:'center'}} /></div>
            <div className="field"><label>說明</label><textarea rows="2" value={compBox.reason} onChange={e=>setCompBox({...compBox, reason:e.target.value})}></textarea></div>
            <div className="modal-actions">
              <button className="stay" onClick={()=>setCompBox(null)}>取消</button>
              <button className="go" onClick={submitComp} disabled={busy}>{busy?'送出中...':'送出申請'}</button>
            </div>
          </div>
        </div>
      )}

      {pickerFor && (
        <CustomDateTimePicker
          dateOnly={pickerFor==='comp'}
          unitHours={unit} schedStart={shiftStart}
          value={pickerFor==='start' ? leaveBox.startDT : pickerFor==='end' ? leaveBox.endDT : compBox.date}
          onConfirm={(v)=>{
            if(pickerFor==='start') updateLeaveField({startDT:v, endDT: leaveBox.endDT || v});
            else if(pickerFor==='end') updateLeaveField({endDT:v});
            else setCompBox({...compBox, date:v});
            setPickerFor(null);
          }}
          onClose={()=>setPickerFor(null)}
        />
      )}

      {reviewBox && (
        <div className="modal-bg">
          <div className="modal">
            <h3><span className="material-icons">{reviewBox.mode==='approve'?'check_circle':'cancel'}</span>{reviewBox.mode==='approve'?'核准':'駁回'}申請</h3>
            <div className="card req-item" style={{marginBottom:12}}>
              <div className="type">{reviewBox.req.name}　{reviewBox.req.type==='請假'?reviewBox.req.leaveType:'加班換補休'}</div>
              <div className="meta">{reqSummary(reviewBox.req)}{reqDelegate(reviewBox.req)}{reviewBox.req.reason && <><br/>事由：{reviewBox.req.reason}</>}{reviewBox.req.attachmentUrl && <><br/><a href={reviewBox.req.attachmentUrl} target="_blank" rel="noopener" style={{color:'var(--gold)'}}>查看附件</a></>}</div>
            </div>
            <div className="field"><label>審核意見（選填）</label><textarea rows="2" value={reviewBox.comment} onChange={e=>setReviewBox({...reviewBox, comment:e.target.value})}></textarea></div>
            <div className="modal-actions">
              <button className="stay" onClick={()=>setReviewBox(null)}>取消</button>
              <button className="go" style={reviewBox.mode==='reject'?{background:'var(--red)', color:'#fff'}:{}} onClick={doReview} disabled={busy}>
                {busy?'處理中...':(reviewBox.mode==='approve'?'確認核准':'確認駁回')}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ========================= 行事曆 ========================= */
function CalendarPage({session, showToast}){
  const [month, setMonth] = useState(()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); });
  const [holidays, setHolidays] = useState([]);
  const [myLeaves, setMyLeaves] = useState([]);
  const [settings, setSettings] = useState(null);
  const [loading, setLoading] = useState(true);

  // 三支合併成一支（國定假日／我的假單／系統設定），省下兩次請求的固定開銷
  useEffect(()=>{
    setLoading(true);
    apiGet('getCalendarBootstrap')
      .then(d=>{
        if(d.holidays) setHolidays(d.holidays);
        if(d.requests) setMyLeaves(d.requests.filter(r=>r.type==='請假' && r.status==='已核准'));
        if(d.settings) setSettings(d.settings);
      })
      .catch(e=>showToast(e.message,'err')).finally(()=>setLoading(false));
  }, []);

  const [y, m] = month.split('-').map(Number);
  const firstDowSun = new Date(y, m-1, 1).getDay();
  const firstDow = (firstDowSun + 6) % 7; // 轉換成週一為0的排列
  const daysInMonth = new Date(y, m, 0).getDate();
  const holidayMap = {}; holidays.forEach(h=>{ holidayMap[h.date] = h; });
  function leavesOnDate(dateStr){
    return myLeaves.filter(r=>{
      const s = r.startTime.slice(0,10), e = r.endTime.slice(0,10);
      return dateStr >= s && dateStr <= e;
    });
  }
  function shiftMonth(delta){
    const nd = new Date(y, m-1+delta, 1);
    setMonth(nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0'));
  }

  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const monthLeaves = myLeaves.filter(r=>r.startTime.slice(0,7)===month || r.endTime.slice(0,7)===month);
  const monthHolidays = holidays.filter(h=>h.date.indexOf(month)===0).sort((a,b)=>a.date.localeCompare(b.date));

  const shift = session.employee?.shift;

  return (
    <div className="page">
      <div className="card shift-card">
        <span className="material-icons">schedule</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700, fontSize:14.5}}>{shift ? shift.name : '標準班'}　{shift ? shift.workStart : '09:00'}~{shift ? shift.workEnd : '18:00'}</div>
          <div className="hint">預設班別（若無另外排班）</div>
        </div>
      </div>

      <div className="card">
        <div className="row-between" style={{marginBottom:10}}>
          <button className="icon-btn" onClick={()=>shiftMonth(-1)}><span className="material-icons">chevron_left</span></button>
          <div style={{fontWeight:700, fontSize:15}}>{y} 年 {m} 月</div>
          <button className="icon-btn" onClick={()=>shiftMonth(1)}><span className="material-icons">chevron_right</span></button>
        </div>
        {loading ? <div className="hint" style={{textAlign:'center'}}>載入中...</div> : (
          <>
            <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, textAlign:'center', fontSize:11, color:'var(--muted)', marginBottom:4}}>
              {['一','二','三','四','五','六','日'].map(d=><div key={d}>{d}</div>)}
            </div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4}}>
              {cells.map((d,idx)=>{
                if(!d) return <div key={idx}></div>;
                const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const hol = holidayMap[dateStr];
                const leaves = leavesOnDate(dateStr);
                const isToday = dateStr === new Date().toISOString().slice(0,10);
                const dow = new Date(y, m-1, d).getDay();
                const isMandatoryRest = settings && dow === Number(settings.mandatoryRestDay);
                const isRestDay = settings && dow === Number(settings.restDay);
                const isCompanyHoliday = hol && hol.type === '公司休假日';
                const isNationalOrWeeklyOff = (hol && hol.type === '國定假日') || isMandatoryRest || isRestDay;
                let bg = '#5b8db826'; // 上班日：藍色底
                if(isCompanyHoliday) bg = '#9575cd26'; // 公司休假日：紫色底
                else if(isNationalOrWeeklyOff) bg = '#c05a4f26';
                return (
                  <div key={idx} style={{
                    aspectRatio:'1', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
                    borderRadius:8, background:bg, fontSize:12.5, position:'relative',
                    border: isToday ? '1.5px solid var(--gold)' : '1px solid transparent'
                  }}>
                    <div>{d}</div>
                    {leaves.length>0 && <div style={{position:'absolute', bottom:4, width:5,height:5,borderRadius:3,background:'var(--green)'}}></div>}
                  </div>
                );
              })}
            </div>
            <div style={{display:'flex', gap:12, marginTop:12, fontSize:11, color:'var(--muted)', flexWrap:'wrap'}}>
              <span><span style={{display:'inline-block',width:8,height:8,borderRadius:4,background:'var(--blue)',marginRight:4}}></span>上班日</span>
              <span><span style={{display:'inline-block',width:8,height:8,borderRadius:4,background:'var(--red)',marginRight:4}}></span>休息日/例假日/國定假日</span>
              <span><span style={{display:'inline-block',width:8,height:8,borderRadius:4,background:'#9575cd',marginRight:4}}></span>公司休假日</span>
              <span><span style={{display:'inline-block',width:5,height:5,borderRadius:3,background:'var(--green)',marginRight:4}}></span>已核准請假</span>
            </div>
          </>
        )}
      </div>

      {monthHolidays.length>0 && (
        <>
          <h2><span className="material-icons" style={{color:'var(--red)'}}>event_busy</span>本月假日</h2>
          {monthHolidays.map(h=>(
            <div className="card req-item" key={h.date}>
              <div className="title-row"><div className="type">{h.name || h.type}</div><span className={'status-badge '+(h.type==='國定假日'?'no':'pending')}>{h.type}</span></div>
              <div className="meta">{h.date}</div>
            </div>
          ))}
        </>
      )}
      {monthLeaves.length>0 && (
        <>
          <h2><span className="material-icons" style={{color:'var(--green)'}}>event_available</span>本月已核准請假</h2>
          {monthLeaves.map(r=>(
            <div className="card req-item" key={r.id}>
              <div className="title-row"><div className="type">{r.leaveType}</div><span className="status-badge ok">已核准</span></div>
              <div className="meta">{r.startTime} ~ {r.endTime}　{r.hours} 小時</div>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

/* ========================= 公告 ========================= */
function NewsPage({showToast, onMarkedRead}){
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(null);
  const [activeCategory, setActiveCategory] = useState('全部');

  function load(){
    setLoading(true);
    apiGet('getMyAnnouncements').then(data=>{
      setList(data.items || []);
    }).catch(e=>showToast(e.message,'err')).finally(()=>setLoading(false));
  }
  useEffect(()=>{
    load();
    apiPost('markAnnouncementsRead', {}).then(()=>{ if(onMarkedRead) onMarkedRead(); }).catch(()=>{});
  }, []);

  const categories = ['全部', ...Array.from(new Set(list.filter(a=>a.category).map(a=>a.category)))];
  const shown = activeCategory==='全部' ? list : list.filter(a=>a.category===activeCategory);
  const categoryColorMap = {};
  list.forEach(a=>{ if(a.category && a.categoryColor) categoryColorMap[a.category] = a.categoryColor; });

  return (
    <div className="page">
      {!loading && categories.length > 1 && (
        <div className="ann-filter-row">
          {categories.map(c=>{
            const isActive = activeCategory===c;
            const color = categoryColorMap[c]; // '全部' 沒有顏色
            return (
              <div key={c} className={'ann-filter-pill'+(isActive?' active':'')} onClick={()=>setActiveCategory(c)}
                style={color ? {
                  background: isActive ? color : 'var(--panel-2)',
                  color: isActive ? '#fff' : 'var(--muted)',
                  borderLeft: isActive ? undefined : '3px solid '+color,
                  paddingLeft: isActive ? undefined : 10
                } : undefined}>
                {c}
              </div>
            );
          })}
        </div>
      )}
      {loading ? <div className="hint" style={{textAlign:'center', marginTop:30}}>載入中...</div> : shown.length===0 ? (
        <div className="coming">
          <div><span className="material-icons">campaign</span></div>
          <div style={{fontSize:15, fontWeight:700, color:'var(--text)'}}>目前尚無公告</div>
        </div>
      ) : shown.map(a=>{
        const isOpen = expanded===a.id;
        return (
          <div className="card" key={a.id} onClick={()=>setExpanded(isOpen?null:a.id)}
            style={{cursor:'pointer', borderLeft: a.pinned?'4px solid var(--gold)':undefined, paddingLeft: a.pinned?12:undefined}}>
            <div className="ann-head">
              <div className="ann-meta" style={{marginTop:0, display:'flex', alignItems:'center', gap:6}}>
                {announceDateShort(a.createdAt)}　· {a.author}
                {a.attachments && a.attachments.length > 0 && (
                  <span style={{display:'flex', alignItems:'center', gap:1}}><span className="material-icons" style={{fontSize:13}}>attach_file</span>{a.attachments.length}</span>
                )}
              </div>
              <div className="ann-badges">
                {a.pinned && (
                  <span className="ann-pin"><span className="material-icons" style={{fontSize:13}}>push_pin</span>置頂</span>
                )}
                {a.category && <span className="ann-pin" style={{color:'#fff', background:a.categoryColor||'var(--gold)'}}>{a.category}</span>}
                <span className={a.unread?'ann-unread':'ann-read'}>{a.unread?'未讀':'已讀'}</span>
              </div>
            </div>
            <div className="ann-title" style={{marginTop:6}}>{a.title}</div>
            {isOpen && (
              <div>
                <div className="ann-content" dangerouslySetInnerHTML={{__html: linkifyBlank(a.content)}} />
                {a.attachments && a.attachments.length > 0 && (
                  <div style={{display:'flex', flexDirection:'column', gap:6, marginTop:10}}>
                    {a.attachments.map((att,idx)=>(
                      <a key={idx} href={att.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()}
                        style={{display:'flex', alignItems:'center', gap:8, background:'var(--panel-2)', padding:'8px 10px', borderRadius:8, color:'var(--text)', textDecoration:'none'}}>
                        <span className="material-icons" style={{color:'var(--gold)'}}>{attachIcon(att.name)}</span>
                        <div style={{minWidth:0, flex:1}}>
                          <div style={{fontSize:13, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{att.name}</div>
                          <div className="hint" style={{fontSize:11}}>{fileSizeText(att.size)}</div>
                        </div>
                        <span className="material-icons" style={{color:'var(--muted)', fontSize:18}}>download</span>
                      </a>
                    ))}
                  </div>
                )}
              </div>
            )}
            <div style={{display:'flex', justifyContent:'flex-end', marginTop:4}}>
              <span className="material-icons" style={{color:'var(--muted)', fontSize:20}}>{isOpen?'expand_less':'expand_more'}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ========================= 薪資條（Modal） ========================= */
function PayslipModal({onClose, showToast}){
  // 預設帶「上個月」：當月薪資要到次月 6 日才結算產出，開當月一定是空的。
  // setMonth(0 值) 會自動退到前一年 12 月，跨年不必特別處理。
  const [month, setMonth] = useState(()=>{
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  });
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [expanded, setExpanded] = useState({base:true, overtime:true, leave:true, sales26:true, infoLeave:true});
  const [leaveDetail, setLeaveDetail] = useState(null);
  function toggleSection(key){ setExpanded(prev=>({...prev, [key]: !prev[key]})); }

  // 輸出 PDF：用瀏覽器內建列印功能（手機選「儲存為 PDF」即可），不必額外載入套件。
  // 多數瀏覽器會拿 document.title 當預設檔名，所以列印前先暫時改掉標題，列印完再改回來。
  function exportPdf(){
    if(!data || data.hasRecord===false) return;
    const [yy, mo] = month.split('-');
    const fileName = `${yy}年${mo}月份-${(data.employee.company||'').trim()}-${(data.employee.name||'').trim()}-薪資條`;
    const prevTitle = document.title;
    document.title = fileName;
    // 等一次繪製，確保列印區塊已經上到畫面（Safari 需要）
    setTimeout(()=>{
      window.print();
      // 列印對話框關閉後再還原；印表機對話框是同步阻塞，這裡用 setTimeout 保險
      setTimeout(()=>{ document.title = prevTitle; }, 300);
    }, 60);
  }

  function load(m){
    setLoading(true);
    setLeaveDetail(null);
    apiGet('getMyPayslip', {month:m}).then(setData).catch(e=>{ showToast(e.message,'err'); setData(null); }).finally(()=>setLoading(false));
  }
  useEffect(()=>{ load(month); }, [month]);
  useEffect(()=>{
    if(!data?.employee?.id) return;
    apiGet('getLeaveDetailForPayslip', {employeeId: data.employee.id, month}).then(setLeaveDetail).catch(()=>setLeaveDetail(null));
  }, [data?.employee?.id, month]);

  const money = v => Math.round(Number(v)||0).toLocaleString('zh-TW');
  const negMoney = v => { const rv = Math.round(Number(v)||0); return rv===0 ? money(0) : '-'+money(rv); };
  const n = v => Number(v)||0;
  const [my, mm] = month.split('-');

  const emp = data ? data.employee : {};
  const entry = data ? data.entry : {};
  const calc = data ? data.calc : {};

  const allowanceItems = data ? [
    {label:'伙食津貼', value:n(calc.effMealAllowance)},
    {label:'交通津貼', value:n(calc.effTransportAllowance)},
    {label:'職務加給', value:n(calc.effPositionAllowance)},
    {label:`全勤獎金${calc.fullAttendanceDeductRatio>0?`（依比例扣${(calc.fullAttendanceDeductRatio*100).toFixed(1)}%）`:(calc.fullAttendanceRatio<1?`（依在職比例${(calc.fullAttendanceRatio*100).toFixed(0)}%）`:'')}`, value:n(calc.fullAttendanceAdjusted), showAnyway:n(calc.effFullAttendanceBonus)>0 && calc.fullAttendanceDeductRatio>0}
  ].filter(it=>it.value>0 || it.showAnyway) : [];

  const overtimeItems = data ? [
    {label:`平日加班（${n(entry.otWeekday134)}/${n(entry.otWeekday167)}hr）`, value:n(calc.weekdayOtPay)},
    {label:`休息日出勤（${n(entry.otRestDayHours)}hr）`, value:n(calc.restDayPay)},
    {label:`國定假日出勤（${n(entry.otHolidayHours)}hr）`, value:n(calc.holidayPay)},
    {label:`例假日出勤（${n(entry.otMandatoryRestHours)}hr，需補休）`, value:n(calc.mandatoryRestPay)}
  ].filter(it=>it.value>0) : [];

  function hrsLabel(hours){
    const h = n(hours);
    if(h<=0) return '';
    const days = Math.round((h/8)*10)/10;
    return `${h}小時（${days} 日）`;
  }
  const familyCareHours = Math.min(n(leaveDetail?.familyCareHours), n(entry.personalLeave));
  const personalOnlyHours = Math.max(0, n(entry.personalLeave) - familyCareHours);
  const infoLeave = leaveDetail?.infoLeave || {};
  const infoLeaveItems = ['特休','婚假','喪假','公假','公傷病假','產假','產檢假','陪產假']
    .filter(t=>n(infoLeave[t])>0).map(t=>({label:`${t}　${hrsLabel(infoLeave[t])}`, value:0}));

  const leaveItems = data ? [
    {show:personalOnlyHours>0, label:`事假　${hrsLabel(personalOnlyHours)}`, value:n(calc.hourly)*personalOnlyHours},
    {show:familyCareHours>0, label:`家庭照顧假　${hrsLabel(familyCareHours)}`, value:n(calc.hourly)*familyCareHours},
    {show:n(entry.sickLeave)>0, label:`病假　${hrsLabel(n(entry.sickLeave))}${n(calc.sickUnpaidHours)>0?'（部分已達年度上限不給薪）':''}`, value:n(calc.hourly)*0.5*n(calc.sickHalfPayHours)+n(calc.hourly)*n(calc.sickUnpaidHours)},
    {show:n(entry.menstrualLeave)>0, label:`生理假　${hrsLabel(n(entry.menstrualLeave))}${n(calc.menstrualUnpaidHours)>0?'（部分已達上限不給薪）':''}`, value:n(calc.hourly)*0.5*n(calc.menstrualHalfPayHours)+n(calc.hourly)*n(calc.menstrualUnpaidHours)},
    {show:n(entry.disasterLeave)>0, label:`災防假　${hrsLabel(n(entry.disasterLeave))}`, value:n(calc.hourly)*1.0*n(entry.disasterLeave)},
    {show:n(entry.otherLeave)>0, label:`其他假　${hrsLabel(n(entry.otherLeave))}`, value:n(calc.hourly)*n(entry.otherLeave)}
  ].filter(it=>it.show) : [];

  const sales26Items = data ? [
    {label:'業務費用', value:n(entry.businessExpense)},
    {label:'業績獎金', value:n(entry.salesPerformance)},
    {label:'其他獎金', value:n(entry.salesBonus26)},
    {label:'其他費用', value:n(entry.otherExpense26)},
    {label:'其他扣款', value:-n(entry.deduction26)}
  ].filter(it=>it.value!==0) : [];

  function SectionHeader({label, amount, amountColor, sectionKey, hasDetail, total}){
    return (
      <div className={total?'pl-row total':'pl-row'} style={{cursor: hasDetail?'pointer':'default'}} onClick={hasDetail?()=>toggleSection(sectionKey):undefined}>
        <span className="lbl">
          {label}
          {hasDetail && <span className="material-icons" style={{fontSize:18}}>{expanded[sectionKey]?'expand_less':'expand_more'}</span>}
        </span>
        <span className="val" style={amountColor?{color:amountColor}:undefined}>{amount}</span>
      </div>
    );
  }

  return (
    <div className="modal-bg">
      <div className="modal">
        <h3><span className="material-icons">receipt_long</span>我的薪資條</h3>
        <div className="field">
          <label>月份</label>
          <button type="button" className="ghost-btn" style={{textAlign:'center', display:'flex', justifyContent:'center', alignItems:'center', gap:8, background:'#1B2027', color:'var(--text)', border:'1px solid var(--line)'}} onClick={()=>setPickerOpen(true)}>
            <span>{my}年{Number(mm)}月</span>
            <span className="material-icons" style={{fontSize:18}}>event</span>
          </button>
        </div>
        {loading ? <div className="hint">載入中...</div> : !data ? (
          <div className="hint">查無資料</div>
        ) : data.hasRecord===false ? (
          <div className="coming" style={{padding:'30px 10px'}}>
            <div><span className="material-icons">event_busy</span></div>
            <div style={{fontSize:15, fontWeight:700, color:'var(--text)'}}>這個月尚無薪資資料</div>
            <div className="hint" style={{marginTop:6}}>管理者尚未儲存 {my}年{Number(mm)}月 的薪資紀錄</div>
          </div>
        ) : (
          <>
            {/* 兩筆發放金額原本只寫日期，看不出各是什麼；加上用途標示比較清楚 */}
            <div className="balance-row">
              <div className="balance-cell">
                <div className="tag">薪資</div>
                <div className="num">{money(data.calc.pay06)}</div>
                <div className="lbl">{data.payDate06 ? data.payDate06.replace(/^\d+-/,'').replace('-','/') : '06日'} 發放</div>
              </div>
              <div className="balance-cell">
                <div className="tag">業務／獎金</div>
                <div className="num">{money(data.calc.pay26)}</div>
                <div className="lbl">{data.payDate26 ? data.payDate26.replace(/^\d+-/,'').replace('-','/') : '26日'} 發放</div>
              </div>
            </div>
            <div className="card" style={{padding:14}}>
              <SectionHeader label="本薪" amount={money(calc.effBaseSalary)} sectionKey="base" hasDetail={allowanceItems.length>0} />
              {expanded.base && allowanceItems.length>0 && (
                <div style={{padding:'0 0 6px'}}>
                  <div className="pl-note">已含在本薪內，僅供對照</div>
                  {allowanceItems.map(it=>(
                    <div className="pl-sub" key={it.label}><span>{it.label}</span><span>{money(it.value)}</span></div>
                  ))}
                </div>
              )}

              {overtimeItems.length>0 && (
                <>
                  <SectionHeader label="加班費" amount={money(calc.overtimePay)} amountColor="var(--green)" sectionKey="overtime" hasDetail={true} />
                  {expanded.overtime && (
                    <div style={{padding:'0 0 6px'}}>
                      {overtimeItems.map(it=>(
                        <div className="pl-sub" key={it.label}><span>{it.label}</span><span>{money(it.value)}</span></div>
                      ))}
                    </div>
                  )}
                </>
              )}

              {n(calc.bonusTotal)>0 && <div className="pl-row"><span className="lbl">獎金合計</span><span className="val">{money(calc.bonusTotal)}</span></div>}
              {n(entry.annualLeaveSettlement)>0 && <div className="pl-row"><span className="lbl">特休結算</span><span className="val">{money(entry.annualLeaveSettlement)}</span></div>}
              <SectionHeader label="應發合計" amount={money(calc.payableTotal)} total={true} />
              <div style={{borderTop:'1px solid var(--line)', margin:'8px 0'}}></div>
              <div className="pl-row">
                <span className="lbl">勞保費{data.calc.insFullMonth===false && <span style={{fontSize:11}}>（按{data.calc.insLaborDays} 日計）</span>}</span>
                <span className="val" style={{color:'var(--red)'}}>{negMoney(data.calc.laborFee)}</span>
              </div>
              <div className="pl-row">
                <span className="lbl">健保費{data.calc.insActiveAtMonthEnd===false && <span style={{fontSize:11}}>（月底已離職不收）</span>}{data.calc.insActiveAtMonthEnd!==false && Number(data.employee.dependentCount)>0 && <span style={{fontSize:11}}>（含眷屬{Math.min(Number(data.employee.dependentCount),3)}人）</span>}</span>
                <span className="val" style={{color:'var(--red)'}}>{negMoney(data.calc.healthFee)}</span>
              </div>

              {leaveItems.length>0 && (
                <>
                  <SectionHeader label="請假扣款" amount={negMoney(calc.leaveDeduct)} amountColor="var(--red)" sectionKey="leave" hasDetail={true} />
                  {expanded.leave && (
                    <div style={{padding:'0 0 6px'}}>
                      {leaveItems.map(it=>(
                        <div className="pl-sub" key={it.label}><span>{it.label}</span><span>{negMoney(it.value)}</span></div>
                      ))}
                      {(n(entry.sickLeave)>0 || n(entry.menstrualLeave)>0) && <div className="pl-note">病假、生理假：年度合計前30 日半薪，超過不給薪</div>}
                    </div>
                  )}
                </>
              )}

              {n(entry.otherDeduction)>0 && <div className="pl-row"><span className="lbl">其他扣款</span><span className="val" style={{color:'var(--red)'}}>{negMoney(entry.otherDeduction)}</span></div>}
              <SectionHeader label="應扣合計" amount={negMoney(calc.deductTotal)} amountColor="var(--red)" total={true} />
            </div>

            {infoLeaveItems.length>0 && (
              <div className="card" style={{padding:14, marginTop:10}}>
                <SectionHeader label="本月請假紀錄（全薪，不影響薪資）" amount="" sectionKey="infoLeave" hasDetail={true} />
                {expanded.infoLeave && (
                  <div style={{padding:'0 0 6px'}}>
                    {infoLeaveItems.map(it=>(
                      <div className="pl-sub" key={it.label}><span>{it.label}</span><span>0</span></div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {sales26Items.length>0 && (
              <div className="card" style={{padding:14, marginTop:10}}>
