/* ========================= App ========================= */
const THEME_PALETTES = [
  { id:'default', name:'湖水藍', bg1:'#222831', bg2:'#282E38', accent:'#00ADB5' },
  { id:'yellow', name:'焦糖黃', bg1:'#3D3527', bg2:'#443B2C', accent:'#D9C08C' },
  { id:'red', name:'陶土紅', bg1:'#42302C', bg2:'#4a3430', accent:'#C08D7F' },
  { id:'green', name:'鼠尾草綠', bg1:'#333A2E', bg2:'#3a4234', accent:'#A3AD8C' },
  { id:'milktea', name:'奶茶棕', bg1:'#3E332A', bg2:'#453a30', accent:'#D6BFA0' }
];
function applyTheme(themeId){
  const t = THEME_PALETTES.find(p=>p.id===themeId) || THEME_PALETTES[0];
  const root = document.documentElement.style;
  root.setProperty('--bg-1', t.bg1);
  root.setProperty('--bg-2', t.bg2);
  root.setProperty('--gold', t.accent);
}
function App(){
  const [configError] = useState(GAS_URL.indexOf('請填入') !== -1);
  const [session, setSession] = useState(null);
  useEffect(()=>{ applyTheme(session?.employee?.themeColor || 'default'); }, [session?.employee?.themeColor]);
  const [themeOpen, setThemeOpen] = useState(false);
  const [checkingSession, setCheckingSession] = useState(true);
  const [tab, setTab] = useState('home');
  const [settings, setSettings] = useState(null);
  useEffect(()=>{
    const brand = session?.employee?.companyDisplayName || settings?.storeName || '';
    if(settings?.frontTitle) document.title = brand ? `${brand} - ${settings.frontTitle}` : settings.frontTitle;
    const favicon = session?.employee?.companyFaviconUrl || settings?.faviconUrl || '';
    const link = document.getElementById('favicon-link');
    if(link && favicon) link.href = favicon;
  }, [settings?.frontTitle, settings?.storeName, session?.employee?.companyDisplayName, session?.employee?.companyFaviconUrl, settings?.faviconUrl]);
  const [status, setStatus] = useState(null);
  const [pending, setPending] = useState([]);
  const [unreadAnnounceCount, setUnreadAnnounceCount] = useState(0);
  const [toast, setToast] = useState(null);
  const [pwOpen, setPwOpen] = useState(false);

  // tabbar 是 fixed，靠 .app 的 padding-bottom 讓位。那個高度不能寫死也不好用 CSS 硬算：
  // 它會隨 home indicator（safe-area-inset）、字級與桌機的 media query 變動，猜錯就是
  // 「底下空一截」或「內容被 tabbar 蓋住」。直接量它，寫進 --tabbar-h。
  const tabbarRef = useRef(null);
  useEffect(()=>{
    const el = tabbarRef.current;
    if(!el) return;
    const apply = ()=> document.documentElement.style.setProperty('--tabbar-h', el.offsetHeight + 'px');
    apply();
    const ro = new ResizeObserver(apply);
    ro.observe(el);
    return ()=>{ ro.disconnect(); document.documentElement.style.removeProperty('--tabbar-h'); };
  }, [session]);   // 登入前沒有 tabbar，登入後才掛得上

  function showToast(msg, type){
    setToast({msg, type});
    setTimeout(()=>setToast(null), 3500);
  }

  useEffect(()=>{
    if(configError){ setCheckingSession(false); return; }
    if(!CURRENT_TOKEN){ setCheckingSession(false); return; }
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(SESSION_CACHE_KEY) || 'null'); }catch(e){}
    if(cached && cached.employeeId){
      // 樂觀還原：本機已有登入紀錄就直接視為已登入，不用等一趟網路來回才顯示畫面
      // 如果 token 真的已經逾時，後續任何 API 呼叫都會偵測到並自動導回登入畫面
      setSession(cached);
    } else {
      setToken(null);
    }
    setCheckingSession(false);
  }, []);

  /* 登入後只打一支。原本是 5 支（設定／我的資料／今日狀態／公告未讀／待審核）
     ＋ 首頁自己再打 2 支（getHomeBootstrap、getMyAttendanceGap），共 7 趟往返。
     GAS 的成本幾乎與資料量無關、全在固定往返，所以「支數」才是關鍵。 */
  const [homeData, setHomeData] = useState(null);   // 首頁要用的那幾段，從這裡往下傳
  useEffect(()=>{
    if(!session) return;
    apiGet('getAppBootstrap').then(d=>{
      if(d.settings) setSettings(d.settings);
      if(d.todayStatus) setStatus(d.todayStatus);
      setPending(d.pendingApprovals || []);
      if(d.announcements) setUnreadAnnounceCount(d.announcements.unreadCount || 0);
      if(d.profile && d.profile.employee){
        setSession(prev=>{
          if(!prev) return prev;
          // mustChangePassword 以後端回報的為準：登入後快取在 localStorage 的舊值可能已經過時
          const next = {...prev, employee: d.profile.employee, isManager: d.profile.isManager,
            mustChangePassword: d.profile.mustChangePassword === true};
          try{ localStorage.setItem(SESSION_CACHE_KEY, JSON.stringify(next)); }catch(e){}
          return next;
        });
      }
      setHomeData({balances: d.balances, announcements: d.announcements,
                   weather: d.weather, gap: d.attendanceGap});
      // profile 是唯一「拿不到就會出事」的一段（mustChangePassword 靠它自我修正），
      // 所以留一條退路：合併端點沒給就走舊的單支查詢。
      if(!d.profile) refreshProfile();
    }).catch(()=>{
      // 合併端點整個失敗時退回舊路徑，員工至少還能正常使用
      apiGet('getSettings').then(setSettings).catch(()=>{});
      refreshProfile();
      refreshStatus();
      refreshPending();
      refreshAnnounceUnread();
    });
  }, [session?.token]);

  function refreshProfile(){
    if(!session?.employeeId) return;
    apiGet('getMyProfile').then(data=>{
      setSession(prev=>{
        if(!prev) return prev;
        const next = {...prev, employee: data.employee, isManager: data.isManager,
          mustChangePassword: data.mustChangePassword === true};
        try{ localStorage.setItem(SESSION_CACHE_KEY, JSON.stringify(next)); }catch(e){}
        return next;
      });
    }).catch(()=>{});
  }
  function refreshPending(){
    if(!session?.isManager) { setPending([]); return; }
    apiGet('listPendingApprovals').then(setPending).catch(()=>{});
  }

  function refreshAnnounceUnread(){
    if(!session?.employeeId) return;
    apiGet('getMyAnnouncements').then(data=>setUnreadAnnounceCount(data.unreadCount || 0)).catch(()=>{});
  }

  function refreshStatus(){
    if(!session?.employeeId) return;
    apiGet('getTodayStatus', {employeeId: session.employeeId}).then(setStatus).catch(e=>showToast(e.message,'err'));
  }
  function onLoggedIn(data){ setSession(data); setTab('home'); }
  async function changeTheme(themeId){
    try{
      await apiPost('updateMyTheme', {themeColor: themeId});
      setSession(prev=>({...prev, employee:{...prev.employee, themeColor: themeId}}));
      setThemeOpen(false);
    }catch(e){ alert(e.message); }
  }
  function logout(){
    /* 先通知後端刪掉工作階段，再清本地。只清本地的話後端紀錄還在，
       舊 token 到期前（30 天）仍然有效 —— 員工在共用裝置登出等於沒登出。 */
    const t = CURRENT_TOKEN;
    if(t){ apiPost('logoutSession', {token:t}).catch(()=>{}); }
    setToken(null);
    setSession(null); setStatus(null); setPending([]); setUnreadAnnounceCount(0); setTab('home');
  }

  if(configError){
    return <div className="config-warn">尚未設定 GAS 後端網址。請先部署 <code>Code.gs</code>，並將網址貼到本檔案頂端的 <code>GAS_URL</code> 常數中。</div>;
  }
  if(checkingSession){
    return <div style={{padding:80, textAlign:'center', color:'var(--muted)'}}>載入中...</div>;
  }

  const TABS = [
    {id:'home', label:'首頁', icon:'home'},
    {id:'punch', label:'打卡', icon:'how_to_reg'},
    {id:'forms', label:'表單', icon:'description'},
    {id:'schedule', label:'班表', icon:'calendar_month'},
    {id:'news', label:'公告', icon:'campaign'},
  ];

  return (
    <div className="app">
      {!session ? (
        <LoginScreen onLoggedIn={onLoggedIn} />
      ) : (
        <>
          <div className="topbar">
            <div className="store">{session?.employee?.companyDisplayName || settings?.storeName || '員工專區'}</div>
            <div className="right">
              <button className="icon-btn" title="切換介面配色" onClick={()=>setThemeOpen(true)}><span className="material-icons">palette</span></button>
              <button className="icon-btn" title="修改密碼" onClick={()=>setPwOpen(true)}><span className="material-icons">lock</span></button>
              <button className="icon-btn" title="登出" onClick={()=>{ if(confirm('確定要登出嗎？')) logout(); }}><span className="material-icons">logout</span></button>
            </div>
          </div>

          {themeOpen && (
            <div className="modal-bg" onClick={()=>setThemeOpen(false)}>
              <div className="modal" onClick={e=>e.stopPropagation()}>
                <h3><span className="material-icons">palette</span>切換我的介面配色</h3>
                <div className="hint" style={{marginBottom:12}}>只會改變你自己看到的畫面，其他同事跟後台管理不會受影響。</div>
                <div style={{display:'flex', flexDirection:'column', gap:8}}>
                  {THEME_PALETTES.map(t=>(
                    <div key={t.id} onClick={()=>changeTheme(t.id)}
                      style={{display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:10, cursor:'pointer',
                        border: (session?.employee?.themeColor||'default')===t.id ? '2px solid '+t.accent : '1px solid var(--line)'}}>
                      <span style={{width:22, height:22, borderRadius:'50%', background:t.bg1, border:'2px solid '+t.accent, flexShrink:0}}></span>
                      <span style={{fontSize:14}}>{t.name}</span>
                      {(session?.employee?.themeColor||'default')===t.id && <span className="material-icons" style={{marginLeft:'auto', color:t.accent, fontSize:18}}>check_circle</span>}
                    </div>
                  ))}
                </div>
                <div className="modal-actions"><button className="ghost" onClick={()=>setThemeOpen(false)}>關閉</button></div>
              </div>
            </div>
          )}

          {tab==='home' && <HomePage session={session} setSession={setSession} status={status} pendingCount={pending.length} homeData={homeData} goForms={()=>setTab('forms')} goNews={()=>setTab('news')} showToast={showToast} />}
          {tab==='punch' && <PunchPage session={session} status={status} refreshStatus={refreshStatus} showToast={showToast} settings={settings} />}
          {tab==='forms' && <FormsPage session={session} isManager={!!session.isManager} pending={pending} refreshPending={refreshPending} showToast={showToast} settings={settings} />}
          {tab==='schedule' && <CalendarPage session={session} showToast={showToast} />}
          {tab==='news' && <NewsPage showToast={showToast} onMarkedRead={()=>setUnreadAnnounceCount(0)} />}

          <div className="tabbar" ref={tabbarRef}>
            <div className="tabbar-inner">
              {TABS.map(t=>(
                <div key={t.id} className={'tab'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>
                  <span className="material-icons">{t.icon}</span>
                  {t.label}
                  {t.id==='forms' && pending.length>0 && <span className="reddot">{pending.length}</span>}
                  {t.id==='news' && unreadAnnounceCount>0 && <span className="reddot">{unreadAnnounceCount}</span>}
                </div>
              ))}
            </div>
          </div>
        </>
      )}
      {pwOpen && <ChangePasswordModal onClose={()=>setPwOpen(false)} showToast={showToast} />}
      {/* 管理者建立帳號或重設密碼後，員工首次登入必須先自行變更密碼才能使用系統 */}
      {session?.mustChangePassword && !pwOpen && (
        <ChangePasswordModal forced showToast={showToast}
          onClose={()=>setSession(prev=>{
            const next = {...prev, mustChangePassword:false};
            try{ localStorage.setItem(SESSION_CACHE_KEY, JSON.stringify(next)); }catch(e){}
            return next;
          })} />
      )}
      {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
(function(){
  function showError(msg){
    var box = document.getElementById('boot-error');
    if(box){ box.style.display='block'; box.textContent = msg; }
  }
  window.addEventListener('error', function(e){
    showError('頁面發生錯誤：' + (e.message||e.error) + '\n(檔案:' + (e.filename||'') + ' 行:' + (e.lineno||'') + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    showError('未處理的錯誤：' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  function loadScript(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = function(){ reject(new Error(src + ' 載入失敗')); };
      document.head.appendChild(s);
    });
  }
  function loadWithFallback(urls, idx){
    idx = idx || 0;
    if(idx >= urls.length) return Promise.reject(new Error('所有來源皆載入失敗：' + urls.join(' / ')));
    return loadScript(urls[idx]).catch(function(){ return loadWithFallback(urls, idx+1); });
  }
  var CDN = {
    react: ['https://unpkg.com/react@18/umd/react.production.min.js', 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'],
    reactDom: ['https://unpkg.com/react-dom@18/umd/react-dom.production.min.js', 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'],
    babel: ['https://unpkg.com/@babel/standalone/babel.min.js', 'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js']
  };

  /* 啟動加速：Babel standalone 約 2.9MB，且每次開頁都要重新編譯這份 JSX。
     員工每天打卡都會開這頁，等於天天重付一次這個成本。
     作法：把編譯結果存進 localStorage，並用原始碼的雜湊當版本識別；
     只要 JSX 沒改，下次開頁就直接用快取，連 Babel 都不必下載。
     JSX 一改，雜湊跟著變，快取自動失效重編，不需要手動清。       */
  var APP_SRC = document.getElementById('app-src').textContent;
  var CACHE_KEY = 'tap_compiled_app';
  function hashStr(s){ var h = 5381, i = s.length; while(i) h = (h * 33) ^ s.charCodeAt(--i); return (h >>> 0).toString(36); }
  var srcHash = hashStr(APP_SRC);
  function readCompiledCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return null;
      var obj = JSON.parse(raw);
      return (obj && obj.h === srcHash) ? obj.c : null;
    }catch(e){ return null; } // 隱私模式或存取被擋，當作沒有快取
  }
  function writeCompiledCache(code){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({h: srcHash, c: code})); }
    catch(e){ /* 空間不足或無痕模式：不快取也能正常運作，忽略 */ }
  }

  var cached = readCompiledCache();
  // react-dom 執行時需要 React 全域，兩者必須依序執行；但 babel 與它們互不相干，可同時下載。
  // 已有編譯快取時就完全不載入 babel。
  Promise.all([
    loadWithFallback(CDN.react).then(function(){ return loadWithFallback(CDN.reactDom); }),
    cached ? Promise.resolve() : loadWithFallback(CDN.babel)
  ])
    .then(function(){
      var compiled = cached;
      if(!compiled){
        compiled = Babel.transform(APP_SRC, {presets:[['react',{runtime:'classic'}]]}).code;
        writeCompiledCache(compiled);
      }
      var statusEl = document.getElementById('boot-status');
      if(statusEl) statusEl.remove();
      try{
        (0, eval)(compiled);
      }catch(evalErr){
        // 快取內容若損毀會在這裡爆掉：清掉快取重載一次（用 sessionStorage 標記避免無限重整）
        if(cached && !sessionStorage.getItem('tap_cache_retried')){
          try{ sessionStorage.setItem('tap_cache_retried', '1'); localStorage.removeItem(CACHE_KEY); }catch(e){}
          location.reload();
          return;
        }
        throw evalErr;
      }
      try{ sessionStorage.removeItem('tap_cache_retried'); }catch(e){}
    })
    .catch(function(err){
      showError('必要程式庫載入失敗，畫面因此空白。\n原因：' + err.message + '\n\n最常見情況：瀏覽器擴充功能（例如廣告攔截/隱私保護外掛）封鎖了 unpkg.com 或 jsdelivr.net，或目前網路無法連線到這兩個網域。\n\n請嘗試：\n1. 停用廣告攔截類擴充功能後重新整理本頁\n2. 改用無痕視窗開啟同一網址測試\n3. 確認網路能連上 unpkg.com 與 cdn.jsdelivr.net');
    });
})();
</script>
