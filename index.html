<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>員工專區</title>
<link rel="icon" id="favicon-link" href="icons/favicon-32.png" />

<!-- 加到主畫面（PWA）。目的不只是好看：iOS Safari 對一般網頁的定位授權大約一天就過期，
     從主畫面啟動的 web app 有獨立的權限儲存，允許過就長期保留，不必每天重按一次。
     ⚠️ 主畫面版是獨立的儲存空間，localStorage 不與 Safari 共用，首次要重新登入一次。 -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#222831" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="出缺勤打卡系統" />
<!-- status bar 用 black 而非 black-translucent：後者會讓內容鑽到瀏海底下，現有版面沒有預留 safe-area -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --bg-1:#222831; --bg-2:#282E38; --panel:#393E46; --panel-2:#454B55;
    --line:#4F5761; --gold:#00ADB5; --green:#4f9b6f; --red:#c05a4f; --blue:#5b8db8; --purple:#8b6fa8; --amber:#c98a4b;
    --text:#EEEEEE; --muted:#9CA3AC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* ⚠️ background-color 一定要單獨寫。加到主畫面後 iOS 用「純色」背景填狀態列與 home indicator
     那兩條 safe area，漸層（background-image）不算，只寫漸層會退回預設的白色。 */
  html{ background-color:#222831; }
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--bg-1);
    background-image:radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg-1) 60%);
    color:var(--text); font-family:'Noto Sans TC',sans-serif; min-height:100vh; min-height:100dvh;
  }
  .material-icons{vertical-align:middle; line-height:1;}
  /* tabbar 是 fixed，靠 padding-bottom 讓位。--tabbar-h 由 JS 實測 tabbar 高度後寫入（見 tabbarRef），
     猜錯的話不是「底下空一截」就是「內容被 tabbar 蓋住」。76px 只是量到之前的保底值。 */
  .app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    padding-bottom:var(--tabbar-h, 76px); }
  .app:not(:has(.tabbar)){ justify-content:center; padding-bottom:0; }

  /* 頂欄 */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px 18px;
  }
  .topbar .store{ font-size:15px; font-weight:700; letter-spacing:2px; color:var(--gold); }
  .topbar .right{ display:flex; gap:6px; }
  .icon-btn{
    background:transparent; border:none; color:var(--muted); cursor:pointer; padding:6px;
    border-radius:50%; display:flex; align-items:center; position:relative;
  }
  .icon-btn:active{ background:#ffffff14; }
  .icon-btn .reddot{
    position:absolute; top:4px; right:4px; min-width:16px; height:16px; border-radius:9px;
    background:var(--red); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  .page{ flex:1; padding:6px 16px 24px 16px; }
  .punch-hero{ margin:0 -16px -24px -16px; border-radius:16px 16px 0 0; }
  /* ⚠️ 地圖高度不能寫死。Safari 分頁模式有網址列吃掉高度，640px 剛好填滿；加到主畫面後
     可視範圍多出約 300px，底部就空出一截。改用 flex 撐滿剩餘空間，兩種模式都對。
     （inline style 的 minHeight:640 仍在，小螢幕不足時保底並改用捲動） */
  .page:has(> .punch-hero){ display:flex; flex-direction:column; }
  .page > .punch-hero{ flex:1 1 auto; }
  @media (min-width:900px){ .punch-hero{ margin:0 -32px -32px -32px; } }
  .page h2{ font-size:16px; font-weight:700; margin:14px 2px 10px 2px; display:flex; align-items:center; gap:7px; }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:12px;
  }
  .hint{ font-size:11.5px; color:var(--muted); }

  /* 天氣顯示 */
  .wx{ display:flex; align-items:center; gap:10px; }
  .wx .icon-wrap{ width:52px; height:52px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .wx .material-icons{ font-size:48px; }
  .wx .temp{ font-size:32px; font-weight:700; color:var(--text); line-height:1; }
  .wx .cond{ font-size:15px; color:var(--muted); }
  @keyframes wx-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @keyframes wx-drift{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(3px);} }
  @keyframes wx-fall{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }
  .wx-sunny{ color:#FDB813; animation:wx-spin 14s linear infinite; }
  .wx-cloudy{ color:#CFD8DC; animation:wx-drift 4s ease-in-out infinite; }
  .wx-rainy{ color:#5b8db8; animation:wx-fall 1.6s ease-in-out infinite; }
  .wx-snowy{ color:#E0F7FA; animation:wx-drift 3s ease-in-out infinite; }
  .pl-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:6px 0; font-size:14px; }
  .pl-row .lbl{ color:var(--muted); display:flex; align-items:center; gap:2px; }
  .pl-row .val{ color:var(--text); font-weight:500; font-variant-numeric:tabular-nums; }
  .pl-row.total{ font-size:15px; }
  .pl-row.total .lbl, .pl-row.total .val{ color:var(--text); font-weight:700; }
  .pl-sub{ display:flex; justify-content:space-between; padding:4px 0 4px 6px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pl-note{ font-size:11px; color:var(--muted); margin:0 0 4px 6px; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  /* 首頁 */
  .profile{ display:flex; align-items:center; gap:14px; padding:8px 4px 16px 4px; }
  .avatar{
    width:100px; height:100px; border-radius:50%; background:var(--gold); color:#1c1305;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; flex-shrink:0;
  }
  .profile .name{ font-size:24px; font-weight:500; letter-spacing:2px; }
  .profile .dept{ font-size:14px; font-weight:400; letter-spacing:0.5px; color:var(--muted); margin-top:2px; }
  .shift-card{ display:flex; align-items:center; gap:10px; }
  .shift-card .material-icons{ color:var(--gold); }
  .status-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .status-cell{ background:var(--panel-2); border-radius:10px; padding:8px 4px; text-align:center; }
  .status-cell .lbl{ font-size:10.5px; color:var(--muted); }
  .status-cell .val{ font-family:'Roboto Mono',monospace; font-size:14px; font-weight:700; margin-top:2px; }
  /* 出勤缺漏提醒：語氣是「幫你補救」不是「抓你曠職」——
     缺口的成因也可能是忘了打卡或系統沒記到，用字要留餘地。 */
  .gap-card{ border-color:var(--red); background:rgba(192,90,79,0.09); cursor:pointer; }
  .gap-card .gap-hd{ display:flex; align-items:center; gap:9px; }
  .gap-card .gap-hd .material-icons{ color:var(--red); font-size:21px; }
  .gap-card .gap-ttl{ font-weight:700; font-size:14px; }
  .gap-card .gap-mon{ margin-top:9px; }
  .gap-card .gap-mon + .gap-mon{ margin-top:11px; padding-top:11px; border-top:1px solid rgba(192,90,79,0.28); }
  .gap-card .gap-mlbl{ font-size:12px; color:var(--muted); margin-bottom:4px; }
  .gap-card .gap-days{ display:flex; flex-wrap:wrap; gap:5px; }
  .gap-card .gap-day{ padding:3px 9px; border-radius:20px; background:rgba(192,90,79,0.16);
                      color:var(--text); font-size:12px; font-variant-numeric:tabular-nums; }
  .gap-card .gap-day .why{ color:var(--red); font-weight:700; margin-left:4px; }
  .gap-card .gap-note{ margin-top:9px; font-size:12px; color:var(--muted); line-height:1.7; }
  .gap-card .gap-go{ margin-top:10px; display:flex; align-items:center; gap:4px;
                     color:var(--gold); font-size:13px; font-weight:700; }
  .pending-card{ border-color:var(--gold); cursor:pointer; }
  .pending-card .material-icons{ color:var(--gold); }

  /* 打卡 */
  .clock-big{ text-align:center; margin:8px 0 16px 0; }
  .clock-big .time{ font-family:'Roboto Mono',monospace; font-size:52px; font-weight:700; letter-spacing:2px; }
  .clock-big .date{ font-size:13px; color:var(--muted); margin-top:2px; }
  .big-btn{
    width:100%; padding:19px 0; border-radius:14px; border:none; cursor:pointer;
    font-size:19px; font-weight:700; font-family:'Noto Sans TC',sans-serif; letter-spacing:3px;
    display:flex; align-items:center; justify-content:center; gap:10px; transition:transform .1s;
    margin-bottom:10px;
  }
  .big-btn:active{ transform:scale(0.97); }
  .big-btn.in{ background:var(--green); color:#082018; }
  .big-btn.out{ background:var(--gold); color:#1c1305; }
  .big-btn.done{ background:var(--line); color:var(--muted); cursor:default; }
  .sub-btn-row{ display:flex; gap:10px; }
  .sub-btn{
    flex:1; padding:13px 0; border-radius:11px; border:1px solid var(--line); background:var(--panel);
    color:var(--text); font-size:14.5px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .sub-btn:active{ transform:scale(0.97); }
  .sub-btn:disabled{ opacity:.4; }
  .sub-btn .material-icons{ font-size:18px; color:var(--blue); }

  /* 表單 */
  .form-actions{ display:flex; gap:10px; margin-bottom:14px; }
  .form-actions button{
    flex:1; padding:14px 0; border-radius:12px; border:none; cursor:pointer;
    font-size:14px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .form-actions .leave{ background:var(--green); color:#082018; }
  .form-actions .comp{ background:var(--gold); color:#1c1305; }
  .req-item{ padding:13px 14px; }
  .req-item .title-row{ display:flex; align-items:center; justify-content:space-between; }
  .req-item .type{ font-size:14.5px; font-weight:700; }
  .req-item .meta{ font-size:12px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .status-badge{
    font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px;
  }
  .status-badge.pending{ background:#d9a44126; color:var(--gold); }
  .status-badge.ok{ background:#4f9b6f26; color:var(--green); }
  .status-badge.no{ background:#c05a4f26; color:#e79288; }
  .status-badge.cancel{ background:#ffffff12; color:var(--muted); }
  .req-actions{ display:flex; gap:8px; margin-top:10px; }
  .req-actions button{
    flex:1; padding:9px 0; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .btn-approve{ background:var(--green); border:none; color:#082018; }
  .btn-reject{ background:transparent; border:1px solid var(--red); color:#e79288; }
  .btn-cancel-req{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  .balance-row{ display:flex; gap:10px; margin-bottom:12px; }
  .balance-cell{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .balance-cell .num{ font-family:'Roboto Mono',monospace; font-size:21px; font-weight:700; color:var(--gold); }
  .balance-cell .lbl{ font-size:11px; color:var(--muted); margin-top:2px; }
  .balance-cell .tag{ font-size:10px; color:var(--muted); opacity:.8; margin-bottom:3px; letter-spacing:.5px; }

  /* 伺服器喚醒中的提示條：請求超過門檻秒數才出現，結束就淡出 */
  #api-slow-hint{
    position:fixed; left:50%; bottom:88px; transform:translate(-50%, 8px);
    max-width:88vw; z-index:200; pointer-events:none;
    background:rgba(0,0,0,.82); color:#EEE; border:1px solid var(--line);
    border-radius:20px; padding:9px 16px; font-size:12px; line-height:1.5; text-align:center;
    opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  #api-slow-hint.show{ opacity:1; transform:translate(-50%, 0); }

  /* 薪資條合計：這是整張條子最重要的數字，原本只是灰色小字，改成明確的結算列 */
  .pl-grand{ display:flex; align-items:center; justify-content:space-between; gap:10px;
             background:var(--panel); border:1px solid var(--gold); border-radius:12px;
             padding:12px 14px; margin-top:12px; }
  .pl-grand .lbl{ font-size:12.5px; color:var(--muted); }
  .pl-grand .val{ font-family:'Roboto Mono',monospace; font-size:22px; font-weight:700; color:var(--gold); }

  /* ===== 列印／輸出 PDF =====
     畫面是深色主題，直接列印會整片黑底又浪費碳粉，
     因此另外準備一份淺色的列印專用版面（畫面上不顯示，只在列印時出現）。
     作法：列印時把所有元素 visibility 隱藏，只讓 #payslip-print 及其子孫可見，
     並將它絕對定位到頁面左上角，避免受到 modal 定位的影響。 */
  #payslip-print{ display:none; }
  @media print{
    @page{ margin:12mm; }
    body *{ visibility:hidden !important; }
    #payslip-print, #payslip-print *{ visibility:visible !important; }
    #payslip-print{
      display:block !important; position:absolute; top:0;
      /* 絕對定位要 left 與 right 同時有值，margin:auto 才會平分剩餘空間達成置中；
         只給 left:0 的話會整份靠左。max-width 是避免在寬紙張上標籤與金額離太遠。 */
      left:0; right:0; width:auto; max-width:180mm; margin:0 auto;
      background:#fff; color:#1a1a1a; font-size:12px;
    }
    #payslip-print .pp-title{ text-align:center; font-size:17px; font-weight:700; margin-bottom:2px; }
    #payslip-print .pp-sub{ text-align:center; font-size:11px; color:#666; margin-bottom:12px; }
    #payslip-print .pp-meta{ display:flex; flex-wrap:wrap; gap:4px 20px; font-size:11.5px;
                             border-top:1px solid #333; border-bottom:1px solid #333; padding:7px 0; margin-bottom:10px; }
    #payslip-print .pp-sec{ font-size:12px; font-weight:700; background:#eee; padding:4px 8px; margin:10px 0 4px; }
    #payslip-print .pp-row{ display:flex; justify-content:space-between; padding:3px 8px; font-variant-numeric:tabular-nums; }
    #payslip-print .pp-row.sub{ font-size:11px; color:#555; padding-left:22px; }
    #payslip-print .pp-row.total{ font-weight:700; border-top:1px solid #999; margin-top:3px; padding-top:5px; }
    #payslip-print .pp-pay{ display:flex; gap:10px; margin-top:14px; }
    #payslip-print .pp-pay > div{ flex:1; border:1px solid #333; padding:8px; text-align:center; }
    #payslip-print .pp-pay .amt{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
    #payslip-print .pp-pay .cap{ font-size:10.5px; color:#555; }
    #payslip-print .pp-foot{ margin-top:14px; font-size:10px; color:#777; text-align:center; }
  }

  /* 即將推出 */
  .coming{ text-align:center; padding:70px 20px; color:var(--muted); }

  /* 公告卡片（獨立命名，避免跟其他頁面共用class互相影響） */
  .ann-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .ann-title{ font-size:16px; font-weight:700; color:var(--text); line-height:1.4; }
  .ann-badges{ display:flex; align-items:center; gap:6px; flex-shrink:0; margin-top:2px; }
  .ann-pin{ display:flex; align-items:center; gap:2px; font-size:11px; font-weight:700; color:var(--gold); background:rgba(212,175,55,0.14); border-radius:5px; padding:3px 6px; white-space:nowrap; }
  .ann-unread{ font-size:11px; font-weight:700; border-radius:5px; padding:3px 7px; white-space:nowrap; color:#1c1305; background:var(--gold); }
  .ann-read{ font-size:11px; font-weight:700; border-radius:5px; padding:3px 7px; white-space:nowrap; color:var(--muted); background:var(--panel-2); }
  .ann-meta{ font-size:12.5px; color:var(--muted); margin-top:6px; }
  .ann-preview{ font-size:13px; color:var(--muted); margin-top:8px; display:flex; align-items:center; gap:6px; }
  .ann-content{ margin-top:12px; font-size:14px; line-height:1.75; color:var(--text); }
  .ann-filter-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:2px; -webkit-overflow-scrolling:touch; }
  .ann-filter-row::-webkit-scrollbar{ display:none; }
  .ann-filter-pill{ flex-shrink:0; font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:20px; background:var(--panel-2); color:var(--muted); white-space:nowrap; cursor:pointer; }
  .ann-filter-pill.active{ background:var(--gold); color:#1c1305; }
  .coming .material-icons{ font-size:44px; color:var(--line); margin-bottom:10px; }

  /* 底部分頁列 */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:#222831f2; border-top:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .tabbar-inner{ max-width:480px; margin:0 auto; display:flex; }
  .tab{
    flex:1; padding:9px 0 max(9px, env(safe-area-inset-bottom)) 0; text-align:center; cursor:pointer; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; position:relative;
  }
  .tab .material-icons{ font-size:22px; }
  .tab.active{ color:var(--gold); font-weight:700; }
  .tab .reddot{
    position:absolute; top:5px; left:calc(50% + 8px); min-width:15px; height:15px; border-radius:8px;
    background:var(--red); color:#fff; font-size:9.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* 登入 */
  .login-wrap{ padding:24px; max-width:400px; margin:0 auto; width:100%; }
  .login-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 26px; text-align:center; }
  .login-card .mark-icon{
    width:52px; height:52px; border-radius:14px; background:var(--gold); color:#1c1305;
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;
  }
  .login-card h2{ font-size:18px; font-weight:700; margin:0 0 4px 0; }
  .login-card .sub{ font-size:12px; color:var(--muted); margin-bottom:22px; }

  .field{ text-align:left; margin-bottom:13px; width:100%; max-width:100%; box-sizing:border-box; }
  label{ font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  input,select,textarea{
    width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line);
    background:#1B2027; color:var(--text); font-size:14px; font-family:'Noto Sans TC',sans-serif;
  }
  select{ appearance:none; -webkit-appearance:none; -moz-appearance:none; }
  input[type=date],input[type=time],input[type=datetime-local],input[type=month]{
    padding-left:12px; padding-right:12px; color-scheme:dark; min-width:0; max-width:100%; width:100%;
    font-size:13px; box-sizing:border-box;
  }
  input[type=range]{
    width:auto; padding:0; border:none; background:transparent; height:20px;
  }
  input[type=date]::-webkit-calendar-picker-indicator,
  input[type=time]::-webkit-calendar-picker-indicator,
  input[type=datetime-local]::-webkit-calendar-picker-indicator,
  input[type=month]::-webkit-calendar-picker-indicator{
    margin-left:4px; padding:4px; filter:invert(0.75);
  }
  .primary-btn{
    width:100%; padding:13px 0; border-radius:9px; border:none; background:var(--gold); color:#1c1305;
    font-size:15px; font-weight:700; cursor:pointer; margin-top:4px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .ghost-btn{
    width:100%; padding:12px 0; border-radius:9px; border:1px solid var(--line); background:transparent;
    color:var(--muted); font-size:14px; cursor:pointer;
  }
  .err-text{ color:#f3c9c2; font-size:12.5px; margin-top:10px; min-height:16px; }

  /* Modal */
  .modal-bg{

<script type="text/plain" id="app-src">
const {useState, useEffect, useMemo, useRef} = React;
// 時數／日數一律取小數一位，末尾的 .0 去掉
function trim1(v){ const x = Math.round((Number(v)||0)*10)/10; return String(x); }
// 日期後面補上星期，例如 2026-08-17 08:30 → 2026-08-17(一) 08:30。
// 與 admin.html 的同名函式為同一份實作，前後台顯示格式要一致。
// 審核假單時「星期幾」是判斷的關鍵資訊（排班、連假、例假日），只給日期看不出來。
const DOW_SHORT = ['日','一','二','三','四','五','六'];
function withWeekday(dateTimeStr){
  const s = String(dateTimeStr||'');
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
  if(!m) return s;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if(isNaN(d.getTime())) return s;
  return `${m[1]}-${m[2]}-${m[3]}(${DOW_SHORT[d.getDay()]})${m[4]}`;
}
// 假別下拉的剩餘額度標籤。iOS Safari 的原生選單寬度是系統決定的、CSS 改不到，
// 文字一長就折行，所以只給一個單位：滿一日以上講日，不足一日才講小時。
function remainText(hours){
  const h = Number(hours) || 0;
  return h >= 8 ? `（剩 ${trim1(h/8)} 日）` : `（剩 ${trim1(h)} 小時）`;
}
// 額度條的數字：主行給「小時」（系統實際存放與結算的原始單位），副行給日數換算。
// ⚠️ 日數刻意用「X 日 Y 小時」而不是小數日，因為 1 日 = 8 小時，除不盡的時候小數日一定要四捨五入
//    （10 小時 = 1.25 日 → 顯示 1.3 日），員工照著 1.3 日去請就變成 10.4 小時、反而被後端擋下來。
//    混合寫法完全不做進位，數字永遠精確，也不會誤導額度。
// 特休「核定日數」本身是原始值（roundLeaveDays 依勞動部規則產出，永遠只有 1 位小數），
// 時數是 日數×8 換算來的，所以核定值永遠是 0.8 小時的倍數、兩個方向都精確。
// 會除不盡的是「已休／剩餘」——請假以 0.5 或 1 小時為單位累加，10 小時 ÷ 8 = 1.25 日就回不去 1 位小數。
// 因此：能整除到 1 位小數就寫小數日（跟特休核定表、勞動部試算系統的數字完全一致），
//       除不盡才拆成「X 日 Y 小時」。兩種情況都不做任何進位，顯示的額度永遠等於後端會放行的額度。
function dayPart(hours){
  const h = Number(hours) || 0;
  if(h < 8) return '';                        // 不滿一日就只講小時，不必再寫「0 日」
  const exact = Math.round(h/8*10)/10;        // 試著換成 1 位小數的日
  if(Math.abs(exact*8 - h) < 1e-9) return `${trim1(exact)} 日`;
  const d = Math.floor(h/8 + 1e-9);
  const rem = Math.round((h - d*8)*10)/10;
  return `${d} 日 ${trim1(rem)} 小時`;
}
// 剩餘額度出現「畸零時數」時的解套提示。
// 特休核定日數是 0.1 日的倍數 → 時數是 0.8 小時的倍數，最小單位設 1 小時的話，
// 一小時一小時請到最後一定會剩不足一單位的零頭（191.2 小時請到 191 還剩 0.2），
// 湊不出倍數就永遠送不出去。後端 createRequest 對「時數剛好等於剩餘」放行（清零例外），
// 這顆按鈕就是把那個數字一鍵帶進時數欄，員工不用自己算。
function ClearLeftover({remain, unit, onUse}){
  const r = Math.round((Number(remain)||0) * 10) / 10;
  if(r <= 0) return null;
  const isMultiple = Math.round((r / unit) * 100) % 100 === 0;
  if(isMultiple) return null;                     // 剩餘剛好是整數倍就沒這個問題
  return (
    <div style={{marginTop:8, padding:'8px 10px', borderRadius:8,
                 background:'rgba(0,173,181,.10)', border:'1px dashed var(--gold,#00ADB5)',
                 fontSize:11.5, lineHeight:1.6}}>
      剩餘 <b>{r} 小時</b>不是最小單位（{unit} 小時）的倍數，零頭無法用一般方式請完。
      <button type="button" onClick={()=>onUse(String(r))}
        style={{display:'block', marginTop:6, width:'100%', padding:'7px 10px', borderRadius:6,
                border:'1px solid var(--gold,#00ADB5)', background:'transparent',
                color:'var(--gold,#00ADB5)', fontSize:12, fontWeight:700, cursor:'pointer'}}>
        一次休完剩餘 {r} 小時
      </button>
      <div style={{opacity:.7, marginTop:5}}>不休完也不會損失——年度終結時未休完的特休依法折發工資。</div>
    </div>
  );
}
// 額度條裡的一格數字：主行小時、副行日數換算
function Amount({label, hours, strong, danger}){
  const sub = dayPart(hours);
  return (
    <span style={{display:'inline-block', fontVariantNumeric:'tabular-nums'}}>
      <span style={{fontWeight: strong?700:400, color: danger?'#c05a4f':'inherit'}}>{label} {trim1(hours)} 小時</span>
      {sub && <><br/><span style={{opacity:.6, fontSize:11}}>{sub}</span></>}
    </span>
  );
}

const TOKEN_KEY = 'employee_session_token';
const SESSION_CACHE_KEY = 'employee_session_info';

let CURRENT_TOKEN = null;
try{ CURRENT_TOKEN = localStorage.getItem(TOKEN_KEY) || null; }catch(e){}
function setToken(t){

function isSessionError(msg){

function forceReLogin(){

// 連線失敗自動重試1次，避免手機瀏覽器偶發的網路中斷（例如冷啟動、切背景）就直接跳錯誤訊息
/* GAS 部署後的第一次呼叫要重新編譯整個腳本，冷啟動可能要 20~40 秒。
   fetch 預設沒有逾時，遇到這種情況畫面會無限停在「載入中」，看起來就像當掉。
   這裡做兩件事：
   1) 設定逾時上限，超過就中止並回報明確訊息，不讓使用者無止境地等
   2) 等超過門檻秒數就顯示提示，讓使用者知道是在等伺服器喚醒，不是壞了      */
const API_TIMEOUT_MS = 35000; // 單次請求逾時；GAS 冷啟動通常 20~40 秒，留一次重試的餘裕
const SLOW_HINT_MS = 6000;    // 超過這個時間就顯示「伺服器喚醒中」

// 提示用純 DOM 操作，不牽動 React 狀態，避免各元件都要接一份載入狀態
let _slowPending = 0, _slowTimer = null;
function slowHintShow(){
  let el = document.getElementById('api-slow-hint');
  if(!el){
    el = document.createElement('div');
    el.id = 'api-slow-hint';
    el.textContent = '伺服器喚醒中，請稍候…（系統閒置一段時間後的第一次連線較慢）';
    document.body.appendChild(el);
  }
  el.classList.add('show');
}
function slowStart(){
  _slowPending++;
  if(_slowTimer) return;
  _slowTimer = setTimeout(()=>{ if(_slowPending > 0) slowHintShow(); }, SLOW_HINT_MS);
}
function slowEnd(){
  _slowPending = Math.max(0, _slowPending - 1);
  if(_slowPending === 0){
    if(_slowTimer){ clearTimeout(_slowTimer); _slowTimer = null; }
    const el = document.getElementById('api-slow-hint');
    if(el) el.classList.remove('show');
  }
}

async function fetchWithRetry(url, options, retries=1, delayMs=1000){
  slowStart();
  try{
    let lastErr;
    for(let i=0; i<=retries; i++){
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), API_TIMEOUT_MS);
      try{
        return await fetch(url, Object.assign({}, options || {}, {signal: ctrl.signal}));
      }catch(e){
        // AbortError 代表是我們主動中止的逾時，換成使用者看得懂的說法
        lastErr = (e && e.name === 'AbortError')
          ? new Error('連線逾時（超過 ' + Math.round(API_TIMEOUT_MS/1000) + ' 秒沒有回應）。請確認網路後再試一次；若剛更新過系統，稍等一下再開通常就會恢復。')
          : e;
        if(i === retries) throw lastErr;
        await new Promise(r=>setTimeout(r, delayMs));
      }finally{
        clearTimeout(timer);
      }
    }
    throw lastErr;
  } finally {
    slowEnd();
  }
}
// 後端偶爾會回傳 HTML（例如 GAS 錯誤頁、登入逾期被導向），直接 res.json() 會丟出看不懂的
// 「Unexpected token '<'」。統一在這裡轉成人看得懂的訊息。
async function parseApiResponse(res){
  const text = await res.text();
  try{ return JSON.parse(text); }
  catch(e){
    if(text.indexOf('<!DOCTYPE') === 0 || text.indexOf('<html') === 0){
      throw new Error('伺服器回傳了非預期的內容（可能是 Google 服務暫時忙碌或連線逾時），請稍候再試一次。');
    }
    throw new Error('伺服器回應格式錯誤：' + text.slice(0, 80));
  }
}
/* 新後端（Cloudflare Workers）。
   讀的是同一份 Google 試算表，只是換掉執行環境：GAS 每次請求要 2～15 秒，
   新後端約 0.6 秒。下列 action 都已與 GAS 逐欄比對確認結果完全一致才切換。
   寫入類與尚未搬移的查詢仍走 GAS。 */
const API_URL = 'https://tap-api.mammyshop-tw.workers.dev';
const NEW_BACKEND_ACTIONS = ['getAppBootstrap', 'getHomeBootstrap', 'getRequestsBootstrap', 'getCalendarBootstrap'];

async function callApiGet(base, action, params){
  const qs = new URLSearchParams({action, token: CURRENT_TOKEN||'', ...params}).toString();
  const res = await fetchWithRetry(`${base}?${qs}`);
  const json = await parseApiResponse(res);
  if(json.status !== 'success'){
    if(isSessionError(json.message)) forceReLogin();
    throw new Error(json.message || '發生錯誤');
  }
  return json.data;
}

async function apiGet(action, params={}){
  const useNew = NEW_BACKEND_ACTIONS.indexOf(action) !== -1;
  if(!useNew) return callApiGet(GAS_URL, action, params);
  try{
    return await callApiGet(API_URL, action, params);
  }catch(e){
    // 新後端若有任何問題（部署異常、憑證過期、網路），自動改走 GAS。
    // 最壞情況只是回到原本的速度，不會讓員工卡住無法作業。
    if(isSessionError(e.message)) throw e; // 登入問題兩邊一樣，不必重試
    console.warn('新後端失敗，改用 GAS：', e.message);
    return callApiGet(GAS_URL, action, params);
  }
}
async function apiPost(action, body={}){
  const res = await fetchWithRetry(GAS_URL, {method:'POST', body: JSON.stringify({action, token: CURRENT_TOKEN, ...body})});
  const json = await parseApiResponse(res);
  if(json.status !== 'success'){
    if(isSessionError(json.message)) forceReLogin();
    throw new Error(json.message || '發生錯誤');
  }
  return json.data;
}
// 壓縮手機拍照/選圖的檔案，避免上傳失敗或太慢；回傳 {base64, mimeType}
function compressImageFile(file, maxDim=800, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('讀取圖片失敗'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('圖片格式無法讀取'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function getLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve({lat:null,lng:null,error:'此裝置不支援定位'}); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, error:null}),
      err => resolve({lat:null, lng:null, error:'無法取得定位（' + err.message + '）'}),
      {enableHighAccuracy:true, timeout:8000, maximumAge:0}
    );
  });
}

function linkifyBlank(html){
  if(!html) return html;
  return html.replace(/<a\s+(?![^>]*target=)/gi, '<a target="_blank" rel="noopener noreferrer" ');
}
function attachIcon(name){
  const s = String(name||'').toLowerCase();
  if(s.endsWith('.pdf')) return 'picture_as_pdf';
  if(s.endsWith('.doc') || s.endsWith('.docx')) return 'description';
  if(s.endsWith('.xls') || s.endsWith('.xlsx')) return 'table_chart';
  if(s.endsWith('.ppt') || s.endsWith('.pptx')) return 'slideshow';
  return 'insert_drive_file';
}
function fileSizeText(bytes){
  if(!bytes) return '';
  if(bytes < 1024*1024) return Math.round(bytes/1024) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}
function announcePreview(html, len){
  const text = stripHtml(html);
  return text.length > (len||40) ? text.slice(0, len||40) + '…' : text;
}
function announceDateShort(createdAt){
  if(!createdAt) return '';
  const datePart = createdAt.slice(0,10); // yyyy-MM-dd
  const now = new Date();
  const todayPart = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  if(datePart === todayPart) return '今天';
  const [y,m,d] = datePart.split('-').map(Number);
  if(y === now.getFullYear()) return `${m}月${d}日`;
  return `${y}年${m}月${d}日`;
}
function hhmm(dt){
  if(!dt) return '—';
  const timePart = String(dt).split(' ')[1] || String(dt).split('T')[1];
  if(!timePart) return '—';
  const m = timePart.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return '—';
  return m[1].padStart(2,'0') + ':' + m[2];
}
function formatDateTimeReadable(dtLocalValue){
  if(!dtLocalValue) return '';
  const d = new Date(dtLocalValue);
  if(isNaN(d.getTime())) return '';
  const dow = '日一二三四五六'[d.getDay()];
  const pad2 = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}（${dow}）${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function formatDateReadable(dateValue){
  if(!dateValue) return '';
  const d = new Date(dateValue+'T00:00');
  if(isNaN(d.getTime())) return '';
  const dow = '日一二三四五六'[d.getDay()];
  const pad2 = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}（${dow}）`;
}

/* ========================= 自訂日期時間選擇器 ========================= */
/* unitHours：最小請假單位（系統設定 leaveUnit）；schedStart：該員工班表的上班時間 'HH:mm'。
   時間只能選在「班表上班時間 ＋ N × 單位」的格線上 —— 不能單純看分鐘是不是 0 或 30，
   因為班表是 08:30 開始的，整天假就是 08:30~17:30，分鐘本來就不是 0。
   讓不合法的時間**根本選不到**，比選了才被後端擋回來好。 */
function CustomDateTimePicker({value, onConfirm, onClose, dateOnly, unitHours, schedStart}){
  const unitMin = Math.max(1, Math.round((Number(unitHours) || 1) * 60));
  const schedStartMin = (()=>{ const m = String(schedStart||'09:00').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1])*60+Number(m[2]) : 9*60; })();
  const isAligned = (minOfDay)=> ((((minOfDay - schedStartMin) % unitMin) + unitMin) % unitMin) === 0;
  // 可選的分鐘。單位 ≥ 60 分時，一小時內只有一個合法的分鐘（例如 08:30 起算就是 :30）
  const allowedMins = [];
  for(let m=0; m<60; m++){
    const diff = (((m - (schedStartMin % 60)) % 60) + 60) % 60;
    if(unitMin >= 60 ? diff === 0 : diff % unitMin === 0) allowedMins.push(m);
  }
  // 可選的小時：該小時內至少要有一個合法的分鐘（單位 > 1 小時的情況才會篩掉東西）
  const allowedHours = [];
  for(let h=0; h<24; h++) if(allowedMins.some(m=>isAligned(h*60+m))) allowedHours.push(h);

  const raw = value ? new Date(dateOnly ? value+'T00:00' : value) : new Date();
  /* 初始值對齊到最近的格線。
     ⚠️ 一定要用 setHours(時, 分) 一次設定 —— 只設分鐘的話，58 分進位會變成 00 分但小時不動，
        等於整整早了一小時（這個坑 2026-08-19 踩過一次）。 */
  const initial = new Date(raw);
  if(!dateOnly){
    const cur = raw.getHours()*60 + raw.getMinutes();
    let snapped = schedStartMin + Math.round((cur - schedStartMin) / unitMin) * unitMin;
    snapped = Math.max(0, Math.min(24*60 - 1, snapped));
    initial.setHours(Math.floor(snapped/60), snapped%60, 0, 0);
  }
  const [viewY, setViewY] = useState(initial.getFullYear());
  const [viewM, setViewM] = useState(initial.getMonth()); // 0-11
  const [selDate, setSelDate] = useState(`${initial.getFullYear()}-${String(initial.getMonth()+1).padStart(2,'0')}-${String(initial.getDate()).padStart(2,'0')}`);
  const [selHour, setSelHour] = useState(initial.getHours());
  const [selMin, setSelMin] = useState(initial.getMinutes());
  const hourRef = useRef(null);
  const minRef = useRef(null);
  const ROW_H = 40;

  useEffect(()=>{
    // 開啟時捲動到目前選取的時間位置（索引要用「在可選清單中的位置」，不是數值本身）
    setTimeout(()=>{
      if(hourRef.current) hourRef.current.scrollTop = Math.max(0, allowedHours.indexOf(selHour)) * ROW_H;
      if(minRef.current) minRef.current.scrollTop = Math.max(0, allowedMins.indexOf(selMin)) * ROW_H;
    }, 0);
  }, []);

  function shiftMonth(delta){
    let y = viewY, m = viewM + delta;
    if(m < 0){ m = 11; y -= 1; } else if(m > 11){ m = 0; y += 1; }
    setViewY(y); setViewM(m);
  }
  const firstDowSun = new Date(viewY, viewM, 1).getDay();
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
  const firstDow = (firstDowSun + 6) % 7; // 轉換成週一為0的排列
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  function pickDay(d){
    setSelDate(`${viewY}-${String(viewM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  function onHourScroll(e){
    const idx = Math.round(e.target.scrollTop / ROW_H);
    setSelHour(allowedHours[Math.max(0, Math.min(allowedHours.length-1, idx))]);
  }
  function onMinScroll(e){
    const idx = Math.round(e.target.scrollTop / ROW_H);
    setSelMin(allowedMins[Math.max(0, Math.min(allowedMins.length-1, idx))]);
  }
  function confirm(){
    if(dateOnly){ onConfirm(selDate); return; }
    const hh = String(selHour).padStart(2,'0');
    const mm = String(selMin).padStart(2,'0');
    onConfirm(`${selDate}T${hh}:${mm}`);
  }
  const [dy,dm,dd] = selDate.split('-').map(Number);
  const dowText = '日一二三四五六'[new Date(dy,dm-1,dd).getDay()];

  return (
    <div className="modal-bg">
      <div className="modal" style={{maxWidth:380}}>
        <div className="row-between" style={{marginBottom:14}}>
          <div style={{fontSize:15, fontWeight:700}}>{dy}/{String(dm).padStart(2,'0')}/{String(dd).padStart(2,'0')}（{dowText}）{!dateOnly && `${String(selHour).padStart(2,'0')}:${String(selMin).padStart(2,'0')}`}</div>
          <button className="go" style={{padding:'7px 16px', fontSize:13}} onClick={confirm}>確認</button>
        </div>

        <div className="row-between" style={{marginBottom:8}}>
          <button className="icon-btn" onClick={()=>shiftMonth(-1)}><span className="material-icons">chevron_left</span></button>
          <div style={{fontWeight:700, fontSize:14.5}}>{viewY} 年 {viewM+1} 月</div>
          <button className="icon-btn" onClick={()=>shiftMonth(1)}><span className="material-icons">chevron_right</span></button>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, textAlign:'center', fontSize:11, color:'var(--muted)', marginBottom:4}}>
          {['一','二','三','四','五','六','日'].map(d=><div key={d}>{d}</div>)}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:2, marginBottom:16}}>
          {cells.map((d,idx)=>{
            if(!d) return <div key={idx}></div>;
            const ds = `${viewY}-${String(viewM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isSel = ds === selDate;
            return (
              <div key={idx} onClick={()=>pickDay(d)} style={{
                aspectRatio:'1', display:'flex', alignItems:'center', justifyContent:'center',
                borderRadius:8, cursor:'pointer', fontSize:13,
                background: isSel ? 'var(--gold)' : 'transparent',
                color: isSel ? '#1c1305' : 'var(--text)', fontWeight: isSel ? 700 : 400
              }}>{d}</div>
            );
          })}
        </div>

        {!dateOnly && (
          <>
            <div style={{display:'flex', justifyContent:'center', gap:8, position:'relative'}}>
              <div style={{position:'absolute', top:ROW_H, left:0, right:0, height:ROW_H, background:'var(--panel-2)', borderRadius:8, pointerEvents:'none', zIndex:0}}></div>
              <div ref={hourRef} onScroll={onHourScroll} style={{height:ROW_H*3, overflowY:'scroll', scrollSnapType:'y mandatory', width:70, textAlign:'center', position:'relative', zIndex:1}}>
                <div style={{height:ROW_H}}></div>
                {allowedHours.map(h=>(
                  <div key={h} style={{height:ROW_H, lineHeight:ROW_H+'px', scrollSnapAlign:'center', fontSize: h===selHour?18:14, fontWeight: h===selHour?700:400, color: h===selHour?'var(--text)':'var(--muted)'}}>
                    {String(h).padStart(2,'0')}
                  </div>
                ))}
                <div style={{height:ROW_H}}></div>
              </div>
              <div style={{fontSize:18, alignSelf:'center', marginTop:ROW_H, position:'relative', zIndex:1}}>:</div>
              <div ref={minRef} onScroll={onMinScroll} style={{height:ROW_H*3, overflowY:'scroll', scrollSnapType:'y mandatory', width:70, textAlign:'center', position:'relative', zIndex:1}}>
                <div style={{height:ROW_H}}></div>
                {allowedMins.map(m=>(
                  <div key={m} style={{height:ROW_H, lineHeight:ROW_H+'px', scrollSnapAlign:'center', fontSize: m===selMin?18:14, fontWeight: m===selMin?700:400, color: m===selMin?'var(--text)':'var(--muted)'}}>
                    {String(m).padStart(2,'0')}
                  </div>
                ))}
                <div style={{height:ROW_H}}></div>
              </div>
            </div>
            <div className="hint" style={{textAlign:'center', marginTop:10}}>
              上下滑動選擇時間。請假以 <b>{unitHours || 1}</b> 小時為單位，
              從上班時間 {schedStart || '09:00'} 起算，所以只能選到這些時間點
            </div>
          </>
        )}

        <div className="modal-actions">
          <button className="stay" onClick={onClose}>取消</button>
        </div>
      </div>
    </div>
  );
}

function tenureShort(hireDate, breakStart, breakEnd){
  if(!hireDate) return '';
  let h = new Date(hireDate);
  if(isNaN(h.getTime())) return '';
  let breakNote = '';
  if(breakStart && breakEnd){
    const [by,bm] = breakStart.split('-').map(Number);
    const [ey,em] = breakEnd.split('-').map(Number);
    if(by && bm && ey && em){
      const breakMonths = (ey-by)*12 + (em-bm) + 1;
      if(breakMonths > 0){
        h = new Date(h); h.setMonth(h.getMonth()+breakMonths);
        const by2 = Math.floor(breakMonths/12), bm2 = breakMonths%12;
        breakNote = `不含中斷${by2>0?by2+'年':''}${bm2>0?bm2+'個月':''}`;
      }
    }
  }
  const now = new Date();
  let months = (now.getFullYear()-h.getFullYear())*12 + (now.getMonth()-h.getMonth());
  if(now.getDate() < h.getDate()) months -= 1;
  if(months < 0) return '';
  const y = Math.floor(months/12), m = months%12;
  const tenure = y<=0 ? `${m}個月` : (m<=0 ? `${y}年` : `${y}年${m}個月`);
  return breakNote ? `${tenure}（${breakNote}）` : tenure;
}

/* ========================= 大頭照裁切/縮放 ========================= */
function AvatarCropModal({file, onConfirm, onCancel}){
  const BOX = 280; // 顯示用圓形範圍大小(px)
  const [imgSrc, setImgSrc] = useState(null);
  const [imgSize, setImgSize] = useState(null); // {w, h} 原始圖片尺寸
  const [scale, setScale] = useState(1);
  const [minScale, setMinScale] = useState(1);
  const [offset, setOffset] = useState({x:0, y:0});
  const dragRef = useRef({dragging:false, startX:0, startY:0, startOffset:{x:0,y:0}});
  const pinchRef = useRef({active:false, startDist:0, startScale:1});

  useEffect(()=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.max(BOX/img.width, BOX/img.height);
      setMinScale(s); setScale(s); setOffset({x:0, y:0});
      setImgSize({w:img.width, h:img.height});
      setImgSrc(url);
    };
    img.src = url;
    return () => URL.revokeObjectURL(url);
  }, [file]);

  function clampOffset(o, s){
    if(!imgSize) return o;
    const w = imgSize.w*s, h = imgSize.h*s;
    const maxX = Math.max(0, (w-BOX)/2), maxY = Math.max(0, (h-BOX)/2);
    return { x: Math.min(maxX, Math.max(-maxX, o.x)), y: Math.min(maxY, Math.max(-maxY, o.y)) };
  }
  function touchDist(touches){
    const dx=touches[0].clientX-touches[1].clientX, dy=touches[0].clientY-touches[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
  }

  function onPointerDown(e){ dragRef.current = {dragging:true, startX:e.clientX, startY:e.clientY, startOffset:{...offset}}; }
  function onPointerMove(e){
    if(!dragRef.current.dragging) return;
    const dx = e.clientX - dragRef.current.startX, dy = e.clientY - dragRef.current.startY;
    setOffset(clampOffset({x:dragRef.current.startOffset.x+dx, y:dragRef.current.startOffset.y+dy}, scale));
  }
  function onPointerUp(){ dragRef.current.dragging = false; }

  function onTouchStart(e){
    if(e.touches.length===2){ pinchRef.current = {active:true, startDist:touchDist(e.touches), startScale:scale}; }
    else if(e.touches.length===1){ dragRef.current = {dragging:true, startX:e.touches[0].clientX, startY:e.touches[0].clientY, startOffset:{...offset}}; }
  }
  function onTouchMove(e){
    if(pinchRef.current.active && e.touches.length===2){
      e.preventDefault();
      const newScale = Math.max(minScale, Math.min(minScale*4, pinchRef.current.startScale * (touchDist(e.touches)/pinchRef.current.startDist)));
      setScale(newScale);
      setOffset(o=>clampOffset(o, newScale));
    } else if(dragRef.current.dragging && e.touches.length===1){
      const dx = e.touches[0].clientX - dragRef.current.startX, dy = e.touches[0].clientY - dragRef.current.startY;
      setOffset(clampOffset({x:dragRef.current.startOffset.x+dx, y:dragRef.current.startOffset.y+dy}, scale));
    }
  }
  function onTouchEnd(e){
    if(e.touches.length<2) pinchRef.current.active = false;
    if(e.touches.length===0) dragRef.current.dragging = false;
  }
  function onSliderChange(e){
    const s = Number(e.target.value);
    setScale(s);
    setOffset(o=>clampOffset(o, s));
  }

  function confirm(){
    if(!imgSize || !imgSrc) return;
    const OUT = 480;
    const canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.beginPath();
    ctx.arc(OUT/2, OUT/2, OUT/2, 0, Math.PI*2);
    ctx.closePath();
    ctx.clip();
    const ratio = OUT/BOX;
    const drawW = imgSize.w*scale*ratio, drawH = imgSize.h*scale*ratio;
    const drawX = OUT/2 - drawW/2 + offset.x*ratio;
    const drawY = OUT/2 - drawH/2 + offset.y*ratio;
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      onConfirm(dataUrl.split(',')[1], 'image/jpeg');
    };
    img.src = imgSrc;
  }

  return (
    <div className="modal-bg">
      <div className="modal" style={{maxWidth:380}}>
        <h3><span className="material-icons">crop</span>調整大頭照</h3>
        <div className="hint" style={{marginBottom:12}}>拖曳照片調整位置，用下方拉桿或兩指縮放調整大小</div>
        <div
          style={{position:'relative', width:BOX, height:BOX, margin:'0 auto', borderRadius:'50%', overflow:'hidden', background:'#000', touchAction:'none', cursor:'grab'}}
          onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
          onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        >
          {imgSrc && imgSize && (
            <img src={imgSrc} draggable={false} style={{
              position:'absolute', left:'50%', top:'50%',
              width:imgSize.w*scale, height:imgSize.h*scale,
              transform:`translate(calc(-50% + ${offset.x}px), calc(-50% + ${offset.y}px))`,
              pointerEvents:'none'
            }} />
          )}
          <div style={{position:'absolute', inset:0, borderRadius:'50%', border:'2px solid rgba(255,255,255,0.6)', pointerEvents:'none'}}></div>
        </div>
        <div style={{display:'flex', alignItems:'center', gap:10, marginTop:16}}>
          <span className="material-icons" style={{fontSize:18, color:'var(--muted)'}}>photo_size_select_small</span>
          <input type="range" min={minScale} max={minScale*4} step={0.01} value={scale} onChange={onSliderChange} style={{flex:1}} />
          <span className="material-icons" style={{fontSize:22, color:'var(--muted)'}}>photo_size_select_large</span>
        </div>
        <div className="modal-actions">
          <button className="stay" onClick={onCancel}>取消</button>
          <button className="go" onClick={confirm} disabled={!imgSrc}>完成</button>
        </div>
      </div>
    </div>
  );
}

/* ========================= 修改密碼（Modal） ========================= */
function ChangePasswordModal({onClose, showToast, forced}){
  const [pw, setPw] = useState({oldPassword:'', newPassword:'', confirm:''});
  const [saving, setSaving] = useState(false);

  async function changePw(){
    if(!pw.newPassword || pw.newPassword.length < 4){ showToast('新密碼至少 4 碼', 'err'); return; }
    if(forced && pw.newPassword === pw.oldPassword){ showToast('新密碼不能與預設密碼相同', 'err'); return; }
    if(pw.newPassword !== pw.confirm){ showToast('兩次輸入的新密碼不一致', 'err'); return; }
    setSaving(true);
    try{
      await apiPost('changePassword', {oldPassword: pw.oldPassword, newPassword: pw.newPassword});
      showToast('密碼已更新', 'ok');
      onClose();
    }catch(e){ showToast(e.message, 'err'); }
    finally{ setSaving(false); }
  }

  return (
    <div className="modal-bg">
      <div className="modal">
        <h3><span className="material-icons">lock_reset</span>{forced ? '請先設定你的密碼' : '修改密碼'}</h3>
        {forced && (
          <div className="hint" style={{marginBottom:10, lineHeight:1.7}}>
            你目前使用的是公司提供的預設密碼 <b>1234</b>。為了保護你的薪資與個人資料，
            <b>首次登入必須先改成只有你知道的密碼</b>，改完才能使用其他功能。
          </div>
        )}
        <div className="field"><label>原密碼</label><input type="password" value={pw.oldPassword} onChange={e=>setPw({...pw,oldPassword:e.target.value})} /></div>
        <div className="field"><label>新密碼（至少4碼）</label><input type="password" value={pw.newPassword} onChange={e=>setPw({...pw,newPassword:e.target.value})} /></div>
        <div className="field"><label>再次輸入新密碼</label><input type="password" value={pw.confirm} onChange={e=>setPw({...pw,confirm:e.target.value})} /></div>
        <div className="modal-actions">
          {!forced && <button className="stay" onClick={onClose}>取消</button>}
          <button className="go" onClick={changePw} disabled={saving}>{saving?'儲存中...':(forced?'設定密碼':'確認修改')}</button>
        </div>
      </div>
    </div>
  );
}
